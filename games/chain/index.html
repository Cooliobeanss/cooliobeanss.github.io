<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coolio Climb</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050611;
    color:white;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    user-select:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================================================
   LOBBY
========================================================= */

#lobby{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;

    background:
        radial-gradient(circle at 20% 20%,rgba(117,82,255,.2),transparent 32%),
        radial-gradient(circle at 80% 70%,rgba(0,217,255,.13),transparent 32%),
        linear-gradient(135deg,#04050d,#090a19);
}

.lobby-card{
    width:min(550px,100%);
    padding:45px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.1),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(28px);

    box-shadow:
        0 35px 120px rgba(0,0,0,.7),
        inset 0 1px rgba(255,255,255,.13);

    text-align:center;
}

.logo{
    font-size:clamp(40px,9vw,76px);
    font-weight:1000;
    letter-spacing:-5px;

    background:
        linear-gradient(
            90deg,
            #9b7cff,
            #52dfff,
            #df71ff,
            #9b7cff
        );

    background-size:300% 100%;
    animation:logoMove 5s linear infinite;

    -webkit-background-clip:text;
    color:transparent;
}

@keyframes logoMove{
    to{
        background-position:300% 0;
    }
}

.subtitle{
    color:#9ca2bc;
    font-size:14px;
    margin:5px 0 32px;
}

input{
    width:100%;
    padding:16px 18px;
    margin-bottom:12px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;

    outline:none;

    background:rgba(0,0,0,.3);
    color:white;

    font-size:16px;
}

input:focus{
    border-color:#8b70ff;
    box-shadow:0 0 30px rgba(120,90,255,.2);
}

button{
    border:0;
    cursor:pointer;

    padding:15px 22px;
    border-radius:14px;

    color:white;
    font-size:15px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #7657ff,
            #4c9eff
        );

    box-shadow:0 10px 35px rgba(80,90,255,.25);

    transition:.16s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.12);
}

button:active{
    transform:translateY(1px);
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.secondary{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:none;
}

#joinPanel,
#roomPanel{
    display:none;
}

.room-code{
    margin:15px 0 25px;

    font-size:52px;
    font-weight:1000;
    letter-spacing:12px;

    color:#83eaff;

    text-shadow:0 0 30px rgba(80,220,255,.65);
}

.player-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-bottom:20px;
}

.player-entry{
    padding:13px 15px;
    border-radius:13px;

    background:rgba(255,255,255,.05);

    display:flex;
    align-items:center;
    gap:10px;

    text-align:left;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
}

.red{
    background:#ff5270;
    box-shadow:0 0 15px #ff5270;
}

.blue{
    background:#51caff;
    box-shadow:0 0 15px #51caff;
}

.status{
    color:#858ba3;
    font-size:13px;
    margin-top:12px;
}

#error,
#roomError{
    color:#ff7080;
    font-size:13px;
    min-height:18px;
    margin-top:10px;
}

/* =========================================================
   GAME UI
========================================================= */

#gameUI{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.topbar{
    position:absolute;
    top:17px;
    left:17px;
    right:17px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.panel{
    padding:12px 16px;

    border:1px solid rgba(255,255,255,.11);
    border-radius:15px;

    background:rgba(5,7,20,.62);
    backdrop-filter:blur(16px);

    box-shadow:0 12px 40px rgba(0,0,0,.3);
}

.controls{
    color:#aeb4cb;
    font-size:12px;
    line-height:1.7;
}

.controls b{
    color:white;
}

#location{
    font-weight:900;
    letter-spacing:.5px;
}

#message{
    position:absolute;
    left:50%;
    top:28%;

    transform:translate(-50%,-50%) scale(.8);

    opacity:0;
    visibility:hidden;

    padding:23px 38px;

    border-radius:20px;

    background:rgba(7,8,18,.9);
    border:1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(22px);

    font-size:clamp(25px,5vw,46px);
    font-weight:1000;

    text-align:center;

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        0 0 55px rgba(100,80,255,.15);

    transition:
        opacity .18s ease,
        transform .25s cubic-bezier(.2,.8,.2,1);
}

#message.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,-50%) scale(1);
}

#checkpoint{
    position:absolute;
    left:50%;
    top:14%;

    transform:translateX(-50%) translateY(-15px);

    opacity:0;
    visibility:hidden;

    padding:10px 20px;
    border-radius:999px;

    background:rgba(60,48,160,.75);
    border:1px solid rgba(170,150,255,.4);

    backdrop-filter:blur(15px);

    font-weight:900;
    font-size:14px;

    transition:.3s;
}

#checkpoint.show{
    opacity:1;
    visibility:visible;
    transform:translateX(-50%) translateY(0);
}

#loading{
    position:fixed;
    inset:0;
    z-index:200;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050610;

    font-size:18px;
    font-weight:800;
}

.spinner{
    width:24px;
    height:24px;

    border:3px solid rgba(255,255,255,.15);
    border-top-color:#8b6cff;

    border-radius:50%;

    animation:spin .7s linear infinite;
    margin-right:12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:700px){
    .lobby-card{
        padding:28px 20px;
    }

    .buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

addEventListener("resize",resize);

/* =========================================================
   CONNECTION
========================================================= */

function connect(){

    return new Promise(
        (resolve,reject) => {

            socket =
                new WebSocket(SERVER);

            socket.onopen = () => {

                loading.style.display = "none";

                resolve();

            };

            socket.onerror = () => {

                reject(
                    new Error(
                        "Could not connect to multiplayer server."
                    )
                );

            };

            socket.onclose = () => {

                if(
                    !practiceMode &&
                    !gameStarted
                ){

                    showError(
                        "Disconnected from server."
                    );

                }

            };

            socket.onmessage =
                event => {

                    try{

                        handleServerMessage(
                            JSON.parse(event.data)
                        );

                    }catch(error){

                        console.error(error);

                    }

                };

        }
    );

}


/* =========================================================
   SERVER
========================================================= */

function handleServerMessage(data){

    if(data.type === "error"){

        errorBox.textContent =
            data.message || "";

        roomError.textContent =
            data.message || "";

        return;
    }


    if(data.type === "roomCreated"){

        myId = data.id;
        myName = data.name;
        myColor = data.color;
        room = data.room;

        players.clear();

        players.set(
            myId,
            createPlayer(
                myId,
                myName,
                myColor,
                760,
                530
            )
        );

        roomCode.textContent =
            room;

        showRoomPanel();

        return;
    }


    if(data.type === "joined"){

        myId = data.id;
        myName = data.name;
        myColor = data.color;
        room = data.room;

        players.clear();

        players.set(
            myId,
            createPlayer(
                myId,
                myName,
                myColor,
                820,
                530
            )
        );

        roomCode.textContent =
            room;

        showRoomPanel();

        return;
    }


    if(data.type === "playerJoined"){

        if(data.id === myId){
            return;
        }

        players.set(
            data.id,
            createPlayer(
                data.id,
                data.name,
                data.color,
                data.x,
                data.y
            )
        );

        updatePlayerList();

        return;
    }


    if(data.type === "playerMoved"){

        if(data.id === myId){
            return;
        }

        const p =
            players.get(data.id);

        if(!p){
            return;
        }

        p.targetX =
            data.x;

        p.targetY =
            data.y;

        p.targetVX =
            data.vx;

        p.targetVY =
            data.vy;

        p.grounded =
            !!data.grounded;

        p.running =
            !!data.running;

        p.dead =
            !!data.dead;

        return;
    }


    if(data.type === "playerRespawned"){

        const p =
            players.get(data.id);

        if(!p){
            return;
        }

        p.x =
            data.x;

        p.y =
            data.y;

        p.targetX =
            data.x;

        p.targetY =
            data.y;

        p.vx = 0;
        p.vy = 0;
        p.dead = false;

        return;
    }


    if(data.type === "playerLeft"){

        players.delete(data.id);

        updatePlayerList();

        return;
    }


    if(data.type === "gameStart"){

        beginGame();

        return;
    }

}

async function hostGame(){

    const name =
        nameInput.value.trim();

    if(!name){

        showError(
            "Enter a name first."
        );

        return;
    }

    try{

        await connect();

        socket.send(
            JSON.stringify({
                type:"host",
                name

        );

    }catch(error){

        showError(
            error.message
        );

    }

}


async function joinGame(){

    const name =
        joinName.value.trim();

    const code =
        roomInput.value
            .trim()
            .toUpperCase();

    if(!name){

        roomError.textContent =
            "Enter your name.";

        return;
    }

    if(code.length !== 4){

        roomError.textContent =
            "Room codes are 4 characters.";

        return;
    }

    try{

        await connect();

        socket.send(
            JSON.stringify({
                type:"join",
                room:code,
                name
            })
        );

    }catch(error){

        roomError.textContent =
            error.message;

    }

}

/* =========================================================
   PHYSICS
========================================================= */

const physics = {

    gravity:1800,

    walkSpeed:320,
    runSpeed:520,

    acceleration:2600,
    airAcceleration:1450,

    jumpVelocity:-735,

    friction:3000,

    maxFall:1500

};


/* =========================================================
   LOCAL PLAYER
========================================================= */

function updateLocalPlayer(p,dt){

    if(p.dead){
        return;
    }

    const left =
        keys["KeyA"] ||
        keys["ArrowLeft"];

    const right =
        keys["KeyD"] ||
        keys["ArrowRight"];

    const jump =
        keys["KeyW"] ||
        keys["ArrowUp"] ||
        keys["Space"];

    const running =
        keys["ShiftLeft"] ||
        keys["ShiftRight"];


    if(jump){
        p.jumpBuffer = .14;
    }else{
        p.jumpBuffer -= dt;
    }


    if(!p.grounded){
        p.coyote -= dt;
    }else{
        p.coyote = .12;
    }


    const direction =
        (right ? 1 : 0) -
        (left ? 1 : 0);


    const targetSpeed =
        running
            ? physics.runSpeed
            : physics.walkSpeed;


    const acceleration =
        p.grounded
            ? physics.acceleration
            : physics.airAcceleration;


    if(direction !== 0){

        p.vx +=
            direction *
            acceleration *
            dt;

        p.facing =
            direction;

    }else{

        if(p.grounded){

            if(
                Math.abs(p.vx) <=
                physics.friction * dt
            ){

                p.vx = 0;

            }else{

                p.vx -=
                    Math.sign(p.vx) *
                    physics.friction *
                    dt;

            }

        }else{

            p.vx *=
                Math.pow(.985,dt * 60);

        }

    }


    p.vx =
        Math.max(
            -targetSpeed,
            Math.min(
                targetSpeed,
                p.vx
            )
        );


    if(
        p.jumpBuffer > 0 &&
        p.coyote > 0
    ){

        p.vy =
            physics.jumpVelocity;

        p.grounded = false;
        p.coyote = 0;
        p.jumpBuffer = 0;

    }


    if(
        !jump &&
        p.vy < -250
    ){

        p.vy +=
            2300 * dt;

    }


    p.vy +=
        physics.gravity * dt;

    p.vy =
        Math.min(
            p.vy,
            physics.maxFall
        );


    const oldY =
        p.y;

    p.x +=
        p.vx * dt;

    p.y +=
        p.vy * dt;

    p.grounded = false;


    collideWithWorld(
        p,
        oldY
    );


    p.running =
        Math.abs(p.vx) > 360;


    p.anim +=
        Math.abs(p.vx) *
        dt *
        .025;


    p.squash =
        Math.max(
            0,
            p.squash - dt * 5
        );


    if(p.y > cameraY + H + 700){

        killPlayer(p);

    }


    p.x =
        Math.max(
            -1000,
            Math.min(
                33000,
                p.x
            )
        );


    updateCheckpoint(p);

}


/* =========================================================
   MOVING PLATFORM
========================================================= */

function getMovingPlatformData(mp){

    const t =
        worldTime;

    return {

        x:
            mp.baseX +
            Math.sin(
                t * mp.speed +
                mp.phase
            ) *
            mp.distance,

        y:
            mp.baseY

    };

}


/* =========================================================
   COLLISION
========================================================= */

function collideWithWorld(p,oldY){

    const oldBottom =
        oldY + p.height;

    const newBottom =
        p.y + p.height;


    for(
        const platform
        of platforms
    ){

        if(
            p.x + p.width >
                platform.x &&
            p.x <
                platform.x + platform.w &&
            oldBottom <= platform.y &&
            newBottom >= platform.y &&
            p.vy >= 0
        ){

            p.y =
                platform.y -
                p.height;

            p.vy = 0;
            p.grounded = true;

            p.squash = 1;

        }

    }


    for(
        const f
        of furniture
    ){

        const top =
            f.y;

        if(
            p.x + p.width >
                f.x &&
            p.x <
                f.x + f.w &&
            oldBottom <= top &&
            newBottom >= top &&
            p.vy >= 0
        ){

            p.y =
                top -
                p.height;

            p.vy = 0;
            p.grounded = true;

        }

    }


    for(
        const f
        of officeFurniture
    ){

        const top =
            f.y;

        if(
            p.x + p.width >
                f.x &&
            p.x <
                f.x + f.w &&
            oldBottom <= top &&
            newBottom >= top &&
            p.vy >= 0
        ){

            p.y =
                top -
                p.height;

            p.vy = 0;
            p.grounded = true;

        }

    }


    for(
        const mp
        of movingPlatforms
    ){

        const pos =
            getMovingPlatformData(mp);

        if(
            p.x + p.width >
                pos.x &&
            p.x <
                pos.x + mp.w &&
            oldBottom <= pos.y &&
            newBottom >= pos.y &&
            p.vy >= 0
        ){

            p.y =
                pos.y -
                p.height;

            p.vy = 0;
            p.grounded = true;

        }

    }

}


/* =========================================================
   CHECKPOINT
========================================================= */

function updateCheckpoint(p){

    let best = null;

    for(
        const cp
        of checkpoints
    ){

        if(
            p.y <= cp.y + 120 &&
            cp.y < p.checkpointY
        ){

            if(
                !best ||
                cp.y < best.y
            ){

                best = cp;

            }

        }

    }


    if(best){

        p.checkpointX =
            best.x;

        p.checkpointY =
            best.y;

        if(p.id === myId){

            showCheckpoint();

        }

    }

}

/* =========================================================
   CHAIN
========================================================= */

const chain = {

    softLength:290,
    maxLength:355,

    stiffness:7,
    damping:2.5

};


function updateChain(dt){

    if(players.size < 2){
        return;
    }

    const list =
        [...players.values()];

    const a = list[0];
    const b = list[1];

    if(a.dead || b.dead){
        return;
    }


    const ax =
        a.x + a.width / 2;

    const ay =
        a.y + a.height / 2;

    const bx =
        b.x + b.width / 2;

    const by =
        b.y + b.height / 2;


    const dx =
        bx - ax;

    const dy =
        by - ay;


    const distance =
        Math.hypot(dx,dy);


    chainDistanceText.textContent =
        Math.round(distance);


    if(distance <= chain.softLength){
        return;
    }


    const nx =
        dx / distance;

    const ny =
        dy / distance;


    const excess =
        distance -
        chain.softLength;


    const relativeVelocity =
        (b.vx - a.vx) * nx +
        (b.vy - a.vy) * ny;


    const force =
        excess *
            chain.stiffness +
        relativeVelocity *
            chain.damping;


    const pull =
        Math.min(
            Math.max(force,0),
            1700
        );


    a.vx +=
        nx * pull * dt;

    a.vy +=
        ny * pull * dt;

    b.vx -=
        nx * pull * dt;

    b.vy -=
        ny * pull * dt;


    if(distance > chain.maxLength){

        const correction =
            distance -
            chain.maxLength;

        const amount =
            correction * .5;


        if(!a.grounded){

            a.x +=
                nx * amount;

            a.y +=
                ny * amount;

        }


        if(!b.grounded){

            b.x -=
                nx * amount;

            b.y -=
                ny * amount;

        }

    }

}

function killPlayer(p){

    if(p.dead){
        return;
    }

    p.dead = true;

    p.vx = 0;

    shake = 12;

        socket.readyState ===
            WebSocket.OPEN &&
        !practiceMode
    ){

        socket.send(
            JSON.stringify({
                type:"respawn"
            })
        );

    }

}


function respawnPlayer(p){

    p.x =
        p.checkpointX;

    p.y =
        p.checkpointY -
        p.height;

    p.vx = 0;
    p.vy = 0;

    p.dead = false;

    p.grounded = false;

    p.coyote = 0;
    p.jumpBuffer = 0;

    cameraY =
        p.y - H * .65;

    cameraX =
        p.x - W * .38;

    hideMessage();

}

/* =========================================================
   REMOTE PLAYERS
========================================================= */

function updateRemotePlayers(dt){

    for(
        const p
        of players.values()
    ){

        if(
            p.id === myId ||
            p.dead
        ){
            continue;
        }


        const smoothing =
            1 -
            Math.pow(
                .0001,
                dt
            );


        p.x +=
            (
                p.targetX -
                p.x
            ) *
            smoothing;


        p.y +=
            (
                p.targetY -
                p.y
            ) *
            smoothing;


        p.vx =
            p.targetVX;

        p.vy =
            p.targetVY;


        if(
            Math.abs(p.vx) > 10
        ){

            p.facing =
                Math.sign(p.vx);

        }


        p.anim +=
            Math.abs(p.vx) *
            dt *
            .025;

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    const me =
        players.get(myId);

    if(!me){
        return;
    }


    const targetY =
        me.y -
        H * .58;


    const targetX =
        me.x -
        W * .38;


    cameraY +=
        (
            targetY -
            cameraY
        ) *
        (
            1 -
            Math.pow(.0008,dt)
        );


    cameraX +=
        (
            targetX -
            cameraX
        ) *
        (
            1 -
            Math.pow(.001,dt)
        );


    cameraY =
        Math.min(
            1000,
            cameraY
        );

    cameraY =
        Math.max(
            -6500,
            cameraY
        );


    cameraX =
        Math.max(
            0,
            Math.min(
                32000,
                cameraX
            )
        );


    let area =
        "🏠 THE HOUSE";


    if(me.y < -120){
        area = "🏢 THE OFFICE";
    }

    if(me.y < -1300){
        area = "☁️ THE CLOUDS";
    }

    if(me.y < -2750){
        area = "🚀 SPACE";
    }

    if(me.y < -5150){
        area = "🌕 THE MOON";
    }


    locationText.textContent =
        area;

}

function drawBackground(){

    const me =
        players.get(myId);

    const y =
        me ? me.y : 800;


    /* HOUSE */

    if(y > -120){

        const g =
            ctx.createLinearGradient(

            0,
            "#91c9ff"
        );

        g.addColorStop(
            1,
            "#f5d9b5"
        );

        ctx.fillStyle = g;
        ctx.fillRect(0,0,W,H);

        drawHouseBackground();

        return;
    }


    /* OFFICE */

    if(y > -1300){

        ctx.fillStyle =
            "#101522";

        ctx.fillRect(
            0,0,W,H
        );

        drawOfficeBackground();

        return;
    }


    /* CLOUDS */

    if(y > -2750){

        const g =
            ctx.createLinearGradient(
                0,0,
                0,H
            );

        g.addColorStop(
            0,
            "#5b79c9"
        );

        g.addColorStop(
            1,
            "#d9efff"
        );

        ctx.fillStyle = g;
        ctx.fillRect(
            0,0,W,H
        );

        drawCloudBackground();

        return;
    }


    /* SPACE */

    if(y > -5150){

        drawSpaceBackground();

        return;
    }


    /* MOON */

    drawMoonBackground();

}


/* =========================================================
   HOUSE BACKGROUND
========================================================= */

function drawHouseBackground(){

    /* distant neighborhood */

    ctx.fillStyle =
        "rgba(80,100,130,.25)";

    for(
        let x=-100;
        x<W+100;
        x+=170
    ){

        const h =
            90 +
            ((x * 17) % 90);

        ctx.fillRect(
            x,
            H-h,
            130,
            h
        );

    }


    /* sun */

    ctx.fillStyle =
        "rgba(255,240,170,.8)";

    ctx.beginPath();

    ctx.arc(
        W-130,
        110,
        55,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   OFFICE BACKGROUND
========================================================= */

function drawOfficeBackground(){

    /* skyscrapers */

    for(
        let i=0;
        i<14;
        i++
    ){

        const x =
            i * 170 -
            (cameraX*.12 % 170);

        const height =
            220 +
            (i%5)*90;

        ctx.fillStyle =
            i%2
                ? "#151d30"
                : "#111827";

        ctx.fillRect(
            x,
            H-height,
            140,
            height
        );


        for(
            let wy=H-height+30;
            wy<H-20;
            wy+=45
        ){

            ctx.fillStyle =
                "rgba(100,190,255,.13)";

            ctx.fillRect(
                x+20,
                wy,
                20,
                18
            );

            ctx.fillRect(
                x+65,
                wy,
                20,
                18
            );

        }

    }

}


/* =========================================================
   CLOUD BACKGROUND
========================================================= */

function drawCloudBackground(){

    for(
        let i=0;
        i<14;
        i++
    ){

        const x =
            i*260 -
            (cameraX*.25 % 260);

        const y =
            100 +

        );

}


/* =========================================================
   SPACE BACKGROUND
========================================================= */

function drawSpaceBackground(){

    ctx.fillStyle =
        "#02030b";

    ctx.fillRect(
        0,0,W,H
    );


    /* stars */

    for(
        let i=0;
        i<180;
        i++
    ){

        const x =
            ((i*137) -
            cameraX*.08) %
            (W+50);

        const y =
            ((i*83) -
            cameraY*.05) %
            (H+50);

        const sx =
            x < 0 ? x+W+50 : x;

        const sy =
            y < 0 ? y+H+50 : y;

        ctx.fillStyle =
            i%7===0
                ? "#9fdcff"
                : "#ffffff";

        ctx.globalAlpha =
            .35 +
            (i%5)*.1;

        ctx.fillRect(
            sx,
            sy,
            i%3===0 ? 3 : 2,
            i%3===0 ? 3 : 2
        );

    }

    ctx.globalAlpha = 1;


    /* earth */

    ctx.save();

    ctx.globalAlpha=.7;

    ctx.fillStyle="#315dff";

    ctx.beginPath();

    ctx.arc(
        W-80,
        H-100,
        95,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   MOON BACKGROUND
========================================================= */

function drawMoonBackground(){

    ctx.fillStyle =
        "#02030a";

    ctx.fillRect(
        0,0,W,H
    );


    /* stars */

    for(
        let i=0;
        i<130;
        i++
    ){

        const x =
            (i*173)%W;

        const y =
            (i*71)%H;

        ctx.fillStyle =
            "#ffffff";

        ctx.globalAlpha =
            .35+(i%4)*.12;

        ctx.fillRect(
            x,
            y,
            2,
            2
        );

    }

    ctx.globalAlpha=1;


    /* giant earth */

    ctx.fillStyle =
        "#2870d8";

    ctx.beginPath();

    ctx.arc(
        W*.82,
        H*.25,
        150,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
        "rgba(255,255,255,.15)";

    ctx.beginPath();

    ctx.arc(
        W*.77,
        H*.20,
        130,
        0,
        Math.PI*2
    );

    ctx.fill();

}

/* =========================================================
   CLOUD
========================================================= */

function drawCloud(
    x,
    y,
    w,
    h
){

    ctx.save();

    ctx.fillStyle =
        "rgba(255,255,255,.94)";

    ctx.beginPath();

    ctx.ellipse(
        x+w*.5,
        y+h*.65,
        w*.5,
        h*.35,
        0,0,Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x+w*.25,
        y+h*.55,
        h*.4,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x+w*.5,
        y+h*.35,
        h*.5,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x+w*.73,
        y+h*.55,
        h*.42,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   METAL
========================================================= */

function drawMetalPlatform(
    x,y,w,h
){

    ctx.fillStyle =
        "#657184";

    ctx.fillRect(
        x,y,w,h
    );

    ctx.fillStyle =
        "#a7b4c7";

    ctx.fillRect(
        x,y,w,5
    );

    ctx.strokeStyle =
        "#313a49";

    ctx.lineWidth=3;

    for(
        let i=0;
        i<w;
        i+=45
    ){

        ctx.strokeRect(
            x+i,
            y,
            30,
            h
        );

    }

}


/* =========================================================
   ASTEROID
========================================================= */

function drawAsteroid(
    x,y,w,h
){

    ctx.fillStyle =
        "#71685f";

    ctx.beginPath();

    ctx.moveTo(
        x+w*.05,
        y+h*.6
    );

    ctx.lineTo(
        x+w*.2,
        y+h*.1
    );

    ctx.lineTo(
        x+w*.65,
        y
    );

    ctx.lineTo(
        x+w*.95,
        y+h*.3
    );

    ctx.lineTo(
        x+w*.85,
        y+h*.9
    );

    ctx.lineTo(
        x+w*.35,
        y+h
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle =
        "rgba(30,25,25,.35)";

    ctx.beginPath();

    ctx.arc(
        x+w*.3,
        y+h*.45,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   MOON ROCK
========================================================= */

function drawMoonRock(

){

    ctx.fillStyle =
        "#8f919a";

    ctx.fillRect(

    ctx.fillStyle =
        "#b7bac2";

    ctx.fillRect(
        x,y,w,8
    );

    ctx.fillStyle =
        "rgba(40,40,45,.3)";

    for(
        let i=0;
        i<Math.floor(w/100);

        ctx.beginPath();

        ctx.arc(
            x+50+i*100,
            y+h*.55,

        );

    }

}

    );

    );

        i++

            );

            );

        ctx.fillStyle =
            "#72c9ee";

        ctx.fillRect(
            wx,
            wy,
            170,
            150
        );

        ctx.strokeStyle =
            "#8b705c";

        ctx.lineWidth=8;

        ctx.strokeRect(
            wx,
            wy,
            170,
            150
        );

    }

}


/* =========================================================
   OFFICE STRUCTURE
========================================================= */

function drawOfficeStructure(){

    const x =
        worldToScreenX(6400);

    const y =
        worldToScreenY(-1250);


    if(
        x > W ||
        x+1300 < 0
    ){
        return;
    }


    /* outside building */

    ctx.fillStyle =
        "#252b37";

    ctx.fillRect(
        x,
        y,
        1250,
        1050
    );


    /* glass windows */

    for(
        let floor=0;
        floor<5;
        floor++
    ){

        const fy =
            worldToScreenY(
                -1120-floor*180
            );

        for(
            let i=0;
            i<6;
            i++
        ){

            const fx =
                worldToScreenX(
                    6530+i*180
                );

            ctx.fillStyle =
                "rgba(70,170,230,.28)";

            ctx.fillRect(
                fx,
                fy,
                130,
                120
            );

            ctx.strokeStyle =
                "#566273";

            ctx.lineWidth=5;

            ctx.strokeRect(
                fx,
                fy,
                130,
                120
            );

        }

    }

}


/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

    drawBackground();

    const me =
        players.get(myId);

    if(
        me &&
        me.y > -1300
    ){

        drawHouseStructure();

    }

    if(
        me &&
        me.y < -100 &&
        me.y > -1450
    ){

        drawOfficeStructure();

    }

    drawEnvironment();

    drawCheckpoints();

    drawChain();

    drawPlayers();

}


/* =========================================================
   CHECKPOINT VISUALS
========================================================= */

function drawCheckpoints(){

    for(
        const cp
        of checkpoints
    ){

        const x =
            worldToScreenX(cp.x);

        const y =
            worldToScreenY(cp.y);


        if(
            x < -100 ||
            x > W+100 ||
            y < -100 ||
            y > H+100
        ){
            continue;
        }


        ctx.fillStyle =
            "rgba(120,100,255,.18)";

        ctx.fillRect(
            x-5,
            y-100,
            10,
            100
        );

        ctx.fillStyle =
            "#8f7dff";

        ctx.fillRect(
            x-4,
            y-100,
            8,
            100
        );

        ctx.fillStyle =
            "#c3b9ff";

        ctx.beginPath();

        ctx.arc(
            x,
            y-105,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   CHAIN DRAW
========================================================= */

function drawChain(){

    if(players.size < 2){
        return;
    }

    const list =
        [...players.values()];

    const a=list[0];
    const b=list[1];

    if(a.dead || b.dead){
        return;
    }


    const ax =
        worldToScreenX(
            a.x+a.width/2
        );

    const ay =
        worldToScreenY(
            a.y+a.height/2
        );

    const bx =
        worldToScreenX(
            b.x+b.width/2
        );

    const by =
        worldToScreenY(
            b.y+b.height/2
        );


    const distance =
        Math.hypot(
            bx-ax,
            by-ay
        );


    const danger =
        distance >
        chain.softLength;


    ctx.strokeStyle =
        danger
            ? "#ff6a83"
            : "#b9c2d5";

    ctx.lineWidth =
        danger
            ? 8
            : 6;


    ctx.beginPath();

    ctx.moveTo(
        ax,
        ay
    );

    ctx.lineTo(
        bx,
        by
    );

    ctx.stroke();


    const links =
        Math.max(
            3,
            Math.floor(
                distance/24
            )
        );


    ctx.fillStyle =
        danger
            ? "#ff93a5"
            : "#e5e9f1";


    for(
        let i=1;
        i<links;
        i++
    ){

        const t =
            i/links;

        const x =
            ax+
            (bx-ax)*t;

        const y =
            ay+
            (by-ay)*t;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   PLAYERS
========================================================= */

function drawPlayers(){

    for(
        const p
        of players.values()
    ){

        if(p.dead){
            continue;
        }


        const x =
            worldToScreenX(p.x);

        const y =
            worldToScreenY(p.y);


        if(
            x+p.width < 0 ||
            x > W ||
            y+p.height < 0 ||
            y > H
        ){
            continue;
        }


        drawPlayer(
            p,
            x,
            y
        );

    }

}


function drawPlayer(
    p,
    x,
    y
){

    const moving =
        Math.abs(p.vx)>20;

    const bob =
        moving
            ? Math.sin(p.anim*12)*2
            : 0;


    const bodyColor =
        p.color === "blue"
            ? "#48bfff"
            : "#ff5270";


    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.22)";

    ctx.beginPath();

    ctx.ellipse(
        x+p.width/2,
        y+p.height+4,
        23,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* legs */

    ctx.strokeStyle =
        "#202331";

    ctx.lineWidth=8;

    ctx.lineCap="round";

    const legMove =
        moving
            ? Math.sin(p.anim*14)*6
            : 0;

    ctx.beginPath();

    ctx.moveTo(
        x+11,
        y+42
    );

    ctx.lineTo(
        x+8-legMove,
        y+58
    );

    ctx.moveTo(
        x+23,
        y+42
    );

    ctx.lineTo(
        x+26+legMove,
        y+58
    );

    ctx.stroke();


    /* body */

    ctx.fillStyle =
        bodyColor;

    ctx.fillRect(
        x+6,
        y+17+bob,
        23,
        28
    );


    /* head */

    ctx.fillStyle =
        "#ffd0ad";

    ctx.beginPath();

    ctx.arc(
        x+17,
        y+10+bob,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* hair */

    ctx.fillStyle =
        "#2c2430";

    ctx.beginPath();

    ctx.arc(
        x+17,
        y+6+bob,
        13,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* eyes */

    ctx.fillStyle =
        "#11131b";

    ctx.beginPath();

    ctx.arc(
        x+12,
        y+10+bob,
        2,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+21,
        y+10+bob,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* name */

    ctx.font =
        "800 12px system-ui";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "rgba(255,255,255,.9)";

    ctx.fillText(
        p.name,
        x+p.width/2,
        y-13
    );

}


/* =========================================================
   NETWORK
========================================================= */

function sendMovement(){

    const me =
        players.get(myId);

    if(
        !me ||
        practiceMode ||
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ){
        return;
    }


    socket.send(
        JSON.stringify({

            type:"move",

            x:me.x,
            y:me.y,

            vx:me.vx,
            vy:me.vy,

            grounded:me.grounded,
            running:me.running,
            dead:me.dead

        })
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(text){

    errorBox.textContent =
        text;

}


/* =========================================================
   FINISH
========================================================= */

let finished = false;

function checkFinish(){

    if(finished){
        return;
    }

    const me =
        players.get(myId);

    if(!me){
        return;
    }


    if(
        me.x > finishX &&
        me.y < finishY + 150
    ){

        finished = true;

        showMessage(
            "🌕 YOU REACHED THE MOON!"
        );

        shake=20;

        setTimeout(
            () => {

                showMessage(
                    "🏆 YOU CONQUERED THE CLIMB"
                );

            },
            1800
        );

    }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

    const dt =
        Math.min(
            (now-lastTime)/1000,
            .033
        );

    lastTime =
        now;

    worldTime += dt;


    if(gameStarted){

        const me =
            players.get(myId);


        if(me){

            updateLocalPlayer(
                me,
                dt
            );

        }


        updateRemotePlayers(dt);

        updateChain(dt);

        updateCamera(dt);

        checkFinish();


        if(
            now-lastSend >
            50
        ){

            sendMovement();

            lastSend =
                now;

        }

    }


    if(shake>0){

        shake =
            Math.max(
                0,
                shake-dt*35
            );

    }


    ctx.save();


    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

    }


    drawWorld();


    ctx.restore();


    requestAnimationFrame(
        loop
    );

}


requestAnimationFrame(
    loop
);


/* =========================================================
   INITIAL LOADING
========================================================= */

setTimeout(
    () => {

        loading.style.display =
            "none";

    },
    700
);

</script>
