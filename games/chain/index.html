<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolio Climb</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #070812;
    color: white;
}

body {
    user-select: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

.hidden {
    display: none !important;
}

/* =========================
   MENU
========================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 20%, rgba(125, 70, 255, .25), transparent 40%),
        linear-gradient(135deg, #080912, #11132a);
}

.menu-box {
    width: min(480px, 92vw);
    padding: 38px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    background: rgba(15,17,35,.82);
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 100px rgba(0,0,0,.55);
    text-align: center;
}

.logo {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(90deg,#ff4d6d,#8b5cf6,#3b82f6);
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 8px;
}

.subtitle {
    color: #a7a9bb;
    margin-bottom: 30px;
}

.menu-buttons {
    display: grid;
    gap: 12px;
}

button {
    border: 0;
    cursor: pointer;
    font: inherit;
}

.menu-btn {
    padding: 16px;
    border-radius: 14px;
    color: white;
    font-weight: 800;
    font-size: 16px;
    background: linear-gradient(135deg,#7c3aed,#2563eb);
    transition: .2s;
}

.menu-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

.menu-btn.secondary {
    background: rgba(255,255,255,.08);
}

input {
    width: 100%;
    padding: 15px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    outline: none;
    background: rgba(0,0,0,.3);
    color: white;
    font-size: 16px;
    margin-bottom: 12px;
}

input:focus {
    border-color: #8b5cf6;
}

.back-btn {
    margin-top: 14px;
    color: #aaa;
    background: none;
}

/* =========================
   LOBBY
========================= */

#lobby {
    position: fixed;
    inset: 0;
    z-index: 19;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 10%, rgba(139,92,246,.2), transparent 40%),
        #080912;
}

.room-code {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 10px;
    margin: 15px 0;
    color: #fff;
}

.status {
    margin: 15px 0 25px;
    color: #aaa;
}

.player-list {
    display: grid;
    gap: 8px;
    margin: 20px 0;
}

.player-entry {
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.start-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(135deg,#22c55e,#16a34a);
    color: white;
    font-weight: 900;
}

.start-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* =========================
   GAME UI
========================= */

#gameUI {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.topbar {
    position: absolute;
    top: 18px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.ui-panel {
    padding: 11px 15px;
    border-radius: 12px;
    background: rgba(10,12,25,.7);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(10px);
}

.controls {
    color: #bbb;
    font-size: 13px;
}

.room-small {
    font-weight: 800;
}

#message {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    padding: 20px 28px;
    border-radius: 16px;
    background: rgba(10,12,25,.9);
    font-size: 25px;
    font-weight: 900;
    text-align: center;
    opacity: 0;
    transition: .25s;
}

#message.show {
    opacity: 1;
}

/* =========================
   FINISH
========================= */

.finish-text {
    color: #86efac;
}

/* =========================
   MOBILE DISABLED
========================= */

@media(max-width:700px) {
    .menu-box {
        padding: 25px;
    }

    .logo {
        font-size: 36px;
    }

    .controls {
        display: none;
    }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="menu-box" id="mainMenu">

        <div class="logo">COOLIO CLIMB</div>

        <div class="subtitle">
            Two players. One chain. Absolutely terrible decisions.
        </div>

        <div class="menu-buttons">

            <button class="menu-btn" id="hostBtn">
                HOST GAME
            </button>

            <button class="menu-btn secondary" id="joinBtn">
                JOIN GAME
            </button>

            <button class="menu-btn secondary" id="practiceBtn">
                PRACTICE PARKOUR
            </button>

        </div>

    </div>

    <!-- HOST NAME -->

    <div class="menu-box hidden" id="hostNameMenu">

        <div class="logo">HOST GAME</div>

        <p class="subtitle">
            What's your name?
        </p>

        <input
            id="hostName"
            maxlength="16"
            placeholder="Your name"
        >

        <button class="menu-btn" id="createRoomBtn">
            CREATE ROOM
        </button>

        <button class="back-btn" id="hostBack">
            ← Back
        </button>

    </div>

    <!-- JOIN -->

    <div class="menu-box hidden" id="joinMenu">

        <div class="logo">JOIN GAME</div>

        <input
            id="joinName"
            maxlength="16"
            placeholder="Your name"
        >

        <input
            id="roomInput"
            maxlength="4"
            placeholder="4-letter room code"
            style="text-transform:uppercase"
        >

        <button class="menu-btn" id="joinRoomBtn">
            JOIN ROOM
        </button>

        <button class="back-btn" id="joinBack">
            ← Back
        </button>

    </div>

</div>

<!-- =========================
     LOBBY
========================= -->

<div id="lobby" class="hidden">

    <div class="menu-box">

        <div class="logo">ROOM READY</div>

        <div class="subtitle">
            Give this code to your friend
        </div>

        <div class="room-code" id="roomCode">
            ----
        </div>

        <div class="status" id="lobbyStatus">
            Waiting for player...
        </div>

        <div class="player-list" id="playerList"></div>

        <button
            class="start-btn"
            id="startBtn"
            disabled
        >
            START CLIMB
        </button>

        <button class="back-btn" id="leaveBtn">
            Leave room
        </button>

    </div>

</div>

<!-- =========================
     GAME UI
========================= -->

<div id="gameUI" class="hidden">

    <div class="topbar">

        <div class="ui-panel room-small">
            ROOM: <span id="roomDisplay">----</span>
        </div>

        <div class="ui-panel controls">
            A / D or ← / → Move &nbsp; • &nbsp;
            SHIFT Run &nbsp; • &nbsp;
            SPACE Jump
        </div>

    </div>

    <div id="message"></div>

</div>

<script>

/* =========================================================
   COOLIO CLIMB
   COMPLETE REWRITE
========================================================= */

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize() {
    W = innerWidth;
    H = innerHeight;

    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

resize();

window.addEventListener("resize", resize);


/* =========================
   SERVER
========================= */

const SERVER =
    "wss://cooliobeans-multiplayer.onrender.com";

let socket = null;

let myId = null;
let roomCode = null;
let myColor = "red";
let myName = "Player";

let isHost = false;


/* =========================
   PLAYER STATE
========================= */

const players = new Map();

function createPlayer(id, name, color) {

    return {

        id,
        name,
        color,

        x: 250,
        y: 500,

        vx: 0,
        vy: 0,

        width: 34,
        height: 54,

        grounded: false,

        jumping: false,

        facing: 1,

        running: false,

        dead: false,

        /* remote interpolation */

        targetX: 250,
        targetY: 500,
        targetVX: 0,
        targetVY: 0,

        spawnX: 250,
        spawnY: 500,

        lastGroundY: 500

    };

}


/* =========================
   WORLD
========================= */

const world = {

    gravity: 1800,

    groundY: 650,

    width: 12000

};


/* =========================
   PLATFORMS
========================= */

const platforms = [

    {x:0, y:650, w:850, h:80},

    {x:1000, y:620, w:500, h:80},

    {x:1600, y:560, w:400, h:80},

    {x:2100, y:680, w:700, h:80},

    {x:2950, y:600, w:350, h:80},

    {x:3500, y:530, w:500, h:80},

    {x:4150, y:650, w:900, h:80},

    {x:5200, y:570, w:350, h:80},

    {x:5750, y:500, w:400, h:80},

    {x:6350, y:650, w:700, h:80},

    {x:7200, y:560, w:500, h:80},

    {x:7900, y:460, w:400, h:80},

    {x:8500, y:600, w:700, h:80},

    {x:9500, y:520, w:400, h:80},

    {x:10100, y:450, w:450, h:80},

    {x:10800, y:600, w:900, h:80}

];


/* =========================
   MOVING PLATFORMS
========================= */

const movingPlatforms = [

    {
        x: 880,
        y: 530,
        w: 130,
        h: 25,
        startX: 880,
        range: 100,
        speed: 1.5,
        t: 0
    },

    {
        x: 3050,
        y: 450,
        w: 140,
        h: 25,
        startX: 3050,
        range: 160,
        speed: 1.2,
        t: 2
    },

    {
        x: 6100,
        y: 400,
        w: 150,
        h: 25,
        startX: 6100,
        range: 140,
        speed: 1.4,
        t: 4
    }

];


/* =========================
   OBSTACLES
========================= */

const obstacles = [

    {
        x: 1250,
        y: 570,
        w: 35,
        h: 50
    },

    {
        x: 2330,
        y: 630,
        w: 45,
        h: 50
    },

    {
        x: 3650,
        y: 480,
        w: 40,
        h: 50
    },

    {
        x: 4650,
        y: 600,
        w: 40,
        h: 50
    },

    {
        x: 7400,
        y: 510,
        w: 40,
        h: 50
    },

    {
        x: 8650,
        y: 550,
        w: 45,
        h: 50
    }

];


/* =========================
   FINISH
========================= */

const finish = {

    x: 11450,

    y: 430,

    w: 100,

    h: 170

};


/* =========================
   CAMERA
========================= */

let cameraX = 0;

function updateCamera() {

    const me = players.get(myId);

    if (!me) return;

    const other =
        [...players.values()].find(p => p.id !== myId);

    let target = me.x;

    if (other) {

        target =
            (me.x + other.x) / 2;

    }

    cameraX +=
        (target - W * .45 - cameraX) * .09;

    cameraX = Math.max(
        0,
        Math.min(
            world.width - W,
            cameraX
        )
    );

}


/* =========================
   KEYBOARD
========================= */

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.code] = true;

    if (
        e.code === "Space" ||
        e.code === "ArrowUp"
    ) {
        e.preventDefault();
    }

});

window.addEventListener("keyup", e => {

    keys[e.code] = false;

});


/* =========================
   INPUT
========================= */

function leftPressed() {

    return (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    );

}

function rightPressed() {

    return (
        keys["KeyD"] ||
        keys["ArrowRight"]
    );

}

function jumpPressed() {

    return (
        keys["Space"] ||
        keys["KeyW"] ||
        keys["ArrowUp"]
    );

}

function runPressed() {

    return (
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
    );

}


/* =========================
   JUMP BUFFER
========================= */

let jumpBuffer = 0;

let jumpWasPressed = false;


/* =========================
   PHYSICS
========================= */

function updatePlayer(p, dt) {

    if (!p || p.dead) return;

    const isMe = p.id === myId;

    if (!isMe) {

        /* smooth remote player */

        const smooth = 1 - Math.pow(.001, dt);

        p.x +=
            (p.targetX - p.x) * smooth;

        p.y +=
            (p.targetY - p.y) * smooth;

        p.vx +=
            (p.targetVX - p.vx) * smooth;

        p.vy +=
            (p.targetVY - p.vy) * smooth;

        return;
    }


    /* =========================
       INPUT
    ========================= */

    let direction = 0;

    if (leftPressed()) {
        direction--;
    }

    if (rightPressed()) {
        direction++;
    }


    const running = runPressed();

    p.running =
        running && direction !== 0;


    /* =========================
       SPEED
    ========================= */

    const walkSpeed = 330;

    const runSpeed = 540;

    const maxSpeed =
        running ? runSpeed : walkSpeed;


    /* =========================
       ACCELERATION
    ========================= */

    const acceleration =
        p.grounded
            ? 2600
            : 1500;


    if (direction !== 0) {

        p.vx +=
            direction *
            acceleration *
            dt;

        p.facing = direction;

    } else {

        /* friction */

        const friction =
            p.grounded
                ? 2300
                : 500;

        if (Math.abs(p.vx) < friction * dt) {

            p.vx = 0;

        } else {

            p.vx -=
                Math.sign(p.vx) *
                friction *
                dt;

        }

    }


    /* cap speed */

    if (p.vx > maxSpeed) {
        p.vx = maxSpeed;
    }

    if (p.vx < -maxSpeed) {
        p.vx = -maxSpeed;
    }


    /* =========================
       JUMP BUFFER
    ========================= */

    if (
        jumpPressed() &&
        !jumpWasPressed
    ) {

        jumpBuffer = .14;

    }

    jumpWasPressed = jumpPressed();

    jumpBuffer -= dt;


    /* =========================
       JUMP
    ========================= */

    if (
        jumpBuffer > 0 &&
        p.grounded
    ) {

        p.vy = -720;

        p.grounded = false;

        p.jumping = true;

        jumpBuffer = 0;

    }


    /* =========================
       GRAVITY
    ========================= */

    p.vy +=
        world.gravity * dt;


    /* =========================
       VARIABLE JUMP
    ========================= */

    if (
        !jumpPressed() &&
        p.vy < -250
    ) {

        p.vy +=
            1300 * dt;

    }


    /* =========================
       MOVE X
    ========================= */

    const oldX = p.x;

    p.x +=
        p.vx * dt;


    /* =========================
       X COLLISION
    ========================= */

    for (const platform of getAllPlatforms()) {

        if (
            p.x < platform.x + platform.w &&
            p.x + p.width > platform.x &&
            p.y < platform.y + platform.h &&
            p.y + p.height > platform.y
        ) {

            if (p.vx > 0) {

                p.x =
                    platform.x - p.width;

                p.vx = 0;

            }

            else if (p.vx < 0) {

                p.x =
                    platform.x + platform.w;

                p.vx = 0;

            }

        }

    }


    /* =========================
       MOVE Y
    ========================= */

    const oldY = p.y;

    p.y +=
        p.vy * dt;

    p.grounded = false;


    /* =========================
       PLATFORM COLLISION
    ========================= */

    for (const platform of getAllPlatforms()) {

        const wasAbove =
            oldY + p.height <= platform.y;

        const isFalling =
            p.vy >= 0;

        const overlapsX =
            p.x + p.width > platform.x &&
            p.x < platform.x + platform.w;

        const crossesTop =
            p.y + p.height >= platform.y &&
            p.y < platform.y + platform.h;

        if (
            wasAbove &&
            isFalling &&
            overlapsX &&
            crossesTop
        ) {

            p.y =
                platform.y - p.height;

            p.vy = 0;

            p.grounded = true;

            p.jumping = false;

            p.lastGroundY = p.y;

        }

    }


    /* =========================
       OBSTACLES
    ========================= */

    for (const o of obstacles) {

        if (
            p.x + p.width > o.x &&
            p.x < o.x + o.w &&
            p.y + p.height > o.y &&
            p.y < o.y + o.h
        ) {

            killPlayer(p);

        }

    }


    /* =========================
       FALL
    ========================= */

    if (p.y > H + 500) {

        killPlayer(p);

    }


    /* =========================
       WORLD LIMIT
    ========================= */

    p.x =
        Math.max(
            0,
            Math.min(
                world.width - p.width,
                p.x
            )
        );

}


/* =========================
   PLATFORMS
========================= */

function getAllPlatforms() {

    return [
        ...platforms,
        ...movingPlatforms
    ];

}


/* =========================
   MOVING PLATFORMS
========================= */

function updateMovingPlatforms(dt) {

    for (const p of movingPlatforms) {

        p.t +=
            p.speed * dt;

        p.x =
            p.startX +
            Math.sin(p.t) * p.range;

    }

}


/* =========================
   CHAIN PHYSICS
========================= */

const chain = {

    maxLength: 360,

    softLength: 300,

    stiffness: 8,

    damping: 2.5

};


function updateChain(dt) {

    if (players.size < 2) return;

    const arr =
        [...players.values()];

    const a = arr[0];

    const b = arr[1];

    if (a.dead || b.dead) return;


    const ax =
        a.x + a.width / 2;

    const ay =
        a.y + a.height / 2;

    const bx =
        b.x + b.width / 2;

    const by =
        b.y + b.height / 2;


    let dx = bx - ax;

    let dy = by - ay;

    let dist =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (dist <= chain.softLength) {

        return;

    }


    if (dist === 0) return;


    const nx =
        dx / dist;

    const ny =
        dy / dist;


    const excess =
        dist - chain.softLength;


    /* =========================
       ONLY LOCAL PLAYER
       gets correction
    ========================= */

    const me =
        players.get(myId);

    if (!me) return;


    const other =
        me.id === a.id
            ? b
            : a;


    const mex =
        me.x + me.width / 2;

    const mey =
        me.y + me.height / 2;

    const ox =
        other.x + other.width / 2;

    const oy =
        other.y + other.height / 2;


    let mdx =
        ox - mex;

    let mdy =
        oy - mey;

    let mdist =
        Math.sqrt(
            mdx * mdx +
            mdy * mdy
        );

    if (mdist === 0) return;


    mdx /= mdist;

    mdy /= mdist;


    /* gentle spring */

    const force =
        Math.min(
            excess * chain.stiffness,
            2600
        );


    /* only pull when stretched */

    me.vx +=
        mdx *
        force *
        dt;

    me.vy +=
        mdy *
        force *
        dt;


    /* hard emergency limit */

    if (dist > chain.maxLength) {

        const emergency =
            dist - chain.maxLength;

        me.x +=
            mdx *
            emergency *
            .15;

        me.y +=
            mdy *
            emergency *
            .15;

    }

}


/* =========================
   DEATH
========================= */

function killPlayer(p) {

    if (p.dead) return;

    p.dead = true;

    p.vx = 0;
    p.vy = 0;

    if (p.id === myId) {

        showMessage("💀 YOU FELL");

        setTimeout(() => {

            respawnPlayer(p);

        }, 900);

    }

}


function respawnPlayer(p) {

    p.x = p.spawnX;

    p.y = p.spawnY;

    p.vx = 0;

    p.vy = 0;

    p.dead = false;

}


/* =========================
   FINISH
========================= */

let finished = false;

function checkFinish() {

    if (finished) return;

    if (players.size < 2) return;

    const arr =
        [...players.values()];

    const bothAtFinish =
        arr.every(p => {

            return (
                p.x + p.width >
                    finish.x &&
                p.x <
                    finish.x + finish.w
            );

        });


    if (bothAtFinish) {

        finished = true;

        showMessage(
            "🏆 YOU BOTH MADE IT!<br><span class='finish-text'>COOLIO CLIMB COMPLETE</span>"
        );

    }

}


/* =========================
   NETWORK
========================= */

let lastSend = 0;

function sendMovement(timestamp) {

    if (!socket) return;

    if (
        socket.readyState !== WebSocket.OPEN
    ) return;

    if (!myId) return;

    if (
        timestamp - lastSend < 33
    ) return;

    lastSend = timestamp;

    const me =
        players.get(myId);

    if (!me) return;


    socket.send(
        JSON.stringify({

            type: "move",

            x: me.x,

            y: me.y,

            vx: me.vx,

            vy: me.vy

        })
    );

}


/* =========================
   CONNECT
========================= */

function connectSocket() {

    socket =
        new WebSocket(SERVER);


    socket.onopen = () => {

        console.log(
            "Connected to CoolioBeans server"
        );

    };


    socket.onmessage = e => {

        try {

            const data =
                JSON.parse(e.data);

            handleServerMessage(data);

        }

        catch {

            console.log(
                "Bad server message"
            );

        }

    };


    socket.onclose = () => {

        console.log(
            "Disconnected"
        );

        if (gameRunning) {

            showMessage(
                "Connection lost 😭"
            );

        }

    };

}


/* =========================
   SERVER MESSAGES
========================= */

function handleServerMessage(data) {

    if (data.type === "roomCreated") {

        myId = data.id;

        roomCode = data.room;

        myColor = data.color;

        myName = data.name;

        isHost = true;


        players.clear();

        const me =
            createPlayer(
                myId,
                myName,
                myColor
            );

        me.x = 300;

        me.y = 550;

        me.spawnX = 300;

        me.spawnY = 550;

        players.set(
            myId,
            me
        );


        showLobby();

        return;

    }


    if (data.type === "joined") {

        myId = data.id;

        roomCode = data.room;

        myColor = data.color;

        myName = data.name;

        isHost = false;


        players.clear();

        const me =
            createPlayer(
                myId,
                myName,
                myColor
            );

        me.x = 450;

        me.y = 550;

        me.spawnX = 450;

        me.spawnY = 550;

        players.set(
            myId,
            me
        );


        showLobby();

        return;

    }


    if (data.type === "playerJoined") {

        if (
            players.has(data.id)
        ) return;


        const p =
            createPlayer(
                data.id,
                data.name,
                data.color
            );


        p.x = data.x ?? 300;

        p.y = data.y ?? 550;

        p.targetX = p.x;

        p.targetY = p.y;

        p.spawnX = p.x;

        p.spawnY = p.y;


        players.set(
            data.id,
            p
        );


        updateLobby();

        return;

    }


    if (data.type === "playerMoved") {

        const p =
            players.get(data.id);

        if (!p) return;


        /* NEVER overwrite our own local physics */

        if (
            data.id === myId
        ) {
            return;
        }


        p.targetX =
            Number(data.x) || 0;

        p.targetY =
            Number(data.y) || 0;

        p.targetVX =
            Number(data.vx) || 0;

        p.targetVY =
            Number(data.vy) || 0;


        return;

    }


    if (data.type === "playerLeft") {

        players.delete(
            data.id
        );

        updateLobby();

        return;

    }


    if (data.type === "gameStart") {

        startActualGame();

        return;

    }


    if (data.type === "error") {

        alert(data.message);

    }

}


/* =========================
   HOST GAME
========================= */

function hostGame(name) {

    if (!socket) {

        connectSocket();

        const wait =
            setInterval(() => {

                if (
                    socket &&
                    socket.readyState ===
                        WebSocket.OPEN
                ) {

                    clearInterval(wait);

                    socket.send(
                        JSON.stringify({

                            type: "host",

                            name

                        })
                    );

                }

            }, 50);

        return;

    }


    socket.send(
        JSON.stringify({

            type: "host",

            name

        })
    );

}


/* =========================
   JOIN GAME
========================= */

function joinGame(name, code) {

    if (!socket) {

        connectSocket();

        const wait =
            setInterval(() => {

                if (
                    socket &&
                    socket.readyState ===
                        WebSocket.OPEN
                ) {

                    clearInterval(wait);

                    socket.send(
                        JSON.stringify({

                            type: "join",

                            name,

                            room:
                                code.toUpperCase()

                        })
                    );

                }

            }, 50);

        return;

    }


    socket.send(
        JSON.stringify({

            type: "join",

            name,

            room:
                code.toUpperCase()

        })
    );

}


/* =========================
   LOBBY
========================= */

function showLobby() {

    document
        .getElementById("menu")
        .classList.add("hidden");

    document
        .getElementById("lobby")
        .classList.remove("hidden");


    document
        .getElementById("roomCode")
        .textContent =
            roomCode;


    document
        .getElementById("roomDisplay")
        .textContent =
            roomCode;


    updateLobby();

}


function updateLobby() {

    const list =
        document.getElementById(
            "playerList"
        );

    const status =
        document.getElementById(
            "lobbyStatus"
        );

    const start =
        document.getElementById(
            "startBtn"
        );


    list.innerHTML = "";


    for (
        const p of players.values()
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "player-entry";

        div.textContent =
            (p.id === myId
                ? "👑 "
                : "🔗 ") +
            p.name;

        list.appendChild(div);

    }


    if (players.size < 2) {

        status.textContent =
            "Waiting for your friend...";

        start.disabled = true;

    }

    else {

        status.textContent =
            "Both players are ready!";

        start.disabled =
            !isHost;

        if (!isHost) {

            start.textContent =
                "WAITING FOR HOST";

        }

        else {

            start.textContent =
                "START CLIMB";

        }

    }

}


/* =========================
   START GAME
========================= */

function startGame() {

    if (!isHost) return;

    if (players.size < 2) return;


    socket.send(
        JSON.stringify({

            type: "startGame"

        })
    );


    /*
       IMPORTANT:
       Current server needs to forward
       this message.

       We also start locally immediately.
    */

    startActualGame();

}


/* =========================
   ACTUAL GAME
========================= */

let gameRunning = false;

function startActualGame() {

    if (gameRunning) return;

    gameRunning = true;

    finished = false;


    document
        .getElementById("lobby")
        .classList.add("hidden");


    document
        .getElementById("gameUI")
        .classList.remove("hidden");


    /* reset spawn positions */

    const arr =
        [...players.values()];


    if (arr.length >= 2) {

        arr[0].x = 300;
        arr[0].y = 550;

        arr[0].spawnX = 300;
        arr[0].spawnY = 550;


        arr[1].x = 450;
        arr[1].y = 550;

        arr[1].spawnX = 450;
        arr[1].spawnY = 550;

    }


    showMessage(
        "GET READY..."
    );


    setTimeout(() => {

        hideMessage();

    }, 1200);


    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   PRACTICE
========================= */

function startPractice() {

    players.clear();


    const me =
        createPlayer(
            "practice",
            "You",
            "red"
        );


    me.x = 300;

    me.y = 550;

    me.spawnX = 300;

    me.spawnY = 550;


    players.set(
        "practice",
        me
    );


    myId = "practice";

    roomCode = "PRACT";

    gameRunning = true;

    finished = false;


    document
        .getElementById("menu")
        .classList.add("hidden");


    document
        .getElementById("gameUI")
        .classList.remove("hidden");


    document
        .getElementById("roomDisplay")
        .textContent =
            "PRACTICE";


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   GAME LOOP
========================= */

let lastTime = 0;

function gameLoop(timestamp) {

    if (!gameRunning) return;


    let dt =
        (timestamp - lastTime) /
        1000;


    lastTime =
        timestamp;


    /* prevent giant physics jumps */

    dt =
        Math.min(
            dt,
            0.033
        );


    updateMovingPlatforms(dt);


    for (
        const p of players.values()
    ) {

        updatePlayer(
            p,
            dt
        );

    }


    updateChain(dt);


    checkFinish();


    updateCamera();


    sendMovement(timestamp);


    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#090b20"
    );

    gradient.addColorStop(
        1,
        "#171027"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* stars */

    ctx.fillStyle =
        "rgba(255,255,255,.45)";

    for (
        let i = 0;
        i < 90;
        i++
    ) {

        const x =
            (i * 197) %
            W;

        const y =
            (i * 83) %
            (H * .6);

        const size =
            (i % 3) + 1;

        ctx.fillRect(
            x,
            y,
            size,
            size
        );

    }

}


/* =========================
   DRAW WORLD
========================= */

function drawWorld() {

    ctx.save();

    ctx.translate(
        -cameraX,
        0
    );


    /* platforms */

    for (
        const p of platforms
    ) {

        drawPlatform(p);

    }


    /* moving platforms */

    for (
        const p of movingPlatforms
    ) {

        drawMovingPlatform(p);

    }


    /* obstacles */

    for (
        const o of obstacles
    ) {

        drawObstacle(o);

    }


    /* finish */

    drawFinish();


    /* chain */

    drawChain();


    /* players */

    for (
        const p of players.values()
    ) {

        drawPlayer(p);

    }


    ctx.restore();

}


/* =========================
   PLATFORM
========================= */

function drawPlatform(p) {

    ctx.fillStyle =
        "#292d4a";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        p.h
    );


    ctx.fillStyle =
        "#56618d";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        8
    );


    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.fillRect(
        p.x,
        p.y + 8,
        p.w,
        p.h - 8
    );

}


/* =========================
   MOVING PLATFORM
========================= */

function drawMovingPlatform(p) {

    ctx.fillStyle =
        "#7c3aed";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        p.h
    );


    ctx.fillStyle =
        "#c4b5fd";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        5
    );

}


/* =========================
   OBSTACLE
========================= */

function drawObstacle(o) {

    ctx.fillStyle =
        "#ef4444";

    ctx.fillRect(
        o.x,
        o.y,
        o.w,
        o.h
    );


    ctx.fillStyle =
        "#fecaca";

    ctx.fillRect(
        o.x + 7,
        o.y + 7,
        o.w - 14,
        6
    );

}


/* =========================
   FINISH
========================= */

function drawFinish() {

    ctx.fillStyle =
        "rgba(34,197,94,.18)";

    ctx.fillRect(
        finish.x,
        finish.y,
        finish.w,
        finish.h
    );


    ctx.strokeStyle =
        "#22c55e";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        finish.x,
        finish.y,
        finish.w,
        finish.h
    );


    ctx.fillStyle =
        "#86efac";

    ctx.font =
        "bold 20px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "FINISH",
        finish.x + finish.w / 2,
        finish.y - 15
    );

}


/* =========================
   CHAIN
========================= */

function drawChain() {

    if (players.size < 2) return;


    const arr =
        [...players.values()];

    const a = arr[0];

    const b = arr[1];


    const ax =
        a.x + a.width / 2;

    const ay =
        a.y + a.height / 2;

    const bx =
        b.x + b.width / 2;

    const by =
        b.y + b.height / 2;


    const dx =
        bx - ax;

    const dy =
        by - ay;

    const dist =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    ctx.save();

    ctx.lineWidth =
        dist > chain.softLength
            ? 7
            : 5;

    ctx.strokeStyle =
        dist > chain.softLength
            ? "#f97316"
            : "#a78bfa";

    ctx.shadowBlur = 12;

    ctx.shadowColor =
        ctx.strokeStyle;


    ctx.beginPath();

    ctx.moveTo(
        ax,
        ay
    );

    ctx.lineTo(
        bx,
        by
    );

    ctx.stroke();


    /* chain links */

    const links =
        Math.floor(
            dist / 22
        );


    for (
        let i = 1;
        i < links;
        i++
    ) {

        const t =
            i / links;

        const x =
            ax +
            dx * t;

        const y =
            ay +
            dy * t;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================
   PLAYER
========================= */

function drawPlayer(p) {

    if (p.dead) return;


    const x = p.x;

    const y = p.y;


    ctx.save();


    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x + p.width / 2,
        y + p.height + 5,
        20,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle =
        p.color === "red"
            ? "#ef4444"
            : "#3b82f6";


    ctx.fillRect(
        x,
        y + 18,
        p.width,
        p.height - 18
    );


    /* head */

    ctx.beginPath();

    ctx.arc(
        x + p.width / 2,
        y + 14,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* eyes */

    ctx.fillStyle =
        "#fff";


    const eyeOffset =
        p.facing === 1
            ? 5
            : -5;


    ctx.beginPath();

    ctx.arc(
        x + p.width / 2 + eyeOffset,
        y + 11,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* name */

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 13px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        p.name,
        x + p.width / 2,
        y - 12
    );


    /* sprint effect */

    if (
        p.running &&
        Math.abs(p.vx) > 150
    ) {

        ctx.strokeStyle =
            "rgba(255,255,255,.35)";

        ctx.lineWidth = 3;

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x +
                (p.facing === 1
                    ? -5
                    : p.width + 5),
                y + 30 + i * 8
            );

            ctx.lineTo(
                x +
                (p.facing === 1
                    ? -20
                    : p.width + 20),
                y + 30 + i * 8
            );

            ctx.stroke();

        }

    }


    ctx.restore();

}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();

    drawWorld();

}


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

    const msg =
        document.getElementById(
            "message"
        );

    msg.innerHTML =
        text;

    msg.classList.add(
        "show"
    );

}


function hideMessage() {

    document
        .getElementById(
            "message"
        )
        .classList.remove(
            "show"
        );

}


/* =========================
   MENU NAVIGATION
========================= */

const mainMenu =
    document.getElementById(
        "mainMenu"
    );

const hostNameMenu =
    document.getElementById(
        "hostNameMenu"
    );

const joinMenu =
    document.getElementById(
        "joinMenu"
    );


document
    .getElementById("hostBtn")
    .onclick = () => {

        mainMenu.classList.add(
            "hidden"
        );

        hostNameMenu.classList.remove(
            "hidden"
        );

    };


document
    .getElementById("joinBtn")
    .onclick = () => {

        mainMenu.classList.add(
            "hidden"
        );

        joinMenu.classList.remove(
            "hidden"
        );

    };


document
    .getElementById("hostBack")
    .onclick = () => {

        hostNameMenu.classList.add(
            "hidden"
        );

        mainMenu.classList.remove(
            "hidden"
        );

    };


document
    .getElementById("joinBack")
    .onclick = () => {

        joinMenu.classList.add(
            "hidden"
        );

        mainMenu.classList.remove(
            "hidden"
        );

    };


document
    .getElementById("createRoomBtn")
    .onclick = () => {

        const name =
            document
                .getElementById(
                    "hostName"
                )
                .value
                .trim();


        if (!name) {

            alert(
                "Enter a name first!"
            );

            return;

        }


        hostGame(name);

    };


document
    .getElementById("joinRoomBtn")
    .onclick = () => {

        const name =
            document
                .getElementById(
                    "joinName"
                )
                .value
                .trim();


        const code =
            document
                .getElementById(
                    "roomInput"
                )
                .value
                .trim()
                .toUpperCase();


        if (!name) {

            alert(
                "Enter a name first!"
            );

            return;

        }


        if (
            code.length !== 4
        ) {

            alert(
                "Room code must be 4 characters."
            );

            return;

        }


        joinGame(
            name,
            code
        );

    };


document
    .getElementById("practiceBtn")
    .onclick =
        startPractice;


document
    .getElementById("startBtn")
    .onclick =
        startGame;


/* =========================
   LEAVE
========================= */

document
    .getElementById("leaveBtn")
    .onclick = () => {

        if (socket) {

            socket.close();

        }

        location.reload();

    };


/* =========================
   ROOM CODE
========================= */

document
    .getElementById("roomInput")
    .addEventListener(
        "input",
        e => {

            e.target.value =
                e.target.value
                    .replace(
                        /[^a-zA-Z0-9]/g,
                        ""
                    )
                    .substring(
                        0,
                        4
                    )
                    .toUpperCase();

        }
    );


/* =========================
   INITIAL DRAW
========================= */

draw();

</script>
