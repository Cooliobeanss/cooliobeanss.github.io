<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolio Climb</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060713;
    color: white;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    user-select: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* =========================
   LOBBY
========================= */

#lobby {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;

    background:
        radial-gradient(circle at 20% 20%, rgba(105, 70, 255, .18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(0, 220, 255, .12), transparent 30%),
        #050610;
}

.lobby-card {
    width: min(520px, 100%);
    padding: 42px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    backdrop-filter: blur(25px);
    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.12);

    text-align: center;
}

.logo {
    font-size: clamp(42px, 9vw, 72px);
    font-weight: 1000;
    letter-spacing: -4px;

    background: linear-gradient(
        90deg,
        #9b7cff,
        #61d9ff,
        #d36cff,
        #9b7cff
    );

    background-size: 300% 100%;
    animation: logoMove 5s linear infinite;

    -webkit-background-clip: text;
    color: transparent;

    margin-bottom: 5px;
}

@keyframes logoMove {
    to {
        background-position: 300% 0;
    }
}

.subtitle {
    color: #9da1b8;
    font-size: 14px;
    margin-bottom: 35px;
}

input {
    width: 100%;
    padding: 16px 18px;
    margin-bottom: 12px;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;

    outline: none;

    background: rgba(0,0,0,.3);
    color: white;

    font-size: 16px;

    transition: .2s;
}

input:focus {
    border-color: #8c72ff;
    box-shadow: 0 0 25px rgba(130,100,255,.18);
}

button {
    border: none;
    cursor: pointer;

    padding: 15px 22px;
    border-radius: 14px;

    color: white;
    font-weight: 800;
    font-size: 15px;

    background:
        linear-gradient(
            135deg,
            #7657ff,
            #4f9cff
        );

    box-shadow:
        0 10px 30px rgba(90,90,255,.25);

    transition:
        transform .15s,
        filter .15s,
        box-shadow .15s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);

    box-shadow:
        0 15px 40px rgba(90,90,255,.35);
}

button:active {
    transform: translateY(1px);
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.secondary {
    background:
        rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.1);
    box-shadow: none;
}

#roomPanel {
    display: none;
}

.room-code {
    margin: 15px 0 25px;

    font-size: 48px;
    font-weight: 1000;
    letter-spacing: 10px;

    color: #83e8ff;

    text-shadow:
        0 0 25px rgba(80,220,255,.6);
}

.player-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 20px;
}

.player-entry {
    padding: 12px 15px;
    border-radius: 12px;

    background: rgba(255,255,255,.05);

    display: flex;
    align-items: center;
    gap: 10px;

    text-align: left;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
}

.red {
    background: #ff4f6d;
    box-shadow: 0 0 15px #ff4f6d;
}

.blue {
    background: #51c9ff;
    box-shadow: 0 0 15px #51c9ff;
}

.status {
    color: #8f94aa;
    font-size: 13px;
    margin-top: 12px;
}

#error {
    color: #ff6d7c;
    font-size: 13px;
    min-height: 18px;
    margin-top: 10px;
}

/* =========================
   GAME UI
========================= */

#gameUI {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
}

.topbar {
    position: absolute;
    top: 18px;
    left: 18px;
    right: 18px;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.panel {
    padding: 12px 16px;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 15px;

    background: rgba(5,7,20,.65);
    backdrop-filter: blur(14px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.3);
}

.controls {
    color: #aeb3c9;
    font-size: 12px;
    line-height: 1.7;
}

.controls b {
    color: white;
}

#message {
    position: absolute;
    left: 50%;
    top: 28%;

    transform:
        translate(-50%, -50%)
        scale(.8);

    opacity: 0;
    visibility: hidden;

    padding: 22px 38px;

    border-radius: 20px;

    background:
        rgba(8,8,18,.88);

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(20px);

    font-size: clamp(25px, 5vw, 45px);
    font-weight: 1000;

    text-align: center;

    box-shadow:
        0 25px 80px rgba(0,0,0,.5),
        0 0 50px rgba(255,70,100,.12);

    transition:
        opacity .2s ease,
        transform .25s cubic-bezier(.2,.8,.2,1),
        visibility 0s linear .2s;
}

#message.show {
    opacity: 1;
    visibility: visible;

    transform:
        translate(-50%, -50%)
        scale(1);

    transition:
        opacity .2s ease,
        transform .25s cubic-bezier(.2,.8,.2,1),
        visibility 0s;
}

#message.hide {
    opacity: 0;
    visibility: hidden;

    transform:
        translate(-50%, -50%)
        scale(.85);

    transition:
        opacity .12s ease,
        transform .12s ease,
        visibility 0s linear .12s;
}

/* =========================
   LOADING
========================= */

#loading {
    position: fixed;
    inset: 0;
    z-index: 200;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050610;

    font-size: 18px;
    font-weight: 800;
}

.spinner {
    width: 24px;
    height: 24px;

    border: 3px solid rgba(255,255,255,.15);
    border-top-color: #8b6cff;

    border-radius: 50%;

    animation: spin .7s linear infinite;
    margin-right: 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* PC ONLY */

@media (max-width: 700px) {
    .lobby-card {
        padding: 28px 20px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     LOBBY
========================= -->

<div id="lobby">

    <div class="lobby-card">

        <div class="logo">
            COOLIO CLIMB
        </div>

        <div class="subtitle">
            Two players. One chain. Absolutely terrible decisions.
        </div>

        <div id="mainPanel">

            <input
                id="nameInput"
                maxlength="16"
                placeholder="Your name"
                autocomplete="off"
            >

            <div class="buttons">

                <button id="hostBtn">
                    CREATE ROOM
                </button>

                <button
                    id="joinBtn"
                    class="secondary"
                >
                    JOIN ROOM
                </button>

            </div>

            <button
                id="practiceBtn"
                class="secondary"
                style="width:100%;margin-top:12px;"
            >
                PRACTICE MODE
            </button>

            <div id="error"></div>

        </div>

        <div id="joinPanel" style="display:none;">

            <input
                id="joinName"
                maxlength="16"
                placeholder="Your name"
                autocomplete="off"
            >

            <input
                id="roomInput"
                maxlength="4"

                autocomplete="off"
                style="text-transform:uppercase;text-align:center;letter-spacing:7px;"
            >

            <div class="buttons">

                <button id="joinConfirm">
                    JOIN
                </button>

                <button
                    id="joinBack"
                    class="secondary"
                >
                    BACK
                </button>

            </div>

        </div>

        <div id="roomPanel">

            <div class="subtitle">
                YOUR ROOM
            </div>

            <div
                id="roomCode"
                class="room-code"
            >
                ----
            </div>

            <div
                id="playerList"
                class="player-list"
            ></div>

            <button
                id="startBtn"
                style="width:100%;"
            >
                START CLIMB
            </button>

            <div class="status">
                Share the room code with your friend.
            </div>

            <div id="roomError"></div>

        </div>

    </div>

</div>

<!-- =========================
     GAME UI
========================= -->

<div id="gameUI">

    <div class="topbar">

        <div class="panel controls">

            <b>MOVE</b> A / D or ← / →<br>
            <b>JUMP</b> W / SPACE / ↑<br>
            <b>RUN</b> SHIFT

        </div>

        <div class="panel">
            🔗 Chain: <span id="chainDistance">0</span> px
        </div>

    </div>

    <div id="message"></div>

</div>

<div id="loading">
    <div class="spinner"></div>
    Connecting...
</div>

<script>
"use strict";

/* =========================================================
   SERVER
========================================================= */

const SERVER =
    "wss://cooliobeans-multiplayer.onrender.com";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize() {

    W = innerWidth;
    H = innerHeight;

    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

addEventListener("resize", resize);
resize();


/* =========================================================
   LOBBY ELEMENTS
========================================================= */

const lobby =
    document.getElementById("lobby");

const loading =
    document.getElementById("loading");

const mainPanel =
    document.getElementById("mainPanel");

const joinPanel =
    document.getElementById("joinPanel");

const roomPanel =
    document.getElementById("roomPanel");

const nameInput =
    document.getElementById("nameInput");

const joinName =
    document.getElementById("joinName");

const roomInput =
    document.getElementById("roomInput");

const errorBox =
    document.getElementById("error");

const roomError =
    document.getElementById("roomError");

const playerList =
    document.getElementById("playerList");

const roomCode =
    document.getElementById("roomCode");

const startBtn =
    document.getElementById("startBtn");


/* =========================================================
   GAME STATE
========================================================= */

let socket = null;

let myId = null;
let myName = "Player";
let myColor = "red";

let room = null;

let gameStarted = false;
let practiceMode = false;

let lastTime = performance.now();

let cameraX = 0;

let messageTimer = null;


/* =========================================================
   PLAYERS
========================================================= */

const players = new Map();

function createPlayer(
    id,
    name,
    color,
    x,
    y
) {

    return {

        id,
        name,
        color,

        x,
        y,

        vx: 0,
        vy: 0,

        width: 34,
        height: 58,

        spawnX: x,
        spawnY: y,

        grounded: false,
        running: false,
        dead: false,

        targetX: x,
        targetY: y,
        targetVX: 0,
        targetVY: 0,

        coyote: 0,
        jumpBuffer: 0,

        facing: color === "blue"
            ? -1
            : 1,

        anim: 0

    };

}


/* =========================================================
   WORLD
========================================================= */

const platforms = [

    {
        x: -500,
        y: 650,
        w: 1200,
        h: 80
    },

    {
        x: 820,
        y: 560,
        w: 300,
        h: 35
    },

    {
        x: 1300,
        y: 650,
        w: 420,
        h: 40
    },

    {
        x: 1850,
        y: 520,
        w: 260,
        h: 35
    },

    {
        x: 2250,
        y: 430,
        w: 250,
        h: 35
    },

    {
        x: 2650,
        y: 590,
        w: 350,
        h: 35
    },

    {
        x: 3200,
        y: 470,
        w: 260,
        h: 35
    },

    {
        x: 3650,
        y: 380,
        w: 280,
        h: 35
    },

    {
        x: 4100,
        y: 520,
        w: 420,
        h: 40
    },

    {
        x: 4700,
        y: 400,
        w: 300,
        h: 35
    },

    {
        x: 5200,
        y: 550,
        w: 500,
        h: 45
    },

    {
        x: 5850,
        y: 430,
        w: 260,
        h: 35
    },

    {
        x: 6300,
        y: 350,
        w: 350,
        h: 35
    },

    {
        x: 6850,
        y: 500,
        w: 500,
        h: 45
    },

    {
        x: 7500,
        y: 380,
        w: 400,
        h: 40
    },

    {
        x: 8150,
        y: 500,
        w: 550,
        h: 50
    }

];


const movingPlatforms = [

    {
        baseX: 1120,
        baseY: 430,
        w: 150,
        h: 30,
        distance: 180,
        speed: .9,
        phase: 0
    },

    {
        baseX: 3000,
        baseY: 360,
        w: 150,
        h: 30,
        distance: 170,
        speed: 1.1,
        phase: 2
    },

    {
        baseX: 5700,
        baseY: 330,
        w: 160,
        h: 30,
        distance: 200,
        speed: .8,
        phase: 1
    }

];


/* =========================================================
   FINISH
========================================================= */

const finishX = 8500;


/* =========================================================
   INPUT
========================================================= */

const keys = {};

addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;

        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "Space"
            ].includes(e.code)
        ) {
            e.preventDefault();
        }

    }
);

addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;

    }
);


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("hostBtn")
    .onclick = hostGame;

document
    .getElementById("joinBtn")
    .onclick = () => {

        mainPanel.style.display = "none";
        joinPanel.style.display = "block";

    };

document
    .getElementById("joinBack")
    .onclick = () => {

        joinPanel.style.display = "none";
        mainPanel.style.display = "block";

    };

document
    .getElementById("joinConfirm")
    .onclick = joinGame;

document
    .getElementById("practiceBtn")
    .onclick = startPractice;

startBtn.onclick = () => {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({
                type: "startGame"
            })
        );

    }

};


/* =========================================================
   WEBSOCKET
========================================================= */

function connect() {

    return new Promise(
        (resolve, reject) => {

            socket =
                new WebSocket(SERVER);

            socket.onopen = () => {

                loading.style.display = "none";

                resolve();

            };

            socket.onerror = () => {

                reject(
                    new Error(
                        "Could not connect to multiplayer server."
                    )
                );

            };

            socket.onclose = () => {

                if (
                    !practiceMode &&
                    !gameStarted
                ) {

                    showError(
                        "Disconnected from server."
                    );

                }

            };

            socket.onmessage = event => {

                handleServerMessage(
                    JSON.parse(event.data)
                );

            };

        }
    );

}


/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleServerMessage(data) {

    if (data.type === "error") {

        errorBox.textContent =
            data.message || "Something went wrong.";

        roomError.textContent =
            data.message || "";

        return;
    }


    if (data.type === "roomCreated") {

        myId = data.id;
        myName = data.name;
        myColor = data.color;
        room = data.room;

        players.clear();

        players.set(
            myId,
            createPlayer(
                myId,
                myName,
                myColor,
                300,
                550
            )
        );

        roomCode.textContent =
            room;

        showRoomPanel();

        return;
    }


    if (data.type === "joined") {

        myId = data.id;
        myName = data.name;
        myColor = data.color;
        room = data.room;

        players.clear();

        players.set(
            myId,
            createPlayer(
                myId,
                myName,
                myColor,
                450,
                550
            )
        );

        roomCode.textContent =
            room;

        showRoomPanel();

        return;
    }


    if (data.type === "playerJoined") {

        if (data.id === myId) {
            return;
        }

        players.set(
            data.id,
            createPlayer(
                data.id,
                data.name,
                data.color,
                data.x,
                data.y
            )
        );

        updatePlayerList();

        return;
    }


    if (data.type === "playerMoved") {

        if (data.id === myId) {
            return;
        }

        const p =
            players.get(data.id);

        if (!p) return;

        p.targetX = data.x;
        p.targetY = data.y;

        p.targetVX = data.vx;
        p.targetVY = data.vy;

        p.grounded =
            !!data.grounded;

        p.running =
            !!data.running;

        p.dead =
            !!data.dead;

        return;
    }


    if (data.type === "playerRespawned") {

        const p =
            players.get(data.id);

        if (!p) return;

        p.x = data.x;
        p.y = data.y;

        p.targetX = data.x;
        p.targetY = data.y;

        p.vx = 0;
        p.vy = 0;

        p.dead = false;

        if (data.id === myId) {
            hideMessage();
        }

        return;
    }


    if (data.type === "playerLeft") {

        players.delete(data.id);

        updatePlayerList();

        return;
    }


    if (data.type === "gameStart") {

        beginGame();

        return;
    }

}


/* =========================================================
   HOST
========================================================= */

async function hostGame() {

    const name =
        nameInput.value.trim();

    if (!name) {

        showError(
            "Enter a name first."
        );

        return;
    }

    try {

        await connect();

        socket.send(
            JSON.stringify({
                type: "host",
                name
            })
        );

    } catch (error) {

        showError(error.message);

    }

}


/* =========================================================
   JOIN
========================================================= */

async function joinGame() {

    const name =
        joinName.value.trim();

    const code =
        roomInput.value.trim().toUpperCase();

    if (!name) {

        roomError.textContent =
            "Enter your name.";

        return;
    }

    if (code.length !== 4) {

        roomError.textContent =
            "Room codes are 4 characters.";

        return;
    }

    try {

        await connect();

        socket.send(
            JSON.stringify({
                type: "join",
                room: code,
                name
            })
        );

    } catch (error) {

        roomError.textContent =
            error.message;

    }

}


/* =========================================================
   ROOM UI
========================================================= */

function showRoomPanel() {

    mainPanel.style.display = "none";
    joinPanel.style.display = "none";
    roomPanel.style.display = "block";

    updatePlayerList();

}

function updatePlayerList() {

    playerList.innerHTML = "";

    for (const p of players.values()) {

        const div =
            document.createElement("div");

        div.className =
            "player-entry";

        div.innerHTML = `
            <span class="dot ${p.color}"></span>
            <strong>${escapeHTML(p.name)}</strong>
            ${p.id === myId ? "<small style='color:#888'> YOU</small>" : ""}
        `;

        playerList.appendChild(div);

    }

}

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   PRACTICE
========================================================= */

function startPractice() {

    practiceMode = true;

    myId = "practice";
    myName = "Coolio";
    myColor = "red";

    players.clear();

    players.set(
        myId,
        createPlayer(
            myId,
            myName,
            myColor,
            300,
            550
        )
    );

    beginGame();

}


/* =========================================================
   BEGIN GAME
========================================================= */

function beginGame() {

    gameStarted = true;

    lobby.style.display = "none";

    hideMessage();

    const me =
        players.get(myId);

    if (me) {

        me.dead = false;
        me.x = me.spawnX;
        me.y = me.spawnY;
        me.vx = 0;
        me.vy = 0;

    }

}


/* =========================================================
   PHYSICS
========================================================= */

const physics = {

    gravity: 1800,

    walkSpeed: 330,
    runSpeed: 540,

    acceleration: 2600,
    airAcceleration: 1500,

    jumpVelocity: -720,

    friction: 2800,

    maxFall: 1300

};


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updateLocalPlayer(
    p,
    dt
) {

    if (p.dead) {
        return;
    }

    let left =
        keys["KeyA"] ||
        keys["ArrowLeft"];

    let right =
        keys["KeyD"] ||
        keys["ArrowRight"];

    let jump =
        keys["KeyW"] ||
        keys["ArrowUp"] ||
        keys["Space"];

    let running =
        keys["ShiftLeft"] ||
        keys["ShiftRight"];


    if (jump) {

        p.jumpBuffer = .14;

    } else {

        p.jumpBuffer -= dt;

    }


    if (!p.grounded) {

        p.coyote -= dt;

    } else {

        p.coyote = .12;

    }


    const direction =
        (right ? 1 : 0) -
        (left ? 1 : 0);


    const targetSpeed =
        running
            ? physics.runSpeed
            : physics.walkSpeed;


    const acceleration =
        p.grounded
            ? physics.acceleration
            : physics.airAcceleration;


    if (direction !== 0) {

        p.vx +=
            direction *
            acceleration *
            dt;

        p.facing =
            direction;

    } else {

        if (p.grounded) {

            if (Math.abs(p.vx) <= physics.friction * dt) {

                p.vx = 0;

            } else {

                p.vx -=
                    Math.sign(p.vx) *
                    physics.friction *
                    dt;

            }

        } else {

            p.vx *=
                Math.pow(.985, dt * 60);

        }

    }


    p.vx =
        Math.max(
            -targetSpeed,
            Math.min(
                targetSpeed,
                p.vx
            )
        );


    if (
        p.jumpBuffer > 0 &&
        p.coyote > 0
    ) {

        p.vy =
            physics.jumpVelocity;

        p.grounded = false;

        p.coyote = 0;

        p.jumpBuffer = 0;

    }


    if (
        !jump &&
        p.vy < -250
    ) {

        p.vy +=
            2300 * dt;

    }


    p.vy +=
        physics.gravity *
        dt;

    p.vy =
        Math.min(
            p.vy,
            physics.maxFall
        );


    const oldY =
        p.y;

    p.x +=
        p.vx * dt;

    p.y +=
        p.vy * dt;

    p.grounded = false;


    collideWithWorld(
        p,
        oldY
    );


    if (
        p.x < -1000
    ) {

        p.x = -1000;
        p.vx = 0;

    }


    if (
        p.y > 1100
    ) {

        killPlayer(p);

    }


    p.running =
        Math.abs(p.vx) > 360;

    p.anim +=
        Math.abs(p.vx) *
        dt *
        .025;


}


/* =========================================================
   PLATFORM COLLISION
========================================================= */

function getMovingPlatformData(mp) {

    return {

        x:
            mp.baseX +
            Math.sin(
                performance.now() / 1000 *
                mp.speed +
                mp.phase
            ) *
            mp.distance,

        y:
            mp.baseY

    };

}

function collideWithWorld(
    p,
    oldY
) {

    const oldBottom =
        oldY + p.height;

    const newBottom =
        p.y + p.height;


    for (const platform of platforms) {

        if (
            p.x + p.width > platform.x &&
            p.x < platform.x + platform.w &&
            oldBottom <= platform.y &&
            newBottom >= platform.y &&
            p.vy >= 0
        ) {

            p.y =
                platform.y -
                p.height;

            p.vy = 0;

            p.grounded = true;

        }

    }


    for (const mp of movingPlatforms) {

        const pos =
            getMovingPlatformData(mp);

        if (
            p.x + p.width > pos.x &&
            p.x < pos.x + mp.w &&
            oldBottom <= pos.y &&
            newBottom >= pos.y &&
            p.vy >= 0
        ) {

            p.y =
                pos.y -
                p.height;

            p.vy = 0;

            p.grounded = true;

        }

    }

}


/* =========================================================
   CHAIN PHYSICS
========================================================= */

const chain = {

    softLength: 300,
    maxLength: 360,

    stiffness: 7,
    damping: 2.3

};


function updateChain(dt) {

    if (players.size < 2) {
        return;
    }

    const list =
        [...players.values()];

    const a =
        list[0];

    const b =
        list[1];

    if (
        a.dead ||
        b.dead
    ) {
        return;
    }


    const ax =
        a.x + a.width / 2;

    const ay =
        a.y + a.height / 2;

    const bx =
        b.x + b.width / 2;

    const by =
        b.y + b.height / 2;


    const dx =
        bx - ax;

    const dy =
        by - ay;


    const distance =
        Math.hypot(dx, dy);

    document
        .getElementById(
            "chainDistance"
        )
        .textContent =
            Math.round(distance);


    if (
        distance <= chain.softLength
    ) {
        return;
    }


    const nx =
        dx / distance;

    const ny =
        dy / distance;


    const excess =
        distance -
        chain.softLength;


    const relativeVelocity =
        (b.vx - a.vx) * nx +
        (b.vy - a.vy) * ny;


    const force =
        excess *
            chain.stiffness +
        relativeVelocity *
            chain.damping;


    const pull =
        Math.min(
            force,
            1400
        );


    a.vx +=
        nx *
        pull *
        dt;

    a.vy +=
        ny *
        pull *
        dt;

    b.vx -=
        nx *
        pull *
        dt;

    b.vy -=
        ny *
        pull *
        dt;


    if (
        distance >
        chain.maxLength
    ) {

        const correction =
            distance -
            chain.maxLength;

        const amount =
            correction * .5;

        if (!a.grounded) {

            a.x +=
                nx *
                amount;

            a.y +=
                ny *
                amount;

        }

        if (!b.grounded) {

            b.x -=
                nx *
                amount;

            b.y -=
                ny *
                amount;

        }

    }

}


/* =========================================================
   DEATH SYSTEM
   THIS IS THE IMPORTANT FIX
========================================================= */

function killPlayer(p) {

    if (p.dead) {
        return;
    }

    p.dead = true;

    p.vx = 0;
    p.vy = 0;


    if (p.id !== myId) {
        return;
    }


    /*
        Clear ANY previous death timer.
        This prevents old timers from interfering
        with a new death/respawn.
    */

    if (messageTimer !== null) {

        clearTimeout(
            messageTimer
        );

        messageTimer = null;

    }


    showMessage(
        "💀 YOU FELL"
    );


    /*
        Respawn after one second.
    */

    messageTimer =
        setTimeout(
            () => {

                /*
                    First respawn.
                */

                respawnPlayer(p);


                /*
                    THEN force the message completely
                    invisible and reset its state.
                */

                hideMessage();


                messageTimer =
                    null;

            },
            1000
        );


    /*
        Tell the server too.
    */

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN &&
        !practiceMode
    ) {

        socket.send(
            JSON.stringify({
                type: "respawn"
            })
        );

    }

}


/* =========================================================
   RESPAWN
========================================================= */

function respawnPlayer(p) {

    p.x =
        p.spawnX;

    p.y =
        p.spawnY;

    p.vx = 0;
    p.vy = 0;

    p.dead = false;

    p.grounded = false;

    p.coyote = 0;
    p.jumpBuffer = 0;

    /*
        EXTRA SAFETY:
        Every respawn ALWAYS hides the message.
        So even if something else calls respawnPlayer(),
        the death message cannot remain stuck.
    */

    hideMessage();

}


/* =========================================================
   MESSAGE SYSTEM
========================================================= */

function showMessage(text) {

    const msg =
        document.getElementById(
            "message"
        );


    /*
        Cancel any hide timer.
    */

    if (messageTimer !== null) {

        clearTimeout(
            messageTimer
        );

        messageTimer = null;

    }


    msg.textContent =
        text;


    /*
        Remove the forced hide state first.
    */

    msg.classList.remove(
        "hide"
    );


    /*
        Force browser reflow so repeated
        show/hide cycles always work.
    */

    void msg.offsetWidth;


    msg.classList.add(
        "show"
    );

}


function hideMessage() {

    const msg =
        document.getElementById(
            "message"
        );


    /*
        REMOVE show.
    */

    msg.classList.remove(
        "show"
    );


    /*
        ADD hide.
        This explicitly overrides the
        visible state.
    */

    msg.classList.add(
        "hide"
    );


    /*
        Clear it completely after
        the tiny fade animation.
    */

    setTimeout(
        () => {

            msg.classList.remove(
                "hide"
            );

            /*
                This is important:
                if no new message was shown,
                visibility stays hidden.
            */

            if (
                !msg.classList.contains(
                    "show"
                )
            ) {

                msg.style.visibility =
                    "hidden";

            }

        },
        150
    );

}


/* =========================================================
   SEND MOVEMENT
========================================================= */

let lastSend = 0;

function sendMovement(now) {

    if (
        practiceMode ||
        !socket ||
        socket.readyState !==
            WebSocket.OPEN ||
        !gameStarted
    ) {
        return;
    }


    if (
        now -
        lastSend <
        33
    ) {
        return;
    }


    lastSend =
        now;


    const p =
        players.get(myId);

    if (!p) {
        return;
    }


    socket.send(
        JSON.stringify({

            type: "move",

            x: p.x,
            y: p.y,

            vx: p.vx,
            vy: p.vy,

            grounded:
                p.grounded,

            running:
                p.running,

            dead:
                p.dead

        })
    );

}


/* =========================================================
   REMOTE PLAYER UPDATE
========================================================= */

function updateRemotePlayers(dt) {

    for (
        const p
        of players.values()
    ) {

        if (
            p.id === myId ||
            p.dead
        ) {
            continue;
        }


        /*
            Smooth interpolation.
        */

        const smoothing =
            1 -
            Math.pow(
                .0001,
                dt
            );


        p.x +=
            (
                p.targetX -
                p.x
            ) *
            smoothing;


        p.y +=
            (
                p.targetY -
                p.y
            ) *
            smoothing;


        p.vx =
            p.targetVX;

        p.vy =
            p.targetVY;


        if (
            Math.abs(p.vx) > 10
        ) {

            p.facing =
                Math.sign(
                    p.vx
                );

        }


        p.anim +=
            Math.abs(p.vx) *
            dt *
            .025;

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt) {

    const me =
        players.get(myId);

    if (!me) {
        return;
    }


    const target =
        me.x -
        W * .32;


    cameraX +=
        (
            target -
            cameraX
        ) *
        (
            1 -
            Math.pow(.0005, dt)
        );


    cameraX =
        Math.max(
            0,
            cameraX
        );

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#07091a"
    );

    gradient.addColorStop(
        .5,
        "#0b1030"
    );

    gradient.addColorStop(
        1,
        "#090712"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        Large glowing moon.
    */

    const moonX =
        W -
        160;

    const moonY =
        120;


    const moon =
        ctx.createRadialGradient(
            moonX,
            moonY,
            5,
            moonX,
            moonY,
            130
        );

    moon.addColorStop(
        0,
        "rgba(160,140,255,.35)"
    );

    moon.addColorStop(
        1,
        "rgba(100,80,255,0)"
    );

    ctx.fillStyle =
        moon;

    ctx.beginPath();

    ctx.arc(
        moonX,
        moonY,
        130,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        Stars.
    */

    ctx.fillStyle =
        "rgba(255,255,255,.7)";

    for (
        let i = 0;
        i < 90;
        i++
    ) {

        const x =
            (
                i * 173
                - cameraX * .08
            ) % (
                W + 100
            );

        const y =
            (
                i * 71
            ) % (
                H * .55
            );

        const size =
            i % 5 === 0
                ? 2
                : 1;

        ctx.globalAlpha =
            .25 +
            (
                i % 7
            ) / 15;

        ctx.fillRect(
            x,
            y,
            size,
            size
        );

    }

    ctx.globalAlpha = 1;


    /*
        Parallax mountain layers.
    */

    drawMountains(
        .12,
        H * .68,
        "#101538"
    );

    drawMountains(
        .22,
        H * .75,
        "#0c1128"
    );

}


/* =========================================================
   MOUNTAINS
========================================================= */

function drawMountains(
    parallax,
    baseY,
    color
) {

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.moveTo(
        0,
        H
    );

    for (
        let x = -100;
        x <= W + 100;
        x += 180
    ) {

        const worldX =
            x +
            cameraX *
            parallax;

        const height =
            80 +
            (
                Math.sin(
                    worldX * .002
                ) + 1
            ) *
            80;

        ctx.lineTo(
            x,
            baseY -
            height
        );

    }

    ctx.lineTo(
        W,
        H
    );

    ctx.closePath();

    ctx.fill();

}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld() {

    ctx.save();

    ctx.translate(
        -cameraX,
        0
    );


    /*
        Platforms.
    */

    for (
        const platform
        of platforms
    ) {

        drawPlatform(
            platform.x,
            platform.y,
            platform.w,
            platform.h
        );

    }


    /*
        Moving platforms.
    */

    for (
        const mp
        of movingPlatforms
    ) {

        const pos =
            getMovingPlatformData(
                mp
            );

        drawPlatform(
            pos.x,
            pos.y,
            mp.w,
            mp.h,
            true
        );

    }


    /*
        Finish line.
    */

    drawFinish();


    /*
        Players.
    */

    for (
        const p
        of players.values()
    ) {

        if (!p.dead) {

            drawPlayer(
                p
            );

        }

    }


    /*
        Chain goes ON TOP of players
        for visibility.
    */

    drawChain();


    ctx.restore();

}


/* =========================================================
   PLATFORM
========================================================= */

function drawPlatform(
    x,
    y,
    w,
    h,
    moving = false
) {

    /*
        Glow.
    */

    ctx.shadowBlur =
        moving
            ? 25
            : 18;

    ctx.shadowColor =
        moving
            ? "#52d9ff"
            : "#795cff";


    const gradient =
        ctx.createLinearGradient(
            x,
            y,
            x,
            y + h
        );

    gradient.addColorStop(
        0,
        moving
            ? "#3c789d"
            : "#40376f"
    );

    gradient.addColorStop(
        1,
        "#17172e"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    ctx.shadowBlur = 0;


    /*
        Bright top edge.
    */

    ctx.fillStyle =
        moving
            ? "#63dcff"
            : "#8d72ff";

    ctx.fillRect(
        x,
        y,
        w,
        4
    );


    /*
        Little platform details.
    */

    ctx.fillStyle =
        "rgba(255,255,255,.06)";

    for (
        let px = x + 15;
        px < x + w - 10;
        px += 35
    ) {

        ctx.fillRect(
            px,
            y + 12,
            15,
            3
        );

    }

}


/* =========================================================
   FINISH
========================================================= */

function drawFinish() {

    const x =
        finishX;

    /*
        Pole.
    */

    ctx.fillStyle =
        "#dfe7ff";

    ctx.fillRect(
        x,
        250,
        7,
        250
    );


    /*
        Flag.
    */

    const wave =
        Math.sin(
            performance.now() / 350
        ) *
        8;


    ctx.fillStyle =
        "#6c5cff";

    ctx.beginPath();

    ctx.moveTo(
        x + 7,
        250
    );

    ctx.lineTo(
        x + 105,
        270 + wave
    );

    ctx.lineTo(
        x + 7,
        310
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "white";

    ctx.font =
        "900 18px system-ui";

    ctx.fillText(
        "FINISH",
        x + 18,
        290
    );


    /*
        Glow.
    */

    ctx.shadowBlur =
        30;

    ctx.shadowColor =
        "#7565ff";

    ctx.strokeStyle =
        "#7565ff";

    ctx.lineWidth =
        4;

    ctx.beginPath();

    ctx.moveTo(
        x - 30,
        500
    );

    ctx.lineTo(
        x - 30,
        300
    );

    ctx.stroke();

    ctx.shadowBlur = 0;

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(p) {

    const cx =
        p.x +
        p.width / 2;

    const bottom =
        p.y +
        p.height;


    const primary =
        p.color === "red"
            ? "#ff5270"
            : "#4fcaff";


    const secondary =
        p.color === "red"
            ? "#a9284a"
            : "#247eb0";


    /*
        Shadow.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        bottom + 5,
        25,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        Character glow.
    */

    ctx.shadowBlur =
        22;

    ctx.shadowColor =
        primary;


    /*
        Body.
    */

    const bodyGradient =
        ctx.createLinearGradient(
            p.x,
            p.y,
            p.x + p.width,
            bottom
        );

    bodyGradient.addColorStop(
        0,
        primary
    );

    bodyGradient.addColorStop(
        1,
        secondary
    );


    ctx.fillStyle =
        bodyGradient;


    roundRect(
        p.x + 4,
        p.y + 20,
        p.width - 8,
        32,
        9
    );


    /*
        Head.
    */

    ctx.fillStyle =
        primary;

    ctx.beginPath();

    ctx.arc(
        cx,
        p.y + 15,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    /*
        Helmet / hair.
    */

    ctx.fillStyle =
        "#17192d";

    ctx.beginPath();

    ctx.arc(
        cx,
        p.y + 12,
        14,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /*
        Face.
    */

    ctx.fillStyle =
        "white";

    const eyeOffset =
        p.facing * 4;

    ctx.beginPath();

    ctx.arc(
        cx + eyeOffset - 5,
        p.y + 16,
        2.3,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + eyeOffset + 5,
        p.y + 16,
        2.3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        Legs animation.
    */

    const walking =
        Math.abs(p.vx) > 20 &&
        p.grounded;

    const legSwing =
        walking
            ? Math.sin(p.anim) * 5
            : 0;


    ctx.strokeStyle =
        secondary;

    ctx.lineWidth =
        7;

    ctx.lineCap =
        "round";


    ctx.beginPath();

    ctx.moveTo(
        cx - 8,
        p.y + 49
    );

    ctx.lineTo(
        cx - 10 + legSwing,
        bottom
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        cx + 8,
        p.y + 49
    );

    ctx.lineTo(
        cx + 10 - legSwing,
        bottom
    );

    ctx.stroke();

}


/* =========================================================
   CHAIN DRAWING
========================================================= */

function drawChain() {

    if (players.size < 2) {
        return;
    }

    const list =
        [...players.values()];

    const a =
        list[0];

    const b =
        list[1];


    if (
        a.dead ||
        b.dead
    ) {
        return;
    }


    const ax =
        a.x +
        a.width / 2;

    const ay =
        a.y +
        a.height / 2;

    const bx =
        b.x +
        b.width / 2;

    const by =
        b.y +
        b.height / 2;


    const dx =
        bx - ax;

    const dy =
        by - ay;

    const distance =
        Math.hypot(
            dx,
            dy
        );


    /*
        Chain gets more red when stretched.
    */

    const danger =
        Math.max(
            0,
            Math.min(
                1,
                (
                    distance -
                    chain.softLength
                ) /
                (
                    chain.maxLength -
                    chain.softLength
                )
            )
        );


    ctx.save();

    ctx.lineWidth =
        5;

    ctx.lineCap =
        "round";

    ctx.shadowBlur =
        15;

    ctx.shadowColor =
        danger > .5
            ? "#ff526d"
            : "#72dfff";


    /*
        Main rope.
    */

    ctx.strokeStyle =
        danger > .5
            ? "#ff526d"
            : "#62d8ff";


    ctx.beginPath();

    ctx.moveTo(
        ax,
        ay
    );

    ctx.lineTo(
        bx,
        by
    );

    ctx.stroke();


    /*
        Metal links.
    */

    const links =
        Math.max(
            3,
            Math.floor(
                distance / 24
            )
        );


    ctx.lineWidth =
        3;

    ctx.strokeStyle =
        "#d6f8ff";

    for (
        let i = 0;
        i <= links;
        i++
    ) {

        const t =
            i / links;

        const x =
            ax +
            dx * t;

        const y =
            ay +
            dy * t;


        const size =
            7;


        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            size,
            4,
            Math.atan2(
                dy,
                dx
            ) +
            (
                i % 2
                    ? Math.PI / 2
                    : 0
            ),
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    x,
    y,
    w,
    h,
    r
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        w,
        h,
        r
    );

    ctx.fill();

}


/* =========================================================
   ERROR
========================================================= */

function showError(text) {

    errorBox.textContent =
        text;

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now) {

    const dt =
        Math.min(
            .033,
            (now - lastTime) /
            1000
        );

    lastTime =
        now;


    if (gameStarted) {

        const me =
            players.get(myId);

        if (me) {

            updateLocalPlayer(
                me,
                dt
            );

        }


        updateRemotePlayers(
            dt
        );


        updateChain(
            dt
        );


        updateCamera(
            dt
        );


        sendMovement(
            now
        );


        /*
            Finish check.
        */

        if (
            me &&
            !me.dead &&
            me.x >= finishX - 30
        ) {

            showMessage(
                "🏆 YOU MADE IT!"
            );

            gameStarted = false;

        }

    }


    drawBackground();

    drawWorld();


    requestAnimationFrame(
        gameLoop
    );

}

requestAnimationFrame(
    gameLoop
);


/* =========================================================
   INITIAL STATE
========================================================= */

loading.style.display =
    "none";

lobby.style.display =
    "flex";

</script>

</body>
</html>
