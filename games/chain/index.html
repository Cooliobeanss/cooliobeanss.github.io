```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolio Climb</title>

<style>
* {
    box-sizing: border-box;

}

body {
    background: #08080d;
    color: white;

    width: 100vw;

        radial-gradient(circle at 50% 20%, #272040 0%, #0d0d15 45%, #050508 100%);

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud" class="hidden">
    <div class="hudBox" id="roomHud">ROOM: ----</div>
    <div class="hudBox" id="playerHud">🔗 1 / 2</div>
</div>

<div id="mobileControls" class="hidden">
    <div class="controlGroup">
        <button class="control" id="leftBtn">◀</button>
        <button class="control" id="rightBtn">▶</button>
    </div>

    <button class="control" id="jumpBtn">⬆</button>
</div>

<!-- MAIN MENU -->
<div class="screen" id="mainMenu">
    <div class="panel">
        <div class="logo">🔗 Coolio Climb</div>
        <div class="subtitle">Two players. One chain. Don't fall.</div>

        <button id="hostBtn">HOST GAME</button>
        <button id="joinBtn" class="secondary">JOIN GAME</button>
    </div>
</div>

<!-- NAME MENU -->
<div class="screen hidden" id="nameMenu">
    <div class="panel">
        <div class="logo">What's your name?</div>
        <div class="subtitle">Your friend will see this name.</div>

        <input id="nameInput" maxlength="16" placeholder="Enter your name">

        <button id="continueHost" class="hidden">CREATE ROOM</button>
        <button id="continueJoin" class="hidden">CONTINUE</button>

        <button id="backName" class="secondary">BACK</button>
    </div>
</div>

<!-- JOIN MENU -->
<div class="screen hidden" id="joinMenu">
    <div class="panel">
        <div class="logo">Join Room</div>

        <input id="codeInput"
               maxlength="4"
               placeholder="4-character code"
               style="text-transform:uppercase;text-align:center;letter-spacing:5px;">

        <button id="connectJoin">JOIN ROOM</button>
        <button id="backJoin" class="secondary">BACK</button>
    </div>
</div>

<!-- LOBBY -->
<div class="screen hidden" id="lobby">
    <div class="panel">
        <div class="logo">🔗 Your Room</div>

        <div class="code" id="roomCode">----</div>

        <div class="status" id="lobbyStatus">
            Waiting for your friend...
        </div>

        <div class="players" id="playersList"></div>

        <button id="practiceBtn">🧗 PRACTICE PARKOUR</button>

        <button id="startBtn" class="hidden">
            START CLIMB
        </button>

        <button id="leaveBtn" class="secondary">
            LEAVE ROOM
        </button>
    </div>
</div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize", () => {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
});

const SERVER = "wss://cooliobeans-multiplayer.onrender.com";

let socket = null;
let myId = null;
let myName = "";
let myColor = "red";
let roomCode = "";
let isHost = false;
let inGame = false;
let practicing = false;

const players = new Map();

const keys = {
    left: false,
    right: false,
    jump: false
};

let cameraX = 0;
let cameraY = 0;

const gravity = 0.65;
const moveSpeed = 4.2;
const jumpPower = 12;

const level = [
    {x: -500, y: 500, w: 900, h: 50},
    {x: 500, y: 430, w: 260, h: 35},
    {x: 850, y: 350, w: 260, h: 35},
    {x: 1200, y: 280, w: 240, h: 35},
    {x: 1500, y: 200, w: 280, h: 35},
    {x: 1900, y: 320, w: 250, h: 35},
    {x: 2250, y: 220, w: 260, h: 35},
    {x: 2600, y: 130, w: 350, h: 35},
    {x: 3050, y: 40, w: 400, h: 35}
];

function show(id) {
    document.querySelectorAll(".screen").forEach(x => {
        x.classList.add("hidden");
    });

    document.getElementById(id).classList.remove("hidden");
}

function send(data) {
    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(data));
    }
}

function connect() {

    socket = new WebSocket(SERVER);

    socket.onopen = () => {
        if (isHost) {
            send({
                type: "host",
                name: myName
            });
        } else {
            send({
                type: "join",
                room: roomCode,
                name: myName
            });
        }
    };

    socket.onmessage = event => {

        const data = JSON.parse(event.data);

        if (data.type === "roomCreated") {

            myId = data.id;
            roomCode = data.room;
            myColor = data.color;

            createLocalPlayer();

            document.getElementById("roomCode").textContent = roomCode;
            document.getElementById("roomHud").textContent = "ROOM: " + roomCode;

            updateLobby();

            show("lobby");
        }

        if (data.type === "joined") {

            myId = data.id;
            myColor = data.color;

            createLocalPlayer();

            document.getElementById("roomCode").textContent = roomCode;
            document.getElementById("roomHud").textContent = "ROOM: " + roomCode;

            updateLobby();

            show("lobby");
        }

        if (data.type === "playerJoined") {

            players.set(data.id, {
                id: data.id,
                name: data.name || "Player",
                color: data.color,
                x: data.x || 0,
                y: data.y || 0,
                vx: 0,
                vy: 0,
                grounded: false
            });

            updateLobby();

            if (players.size >= 2) {
                document.getElementById("startBtn").classList.remove("hidden");
                document.getElementById("lobbyStatus").textContent =
                    "Your partner is ready!";
            }
        }

        if (data.type === "playerMoved") {

            const p = players.get(data.id);

            if (p) {
                p.x = data.x;
                p.y = data.y;
                p.vx = data.vx || 0;
                p.vy = data.vy || 0;
            }
        }

        if (data.type === "playerLeft") {

            players.delete(data.id);

            updateLobby();

            document.getElementById("startBtn").classList.add("hidden");

            document.getElementById("lobbyStatus").textContent =
                "Your friend left the room.";
        }

        if (data.type === "error") {
            alert(data.message);
        }
    };

    socket.onclose = () => {
        if (inGame) {
            alert("Connection lost.");
            location.reload();
        }
    };
}

function createLocalPlayer() {

    players.set(myId, {
        id: myId,
        name: myName,
        color: myColor,
        x: 0,
        y: 400,
        vx: 0,
        vy: 0,
        grounded: false
    });
}

function updateLobby() {

    const list = document.getElementById("playersList");

    list.innerHTML = "";

    players.forEach(p => {

        const div = document.createElement("div");

        div.className = "player";

        div.innerHTML =
            (p.color === "red" ? "🔴 " : "🔵 ") +
            "<strong>" +
            escapeHTML(p.name) +
            "</strong>";

        list.appendChild(div);
    });

    document.getElementById("playerHud").textContent =
        "🔗 " + players.size + " / 2";
}

function escapeHTML(str) {
    return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
}

function startGame() {

    inGame = true;

    document.querySelectorAll(".screen").forEach(x => {
        x.classList.add("hidden");
    });

    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("mobileControls").classList.remove("hidden");

    players.forEach((p, i) => {

        p.x = i === 0 ? 0 : 80;
        p.y = 350;
        p.vx = 0;
        p.vy = 0;
    });

    requestAnimationFrame(loop);
}

function startPractice() {

    practicing = true;
    inGame = true;

    document.querySelectorAll(".screen").forEach(x => {
        x.classList.add("hidden");
    });

    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("mobileControls").classList.remove("hidden");

    const me = players.get(myId);

    if (me) {
        me.x = 0;
        me.y = 350;
        me.vx = 0;
        me.vy = 0;
    }

    requestAnimationFrame(loop);
}

function collide(p) {

    p.grounded = false;

    for (const platform of level) {

        const previousBottom = p.y + 42 - p.vy;

        if (
            p.x + 28 > platform.x &&
            p.x - 28 < platform.x + platform.w &&
            p.y + 42 >= platform.y &&
            p.y + 42 <= platform.y + platform.h + 20 &&
            previousBottom <= platform.y + 10 &&
            p.vy >= 0
        ) {
            p.y = platform.y - 42;
            p.vy = 0;
            p.grounded = true;
        }
    }
}

function resetPlayer(p) {
    p.x = 0;
    p.y = 350;
    p.vx = 0;
    p.vy = 0;
}

function physics(p, local) {

    if (local) {

        if (keys.left) {
            p.vx -= 0.65;
        }

        if (keys.right) {
            p.vx += 0.65;
        }

        if (!keys.left && !keys.right) {
            p.vx *= 0.78;
        }

        p.vx = Math.max(-moveSpeed, Math.min(moveSpeed, p.vx));

        if (keys.jump && p.grounded) {
            p.vy = -jumpPower;
            p.grounded = false;
        }
    }

    p.vy += gravity;

    p.x += p.vx;
    p.y += p.vy;

    collide(p);

    if (p.y > 800) {
        resetPlayer(p);
    }
}

function applyChain() {

    if (players.size < 2) return;

    const arr = [...players.values()];

    const a = arr[0];
    const b = arr[1];

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    const maxLength = 135;

    if (distance > maxLength) {

        const nx = dx / distance;
        const ny = dy / distance;

        const excess = distance - maxLength;

        if (a.id === myId) {
            a.x += nx * excess * 0.45;
            a.vx += nx * excess * 0.08;
        }

        if (b.id === myId) {
            b.x -= nx * excess * 0.45;
            b.vx -= nx * excess * 0.08;
        }
    }
}

function sendMovement() {

    const p = players.get(myId);

    if (!p) return;

    send({
        type: "move",
        x: p.x,
        y: p.y,
        vx: p.vx,
        vy: p.vy
    });
}

let lastSend = 0;

function update() {

    const me = players.get(myId);

    if (!me) return;

    physics(me, true);

    applyChain();

    const now = performance.now();

    if (now - lastSend > 30) {
        sendMovement();
        lastSend = now;
    }

    cameraX += ((me.x - W * 0.35) - cameraX) * 0.08;

    cameraY += ((me.y - H * 0.55) - cameraY) * 0.08;
}

function drawBackground() {

    ctx.fillStyle = "#09090f";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;

    const grid = 50;

    for (
        let x = -((cameraX % grid) + grid);
        x < W + grid;
        x += grid
    ) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }

    for (
        let y = -((cameraY % grid) + grid);
        y < H + grid;
        y += grid
    ) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
}

function drawLevel() {

    for (const platform of level) {

        const x = platform.x - cameraX;
        const y = platform.y - cameraY;

        ctx.fillStyle = "#30303c";
        ctx.fillRect(x, y, platform.w, platform.h);

        ctx.fillStyle = "#8b5cf6";
        ctx.fillRect(x, y, platform.w, 5);

        ctx.strokeStyle = "rgba(255,255,255,.08)";
        ctx.strokeRect(x, y, platform.w, platform.h);
    }

    const finish = level[level.length - 1];

    const fx = finish.x + finish.w - 70 - cameraX;
    const fy = finish.y - 75 - cameraY;

    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px Arial";
    ctx.fillText("FINISH 🏁", fx, fy);
}

function drawChain() {

    if (players.size < 2) return;

    const arr = [...players.values()];

    const a = arr[0];
    const b = arr[1];

    const ax = a.x - cameraX;
    const ay = a.y + 5 - cameraY;

    const bx = b.x - cameraX;
    const by = b.y + 5 - cameraY;

    ctx.strokeStyle = "#d8d8df";
    ctx.lineWidth = 7;

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();

    ctx.strokeStyle = "#555560";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
}

function drawPlayer(p) {

    const x = p.x - cameraX;
    const y = p.y - cameraY;

    ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI * 2);

    ctx.fillStyle =
        p.color === "red"
            ? "#ef4444"
            : "#3b82f6";

    ctx.fill();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";

    ctx.fillText(p.name, x, y - 35);

    ctx.textAlign = "left";
}

function draw() {

    drawBackground();
    drawLevel();

    drawChain();

    players.forEach(drawPlayer);
}

function loop() {

    if (!inGame) return;

    update();
    draw();

    requestAnimationFrame(loop);
}

/* KEYBOARD */

window.addEventListener("keydown", e => {

    if (e.code === "KeyA" || e.code === "ArrowLeft") {
        keys.left = true;
    }

    if (e.code === "KeyD" || e.code === "ArrowRight") {
        keys.right = true;
    }

    if (
        e.code === "Space" ||
        e.code === "KeyW" ||
        e.code === "ArrowUp"
    ) {
        keys.jump = true;
        e.preventDefault();
    }
});

window.addEventListener("keyup", e => {

    if (e.code === "KeyA" || e.code === "ArrowLeft") {
        keys.left = false;
    }

    if (e.code === "KeyD" || e.code === "ArrowRight") {
        keys.right = false;
    }

    if (
        e.code === "Space" ||
        e.code === "KeyW" ||
        e.code === "ArrowUp"
    ) {
        keys.jump = false;
    }
});

/* MOBILE */

function holdButton(button, key) {

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("pointerup", () => {
        keys[key] = false;
    });

    button.addEventListener("pointercancel", () => {
        keys[key] = false;
    });

    button.addEventListener("pointerleave", () => {
        keys[key] = false;
    });
}

holdButton(document.getElementById("leftBtn"), "left");
holdButton(document.getElementById("rightBtn"), "right");
holdButton(document.getElementById("jumpBtn"), "jump");

/* MENU */

document.getElementById("hostBtn").onclick = () => {

    isHost = true;

    document.getElementById("continueHost").classList.remove("hidden");
    document.getElementById("continueJoin").classList.add("hidden");

    show("nameMenu");
};

document.getElementById("joinBtn").onclick = () => {

    isHost = false;

    document.getElementById("continueHost").classList.add("hidden");
    document.getElementById("continueJoin").classList.remove("hidden");

    show("nameMenu");
};

document.getElementById("continueHost").onclick = () => {

    myName =
        document.getElementById("nameInput").value.trim() ||
        "Player";

    connect();
};

document.getElementById("continueJoin").onclick = () => {

    myName =
        document.getElementById("nameInput").value.trim() ||
        "Player";

    show("joinMenu");
};

document.getElementById("connectJoin").onclick = () => {

    roomCode =
        document.getElementById("codeInput").value
        .trim()
        .toUpperCase();

    if (roomCode.length !== 4) {
        alert("Enter a 4-character room code.");
        return;
    }

    connect();
};

document.getElementById("backName").onclick = () => {
    show("mainMenu");
};

document.getElementById("backJoin").onclick = () => {
    show("nameMenu");
};

document.getElementById("practiceBtn").onclick = () => {
    startPractice();
};

document.getElementById("startBtn").onclick = () => {
    startGame();
};

document.getElementById("leaveBtn").onclick = () => {
    if (socket) socket.close();
    location.reload();
};
</script>

</body>
</html>
```
