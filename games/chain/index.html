<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coolio Climb</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050611;
    color:white;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    user-select:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================================================
   LOBBY
========================================================= */

#lobby{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;

    background:
        radial-gradient(circle at 20% 20%,rgba(117,82,255,.2),transparent 32%),
        radial-gradient(circle at 80% 70%,rgba(0,217,255,.13),transparent 32%),
        linear-gradient(135deg,#04050d,#090a19);
}

.lobby-card{
    width:min(550px,100%);
    padding:45px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.1),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(28px);

    box-shadow:
        0 35px 120px rgba(0,0,0,.7),
        inset 0 1px rgba(255,255,255,.13);

    text-align:center;
}

.logo{
    font-size:clamp(40px,9vw,76px);
    font-weight:1000;
    letter-spacing:-5px;

    background:
        linear-gradient(
            90deg,
            #9b7cff,
            #52dfff,
            #df71ff,
            #9b7cff
        );

    background-size:300% 100%;
    animation:logoMove 5s linear infinite;

    -webkit-background-clip:text;
    color:transparent;
}

@keyframes logoMove{
    to{
        background-position:300% 0;
    }
}

.subtitle{
    color:#9ca2bc;
    font-size:14px;
    margin:5px 0 32px;
}

input{
    width:100%;
    padding:16px 18px;
    margin-bottom:12px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;

    outline:none;

    background:rgba(0,0,0,.3);
    color:white;

    font-size:16px;
}

input:focus{
    border-color:#8b70ff;
    box-shadow:0 0 30px rgba(120,90,255,.2);
}

button{
    border:0;
    cursor:pointer;

    padding:15px 22px;
    border-radius:14px;

    color:white;
    font-size:15px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #7657ff,
            #4c9eff
        );

    box-shadow:0 10px 35px rgba(80,90,255,.25);

    transition:.16s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.12);
}

button:active{
    transform:translateY(1px);
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.secondary{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:none;
}

#joinPanel,
#roomPanel{
    display:none;
}

.room-code{
    margin:15px 0 25px;

    font-size:52px;
    font-weight:1000;
    letter-spacing:12px;

    color:#83eaff;

    text-shadow:0 0 30px rgba(80,220,255,.65);
}

.player-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-bottom:20px;
}

.player-entry{
    padding:13px 15px;
    border-radius:13px;

    background:rgba(255,255,255,.05);

    display:flex;
    align-items:center;
    gap:10px;

    text-align:left;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
}

.red{
    background:#ff5270;
    box-shadow:0 0 15px #ff5270;
}

.blue{
    background:#51caff;
    box-shadow:0 0 15px #51caff;
}

.status{
    color:#858ba3;
    font-size:13px;
    margin-top:12px;
}

#error,#roomError{
    color:#ff7080;
    font-size:13px;
    min-height:18px;
    margin-top:10px;
}

/* =========================================================
   GAME UI
========================================================= */

#gameUI{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.topbar{
    position:absolute;
    top:17px;
    left:17px;
    right:17px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.panel{
    padding:12px 16px;

    border:1px solid rgba(255,255,255,.11);
    border-radius:15px;

    background:rgba(5,7,20,.62);
    backdrop-filter:blur(16px);

    box-shadow:0 12px 40px rgba(0,0,0,.3);
}

.controls{
    color:#aeb4cb;
    font-size:12px;
    line-height:1.7;
}

.controls b{
    color:white;
}

#location{
    font-weight:900;
    letter-spacing:.5px;
}

#message{
    position:absolute;
    left:50%;
    top:28%;

    transform:translate(-50%,-50%) scale(.8);

    opacity:0;
    visibility:hidden;

    padding:23px 38px;

    border-radius:20px;

    background:rgba(7,8,18,.9);
    border:1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(22px);

    font-size:clamp(25px,5vw,46px);
    font-weight:1000;

    text-align:center;

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        0 0 55px rgba(100,80,255,.15);

    transition:
        opacity .18s ease,
        transform .25s cubic-bezier(.2,.8,.2,1);
}

#message.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,-50%) scale(1);
}

/* checkpoint notification */

#checkpoint{
    position:absolute;
    left:50%;
    top:14%;

    transform:translateX(-50%) translateY(-15px);

    opacity:0;
    visibility:hidden;

    padding:10px 20px;
    border-radius:999px;

    background:rgba(60,48,160,.75);
    border:1px solid rgba(170,150,255,.4);

    backdrop-filter:blur(15px);

    font-weight:900;
    font-size:14px;

    transition:.3s;
}

#checkpoint.show{
    opacity:1;
    visibility:visible;
    transform:translateX(-50%) translateY(0);
}

/* =========================================================
   LOADING
========================================================= */

#loading{
    position:fixed;
    inset:0;
    z-index:200;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050610;

    font-size:18px;
    font-weight:800;
}

.spinner{
    width:24px;
    height:24px;

    border:3px solid rgba(255,255,255,.15);
    border-top-color:#8b6cff;

    border-radius:50%;

    animation:spin .7s linear infinite;
    margin-right:12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:700px){
    .lobby-card{
        padding:28px 20px;
    }

    .buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

/* =========================================================
   CONNECTION
========================================================= */

function connect(){

    return new Promise(
        (resolve,reject) => {

            socket =
                new WebSocket(SERVER);

            socket.onopen = () => {

                loading.style.display =
                    "none";

                resolve();

            };

            socket.onerror = () => {

                reject(
                    new Error(
                        "Could not connect to multiplayer server."
                    )
                );

            };

            socket.onclose = () => {

                if(
                    !practiceMode &&
                    !gameStarted
                ){

                    showError(
                        "Disconnected from server."
                    );

                }

            };

            socket.onmessage =
                event => {

                    try{

                        handleServerMessage(
                            JSON.parse(event.data)
                        );

                    }catch(error){

                        console.error(error);

                    }

                };

        }
    );

}


/* =========================================================
   SERVER
========================================================= */

function handleServerMessage(data){

    if(data.type === "error"){

        errorBox.textContent =
            data.message || "";

        roomError.textContent =
            data.message || "";

        return;
    }


    if(data.type === "roomCreated"){

        myId = data.id;
        myName = data.name;
        myColor = data.color;
        room = data.room;

        players.clear();

        players.set(
            myId,
            createPlayer(
                myId,
                myName,
                myColor,
                300,
                890
            )
        );

        roomCode.textContent =
            room;

        showRoomPanel();

        return;
    }


    if(data.type === "joined"){

        myId = data.id;
        myName = data.name;
        myColor = data.color;
        room = data.room;

        players.clear();

        players.set(
            myId,
            createPlayer(
                myId,
                myName,
                myColor,
                370,
                890
            )
        );

        roomCode.textContent =
            room;

        showRoomPanel();

        return;
    }


    if(data.type === "playerJoined"){

        if(data.id === myId){
            return;
        }

        players.set(
            data.id,
            createPlayer(
                data.id,
                data.name,
                data.color,
                data.x,
                data.y
            )
        );

        updatePlayerList();

        return;
    }


    if(data.type === "playerMoved"){

        if(data.id === myId){
            return;
        }

        const p =
            players.get(data.id);

        if(!p){
            return;
        }

        p.targetX =
            data.x;

        p.targetY =
            data.y;

        p.targetVX =
            data.vx;

        p.targetVY =
            data.vy;

        p.grounded =
            !!data.grounded;

        p.running =
            !!data.running;

        p.dead =
            !!data.dead;

        return;
    }


    if(data.type === "playerRespawned"){

        const p =
            players.get(data.id);

        if(!p){
            return;
        }

        p.x =
            data.x;

        p.y =
            data.y;

        p.targetX =
            data.x;

        p.targetY =
            data.y;

        p.vx = 0;
        p.vy = 0;
        p.dead = false;

        return;
    }


    if(data.type === "playerLeft"){

        players.delete(data.id);

        updatePlayerList();

        return;
    }


    if(data.type === "gameStart"){

        beginGame();

        return;
    }

}


/* =========================================================
   HOST
========================================================= */

async function hostGame(){

    const name =
        nameInput.value.trim();

    if(!name){

        showError(
            "Enter a name first."
        );

        return;
    }

    try{

        await connect();

        socket.send(
            JSON.stringify({
                type:"host",
                name
            })
        );

    }catch(error){

        showError(
            error.message
        );

    }

}


/* =========================================================
   JOIN
========================================================= */

async function joinGame(){

    const name =
        joinName.value.trim();

    const code =
        roomInput.value
            .trim()
            .toUpperCase();

    if(!name){

        roomError.textContent =
            "Enter your name.";

        return;
    }

    if(code.length !== 4){

        roomError.textContent =
            "Room codes are 4 characters.";

        return;
    }

    try{

        await connect();

        socket.send(
            JSON.stringify({
                type:"join",
                room:code,
                name
            })
        );

    }catch(error){

        roomError.textContent =
            error.message;

    }

}

            "player-entry";

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

/* =========================================================
   PHYSICS
========================================================= */

const physics = {

    gravity:1800,

    walkSpeed:320,
    runSpeed:520,

    acceleration:2600,
    airAcceleration:1450,

    jumpVelocity:-735,

    friction:3000,

    maxFall:1500

};


/* =========================================================
   LOCAL PLAYER
========================================================= */

function updateLocalPlayer(p,dt){

    if(p.dead){
        return;
    }

    const left =
        keys["KeyA"] ||
        keys["ArrowLeft"];

    const right =
        keys["KeyD"] ||
        keys["ArrowRight"];

    const jump =
        keys["KeyW"] ||
        keys["ArrowUp"] ||
        keys["Space"];

    const running =
        keys["ShiftLeft"] ||
        keys["ShiftRight"];


    if(jump){
        p.jumpBuffer = .14;
    }else{
        p.jumpBuffer -= dt;
    }


    if(!p.grounded){
        p.coyote -= dt;
    }else{
        p.coyote = .12;
    }


    const direction =
        (right ? 1 : 0) -
        (left ? 1 : 0);


    const targetSpeed =
        running
            ? physics.runSpeed
            : physics.walkSpeed;


    const acceleration =
        p.grounded
            ? physics.acceleration
            : physics.airAcceleration;


    if(direction !== 0){

        p.vx +=
            direction *
            acceleration *
            dt;

        p.facing =
            direction;

    }else{

        if(p.grounded){

            if(
                Math.abs(p.vx) <=
                physics.friction * dt
            ){

                p.vx = 0;

            }else{

                p.vx -=
                    Math.sign(p.vx) *
                    physics.friction *
                    dt;

            }

        }else{

            p.vx *=
                Math.pow(.985,dt * 60);

        }

    }


    p.vx =
        Math.max(
            -targetSpeed,
            Math.min(
                targetSpeed,
                p.vx
            )
        );


    if(
        p.jumpBuffer > 0 &&
        p.coyote > 0
    ){

        p.vy =
            physics.jumpVelocity;

        p.grounded = false;
        p.coyote = 0;
        p.jumpBuffer = 0;

    }


    if(
        !jump &&
        p.vy < -250
    ){

        p.vy +=
            2300 * dt;

    }


    p.vy +=
        physics.gravity * dt;

    p.vy =
        Math.min(
            p.vy,
            physics.maxFall
        );


    const oldY =
        p.y;

    p.x +=
        p.vx * dt;

    p.y +=
        p.vy * dt;

    p.grounded = false;


    collideWithWorld(
        p,
        oldY
    );


    p.running =
        Math.abs(p.vx) > 360;


    p.anim +=
        Math.abs(p.vx) *
        dt *
        .025;


    p.squash =
        Math.max(
            0,
            p.squash - dt * 5
        );


    /* Falling */

    if(p.y > cameraY + H + 600){

        killPlayer(p);

    }


    /* Left/right soft boundary */

    p.x =
        Math.max(
            -1000,
            Math.min(
                31500,
                p.x
            )
        );


    updateCheckpoint(p);

}


/* =========================================================
   MOVING PLATFORM
========================================================= */

function getMovingPlatformData(mp){

    const t =
        performance.now() / 1000;

    return {

        x:
            mp.baseX +
            Math.sin(
                t * mp.speed +
                mp.phase
            ) *
            mp.distance,

        y:
            mp.baseY

    };

}


/* =========================================================
   COLLISION
========================================================= */

function collideWithWorld(p,oldY){

    const oldBottom =
        oldY + p.height;

    const newBottom =
        p.y + p.height;


    for(
        const platform
        of platforms
    ){

        if(
            p.x + p.width >
                platform.x &&
            p.x <
                platform.x + platform.w &&
            oldBottom <= platform.y &&
            newBottom >= platform.y &&
            p.vy >= 0
        ){

            p.y =
                platform.y -
                p.height;

            p.vy = 0;

            if(!p.grounded){
                p.squash = 1;
            }

            p.grounded = true;

        }

    }


    for(
        const mp
        of movingPlatforms
    ){

        const pos =
            getMovingPlatformData(mp);

        if(
            p.x + p.width >
                pos.x &&
            p.x <
                pos.x + mp.w &&
            oldBottom <= pos.y &&
            newBottom >= pos.y &&
            p.vy >= 0
        ){

            p.y =
                pos.y -
                p.height;

            p.vy = 0;
            p.grounded = true;

        }

    }

}


/* =========================================================
   CHECKPOINTS
========================================================= */

function updateCheckpoint(p){

    let best = null;

    for(
        const cp
        of checkpoints
    ){

        /*
            Checkpoints are activated once
            the player climbs above them.
        */

        if(
            p.y <= cp.y + 120 &&
            cp.y < p.checkpointY
        ){

            if(
                !best ||
                cp.y < best.y
            ){

                best = cp;

            }

        }

    }


    if(best){

        p.checkpointX =
            best.x;

        p.checkpointY =
            best.y;

        if(p.id === myId){

            showCheckpoint();

        }

    }

}

/* =========================================================
   CHAIN
========================================================= */

const chain = {

    softLength:290,
    maxLength:355,

    stiffness:7,
    damping:2.5

};


function updateChain(dt){

    if(players.size < 2){
        return;
    }

    const list =
        [...players.values()];

    const a = list[0];
    const b = list[1];

    if(a.dead || b.dead){
        return;
    }


    const ax =
        a.x + a.width / 2;

    const ay =
        a.y + a.height / 2;

    const bx =
        b.x + b.width / 2;

    const by =
        b.y + b.height / 2;


    const dx =
        bx - ax;

    const dy =
        by - ay;


    const distance =
        Math.hypot(dx,dy);


    chainDistanceText.textContent =
        Math.round(distance);


    if(distance <= chain.softLength){
        return;
    }


    const nx =
        dx / distance;

    const ny =
        dy / distance;


    const excess =
        distance -
        chain.softLength;


    const relativeVelocity =
        (b.vx - a.vx) * nx +
        (b.vy - a.vy) * ny;


    const force =
        excess *
            chain.stiffness +
        relativeVelocity *
            chain.damping;


    const pull =
        Math.min(
            Math.max(force,0),
            1700
        );


    a.vx +=
        nx * pull * dt;

    a.vy +=
        ny * pull * dt;

    b.vx -=
        nx * pull * dt;

    b.vy -=
        ny * pull * dt;


    if(distance > chain.maxLength){

        const correction =
            distance -
            chain.maxLength;

        const amount =
            correction * .5;


        if(!a.grounded){

            a.x +=
                nx * amount;

            a.y +=
                ny * amount;

        }


        if(!b.grounded){

            b.x -=
                nx * amount;

            b.y -=
                ny * amount;

        }

    }

}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(p){

    if(p.dead){
        return;
    }

    p.dead = true;

    p.vx = 0;
    p.vy = 0;

    shake = 12;


    if(p.id !== myId){
        return;
    }


    if(messageTimer !== null){

        clearTimeout(
            messageTimer
        );

    }


    showMessage(
        "💀 YOU FELL"
    );


    messageTimer =
        setTimeout(
            () => {

                respawnPlayer(p);

                hideMessage();

                messageTimer = null;

            },
            950
        );


    if(
        socket &&
        socket.readyState ===
            WebSocket.OPEN &&
        !practiceMode
    ){

        socket.send(
            JSON.stringify({
                type:"respawn"
            })
        );

    }

}


/* =========================================================
   RESPAWN
========================================================= */

function respawnPlayer(p){

    p.x =
        p.checkpointX;

    p.y =
        p.checkpointY -
        p.height;

    p.vx = 0;
    p.vy = 0;

    p.dead = false;

    p.grounded = false;

    p.coyote = 0;
    p.jumpBuffer = 0;

    cameraY =
        p.y - H * .65;

    hideMessage();

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    if(messageTimer !== null){

        clearTimeout(
            messageTimer
        );

        messageTimer = null;

    }

    message.textContent =
        text;

    message.classList.add(
        "show"
    );

}


function hideMessage(){

    message.classList.remove(
        "show"
    );

    /*
        Hard reset so the old
        YOU FELL bug cannot stick.
    */

    message.style.opacity = "0";
    message.style.visibility = "hidden";
    message.style.transform =
        "translate(-50%,-50%) scale(.8)";

}


/* =========================================================
   REMOTE PLAYERS
========================================================= */

function updateRemotePlayers(dt){

    for(
        const p
        of players.values()
    ){

        if(
            p.id === myId ||
            p.dead
        ){
            continue;
        }


        const smoothing =
            1 -
            Math.pow(
                .0001,
                dt
            );


        p.x +=
            (
                p.targetX -
                p.x
            ) *
            smoothing;


        p.y +=
            (
                p.targetY -
                p.y
            ) *
            smoothing;


        p.vx =
            p.targetVX;

        p.vy =
            p.targetVY;


        if(
            Math.abs(p.vx) > 10
        ){

            p.facing =
                Math.sign(p.vx);

        }


        p.anim +=
            Math.abs(p.vx) *
            dt *
            .025;

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    const me =
        players.get(myId);

    if(!me){
        return;
    }


    /*
        Camera follows vertical height
        much more strongly than horizontal.
    */

    const targetY =
        me.y -
        H * .58;


    const targetX =
        me.x -
        W * .38;


    cameraY +=
        (
            targetY -
            cameraY
        ) *
        (
            1 -
            Math.pow(.0008,dt)
        );


    cameraX +=
        (
            targetX -
            cameraX
        ) *
        (
            1 -
            Math.pow(.001,dt)
        );


    cameraY =
        Math.min(
            1100,
            cameraY
        );

    cameraY =
        Math.max(
            -9000,
            cameraY
        );


    cameraX =
        Math.max(
            0,
            Math.min(
                30000,
                cameraX
            )
        );


    /*
        Determine environment.
    */

    const y =
        me.y;


    let area =
        "🏠 THE HOUSE";


    if(y < -200){
        area = "🏢 THE OFFICE";
    }

    if(y < -2100){
        area = "☁️ THE CLOUDS";
    }

    if(y < -4150){
        area = "🚀 SPACE";
    }

    if(y < -6700){
        area = "🌌 THE COSMIC SUMMIT";
    }


    locationText.textContent =
        area;

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const me =
        players.get(myId);

    const worldY =
        me
            ? me.y
            : 900;


    /*
        HOUSE
    */

    if(worldY > -200){

        drawHouseBackground();

        return;

    }


    /*
        OFFICE
    */

    if(worldY > -2100){

        drawOfficeBackground();

        return;

    }


    /*
        CLOUDS
    */

    if(worldY > -4150){

        drawCloudBackground();

        return;

    }


    /*
        SPACE
    */

    if(worldY > -6700){

        drawSpaceBackground();

        return;

    }


    /*
        COSMIC
    */

    drawCosmicBackground();

}


/* =========================================================
   HOUSE BACKGROUND
========================================================= */

function drawHouseBackground(){

    const g =
        ctx.createLinearGradient(
            0,0,0,H
        );

    g.addColorStop(
        0,
        "#20152c"
    );

    g.addColorStop(
        .55,
        "#6f4050"
    );

    g.addColorStop(
        1,
        "#d18365"
    );

    ctx.fillStyle = g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        Sunset window.
    */

    ctx.fillStyle =
        "rgba(255,200,130,.18)";

    ctx.fillRect(
        W*.7,
        H*.12,
        W*.2,
        H*.45
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.1)";

    ctx.lineWidth = 6;

    ctx.strokeRect(
        W*.7,
        H*.12,
        W*.2,
        H*.45
    );


    /*
        Distant houses.
    */

    ctx.fillStyle =
        "rgba(30,20,45,.5)";

    for(
        let i=0;
        i<8;
        i++
    ){

        const x =
            (
                i*260 -
                cameraX*.15
            ) %
            (W+300);

        const y =
            H*.72 -
            (i%3)*35;

        ctx.fillRect(
            x,
            y,
            190,
            H
        );

    }


    drawDust(
        "rgba(255,220,170,.5)",
        70
    );

}


/* =========================================================
   OFFICE BACKGROUND
========================================================= */

function drawOfficeBackground(){

    const g =
        ctx.createLinearGradient(
            0,0,0,H
        );

    g.addColorStop(
        0,
        "#101727"
    );

    g.addColorStop(
        1,
        "#050811"
    );

    ctx.fillStyle = g;

    ctx.fillRect(
        0,0,W,H
    );


    /*
        Window grid.
    */

    for(
        let x=-100;
        x<W+200;
        x+=150
    ){

        const px =
            x -
            (cameraX*.12)%150;

        ctx.fillStyle =
            "rgba(70,150,210,.07)";

        ctx.fillRect(
            px,
            0,
            105,
            H
        );

        ctx.strokeStyle =
            "rgba(100,190,255,.06)";

        ctx.strokeRect(
            px,
            0,
            105,
            H
        );

    }


    /*
        Office lights.
    */

    for(
        let i=0;
        i<12;
        i++
    ){

        const x =
            (i*170 -
            cameraX*.18)
            % (W+200);

        const y =
            70 +
            (i%4)*120;

        ctx.fillStyle =
            "rgba(190,220,255,.07)";

        ctx.fillRect(
            x,
            y,
            90,
            4
        );

    }

}


/* =========================================================
   CLOUD BACKGROUND
========================================================= */

function drawCloudBackground(){

    const g =
        ctx.createLinearGradient(
            0,0,0,H
        );

    g.addColorStop(
        0,
        "#3b72c9"
    );

    g.addColorStop(
        .55,
        "#79bce8"
    );

    g.addColorStop(
        1,
        "#d9f5ff"
    );

    ctx.fillStyle = g;

    ctx.fillRect(
        0,0,W,H
    );


    /*
        Sun.
    */

    const sunX =
        W*.78;

    const sunY =
        H*.2;

    const glow =
        ctx.createRadialGradient(
            sunX,
            sunY,
            20,
            sunX,
            sunY,
            220
        );

    glow.addColorStop(
        0,
        "rgba(255,255,210,.65)"
    );

    glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        Huge clouds.
    */

    for(
        let i=0;
        i<12;
        i++
    ){

        const x =
            (
                i*260 -
                cameraX*.08
            ) %
            (W+500);

        const y =
            100 +
            (i%6)*110;

        drawCloud(
            x,
            y,
            170 +
            (i%3)*80
        );

    }

}


/* =========================================================
   SPACE BACKGROUND
========================================================= */

function drawSpaceBackground(){

    ctx.fillStyle =
        "#02030b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        Nebula.
    */

    const nebula =
        ctx.createRadialGradient(
            W*.5,
            H*.4,
            50,
            W*.5,
            H*.4,
            500
        );

    nebula.addColorStop(
        0,
        "rgba(115,65,255,.24)"
    );

    nebula.addColorStop(
        .45,
        "rgba(35,100,255,.1)"
    );

    nebula.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        nebula;

    ctx.fillRect(
        0,0,W,H
    );


    drawStars(180);

}

   COSMIC BACKGROUND
========================================================= */

function drawCosmicBackground(){

    ctx.fillStyle =

/* =========================================================
   STARS
========================================================= */

function drawStars(count){

    for(
        let i=0;
        i<count;
        i++
    ){

        const x =
            (
                i*137 -
                cameraX*.05
            ) %
            (W+100);

        const y =
            (
                i*73 +
                Math.floor(
                    Math.abs(cameraY)*.07
                )
            ) %
            H;

        const size =
            i%17===0
                ? 2.5
                : 1;


        ctx.globalAlpha =
            .25 +
            (i%9)/14;

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            x,
            y,
            size,
            size
        );

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   DUST
========================================================= */

function drawDust(color,count){

    ctx.fillStyle =
        color;

    for(
        let i=0;
        i<count;
        i++
    ){

        const x =
            (
                i*149 -
                cameraX*.08
            ) %
            W;

        const y =
            (
                i*97 +
                worldTime*8
            ) %
            H;

        ctx.globalAlpha =
            .15 +
            (i%5)*.04;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            1+(i%3),
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   CLOUD
========================================================= */

function drawCloud(
    x,
    y,
    size
){

    ctx.fillStyle =
        "rgba(255,255,255,.65)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size*.35,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+size*.3,
        y-size*.12,
        size*.42,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+size*.65,
        y,
        size*.32,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

    ctx.save();


    const shakeX =
        (Math.random()-.5)*shake;

    const shakeY =
        (Math.random()-.5)*shake;

    ctx.translate(
        shakeX,
        shakeY
    );


    ctx.translate(
        -cameraX,
        -cameraY
    );


    /*
        Environmental world art.
    */

    drawEnvironment();


    /*
        Platforms.
    */

    for(
        const p
        of platforms
    ){

        drawPlatform(
            p
        );

    }


    /*
        Moving platforms.
    */

    for(
        const mp
        of movingPlatforms
    ){

        const pos =
            getMovingPlatformData(mp);

        drawPlatform({
            x:pos.x,
            y:pos.y,
            w:mp.w,
            h:mp.h,
            type:mp.type
        });

    }


    /*
        Hazards.
    */

    for(
        const h
        of hazards
    ){

        drawHazard(h);

    }


    /*
        Checkpoints.
    */

    for(
        const cp
        of checkpoints
    ){

        drawCheckpoint(
            cp
        );

    }


    /*
        Finish.
    */

    drawFinish();


    /*
        Players.
    */

    for(
        const p
        of players.values()
    ){

        if(!p.dead){

            drawPlayer(
                p
            );

        }

    }


    /*
        Chain on top.
    */

    drawChain();


    ctx.restore();


    shake *=
        Math.pow(.04,
            1/60
        );

}


/* =========================================================
   ENVIRONMENT
========================================================= */

function drawEnvironment(){

    const me =
        players.get(myId);

    if(!me){
        return;
    }


    const y =
        me.y;


    if(y > -200){

        drawHouseWorld();

    }else if(y > -2100){

        drawOfficeWorld();

    }else if(y > -4150){

        drawCloudWorld();

    }else if(y > -6700){

        drawSpaceWorld();

    }else{

        drawCosmicWorld();

    }

}

/* =========================================================
   PLATFORM
========================================================= */

function drawPlatform(p){

    let top =
        "#7f6aff";

    let bottom =
        "#24213e";

    let glow =
        "#7766ff";


    if(p.type==="wood"){

        top="#d59465";
        bottom="#56362e";
        glow="#ffad78";

    }

    if(p.type==="furniture"){

        top="#a86fbd";
        bottom="#39283e";
        glow="#d078e8";

    }

    if(p.type==="roof"){

        top="#6d3945";
        bottom="#271824";
        glow="#d15a6e";

    }

    if(p.type==="office"){

        top="#7194ad";
        bottom="#182332";
        glow="#65c7ff";

    }

    if(p.type==="glass"){

        top="#72e9ff";
        bottom="#16354d";
        glow="#55eaff";

    }

    if(p.type==="construction"){

        top="#ffb94f";
        bottom="#633e1d";
        glow="#ffb13e";

    }

    if(p.type==="cloud"){

        top="#ffffff";
        bottom="#a9cde5";
        glow="#ffffff";

    }

    if(p.type==="sky"){

        top="#9aeaff";
        bottom="#3b7fb0";
        glow="#69ddff";

    }

    if(p.type==="storm"){

        top="#9a8bff";
        bottom="#29254f";
        glow="#8b7aff";

    }

    if(p.type==="space"){

        top="#7f8bff";
        bottom="#161a3b";
        glow="#6978ff";

    }

    if(p.type==="satellite"){

        top="#b5c3d6";
        bottom="#374354";
        glow="#93caff";

    }

    if(p.type==="station"){

        top="#b8d6ff";
        bottom="#283a54";
        glow="#8ac8ff";

    }

    if(p.type==="asteroid"){

        top="#9c8b8b";
        bottom="#423b43";
        glow="#9e7e8e";

    }

    if(p.type==="cosmic"){

        top="#d37cff";
        bottom="#34205d";
        glow="#c85dff";

    }

    if(p.type==="summit"){

        top="#ffffff";
        bottom="#5c3aff";
        glow="#b879ff";

    }


    ctx.save();

    ctx.shadowBlur =
        24;

    ctx.shadowColor =
        glow;


    const gradient =
        ctx.createLinearGradient(
            0,
            p.y,
            0,
            p.y+p.h
        );

    gradient.addColorStop(
        0,
        top
    );

    gradient.addColorStop(
        1,
        bottom
    );

    ctx.fillStyle =
        gradient;


    roundRect(
        p.x,
        p.y,
        p.w,
        p.h,
        8
    );


    ctx.shadowBlur=0;


    /*
        Highlight.
    */

    ctx.fillStyle =
        "rgba(255,255,255,.3)";

    roundRect(
        p.x+5,
        p.y+3,
        Math.max(
            10,
            p.w-10
        ),
        3,
        2
    );


    /*
        Material details.
    */

    if(
        p.type==="wood"
    ){

        ctx.strokeStyle =
            "rgba(70,35,20,.35)";

        ctx.lineWidth=2;

        for(
            let x=p.x+20;
            x<p.x+p.w;
            x+=40
        ){

            ctx.beginPath();

            ctx.moveTo(
                x,
                p.y+8
            );

            ctx.lineTo(
                x+10,
                p.y+p.h-4
            );

            ctx.stroke();

        }

    }


    if(
        p.type==="office" ||
        p.type==="construction"
    ){

        ctx.fillStyle =
            "rgba(255,255,255,.09)";

        for(
            let x=p.x+15;
            x<p.x+p.w-10;
            x+=32
        ){

            ctx.fillRect(
                x,
                p.y+12,
                15,
                3
            );

        }

    }


    if(
        p.type==="summit"
    ){

        ctx.fillStyle =
            "rgba(255,255,255,.65)";

        for(
            let x=p.x+20;
            x<p.x+p.w;
            x+=45
        ){

            ctx.beginPath();

            ctx.arc(
                x,
                p.y-8-
                    Math.sin(
                        worldTime*2+x
                    )*4,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    ctx.restore();

}


/* =========================================================
   HAZARDS
========================================================= */

function drawHazard(h){

    if(h.type==="laser"){

        ctx.save();

        ctx.shadowBlur=25;
        ctx.shadowColor="#ff385d";

        ctx.fillStyle="#ff3155";

        ctx.fillRect(
            h.x,
            h.y,
            h.w,
            h.h
        );

        ctx.fillStyle=
            "rgba(255,255,255,.8)";

        ctx.fillRect(
            h.x,
            h.y+h.h/2-2,
            h.w,
            4
        );

        ctx.restore();

    }


    if(h.type==="lightning"){

        ctx.save();

        ctx.strokeStyle="#dffaff";
        ctx.shadowBlur=30;
        ctx.shadowColor="#64dfff";

        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.moveTo(
            h.x,
            h.y
        );

        ctx.lineTo(
            h.x+35,
            h.y+35
        );

        ctx.lineTo(
            h.x+15,
            h.y+35
        );

        ctx.lineTo(
            h.x+55,
            h.y+80
        );

        ctx.stroke();

        ctx.restore();

    }


    if(
        h.type==="asteroid" ||
        h.type==="energy"
    ){

        ctx.save();

        ctx.shadowBlur =
            h.type==="energy"
                ? 30
                : 12;

        ctx.shadowColor =
            h.type==="energy"
                ? "#c05cff"
                : "#a47c83";

        ctx.fillStyle =
            h.type==="energy"
                ? "#a74dff"
                : "#62545d";

        ctx.beginPath();

        ctx.moveTo(
            h.x+20,
            h.y
        );

        ctx.lineTo(
            h.x+h.w-10,
            h.y+15
        );

        ctx.lineTo(
            h.x+h.w,
            h.y+h.h-20
        );

        ctx.lineTo(
            h.x+35,
            h.y+h.h
        );

        ctx.lineTo(
            h.x,
            h.y+35
        );

        ctx.closePath();

        ctx.fill();

        ctx.restore();

    }


    if(h.type==="chimney"){

        ctx.fillStyle =
            "#49323a";

        ctx.fillRect(
            h.x,
            h.y,
            h.w,
            h.h
        );

        ctx.fillStyle =
            "rgba(255,130,100,.2)";

        ctx.beginPath();

        ctx.arc(
            h.x+h.w/2,
            h.y-15,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   CHECKPOINT
========================================================= */

        cp.y <=

    ctx.save();

    ctx.shadowBlur =
        active
            ? 25
            : 10;

    ctx.shadowColor =
        "#8d6cff";

    ctx.strokeStyle =
        active
            ? "#a48aff"

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
        cp.x,
        cp.y,
        28,

        Math.PI*2

    ctx.stroke();

    ctx.fillStyle =
        active
            ? "rgba(140,100,255,.2)"

    ctx.beginPath();

    ctx.arc(
        cp.x,
        cp.y,
        17+

                worldTime*4

    );

}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(p){

    const cx =
        p.x +
        p.width/2;

    const bottom =
        p.y +
        p.height;


    const primary =
        p.color==="red"
            ? "#ff5272"
            : "#4fcaff";

    const secondary =
        p.color==="red"
            ? "#a92549"
            : "#247db0";


    /*
        Shadow.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.28)";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        bottom+5,
        25,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Glow.
    */

    ctx.save();

    ctx.shadowBlur=24;
    ctx.shadowColor=primary;


    /*
        Body.
    */

    const body =
        ctx.createLinearGradient(
            p.x,
            p.y,
            p.x+p.width,
            bottom
        );

    body.addColorStop(
        0,
        primary
    );

    body.addColorStop(
        1,
        secondary
    );

    ctx.fillStyle =
        body;

    roundRect(
        p.x+4,
        p.y+20,
        p.width-8,
        32,
        9
    );


    /*
        Head.
    */

    ctx.fillStyle =
        "#ffd4bd";

    ctx.beginPath();

    ctx.arc(
        cx,
        p.y+15,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Hair / helmet.
    */

    ctx.fillStyle =
        "#15182a";

    ctx.beginPath();

    ctx.arc(
        cx,
        p.y+12,
        14,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    /*
        Face.
    */

    ctx.fillStyle =
        "#141522";

    const eyeOffset =
        p.facing*4;

    ctx.beginPath();

    ctx.arc(
        cx+eyeOffset-5,
        p.y+16,
        2,
        0,
        Math.PI*2
    );

    ctx.arc(
        cx+eyeOffset+5,
        p.y+16,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Backpack.
    */

    ctx.fillStyle =
        secondary;

    roundRect(
        p.x-1,
        p.y+26,
        8,
        19,
        3
    );


    /*
        Legs.
    */

    const walking =
        Math.abs(p.vx)>20 &&
        p.grounded;

    const swing =
        walking
            ? Math.sin(p.anim)*6
            : 0;


    ctx.strokeStyle =
        secondary;

    ctx.lineWidth=7;
    ctx.lineCap="round";


    ctx.beginPath();

    ctx.moveTo(
        cx-8,
        p.y+49
    );

    ctx.lineTo(
        cx-10+swing,
        bottom
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        cx+8,
        p.y+49
    );

    ctx.lineTo(
        cx+10-swing,
        bottom
    );

    ctx.stroke();


    /*
        Shoes.
    */

    ctx.fillStyle =
        "#101321";

    ctx.fillRect(
        cx-15+swing,
        bottom-3,
        11,
        6
    );

    ctx.fillRect(
        cx+4-swing,
        bottom-3,
        11,
        6
    );


    /*
        Name.
    */

    ctx.font =
        "800 12px system-ui";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    ctx.fillText(
        p.name,
        cx,
        p.y-12
    );


    ctx.restore();

}


/* =========================================================
   CHAIN DRAWING
========================================================= */

function drawChain(){

    if(players.size<2){
        return;
    }

    const list =
        [...players.values()];

    const a =
        list[0];

    const b =
        list[1];


    if(a.dead || b.dead){
        return;
    }


    const ax =
        a.x+a.width/2;

    const ay =
        a.y+a.height/2;

    const bx =
        b.x+b.width/2;

    const by =
        b.y+b.height/2;


    const dx =
        bx-ax;

    const dy =
        by-ay;

    const distance =
        Math.hypot(dx,dy);


    const danger =
        Math.max(
            0,
            Math.min(
                1,
                (
                    distance-
                    chain.softLength
                )/
                (
                    chain.maxLength-
                    chain.softLength
                )
            )
        );


    ctx.save();

    /*
        Thick shadow.
    */

    ctx.lineWidth=9;

    ctx.lineCap="round";

    ctx.strokeStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.moveTo(
        ax+3,
        ay+5
    );

    ctx.lineTo(
        bx+3,
        by+5
    );

    ctx.stroke();


    /*
        Main chain.
    */

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        danger>.5
            ? "#ff4568"
            : "#64eaff";

    ctx.strokeStyle =
        danger>.5
            ? "#ff4d70"
            : "#67dcff";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        ax,
        ay
    );

    ctx.lineTo(
        bx,
        by
    );

    ctx.stroke();


    /*
        Individual metal links.
    */

    const links =
        Math.max(
            3,
            Math.floor(
                distance/23
            )
        );


    ctx.shadowBlur=8;

    ctx.strokeStyle =
        danger>.5
            ? "#ffd0d8"
            : "#e4fbff";

    ctx.lineWidth=3;


    const angle =
        Math.atan2(
            dy,
            dx
        );


    for(
        let i=0;
        i<=links;
        i++
    ){

        const t =
            i/links;

        const x =
            ax+dx*t;

        const y =
            ay+dy*t;


        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            7,
            4,
            angle+
                (
                    i%2
                        ? Math.PI/2
                        : 0
                ),
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    /*
        Chain tension indicator.
    */

    if(danger>.7){

        ctx.fillStyle =
            "rgba(255,50,80,.9)";

        ctx.font =
            "900 12px system-ui";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "CHAIN TAUT!",
            (ax+bx)/2,
            (ay+by)/2-18
        );

    }


    ctx.restore();

}


/* =========================================================
   SATELLITE
========================================================= */

function drawSatellite(x,y){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        Math.sin(
            worldTime*.5+x
        )*.08
    );


    ctx.fillStyle =
        "#8796aa";

    ctx.fillRect(
        -30,
        -12,
        60,
        24
    );


    ctx.fillStyle =
        "#3f91c7";

    ctx.fillRect(
        -80,
        -9,
        45,
        18
    );

    ctx.fillRect(
        35,
        -9,
        45,
        18
    );


    ctx.strokeStyle =
        "#aab5c4";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        0,
        12
    );

    ctx.lineTo(
        0,
        55
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        w,
        h,
        r
    );

    ctx.fill();

}


/* =========================================================
   SEND MOVEMENT
========================================================= */

function sendMovement(now){

    if(
        practiceMode ||
        !socket ||
        socket.readyState !==
            WebSocket.OPEN ||
        !gameStarted
    ){
        return;
    }


    if(
        now-lastSend<33
    ){
        return;
    }


    lastSend =
        now;


    const p =
        players.get(myId);

    if(!p){
        return;
    }


    socket.send(
        JSON.stringify({

            type:"move",

            x:p.x,
            y:p.y,

            vx:p.vx,
            vy:p.vy,

            grounded:p.grounded,

            running:p.running,

            dead:p.dead

        })
    );

}


/* =========================================================
   FINISH CHECK
========================================================= */

let finished = false;

function checkFinish(){

    if(finished){
        return;
    }


    const list =
        [...players.values()];

    if(list.length===0){
        return;
    }


    /*
        Both players need to reach
        the summit.
    */

    const allFinished =
        list.length>=2 &&
        list.every(
            p =>
                !p.dead &&
                p.y <= finishY+180
        );


    /*
        Practice can finish alone.
    */

    const practiceFinished =
        practiceMode &&
        list[0] &&
        list[0].y <= finishY+180;


    if(
        allFinished ||
        practiceFinished
    ){

        finished = true;

        showMessage(
            "🏆 YOU CONQUERED THE CLIMB!"
        );

        gameStarted = false;

    }

}


/* =========================================================
   ERROR
========================================================= */

function showError(text){

    errorBox.textContent =
        text;

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

    const dt =
        Math.min(
            .033,
            (now-lastTime)/1000
        );

    lastTime =
        now;

    worldTime +=
        dt;


    if(gameStarted){

        const me =
            players.get(myId);


        if(me){

            updateLocalPlayer(
                me,
                dt
            );

        }


        updateRemotePlayers(
            dt
        );


        updateChain(
            dt
        );


        updateCamera(
            dt
        );


        sendMovement(
            now
        );


        checkFinish();

    }


    drawBackground();

    drawWorld();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
========================================================= */

loading.style.display =
    "none";

lobby.style.display =
    "flex";

requestAnimationFrame(
    gameLoop
);

</script>
