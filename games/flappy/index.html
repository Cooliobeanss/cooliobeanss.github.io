<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Sky</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b16;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    display: block;
    width: min(100vw, 480px);
    height: min(100vh, 800px);
    background: #65c8ff;
    touch-action: none;
    user-select: none;
}
</style>
</head>

<body>

<canvas id="game" width="480" height="800"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let state = "menu";
let score = 0;
let best = Number(localStorage.getItem("flappySkyBest")) || 0;
let frame = 0;
let shake = 0;
let deathTimer = 0;

const bird = {
    x: 125,
    y: 370,
    velocity: 0,
    rotation: 0,
    wing: 0,
    floatTimer: 0
};

let pipes = [];
let particles = [];
let clouds = [];
let stars = [];

// --------------------------------------------------
// SETTINGS
// --------------------------------------------------

const gravity = 0.18;
const flapPower = -5.8;
const pipeSpeed = 2.7;

// Bigger opening = easier
const pipeGap = 205;

// Much more distance between pipes
const pipeSpacing = 400;

// Tiny bit of float after flapping
const floatTime = 7;

// --------------------------------------------------
// BACKGROUND
// --------------------------------------------------

for (let i = 0; i < 12; i++) {
    clouds.push({
        x: Math.random() * W,
        y: 70 + Math.random() * 260,
        size: 0.5 + Math.random() * 0.8,
        speed: 0.15 + Math.random() * 0.25
    });
}

for (let i = 0; i < 50; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * 500,
        size: Math.random() * 2 + 0.5,
        alpha: Math.random()
    });
}

// --------------------------------------------------
// RESET
// --------------------------------------------------

function reset() {
    bird.x = 125;
    bird.y = 370;
    bird.velocity = 0;
    bird.rotation = 0;
    score = 0;
    frame = 0;
    pipes = [];
    particles = [];
    shake = 0;
    deathTimer = 0;
}

// --------------------------------------------------
// START
// --------------------------------------------------

function startGame() {
    reset();
    state = "playing";
    flap();
}

// --------------------------------------------------
// FLAP
// --------------------------------------------------

function flap() {

    if (state === "menu") {
        startGame();
        return;
    }

    if (state === "gameover") {
        startGame();
        return;
    }

    bird.velocity = flapPower;
bird.floatTimer = floatTime;

    for (let i = 0; i < 7; i++) {
        particles.push({
            x: bird.x - 14,
            y: bird.y + 5,
            vx: -1 - Math.random() * 2,
            vy: (Math.random() - 0.5) * 2,
            life: 25 + Math.random() * 15,
            maxLife: 40,
            size: 2 + Math.random() * 3
        });
    }
}

// --------------------------------------------------
// INPUT
// --------------------------------------------------

document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    flap();
});

// --------------------------------------------------
// PIPE
// --------------------------------------------------

function spawnPipe() {

    const minimum = 110;
    const maximum = H - 220 - pipeGap;

    const top = minimum +
        Math.random() * (maximum - minimum);

    pipes.push({
        x: W + 30,
        top: top,
        bottom: top + pipeGap,
        passed: false
    });
}

// --------------------------------------------------
// PARTICLES
// --------------------------------------------------

function explosion() {

    for (let i = 0; i < 35; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;

        particles.push({
            x: bird.x,
            y: bird.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            size: 2 + Math.random() * 5
        });
    }
}

// --------------------------------------------------
// GAME OVER
// --------------------------------------------------

function gameOver() {

    if (state !== "playing") return;

    state = "gameover";
    deathTimer = 0;
    shake = 14;

    explosion();

    if (score > best) {
        best = score;
        localStorage.setItem("flappySkyBest", best);
    }
}

// --------------------------------------------------
// COLLISION
// --------------------------------------------------

function collision(pipe) {

    const r = 15;

    const bx = bird.x;
    const by = bird.y;

    if (
        bx + r > pipe.x &&
        bx - r < pipe.x + pipeWidth
    ) {

        if (
            by - r < pipe.top ||
            by + r > pipe.bottom
        ) {
            return true;
        }
    }

    return false;
}

// --------------------------------------------------
// UPDATE
// --------------------------------------------------

function update() {

    frame++;

    // Clouds
    clouds.forEach(cloud => {
        cloud.x -= cloud.speed;

        if (cloud.x < -100) {
            cloud.x = W + 100;
        }
    });

    // Particles
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.life--;
    });

    particles = particles.filter(p => p.life > 0);

    if (shake > 0) {
        shake *= 0.82;

        if (shake < 0.2) {
            shake = 0;
        }
    }

    if (state !== "playing") {
        return;
    }

    // Bird
if (bird.floatTimer > 0) {
    bird.floatTimer--;
    
    // Keep the bird floating briefly
    bird.velocity *= 0.92;
} else {
    bird.velocity += gravity;
}

bird.y += bird.velocity;

    bird.rotation =
        Math.max(
            -0.45,
            Math.min(1.15, bird.velocity * 0.075)
        );

    bird.wing += 0.35;

    // Spawn
    if (
        pipes.length === 0 ||
        pipes[pipes.length - 1].x < W - pipeSpacing
    ) {
        spawnPipe();
    }

    // Pipes
    for (let i = pipes.length - 1; i >= 0; i--) {

        const pipe = pipes[i];

        pipe.x -= pipeSpeed;

        if (
            !pipe.passed &&
            pipe.x + pipeWidth < bird.x
        ) {
            pipe.passed = true;
            score++;

            // Score particles
            for (let j = 0; j < 12; j++) {
                particles.push({
                    x: bird.x,
                    y: bird.y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -Math.random() * 3,
                    life: 30,
                    maxLife: 30,
                    size: 2 + Math.random() * 3
                });
            }
        }

        if (collision(pipe)) {
            gameOver();
        }

        if (pipe.x < -pipeWidth - 20) {
            pipes.splice(i, 1);
        }
    }

    // Ceiling
    if (bird.y - 16 < 0) {
        bird.y = 16;
        bird.velocity = 0;
bird.rotation = 0;
bird.floatTimer = 0;
    }

    // Ground
    if (bird.y + 16 > H - 95) {
        bird.y = H - 111;
        gameOver();
    }
}

// --------------------------------------------------
// SKY
// --------------------------------------------------

function drawSky() {

    const gradient = ctx.createLinearGradient(0, 0, 0, H);

    gradient.addColorStop(0, "#38aef5");
    gradient.addColorStop(0.55, "#7bdcff");
    gradient.addColorStop(1, "#d7f7ff");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Sun
    const sunGlow = ctx.createRadialGradient(
        380, 115, 10,
        380, 115, 100
    );

    sunGlow.addColorStop(0, "rgba(255,255,210,0.95)");
    sunGlow.addColorStop(1, "rgba(255,255,210,0)");

    ctx.fillStyle = sunGlow;
    ctx.fillRect(280, 15, 200, 200);

    ctx.fillStyle = "#fff4a8";
    ctx.beginPath();
    ctx.arc(380, 115, 42, 0, Math.PI * 2);
    ctx.fill();

    // Distant hills
    ctx.fillStyle = "#8bd4a2";

    ctx.beginPath();
    ctx.moveTo(0, H - 170);

    for (let x = 0; x <= W; x += 40) {
        ctx.lineTo(
            x,
            H - 170 -
            Math.sin(x * 0.018) * 25
        );
    }

    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();
}

// --------------------------------------------------
// CLOUDS
// --------------------------------------------------

function drawCloud(cloud) {

    ctx.save();

    ctx.translate(cloud.x, cloud.y);
    ctx.scale(cloud.size, cloud.size);

    ctx.fillStyle = "rgba(255,255,255,0.82)";

    ctx.beginPath();

    ctx.arc(0, 15, 25, 0, Math.PI * 2);
    ctx.arc(30, 0, 35, 0, Math.PI * 2);
    ctx.arc(65, 15, 27, 0, Math.PI * 2);
    ctx.arc(35, 25, 38, 0, Math.PI * 2);

    ctx.fill();

    ctx.restore();
}

// --------------------------------------------------
// PIPES
// --------------------------------------------------

function drawPipe(x, y, height, topPipe) {

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(x + 5, y + 5, pipeWidth, height);

    // Body gradient
    const gradient = ctx.createLinearGradient(
        x, 0,
        x + pipeWidth, 0
    );

    gradient.addColorStop(0, "#258f3b");
    gradient.addColorStop(0.25, "#5ad25d");
    gradient.addColorStop(0.5, "#83e66b");
    gradient.addColorStop(0.75, "#45b94d");
    gradient.addColorStop(1, "#217c32");

    ctx.fillStyle = gradient;
    ctx.fillRect(x, y, pipeWidth, height);

    // Border
    ctx.strokeStyle = "#176628";
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, pipeWidth, height);

    // Highlight
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(x + 10, y, 8, height);

    // Cap
    const capHeight = 30;
    const capX = x - 7;
    const capWidth = pipeWidth + 14;

    const capY = topPipe
        ? y + height - capHeight
        : y;

    ctx.fillStyle = "#54c956";
    ctx.fillRect(
        capX,
        capY,
        capWidth,
        capHeight
    );

    ctx.strokeStyle = "#176628";
    ctx.lineWidth = 4;

    ctx.strokeRect(
        capX,
        capY,
        capWidth,
        capHeight
    );

    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(
        capX + 10,
        capY + 5,
        8,
        capHeight - 10
    );
}

function drawPipes() {

    pipes.forEach(pipe => {

        drawPipe(
            pipe.x,
            0,
            pipe.top,
            true
        );

        drawPipe(
            pipe.x,
            pipe.bottom,
            H - pipe.bottom - 95,
            false
        );
    });
}

// --------------------------------------------------
// BIRD
// --------------------------------------------------

function drawBird() {

    ctx.save();

    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.beginPath();
    ctx.ellipse(0, 20, 22, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body gradient
    const body = ctx.createRadialGradient(
        -6, -8, 3,
        0, 0, 25
    );

    body.addColorStop(0, "#fff36a");
    body.addColorStop(0.5, "#ffd83d");
    body.addColorStop(1, "#e9a900");

    ctx.fillStyle = body;

    ctx.beginPath();
    ctx.arc(0, 0, 21, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#bd8500";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Wing animation
    const wingOffset = Math.sin(bird.wing) * 4;

    ctx.fillStyle = "#e9ad00";

    ctx.beginPath();

    ctx.ellipse(
        -8,
        6 + wingOffset,
        14,
        9,
        -0.35,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "#c18b00";
    ctx.stroke();

    // Eye white
    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(8, -8, 8, 0, Math.PI * 2);
    ctx.fill();

    // Pupil
    ctx.fillStyle = "#151515";

    ctx.beginPath();
    ctx.arc(10, -8, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = "#ff8b20";

    ctx.beginPath();
    ctx.moveTo(17, -1);
    ctx.lineTo(37, 5);
    ctx.lineTo(17, 12);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#c95e00";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
}

// --------------------------------------------------
// GROUND
// --------------------------------------------------

function drawGround() {

    const y = H - 95;

    ctx.fillStyle = "#54b83e";
    ctx.fillRect(0, y, W, 95);

    ctx.fillStyle = "#79d450";
    ctx.fillRect(0, y, W, 13);

    // Moving grass
    const offset = (frame * pipeSpeed) % 45;

    ctx.fillStyle = "#3d9832";

    for (let x = -45 + offset; x < W; x += 45) {
        ctx.fillRect(x, y + 32, 24, 7);
        ctx.fillRect(x + 15, y + 55, 18, 6);
    }

    // Dirt
    ctx.fillStyle = "#9c6b3d";
    ctx.fillRect(0, y + 70, W, 25);

    ctx.fillStyle = "#b77d48";

    for (let x = 10; x < W; x += 45) {
        ctx.fillRect(x, y + 77, 18, 5);
    }
}

// --------------------------------------------------
// PARTICLES DRAW
// --------------------------------------------------

function drawParticles() {

    particles.forEach(p => {

        const alpha = Math.max(
            0,
            p.life / p.maxLife
        );

        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#fff3a0";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

// --------------------------------------------------
// SCORE
// --------------------------------------------------

function drawScore() {

    if (state !== "playing") return;

    ctx.textAlign = "center";

    ctx.font = "900 62px Arial";

    ctx.lineWidth = 8;
    ctx.strokeStyle = "rgba(0,0,0,0.25)";

    ctx.strokeText(
        score,
        W / 2,
        85
    );

    ctx.fillStyle = "white";

    ctx.fillText(
        score,
        W / 2,
        85
    );
}

// --------------------------------------------------
// MENU
// --------------------------------------------------

function drawMenu() {

    if (state !== "menu" && state !== "gameover") {
        return;
    }

    ctx.fillStyle = "rgba(7,15,30,0.25)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";

    // Logo
    ctx.font = "900 58px Arial";
    ctx.lineWidth = 8;
    ctx.strokeStyle = "rgba(0,0,0,0.3)";

    ctx.strokeText(
        "FLAPPY",
        W / 2,
        220
    );

    ctx.fillStyle = "white";

    ctx.fillText(
        "FLAPPY",
        W / 2,
        220
    );

    ctx.fillStyle = "#ffe04a";

    ctx.fillText(
        "SKY",
        W / 2,
        280
    );

    if (state === "menu") {

        ctx.font = "bold 22px Arial";
        ctx.fillStyle = "white";

        ctx.fillText(
            "CLICK OR PRESS SPACE",
            W / 2,
            345
        );

        ctx.font = "18px Arial";

        ctx.fillText(
            "to start flying",
            W / 2,
            375
        );

        // Best
        ctx.font = "bold 18px Arial";
        ctx.fillStyle = "rgba(255,255,255,0.85)";

        ctx.fillText(
            "BEST: " + best,
            W / 2,
            425
        );

    } else {

        // Game over panel
        ctx.fillStyle = "rgba(8,10,18,0.78)";

        roundRect(
            65,
            330,
            350,
            220,
            22
        );

        ctx.fill();

        ctx.font = "900 36px Arial";
        ctx.fillStyle = "#ffdf4a";

        ctx.fillText(
            "GAME OVER",
            W / 2,
            385
        );

        ctx.font = "bold 23px Arial";
        ctx.fillStyle = "white";

        ctx.fillText(
            "SCORE   " + score,
            W / 2,
            430
        );

        ctx.fillText(
            "BEST     " + best,
            W / 2,
            465
        );

        ctx.font = "bold 17px Arial";
        ctx.fillStyle = "#bfc7d9";

        ctx.fillText(
            "CLICK OR SPACE TO PLAY AGAIN",
            W / 2,
            515
        );
    }
}

// --------------------------------------------------
// ROUNDED RECT
// --------------------------------------------------

function roundRect(x, y, w, h, r) {

    ctx.beginPath();

    ctx.moveTo(x + r, y);

    ctx.arcTo(
        x + w,
        y,
        x + w,
        y + h,
        r
    );

    ctx.arcTo(
        x + w,
        y + h,
        x,
        y + h,
        r
    );

    ctx.arcTo(
        x,
        y + h,
        x,
        y,
        r
    );

    ctx.arcTo(
        x,
        y,
        x + w,
        y,
        r
    );

    ctx.closePath();
}

// --------------------------------------------------
// DRAW
// --------------------------------------------------

function draw() {

    ctx.save();

    if (shake > 0) {
        ctx.translate(
            (Math.random() - 0.5) * shake,
            (Math.random() - 0.5) * shake
        );
    }

    drawSky();

    clouds.forEach(drawCloud);

    drawPipes();

    drawGround();

    drawBird();

    drawParticles();

    drawScore();

    drawMenu();

    ctx.restore();
}

// --------------------------------------------------
// LOOP
// --------------------------------------------------

function loop() {

    update();
    draw();

    requestAnimationFrame(loop);
}

reset();
loop();

</script>

</body>
</html>
