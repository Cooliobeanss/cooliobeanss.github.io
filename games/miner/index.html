<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miner | CoolioBeans</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background:
            radial-gradient(circle at top, #26354d 0%, #111827 45%, #080b12 100%);
        color: white;
        min-height: 100vh;
        overflow-x: hidden;
    }

    header {
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 35px;
        background: rgba(8, 11, 18, 0.85);
        border-bottom: 1px solid #293246;
        backdrop-filter: blur(10px);
    }

    .logo {
        font-size: 25px;
        font-weight: 900;
    }

    .back {
        color: #cbd5e1;
        text-decoration: none;
        font-weight: bold;
    }

    .back:hover {
        color: white;
    }

    .game {
        width: min(1200px, 94%);
        margin: 30px auto;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .title {
        font-size: 38px;
        font-weight: 900;
    }

    .money {
        background: #172033;
        border: 1px solid #34415a;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 20px;
        font-weight: bold;
    }

    .layout {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 20px;
    }

    .mine-container {
        background: #0d1320;
        border: 1px solid #2b374d;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .mine-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
        color: #aebbd0;
        font-weight: bold;
    }

    #mine {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 5px;
        width: 100%;
        aspect-ratio: 1.2;
    }

    .block {
        border: 0;
        border-radius: 7px;
        cursor: pointer;
        font-size: 22px;
        transition: transform .08s, filter .1s;
        position: relative;
        min-width: 0;
        overflow: hidden;
    }

    .block:hover {
        filter: brightness(1.3);
        transform: scale(1.04);
    }

    .block:active {
        transform: scale(.92);
    }

    .dirt {
        background: #68452d;
    }

    .stone {
        background: #505866;
    }

    .coal {
        background: #20242c;
    }

    .iron {
        background: #9b6f58;
    }

    .gold {
        background: #c59a25;
    }

    .diamond {
        background: #28bcd3;
    }

    .bedrock {
        background: #161a22;
        cursor: not-allowed;
    }

    .ore {
        text-shadow: 0 2px 4px rgba(0,0,0,.7);
    }

    .side {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .panel {
        background: #111a2a;
        border: 1px solid #2b374d;
        border-radius: 15px;
        padding: 18px;
    }

    .panel h2 {
        font-size: 19px;
        margin-bottom: 15px;
    }

    .stat {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
        color: #b9c5d8;
    }

    .stat strong {
        color: white;
    }

    .bar {
        width: 100%;
        height: 13px;
        background: #202a3b;
        border-radius: 20px;
        overflow: hidden;
        margin-top: 8px;
    }

    #bagBar {
        height: 100%;
        width: 0%;
        background: #4ade80;
        transition: width .2s;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        margin-top: 9px;
        background: #26344b;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: .15s;
    }

    button:hover {
        background: #344663;
        transform: translateY(-1px);
    }

    button:disabled {
        opacity: .4;
        cursor: not-allowed;
        transform: none;
    }

    .sell {
        background: #198754;
    }

    .sell:hover {
        background: #21a366;
    }

    .upgrade {
        background: #6954d8;
    }

    .upgrade:hover {
        background: #7964ed;
    }

    .message {
        min-height: 24px;
        margin-top: 15px;
        text-align: center;
        color: #aebbd0;
        font-weight: bold;
    }

    .legend {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        margin-top: 10px;
    }

    .legend div {
        background: #182235;
        border-radius: 8px;
        padding: 8px;
        font-size: 13px;
        color: #cbd5e1;
    }

    @media (max-width: 850px) {
        .layout {
            grid-template-columns: 1fr;
        }

        #mine {
            grid-template-columns: repeat(10, 1fr);
        }
    }

    @media (max-width: 550px) {
        header {
            padding: 0 15px;
        }

        .game {
            width: 96%;
        }

        .title {
            font-size: 30px;
        }

        #mine {
            grid-template-columns: repeat(8, 1fr);
        }

        .block {
            font-size: 17px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="logo">⛏️ CoolioBeans</div>
    <a class="back" href="../../">← Back to Games</a>
</header>

<main class="game">

    <div class="topbar">
        <div class="title">⛏️ MINER</div>
        <div class="money">💰 $<span id="money">0</span></div>
    </div>

    <div class="layout">

        <section class="mine-container">

            <div class="mine-header">
                <span>⛏️ Underground Mine</span>
                <span>Depth: <span id="depth">1</span></span>
            </div>

            <div id="mine"></div>

            <div class="message" id="message">
                Click a block to start mining!
            </div>

        </section>

        <aside class="side">

            <div class="panel">

                <h2>🎒 Backpack</h2>

                <div class="stat">
                    <span>Capacity</span>
                    <strong>
                        <span id="bagCount">0</span>/<span id="bagMax">20</span>
                    </strong>
                </div>

                <div class="bar">
                    <div id="bagBar"></div>
                </div>

                <button class="sell" onclick="sellAll()">
                    💰 Sell Everything
                </button>

            </div>

            <div class="panel">

                <h2>🔨 Pickaxe</h2>

                <div class="stat">
                    <span>Level</span>
                    <strong id="pickLevel">1</strong>
                </div>

                <div class="stat">
                    <span>Mining Power</span>
                    <strong id="power">1</strong>
                </div>

                <button class="upgrade" id="upgradeButton" onclick="upgradePickaxe()">
                    Upgrade — $50
                </button>

            </div>

            <div class="panel">

                <h2>📦 Ores</h2>

                <div class="legend">
                    <div>🟫 Dirt — $1</div>
                    <div>⬜ Stone — $2</div>
                    <div>⬛ Coal — $8</div>
                    <div>🟤 Iron — $15</div>
                    <div>🟨 Gold — $40</div>
                    <div>💎 Diamond — $150</div>
                </div>

            </div>

        </aside>

    </div>

</main>

<script>

const mine = document.getElementById("mine");
const moneyDisplay = document.getElementById("money");
const bagCountDisplay = document.getElementById("bagCount");
const bagMaxDisplay = document.getElementById("bagMax");
const bagBar = document.getElementById("bagBar");
const depthDisplay = document.getElementById("depth");
const pickLevelDisplay = document.getElementById("pickLevel");
const powerDisplay = document.getElementById("power");
const upgradeButton = document.getElementById("upgradeButton");
const message = document.getElementById("message");

let money = Number(localStorage.getItem("minerMoney")) || 0;
let depth = Number(localStorage.getItem("minerDepth")) || 1;
let pickLevel = Number(localStorage.getItem("minerPick")) || 1;

let backpack = JSON.parse(
    localStorage.getItem("minerBag") || "{}"
);

let bagMax = 20 + ((pickLevel - 1) * 5);

const ores = {

    dirt: {
        name: "Dirt",
        emoji: "🟫",
        value: 1,
        className: "dirt",
        chance: 50
    },

    stone: {
        name: "Stone",
        emoji: "⬜",
        value: 2,
        className: "stone",
        chance: 30
    },

    coal: {
        name: "Coal",
        emoji: "⬛",
        value: 8,
        className: "coal",
        chance: 12
    },

    iron: {
        name: "Iron",
        emoji: "🟤",
        value: 15,
        className: "iron",
        chance: 5
    },

    gold: {
        name: "Gold",
        emoji: "🟨",
        value: 40,
        className: "gold",
        chance: 2.5
    },

    diamond: {
        name: "Diamond",
        emoji: "💎",
        value: 150,
        className: "diamond",
        chance: 0.5
    }
};


function saveGame() {

    localStorage.setItem("minerMoney", money);
    localStorage.setItem("minerDepth", depth);
    localStorage.setItem("minerPick", pickLevel);
    localStorage.setItem("minerBag", JSON.stringify(backpack));

}


function getBagCount() {

    return Object.values(backpack).reduce(
        (total, amount) => total + amount,
        0
    );

}


function randomOre() {

    let roll = Math.random() * 100;
    let total = 0;

    for (const key in ores) {

        total += ores[key].chance;

        if (roll <= total) {
            return key;
        }

    }

    return "dirt";
}


function generateMine() {

    mine.innerHTML = "";

    for (let i = 0; i < 96; i++) {

        const block = document.createElement("button");

        let type = randomOre();

        /*
            Deeper levels improve rare ore chances.
        */

        if (depth >= 5 && Math.random() < 0.04) {
            type = "gold";
        }

        if (depth >= 10 && Math.random() < 0.025) {
            type = "diamond";
        }

        const ore = ores[type];

        block.className = "block " + ore.className;
        block.dataset.type = type;
        block.textContent = ore.emoji;

        block.onclick = () => mineBlock(block);

        mine.appendChild(block);
    }

}


function mineBlock(block) {

    if (getBagCount() >= bagMax) {

        showMessage("🎒 Backpack full! Sell your ores first.");

        return;
    }

    const type = block.dataset.type;
    const ore = ores[type];

    /*
        Higher pickaxe levels allow faster access
        to better ores.
    */

    if (
        type === "diamond" &&
        pickLevel < 3
    ) {

        showMessage("💎 You need Pickaxe Level 3!");

        return;
    }

    if (
        type === "gold" &&
        pickLevel < 2
    ) {

        showMessage("🟨 You need Pickaxe Level 2!");

        return;
    }

    backpack[type] = (backpack[type] || 0) + 1;

    /*
        Make the mined block disappear,
        then replace it with another block.
    */

    block.style.transform = "scale(0)";
    block.style.opacity = "0";

    setTimeout(() => {

        const newType = randomOre();
        const newOre = ores[newType];

        block.dataset.type = newType;
        block.className = "block " + newOre.className;
        block.textContent = newOre.emoji;

        block.style.transform = "";
        block.style.opacity = "";

    }, 100);

    showMessage(
        `⛏️ You mined ${ore.emoji} ${ore.name}!`
    );

    updateUI();
    saveGame();

}


function sellAll() {

    let total = 0;
    let amount = getBagCount();

    if (amount === 0) {

        showMessage("🎒 Your backpack is empty!");

        return;
    }

    for (const type in backpack) {

        total +=
            backpack[type] *
            ores[type].value;

    }

    backpack = {};
    money += total;

    showMessage(
        `💰 Sold ${amount} ores for $${total}!`
    );

    updateUI();
    saveGame();

}


function upgradePickaxe() {

    const cost = 50 * pickLevel;

    if (money < cost) {

        showMessage(
            `💸 You need $${cost} to upgrade!`
        );

        return;
    }

    money -= cost;

    pickLevel++;

    bagMax = 20 + ((pickLevel - 1) * 5);

    showMessage(
        `🔨 Pickaxe upgraded to Level ${pickLevel}!`
    );

    updateUI();
    saveGame();

}


function showMessage(text) {

    message.textContent = text;

}


function updateUI() {

    moneyDisplay.textContent =
        money.toLocaleString();

    bagCountDisplay.textContent =
        getBagCount();

    bagMaxDisplay.textContent =
        bagMax;

    depthDisplay.textContent =
        depth;

    pickLevelDisplay.textContent =
        pickLevel;

    powerDisplay.textContent =
        pickLevel;

    const percentage =
        Math.min(
            100,
            (getBagCount() / bagMax) * 100
        );

    bagBar.style.width =
        percentage + "%";

    const cost = 50 * pickLevel;

    upgradeButton.textContent =
        `Upgrade — $${cost}`;

}


generateMine();
updateUI();
saveGame();

</script>

</body>
</html>
