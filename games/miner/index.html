```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miner | CoolioBeans</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #26354d 0%, #111827 45%, #080b12 100%);
    color: white;
    min-height: 100vh;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 35px;
    background: rgba(8, 11, 18, 0.9);
    border-bottom: 1px solid #293246;
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.back {
    color: #cbd5e1;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    color: white;
}

.game {
    width: min(1200px, 94%);
    margin: 30px auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.title {
    font-size: 38px;
    font-weight: 900;
}

.money {
    background: #172033;
    border: 1px solid #34415a;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
}

.mine-container {
    background: #0d1320;
    border: 1px solid #2b374d;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.mine-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    color: #aebbd0;
    font-weight: bold;
}

#mine {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 4px;
    width: 100%;
}

.block {
    position: relative;
    border: 0;
    padding: 0;
    aspect-ratio: 1 / 1;
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    background: #222;
    transition:
        transform .08s,
        filter .1s,
        opacity .1s;
}

.block:hover {
    filter: brightness(1.25);
    transform: scale(1.04);
    z-index: 2;
}

.block:active {
    transform: scale(.9);
}

.block img {
    width: 100%;
    height: 100%;
    display: block;

    /*
        Keeps your pixel art sharp.
    */
    image-rendering: pixelated;

    object-fit: cover;
    pointer-events: none;
}

.side {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.panel {
    background: #111a2a;
    border: 1px solid #2b374d;
    border-radius: 15px;
    padding: 18px;
}

.panel h2 {
    font-size: 19px;
    margin-bottom: 15px;
}

.stat {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    color: #b9c5d8;
}

.stat strong {
    color: white;
}

.bar {
    width: 100%;
    height: 13px;
    background: #202a3b;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 8px;
}

#bagBar {
    height: 100%;
    width: 0%;
    background: #4ade80;
    transition: width .2s;
}

button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    margin-top: 9px;
    background: #26344b;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #344663;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.sell {
    background: #198754;
}

.sell:hover {
    background: #21a366;
}

.upgrade {
    background: #6954d8;
}

.upgrade:hover {
    background: #7964ed;
}

.message {
    min-height: 24px;
    margin-top: 15px;
    text-align: center;
    color: #aebbd0;
    font-weight: bold;
}

.ores {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.ore-item {
    background: #182235;
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    color: #cbd5e1;

    display: flex;
    align-items: center;
    gap: 7px;
}

.ore-item img {
    width: 25px;
    height: 25px;
    image-rendering: pixelated;
}

@media (max-width: 850px) {

    .layout {
        grid-template-columns: 1fr;
    }

    #mine {
        grid-template-columns: repeat(10, 1fr);
    }

}

@media (max-width: 550px) {

    header {
        padding: 0 15px;
    }

    .game {
        width: 96%;
    }

    .title {
        font-size: 30px;
    }

    #mine {
        grid-template-columns: repeat(8, 1fr);
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        ⛏️ CoolioBeans
    </div>

    <a class="back" href="../../">
        ← Back to Games
    </a>

</header>


<main class="game">

    <div class="topbar">

        <div class="title">
            MINER
        </div>

        <div class="money">
            $<span id="money">0</span>
        </div>

    </div>


    <div class="layout">


        <!-- MINING AREA -->

        <section class="mine-container">

            <div class="mine-header">

                <span>
                    Underground Mine
                </span>

                <span>
                    Depth:
                    <span id="depth">1</span>
                </span>

            </div>


            <div id="mine"></div>


            <div class="message" id="message">
                Click a block to start mining!
            </div>

        </section>


        <!-- SIDE PANEL -->

        <aside class="side">


            <!-- BACKPACK -->

            <div class="panel">

                <h2>
                    Backpack
                </h2>

                <div class="stat">

                    <span>
                        Capacity
                    </span>

                    <strong>
                        <span id="bagCount">0</span>
                        /
                        <span id="bagMax">20</span>
                    </strong>

                </div>


                <div class="bar">

                    <div id="bagBar"></div>

                </div>


                <button
                    class="sell"
                    onclick="sellAll()"
                >
                    Sell Everything
                </button>

            </div>


            <!-- PICKAXE -->

            <div class="panel">

                <h2>
                    Pickaxe
                </h2>

                <div class="stat">

                    <span>
                        Level
                    </span>

                    <strong id="pickLevel">
                        1
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        Mining Power
                    </span>

                    <strong id="power">
                        1
                    </strong>

                </div>


                <button
                    class="upgrade"
                    id="upgradeButton"
                    onclick="upgradePickaxe()"
                >
                    Upgrade — $50
                </button>

            </div>


            <!-- ORES -->

            <div class="panel">

                <h2>
                    Ore Values
                </h2>


                <div class="ores">

                    <div class="ore-item">

                        <img src="assets/blocks/dirt.png">

                        Dirt — $1

                    </div>


                    <div class="ore-item">

                        <img src="assets/blocks/stone.png">

                        Stone — $2

                    </div>


                    <div class="ore-item">

                        <img src="assets/blocks/coal.png">

                        Coal — $8

                    </div>


                    <div class="ore-item">

                        <img src="assets/blocks/iron.png">

                        Iron — $15

                    </div>


                    <div class="ore-item">

                        <img src="assets/blocks/gold.png">

                        Gold — $40

                    </div>


                    <div class="ore-item">

                        <img src="assets/blocks/diamond.png">

                        Diamond — $150

                    </div>

                </div>

            </div>


        </aside>

    </div>

</main>


<script>


const mine =
    document.getElementById("mine");

const moneyDisplay =
    document.getElementById("money");

const bagCountDisplay =
    document.getElementById("bagCount");

const bagMaxDisplay =
    document.getElementById("bagMax");

const bagBar =
    document.getElementById("bagBar");

const depthDisplay =
    document.getElementById("depth");

const pickLevelDisplay =
    document.getElementById("pickLevel");

const powerDisplay =
    document.getElementById("power");

const upgradeButton =
    document.getElementById("upgradeButton");

const message =
    document.getElementById("message");


let money =
    Number(localStorage.getItem("minerMoney")) || 0;

let depth =
    Number(localStorage.getItem("minerDepth")) || 1;

let pickLevel =
    Number(localStorage.getItem("minerPick")) || 1;

let backpack =
    JSON.parse(
        localStorage.getItem("minerBag") || "{}"
    );


let bagMax =
    20 + ((pickLevel - 1) * 5);


/*
    All of the textures are loaded from
    your assets/blocks folder.
*/

const ores = {

    dirt: {
        name: "Dirt",
        value: 1,
        image: "assets/blocks/dirt.png",
        chance: 50
    },

    stone: {
        name: "Stone",
        value: 2,
        image: "assets/blocks/stone.png",
        chance: 30
    },

    coal: {
        name: "Coal",
        value: 8,
        image: "assets/blocks/coal.png",
        chance: 12
    },

    iron: {
        name: "Iron",
        value: 15,
        image: "assets/blocks/iron.png",
        chance: 5
    },

    gold: {
        name: "Gold",
        value: 40,
        image: "assets/blocks/gold.png",
        chance: 2.5
    },

    diamond: {
        name: "Diamond",
        value: 150,
        image: "assets/blocks/diamond.png",
        chance: 0.5
    }

};


/*
    Save everything.
*/

function saveGame() {

    localStorage.setItem(
        "minerMoney",
        money
    );

    localStorage.setItem(
        "minerDepth",
        depth
    );

    localStorage.setItem(
        "minerPick",
        pickLevel
    );

    localStorage.setItem(
        "minerBag",
        JSON.stringify(backpack)
    );

}


/*
    Count everything in the backpack.
*/

function getBagCount() {

    return Object.values(backpack).reduce(
        (total, amount) => total + amount,
        0
    );

}


/*
    Choose a random ore.
*/

function randomOre() {

    let roll =
        Math.random() * 100;

    let total = 0;


    for (const key in ores) {

        total += ores[key].chance;

        if (roll <= total) {

            return key;

        }

    }


    return "dirt";

}


/*
    Create the mine.
*/

function generateMine() {

    mine.innerHTML = "";


    for (let i = 0; i < 96; i++) {

        const block =
            document.createElement("button");


        block.className =
            "block";


        const type =
            randomOre();


        block.dataset.type =
            type;


        const image =
            document.createElement("img");


        image.src =
            ores[type].image;


        image.alt =
            ores[type].name;


        block.appendChild(image);


        block.onclick = () => {

            mineBlock(block);

        };


        mine.appendChild(block);

    }

}


/*
    Mine a block.
*/

function mineBlock(block) {

    if (getBagCount() >= bagMax) {

        showMessage(
            "Backpack full! Sell your ores first."
        );

        return;

    }


    const type =
        block.dataset.type;


    const ore =
        ores[type];


    /*
        Gold requires Pickaxe Level 2.
    */

    if (
        type === "gold" &&
        pickLevel < 2
    ) {

        showMessage(
            "You need Pickaxe Level 2!"
        );

        return;

    }


    /*
        Diamond requires Pickaxe Level 3.
    */

    if (
        type === "diamond" &&
        pickLevel < 3
    ) {

        showMessage(
            "You need Pickaxe Level 3!"
        );

        return;

    }


    backpack[type] =
        (backpack[type] || 0) + 1;


    /*
        Mine animation.
    */

    block.style.transform =
        "scale(0)";

    block.style.opacity =
        "0";


    setTimeout(() => {

        const newType =
            randomOre();


        block.dataset.type =
            newType;


        block.innerHTML = "";


        const newImage =
            document.createElement("img");


        newImage.src =
            ores[newType].image;


        newImage.alt =
            ores[newType].name;


        block.appendChild(newImage);


        block.style.transform =
            "";

        block.style.opacity =
            "";

    }, 100);


    showMessage(
        `You mined ${ore.name}!`
    );


    updateUI();

    saveGame();

}


/*
    Sell everything.
*/

function sellAll() {

    const amount =
        getBagCount();


    if (amount === 0) {

        showMessage(
            "Your backpack is empty!"
        );

        return;

    }


    let total = 0;


    for (const type in backpack) {

        total +=
            backpack[type] *
            ores[type].value;

    }


    backpack = {};

    money += total;


    showMessage(
        `Sold ${amount} ores for $${total}!`
    );


    updateUI();

    saveGame();

}


/*
    Upgrade pickaxe.
*/

function upgradePickaxe() {

    const cost =
        50 * pickLevel;


    if (money < cost) {

        showMessage(
            `You need $${cost} to upgrade!`
        );

        return;

    }


    money -= cost;

    pickLevel++;


    bagMax =
        20 + ((pickLevel - 1) * 5);


    showMessage(
        `Pickaxe upgraded to Level ${pickLevel}!`
    );


    updateUI();

    saveGame();

}


/*
    Display messages.
*/

function showMessage(text) {

    message.textContent =
        text;

}


/*
    Update the GUI.
*/

function updateUI() {

    moneyDisplay.textContent =
        money.toLocaleString();


    bagCountDisplay.textContent =
        getBagCount();


    bagMaxDisplay.textContent =
        bagMax;


    depthDisplay.textContent =
        depth;


    pickLevelDisplay.textContent =
        pickLevel;


    powerDisplay.textContent =
        pickLevel;


    const percentage =
        Math.min(
            100,
            (getBagCount() / bagMax) * 100
        );


    bagBar.style.width =
        percentage + "%";


    const cost =
        50 * pickLevel;


    upgradeButton.textContent =
        `Upgrade — $${cost}`;

}


/*
    Start the game.
*/

generateMine();

updateUI();

saveGame();

</script>

</body>
</html>
