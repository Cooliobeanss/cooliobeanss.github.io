<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAYTIME</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    background:#08090c;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

#gameWrap{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#171a20 0%,#08090c 70%);
}

canvas{
    width:min(1400px,100vw);
    height:auto;
    max-height:100vh;
    image-rendering:auto;
    background:#111;
    box-shadow:0 0 60px rgba(0,0,0,.8);
}

.screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

.panel{
    pointer-events:auto;
    width:min(620px,90vw);
    padding:42px;
    background:
        linear-gradient(145deg,rgba(25,28,34,.97),rgba(9,10,13,.97));
    border:1px solid #3c424d;
    box-shadow:
        0 25px 80px rgba(0,0,0,.75),
        inset 0 1px rgba(255,255,255,.04);
    border-radius:8px;
}

.logo{
    font-size:70px;
    font-weight:900;
    letter-spacing:8px;
    text-align:center;
    margin-bottom:4px;
}

.subtitle{
    text-align:center;
    color:#8e96a3;
    letter-spacing:4px;
    margin-bottom:35px;
    font-size:13px;
}

.menuButton{
    width:100%;
    padding:17px;
    margin:8px 0;
    border:1px solid #454c58;
    background:#171a20;
    color:white;
    font-size:17px;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    border-radius:4px;
    transition:.15s;
}

.menuButton:hover{
    background:#272c35;
    border-color:#858e9d;
    transform:translateX(3px);
}

.menuButton.primary{
    background:#d7d9dc;
    color:#111;
    border-color:#fff;
}

.menuButton.primary:hover{
    background:#fff;
}

.hidden{
    display:none!important;
}

.loadoutTitle{
    text-align:center;
    font-size:30px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:30px;
}

.weaponBox{
    padding:25px;
    border:1px solid #3e444e;
    background:#11141a;
    margin-bottom:22px;
}

.weaponName{
    font-size:24px;
    font-weight:900;
    margin-bottom:18px;
}

.weaponPreview{
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
    background:#0b0d11;
    border:1px solid #282d35;
    margin-bottom:20px;
}

.attachment{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-top:1px solid #292e36;
}

.toggle{
    display:flex;
    gap:5px;
}

.toggle button{
    padding:8px 17px;
    border:1px solid #4b525d;
    background:#181b21;
    color:#aaa;
    cursor:pointer;
}

.toggle button.active{
    background:#ddd;
    color:#111;
}

.stat{
    display:grid;
    grid-template-columns:110px 1fr;
    align-items:center;
    margin:8px 0;
    font-size:12px;
    color:#9da5b1;
}

.bar{
    height:7px;
    background:#252a31;
    overflow:hidden;
}

.bar i{
    display:block;
    height:100%;
    background:#d7d9dc;
}

#notice{
    position:absolute;
    left:50%;
    top:30px;
    transform:translateX(-50%);
    padding:12px 22px;
    background:rgba(5,6,8,.9);
    border:1px solid #555d68;
    font-weight:bold;
    letter-spacing:1px;
    opacity:0;
    transition:.2s;
    pointer-events:none;
}

#controls{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#7e8794;
    font-size:11px;
    letter-spacing:1px;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="gameWrap">
<canvas id="game" width="1400" height="800"></canvas>
</div>

<div id="notice"></div>

<div id="mainMenu" class="screen">
<div class="panel">
    <div class="logo">PAYTIME</div>
    <div class="subtitle">NO PLAN SURVIVES CONTACT</div>

    <button class="menuButton primary" id="playBtn">PLAY</button>
    <button class="menuButton" id="loadoutBtn">LOADOUT</button>
    <button class="menuButton" id="settingsBtn">SETTINGS</button>
    <button class="menuButton" id="exitBtn">EXIT</button>
</div>
</div>

<div id="loadoutMenu" class="screen hidden">
<div class="panel">
    <div class="loadoutTitle">LOADOUT</div>

    <div class="weaponBox">
        <div class="weaponName">ASSAULT RIFLE</div>

        <div class="weaponPreview">🔫</div>

        <div class="attachment">
            <span>SUPPRESSOR</span>

            <div class="toggle">
                <button id="supOff" class="active">OFF</button>
                <button id="supOn">ON</button>
            </div>
        </div>

        <div class="stat">
            <span>DAMAGE</span>
            <div class="bar"><i style="width:78%"></i></div>
        </div>

        <div class="stat">
            <span>ACCURACY</span>
            <div class="bar"><i style="width:65%"></i></div>
        </div>

        <div class="stat">
            <span>RECOIL</span>
            <div class="bar"><i style="width:52%"></i></div>
        </div>

        <div class="stat">
            <span>FIRE RATE</span>
            <div class="bar"><i style="width:82%"></i></div>
        </div>
    </div>

    <button class="menuButton primary" id="loadoutPlay">PLAY</button>
    <button class="menuButton" id="loadoutBack">BACK</button>
</div>
</div>

<div id="settingsMenu" class="screen hidden">
<div class="panel">
    <div class="loadoutTitle">SETTINGS</div>

    <div style="color:#999;text-align:center;margin-bottom:25px">
        PAYTIME SETTINGS
    </div>

    <button class="menuButton" id="settingsBack">BACK</button>
</div>
</div>

<div id="controls">
WASD MOVE · SHIFT SPRINT · LMB SHOOT · R RELOAD · E INTERACT · M MASK
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let gameStarted = false;
let paused = false;

let suppressor = false;
let mask = false;
let maskAnimation = 0;

let keys = {};
let mouse = {
    x:700,
    y:400,
    down:false
};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.key.toLowerCase()==="m"){
        toggleMask();
    }

    if(e.key.toLowerCase()==="r"){
        reload();
    }

    if(e.key.toLowerCase()==="e"){
        interact();
    }

    if(e.key==="Escape"){
        togglePause();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove",e=>{
    const r=canvas.getBoundingClientRect();

    mouse.x=(e.clientX-r.left)*(W/r.width);
    mouse.y=(e.clientY-r.top)*(H/r.height);
});

canvas.addEventListener("mousedown",()=>{
    mouse.down=true;
});

canvas.addEventListener("mouseup",()=>{
    mouse.down=false;
});

function showMenu(id){
    document.querySelectorAll(".screen").forEach(x=>x.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
}

document.getElementById("playBtn").onclick=()=>{
    startGame();
};

document.getElementById("loadoutBtn").onclick=()=>{
    showMenu("loadoutMenu");
};

document.getElementById("settingsBtn").onclick=()=>{
    showMenu("settingsMenu");
};

document.getElementById("loadoutBack").onclick=()=>{
    showMenu("mainMenu");
};

document.getElementById("settingsBack").onclick=()=>{
    showMenu("mainMenu");
};

document.getElementById("loadoutPlay").onclick=()=>{
    startGame();
};

document.getElementById("supOff").onclick=()=>{
    suppressor=false;
    document.getElementById("supOff").classList.add("active");
    document.getElementById("supOn").classList.remove("active");
};

document.getElementById("supOn").onclick=()=>{
    suppressor=true;
    document.getElementById("supOn").classList.add("active");
    document.getElementById("supOff").classList.remove("active");
};

document.getElementById("exitBtn").onclick=()=>{
    window.location.href="../../";
};

function notify(text){
    const n=document.getElementById("notice");

    n.textContent=text;
    n.style.opacity=1;

    clearTimeout(notify.timer);

    notify.timer=setTimeout(()=>{
        n.style.opacity=0;
    },2400);
}

/* =========================
   WORLD
========================= */

const walls=[];

function wall(x,y,w,h){
    walls.push({x,y,w,h});
}

/* OUTER BANK */

wall(80,80,1240,20);
wall(80,700,1240,20);
wall(80,80,20,640);
wall(1300,80,20,640);

/* BANK / PARK BORDER */

wall(80,80,1240,20);

/* lobby divider */

wall(510,80,20,170);
wall(510,330,20,370);

/* office divider */

wall(780,80,20,120);
wall(780,280,20,210);
wall(780,570,20,130);

/* security divider */

wall(1000,80,20,170);
wall(1000,370,20,330);

/* vault room */

wall(1080,250,210,20);
wall(1080,530,210,20);
wall(1280,250,20,280);

/* interior vault */

wall(1120,300,160,20);
wall(1120,480,160,20);
wall(1280,300,20,180);
wall(1120,300,20,65);
wall(1120,415,20,65);

/* office partitions */

wall(530,250,230,20);
wall(530,500,230,20);

/* security room */

wall(800,250,200,20);
wall(800,500,200,20);

/* =========================
   DOORS
========================= */

const doors=[];

function addDoor(x,y,w,h,name,locked=true,keycard=false){
    doors.push({
        x,y,w,h,
        name,
        locked,
        open:false,
        keycard,
        progress:0
    });
}

addDoor(510,250,20,80,"Employee Door",true,false);
addDoor(780,200,20,80,"Security Door",true,true);
addDoor(1000,250,20,120,"Vault Corridor Door",true,true);
addDoor(1120,365,20,50,"Vault Door",true,true);

function rectContains(r,x,y){
    return x>=r.x &&
           x<=r.x+r.w &&
           y>=r.y &&
           y<=r.y+r.h;
}

function circleRectCollision(cx,cy,cr,r){
    const nx=Math.max(r.x,Math.min(cx,r.x+r.w));
    const ny=Math.max(r.y,Math.min(cy,r.y+r.h));

    const dx=cx-nx;
    const dy=cy-ny;

    return dx*dx+dy*dy<cr*cr;
}

function solidObjects(){
    return [
        ...walls,
        ...doors.filter(d=>!d.open)
    ];
}

function blocked(x,y,r=15){
    for(const o of solidObjects()){
        if(circleRectCollision(x,y,r,o)) return true;
    }

    return false;
}

/* =========================
   ZONES
========================= */

const zones=[
    {
        name:"PUBLIC LOBBY",
        type:"safe",
        x:100,y:100,w:390,h:590
    },

    {
        name:"OFFICE AREA",
        type:"escort",
        x:530,y:100,w:230,h:140
    },

    {
        name:"EMPLOYEE AREA",
        type:"escort",
        x:530,y:270,w:230,h:220
    },

    {
        name:"BACK OFFICE",
        type:"escort",
        x:530,y:520,w:230,h:160
    },

    {
        name:"SECURITY",
        type:"illegal",
        x:800,y:100,w:190,h:140
    },

    {
        name:"SECURITY",
        type:"illegal",
        x:800,y:270,w:190,h:220
    },

    {
        name:"SECURITY",
        type:"illegal",
        x:800,y:520,w:190,h:160
    },

    {
        name:"VAULT",
        type:"illegal",
        x:1020,y:100,w:260,h:580
    },

    {
        name:"PARK",
        type:"safe",
        x:100,y:710,w:1180,h:70
    }
];

function getZone(x,y){
    for(const z of zones){
        if(rectContains(z,x,y)) return z;
    }

    return null;
}

/* =========================
   PLAYER
========================= */

const player={
    x:280,
    y:400,
    radius:15,

    health:100,
    armor:75,

    speed:2.5,
    sprint:4,

    stamina:100,

    angle:0,

    rifleAmmo:30,
    rifleMax:30,
    reserve:150,

    fireCooldown:0,
    reloadTimer:0,

    carrying:null,

    kills:0
};

let hasKeycard=false;
let alarm=false;
let crimeCommitted=false;

let missionStage=0;

const missionText=[
    "GET INTO POSITION",
    "FIND THE KEYCARD",
    "REACH SECURITY",
    "DISABLE SECURITY",
    "REACH THE VAULT",
    "DRILL THE VAULT",
    "GRAB THE LOOT",
    "ESCAPE TO THE PARK",
    "REACH THE GETAWAY VAN"
];

function startGame(){

    document.querySelectorAll(".screen")
        .forEach(x=>x.classList.add("hidden"));

    gameStarted=true;
    paused=false;

    resetGame();

    notify("GET INTO POSITION · YOU ARE UNMASKED");
}

function resetGame(){

    player.x=280;
    player.y=400;

    player.health=100;
    player.armor=75;
    player.stamina=100;

    player.rifleAmmo=30;
    player.reserve=150;

    player.carrying=null;
    player.kills=0;

    hasKeycard=false;
    alarm=false;
    crimeCommitted=false;

    mask=false;
    maskAnimation=0;

    missionStage=0;

    guards.length=0;
    cameras.forEach(c=>c.disabled=false);

    doors.forEach(d=>{
        d.open=false;
        d.progress=0;
    });

    spawnGuards();
    spawnLoot();
}

/* =========================
   GUARDS
========================= */

const guards=[];

function spawnGuards(){

    const positions=[
        [620,160],
        [680,380],
        [680,620],
        [875,170],
        [920,430],
        [1080,180],
        [1180,600]
    ];

    positions.forEach((p,i)=>{
        guards.push({
            x:p[0],
            y:p[1],

            radius:14,

            health:70,

            angle:Math.random()*Math.PI*2,

            state:"patrol",

            patrolX:p[0],
            patrolY:p[1],

            vision:420,
            fov:Math.PI*.55,

            cooldown:0,

            escortTimer:0,
            escortTarget:null,

            keycard:i===1
        });
    });
}

function distance(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function lineBlocked(x1,y1,x2,y2){

    const d=Math.hypot(x2-x1,y2-y1);
    const steps=Math.ceil(d/8);

    for(let i=0;i<=steps;i++){

        const t=i/steps;

        const x=x1+(x2-x1)*t;
        const y=y1+(y2-y1)*t;

        for(const o of solidObjects()){

            if(rectContains(o,x,y)){
                return true;
            }
        }
    }

    return false;
}

function canSeePlayer(g){

    const dx=player.x-g.x;
    const dy=player.y-g.y;

    const d=Math.hypot(dx,dy);

    let vision=g.vision;

    if(suppressor && !mask){
        vision*=.75;
    }

    if(d>vision) return false;

    const targetAngle=Math.atan2(dy,dx);

    let diff=Math.atan2(
        Math.sin(targetAngle-g.angle),
        Math.cos(targetAngle-g.angle)
    );

    if(Math.abs(diff)>g.fov/2) return false;

    if(lineBlocked(g.x,g.y,player.x,player.y)){
        return false;
    }

    return true;
}

/* =========================
   MASK
========================= */

function toggleMask(){

    if(!gameStarted || paused) return;

    /* PERMANENT */
    if(mask || maskAnimation>0){
        notify("THE MASK STAYS ON.");
        return;
    }

    maskAnimation=70;

    crimeCommitted=true;

    notify("PUTTING ON MASK...");
}

function updateMask(){

    if(maskAnimation>0){

        maskAnimation--;

        if(maskAnimation===1){

            mask=true;

            notify("MASK ON · YOU ARE NOW A CRIMINAL");

            missionStage=1;
        }
    }
}

/* =========================
   LOCKPICK
========================= */

let lockpick=null;

function nearestDoor(){

    let best=null;
    let bestD=70;

    for(const d of doors){

        if(d.open) continue;

        const cx=d.x+d.w/2;
        const cy=d.y+d.h/2;

        const dd=Math.hypot(player.x-cx,player.y-cy);

        if(dd<bestD){
            best=d;
            bestD=dd;
        }
    }

    return best;
}

function startLockpick(d){

    if(lockpick) return;

    if(d.keycard && !hasKeycard){

        notify("KEYCARD REQUIRED");

        return;
    }

    if(d.keycard && hasKeycard){

        d.open=true;

        notify(d.name+" OPENED");

        return;
    }

    lockpick={
        door:d,
        cursor:0,
        direction:1,
        success:0,
        misses:0
    };

    notify("LOCKPICK · PRESS SPACE IN THE GREEN ZONE");
}

function lockpickHit(){

    if(!lockpick) return;

    const lp=lockpick;

    if(lp.cursor>40 && lp.cursor<60){

        lp.success++;

        lp.cursor=0;

        if(lp.success>=4){

            lp.door.open=true;

            notify(lp.door.name+" UNLOCKED");

            lockpick=null;
        }else{

            notify("PIN "+lp.success+"/4");
        }

    }else{

        lp.misses++;

        alarm=true;

        notify("MISS · SECURITY ALERT");

        if(lp.misses>=3){

            lockpick=null;

            triggerAlarm();
        }
    }
}

document.addEventListener("keydown",e=>{

    if(e.code==="Space" && lockpick){

        e.preventDefault();

        lockpickHit();
    }
});

function updateLockpick(){

    if(!lockpick) return;

    lockpick.cursor+=lockpick.direction*2;

    if(lockpick.cursor>=100){

        lockpick.cursor=100;
        lockpick.direction=-1;
    }

    if(lockpick.cursor<=0){

        lockpick.cursor=0;
        lockpick.direction=1;
    }
}

/* =========================
   INTERACTION
========================= */

function interact(){

    if(!gameStarted || paused) return;

    if(lockpick) return;

    const d=nearestDoor();

    if(d){

        startLockpick(d);

        return;
    }

    /* keycard */

    for(const g of guards){

        if(g.dead) continue;

        if(g.keycard &&
           Math.hypot(player.x-g.x,player.y-g.y)<45){

            hasKeycard=true;
            g.keycard=false;

            missionStage=2;

            notify("KEYCARD ACQUIRED");

            return;
        }
    }

    /* cameras */

    for(const c of cameras){

        if(c.disabled) continue;

        if(Math.hypot(player.x-c.x,player.y-c.y)<55){

            c.disabled=true;

            notify("SECURITY CAMERA DISABLED");

            missionStage=4;

            return;
        }
    }

    /* drill */

    if(missionStage===5){

        const d=Math.hypot(player.x-1150,player.y-390);

        if(d<80){

            drillProgress+=1;

            if(drillProgress>=600){

                missionStage=6;

                notify("VAULT OPEN · GRAB THE LOOT");
            }
        }
    }

    /* loot */

    if(missionStage===6){

        for(const l of loot){

            if(l.collected) continue;

            if(Math.hypot(player.x-l.x,player.y-l.y)<50){

                l.collected=true;

                player.carrying=l;

                missionStage=7;

                notify("LOOT BAG SECURED · ESCAPE");
            }
        }
    }

    /* van */

    if(missionStage===8){

        if(player.x>1120 &&
           player.y>715){

            finishHeist();
        }
    }
}

/* =========================
   CAMERAS
========================= */

const cameras=[
    {x:470,y:170,angle:0,disabled:false},
    {x:740,y:320,angle:Math.PI/2,disabled:false},
    {x:950,y:350,angle:Math.PI,disabled:false},
    {x:1100,y:180,angle:Math.PI/2,disabled:false}
];

function updateCameras(){

    if(!mask) return;

    for(const c of cameras){

        if(c.disabled) continue;

        const dx=player.x-c.x;
        const dy=player.y-c.y;

        const d=Math.hypot(dx,dy);

        if(d>280) continue;

        if(lineBlocked(c.x,c.y,player.x,player.y)){
            continue;
        }

        const a=Math.atan2(dy,dx);

        let diff=Math.atan2(
            Math.sin(a-c.angle),
            Math.cos(a-c.angle)
        );

        if(Math.abs(diff)<.45){

            triggerAlarm();

            notify("CAMERA DETECTED YOU");

            return;
        }
    }
}

/* =========================
   ALARM
========================= */

function triggerAlarm(){

    if(alarm) return;

    alarm=true;

    crimeCommitted=true;

    notify("🚨 ALARM ACTIVATED");

    for(let i=0;i<4;i++){

        guards.push({
            x:1250,
            y:150+i*120,

            radius:15,

            health:100,

            angle:Math.PI,

            state:"combat",

            patrolX:1250,
            patrolY:150+i*120,

            vision:500,
            fov:Math.PI*.7,

            cooldown:0,

            escortTimer:0,

            keycard:false
        });
    }
}

/* =========================
   GUARD ZONE LOGIC
========================= */

function updateGuardBehavior(g){

    if(g.dead) return;

    const d=Math.hypot(
        player.x-g.x,
        player.y-g.y
    );

    const zone=getZone(player.x,player.y);

    /*
       MASKED:
       EVERYWHERE IS ILLEGAL.
    */

    if(mask){

        if(canSeePlayer(g)){

            g.state="combat";
            triggerAlarm();
        }

        return;
    }

    /*
       BEFORE THE MASK:
       SAFE = IGNORE
       ESCORT = ESCORT OUT
       ILLEGAL = HOSTILE
    */

    if(!zone) return;

    if(zone.type==="safe"){

        if(g.state==="escort"){
            g.state="patrol";
        }

        return;
    }

    if(zone.type==="escort"){

        if(canSeePlayer(g)){

            if(g.state!=="escort"){

                g.state="escort";
                g.escortTimer=0;

                notify("GUARD: THIS AREA IS RESTRICTED. PLEASE LEAVE.");
            }
        }

        return;
    }

    if(zone.type==="illegal"){

        if(canSeePlayer(g)){

            g.state="combat";

            crimeCommitted=true;

            triggerAlarm();

            notify("GUARD: GET OUT OF HERE!");

            return;
        }
    }
}

/* =========================
   GUARD UPDATE
========================= */

function updateGuards(){

    for(const g of guards){

        if(g.dead) continue;

        g.cooldown=Math.max(0,g.cooldown-1);

        updateGuardBehavior(g);

        if(g.state==="combat"){

            g.angle=Math.atan2(
                player.y-g.y,
                player.x-g.x
            );

            const d=distance(g,player);

            if(d>190){

                const vx=Math.cos(g.angle)*1.2;
                const vy=Math.sin(g.angle)*1.2;

                const nx=g.x+vx;
                const ny=g.y+vy;

                if(!blocked(nx,ny,g.radius)){

                    g.x=nx;
                    g.y=ny;
                }
            }

            if(d<330 && g.cooldown<=0 && canSeePlayer(g)){

                enemyShoot(g);

                g.cooldown=55;
            }

        }else if(g.state==="escort"){

            const safe=findNearestSafeZone();

            if(safe){

                const tx=safe.x+safe.w/2;
                const ty=safe.y+safe.h/2;

                g.angle=Math.atan2(
                    player.y-g.y,
                    player.x-g.x
                );

                /*
                  Guard stays behind the player
                  while pushing them toward safety.
                */

                const px=player.x-Math.cos(g.angle)*55;
                const py=player.y-Math.sin(g.angle)*55;

                const vx=Math.cos(
                    Math.atan2(ty-g.y,tx-g.x)
                )*.8;

                const vy=Math.sin(
                    Math.atan2(ty-g.y,tx-g.x)
                )*.8;

                if(!blocked(g.x+vx,g.y+vy,g.radius)){

                    g.x+=vx;
                    g.y+=vy;
                }

                if(zoneAtSafe(player.x,player.y)){

                    g.state="patrol";

                    notify("GUARD: THANK YOU. HAVE A NICE DAY.");
                }
            }

        }else{

            /*
               Simple patrol movement.
            */

            const dx=g.patrolX-g.x;
            const dy=g.patrolY-g.y;

            if(Math.hypot(dx,dy)<15){

                g.patrolX+=
                    (Math.random()-.5)*140;

                g.patrolY+=
                    (Math.random()-.5)*140;

                g.patrolX=Math.max(130,Math.min(1260,g.patrolX));
                g.patrolY=Math.max(110,Math.min(680,g.patrolY));
            }

            const a=Math.atan2(dy,dx);

            g.angle=a;

            const vx=Math.cos(a)*.45;
            const vy=Math.sin(a)*.45;

            if(!blocked(g.x+vx,g.y+vy,g.radius)){

                g.x+=vx;
                g.y+=vy;
            }
        }
    }
}

function findNearestSafeZone(){

    let best=null;
    let bestD=Infinity;

    for(const z of zones){

        if(z.type!=="safe") continue;

        const x=z.x+z.w/2;
        const y=z.y+z.h/2;

        const d=Math.hypot(player.x-x,player.y-y);

        if(d<bestD){

            bestD=d;
            best=z;
        }
    }

    return best;
}

function zoneAtSafe(x,y){

    const z=getZone(x,y);

    return z && z.type==="safe";
}

/* =========================
   ENEMY SHOOTING
========================= */

function enemyShoot(g){

    const angle=Math.atan2(
        player.y-g.y,
        player.x-g.x
    );

    const hit=Math.random()<.58;

    particles.push({
        type:"shot",
        x:g.x,
        y:g.y,
        tx:player.x,
        ty:player.y,
        life:7
    });

    if(hit){

        let damage=10;

        if(player.armor>0){

            const absorbed=Math.min(
                player.armor,
                damage*.6
            );

            player.armor-=absorbed;

            damage-=absorbed;
        }

        player.health-=damage;

        if(player.health<=0){

            player.health=0;

            endGame(false);
        }
    }
}

/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer(){

    let dx=0;
    let dy=0;

    if(keys.w) dy--;
    if(keys.s) dy++;
    if(keys.a) dx--;
    if(keys.d) dx++;

    const len=Math.hypot(dx,dy);

    if(len){

        dx/=len;
        dy/=len;
    }

    const sprinting=
        keys.shift &&
        len>0 &&
        player.stamina>0;

    const speed=sprinting ?
        player.sprint :
        player.speed;

    if(sprinting){

        player.stamina-=.65;
    }else{

        player.stamina=Math.min(
            100,
            player.stamina+.35
        );
    }

    let nx=player.x+dx*speed;
    let ny=player.y+dy*speed;

    if(!blocked(nx,player.y,player.radius)){
        player.x=nx;
    }

    if(!blocked(player.x,ny,player.radius)){
        player.y=ny;
    }

    player.x=Math.max(105,Math.min(1290,player.x));
    player.y=Math.max(95,Math.min(775,player.y));

    player.angle=Math.atan2(
        mouse.y-player.y,
        mouse.x-player.x
    );
}

/* =========================
   WEAPON
========================= */

const bullets=[];

function shoot(){

    if(player.reloadTimer>0) return;

    if(player.rifleAmmo<=0){

        reload();

        return;
    }

    if(player.fireCooldown>0) return;

    player.rifleAmmo--;

    player.fireCooldown=suppressor ? 7 : 5;

    const spread=suppressor ? .04 : .075;

    const a=
        player.angle+
        (Math.random()-.5)*spread;

    bullets.push({
        x:player.x,
        y:player.y,
        vx:Math.cos(a)*12,
        vy:Math.sin(a)*12,
        life:45
    });

    particles.push({
        type:"muzzle",
        x:player.x+Math.cos(a)*20,
        y:player.y+Math.sin(a)*20,
        life:5
    });

    /*
       Unsuppressed shooting is much louder.
    */

    if(!suppressor){

        for(const g of guards){

            if(g.dead) continue;

            const d=Math.hypot(
                g.x-player.x,
                g.y-player.y
            );

            if(d<500){

                g.state="combat";
                crimeCommitted=true;
                triggerAlarm();
            }
        }
    }
}

function reload(){

    if(player.reloadTimer>0) return;

    if(player.rifleAmmo>=player.rifleMax) return;

    if(player.reserve<=0) return;

    player.reloadTimer=75;
}

function updateWeapon(){

    player.fireCooldown=
        Math.max(0,player.fireCooldown-1);

    if(player.reloadTimer>0){

        player.reloadTimer--;

        if(player.reloadTimer===0){

            const needed=
                player.rifleMax-player.rifleAmmo;

            const take=
                Math.min(needed,player.reserve);

            player.rifleAmmo+=take;
            player.reserve-=take;
        }
    }

    if(mouse.down){

        shoot();
    }
}

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.x+=b.vx;
        b.y+=b.vy;
        b.life--;

        let remove=false;

        if(b.x<0||b.x>W||b.y<0||b.y>H){
            remove=true;
        }

        for(const o of solidObjects()){

            if(rectContains(o,b.x,b.y)){

                particles.push({
                    type:"impact",
                    x:b.x,
                    y:b.y,
                    life:15
                });

                remove=true;
                break;
            }
        }

        if(!remove){

            for(const g of guards){

                if(g.dead) continue;

                if(Math.hypot(
                    b.x-g.x,
                    b.y-g.y
                )<g.radius){

                    g.health-=35;

                    particles.push({
                        type:"blood",
                        x:g.x,
                        y:g.y,
                        life:20
                    });

                    remove=true;

                    if(g.health<=0){

                        g.dead=true;

                        player.kills++;

                        if(g.keycard){

                            g.keycard=true;
                        }
                    }

                    break;
                }
            }
        }

        if(remove || b.life<=0){

            bullets.splice(i,1);
        }
    }
}

/* =========================
   DRILL
========================= */

let drillProgress=0;

/* =========================
   MISSION
========================= */

function updateMission(){

    if(missionStage===0){

        if(mask){

            missionStage=1;
        }
    }

    if(missionStage===1){

        if(hasKeycard){

            missionStage=2;
        }
    }

    if(missionStage===2){

        if(player.x>800){

            missionStage=3;

            notify("DISABLE THE SECURITY SYSTEM");
        }
    }

    if(missionStage===3){

        let disabled=0;

        for(const c of cameras){

            if(c.disabled) disabled++;
        }

        if(disabled>=2){

            missionStage=4;

            notify("REACH THE VAULT");
        }
    }

    if(missionStage===4){

        if(player.x>1080){

            missionStage=5;

            notify("DRILL THE VAULT · HOLD E");
        }
    }

    if(missionStage===5){

        if(keys.e){

            if(
                Math.hypot(
                    player.x-1150,
                    player.y-390
                )<100
            ){

                drillProgress++;

                if(drillProgress>=600){

                    missionStage=6;

                    notify("VAULT OPEN · GRAB THE LOOT");
                }
            }
        }
    }

    if(missionStage===6){

        for(const l of loot){

            if(
                !l.collected &&
                Math.hypot(
                    player.x-l.x,
                    player.y-l.y
                )<55
            ){

                l.collected=true;
                player.carrying=l;

                missionStage=7;

                notify("LOOT BAG ACQUIRED · GET TO THE PARK");
            }
        }
    }

    if(missionStage===7){

        if(player.y>700){

            missionStage=8;

            notify("GET TO THE VAN");
        }
    }
}

            W/2-55,
            35
        );
    }

    if(lockpick){

        drawLockpick();
    }

    if(maskAnimation>0){

        ctx.fillStyle="rgba(0,0,0,.75)";
        ctx.fillRect(0,0,W,H);

        ctx.fillStyle="#fff";
        ctx.textAlign="center";

        ctx.font="bold 28px Arial";
        ctx.fillText(
            "PUTTING ON MASK",
            W/2,
            H/2-20
        );

        ctx.fillStyle="#252a31";
        ctx.fillRect(
            W/2-180,
            H/2+15,
            360,
            14
        );

        ctx.fillStyle="#ddd";
        ctx.fillRect(
            W/2-180,
            H/2+15,
            360*(1-maskAnimation/70),
            14
        );

        ctx.textAlign="left";
    }
}

/* =========================
   LOCKPICK UI
========================= */

function drawLockpick(){

    ctx.fillStyle="rgba(0,0,0,.78)";
    ctx.fillRect(
        W/2-250,
        H/2-90,
        500,
        180
    );

    ctx.fillStyle="#fff";
    ctx.textAlign="center";

    ctx.font="bold 20px Arial";

    ctx.fillText(
        "LOCKPICK",
        W/2,
        H/2-45
    );

    ctx.font="12px Arial";

    ctx.fillStyle="#929aa5";

    ctx.fillText(
        "PRESS SPACE WHEN THE PIN IS GREEN",
        W/2,
        H/2-20
    );

    ctx.fillStyle="#22272e";

    ctx.fillRect(
        W/2-190,
        H/2+5,
        380,
        24
    );

    ctx.fillStyle="#4da866";

    ctx.fillRect(
        W/2-190+380*.4,
        H/2+5,
        380*.2,
        24
    );

    ctx.fillStyle="#eee";

    ctx.fillRect(
        W/2-190+380*(lockpick.cursor/100)-3,
        H/2-3,
        6,
        40
    );

    ctx.fillStyle="#fff";

    ctx.fillText(
        "PINS: "+lockpick.success+"/4",
        W/2,
        H/2+60
    );

    ctx.textAlign="left";
}

/* =========================
   PAUSE
========================= */

function togglePause(){

    if(!gameStarted) return;

    paused=!paused;

    if(paused){

        notify("PAUSED");

    }else{

        notify("RESUMED");
    }
}

/* =========================
   RESULT
========================= */

function finishHeist(){

    gameStarted=false;

    setTimeout(()=>{

        alert(
            "HEIST COMPLETE!\n\n"+
            "Cash Secured: $85,000\n"+
            "Kills: "+player.kills
        );

        showMenu("mainMenu");

    },50);
}

function endGame(success){

    gameStarted=false;

    setTimeout(()=>{

        alert(
            success ?
            "HEIST COMPLETE!" :
            "HEIST FAILED"
        );

        showMenu("mainMenu");

    },50);
}

/* =========================
   DRAW
========================= */

function draw(){

    drawBackground();
    drawZones();
    drawCameras();

    for(const l of loot){

        if(l.collected) continue;

        ctx.fillStyle="#c99d52";

        ctx.fillRect(
            l.x-12,
            l.y-10,
            24,
            20
        );

        ctx.fillStyle="#e3c776";
        ctx.fillRect(
            l.x-8,
            l.y-14,
            16,
            5
        );
    }

    drawGuards();
    drawPlayer();
    drawParticles();

    if(gameStarted){

        drawHUD();

        if(paused){

            ctx.fillStyle="rgba(0,0,0,.72)";
            ctx.fillRect(0,0,W,H);

            ctx.fillStyle="#fff";
            ctx.textAlign="center";

            ctx.font="bold 48px Arial";
            ctx.fillText(
                "PAUSED",
                W/2,
                H/2
            );

            ctx.font="13px Arial";
            ctx.fillStyle="#999";

            ctx.fillText(
                "PRESS ESC TO RESUME",
                W/2,
                H/2+35
            );

            ctx.textAlign="left";
        }
    }
}

/* =========================
   MAIN LOOP
========================= */

function update(){

    if(gameStarted && !paused){

        updateMask();
        updateLockpick();

        updatePlayer();
        updateWeapon();
        updateBullets();

        updateGuards();
        updateCameras();

        updateLoot();
        updateMission();

        updateParticles();
    }
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
