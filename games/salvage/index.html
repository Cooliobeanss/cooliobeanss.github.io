<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Space Salvage</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    color:#eaf1ff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#02040a;
}

.hidden{
    display:none!important;
}

/* =========================================================
   TOP HUD
========================================================= */

#hud{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hud-panel{
    min-width:220px;
    padding:13px 16px;
    border:1px solid rgba(130,160,220,.25);
    border-radius:12px;
    background:rgba(5,10,20,.78);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.hud-title{
    color:#8396bd;
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:4px;
}

.hud-value{
    font-size:20px;
    font-weight:bold;
}

.bar{
    width:190px;
    height:7px;
    margin-top:7px;
    overflow:hidden;
    border-radius:10px;
    background:#101827;
}

.bar-fill{
    width:100%;
    height:100%;
    transition:width .15s;
}

#oxygenFill{
    background:#65d9ff;
}

#healthFill{
    background:#ff526b;
}

/* =========================================================
   LOBBY
========================================================= */

#lobby{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,rgba(38,65,125,.2),transparent 40%),
        rgba(1,3,8,.88);
}

.lobby-card{
    width:min(470px,calc(100vw - 35px));
    padding:35px;
    border:1px solid rgba(130,160,220,.25);
    border-radius:22px;
    background:rgba(7,12,23,.91);
    box-shadow:0 30px 100px rgba(0,0,0,.65);
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;
    background:linear-gradient(90deg,#72a9ff,#b48cff,#67e4ff);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin:8px 0 30px;
    color:#7888a8;
    font-size:13px;
}

input{
    width:100%;
    padding:15px;
    margin:6px 0;
    border:1px solid #263550;
    border-radius:10px;
    outline:none;
    background:#090f1d;
    color:white;
    font-size:15px;
}

input:focus{
    border-color:#668cff;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    background:#263a68;
    color:white;
    font-weight:bold;
    font-size:14px;
    transition:.15s;
}

button:hover{
    background:#38558e;
    transform:translateY(-1px);
}

button.primary{
    background:linear-gradient(135deg,#506eea,#7657d9);
}

button.practice{
    background:#172337;
}

button.back{
    background:#0e1625;
}

.status{
    margin-top:18px;
    color:#6e82a7;
    font-size:11px;
}

/* =========================================================
   ROOM
========================================================= */

#roomLobby{
    position:absolute;
    inset:0;
    z-index:110;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(1,3,8,.9);
}

.room-code{
    margin:12px 0 25px;
    font-size:42px;
    letter-spacing:10px;
    font-weight:900;
    color:#78a6ff;
}

.player-list{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:15px;
}

.player{
    padding:11px;
    border:1px solid #1d2b42;
    border-radius:8px;
    background:#0a1220;
    text-align:left;
}

#roomStatus{
    color:#7185aa;
    font-size:12px;
    margin:12px 0;
}

/* =========================================================
   GAME UI
========================================================= */

#gameUI{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#shipLabel{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    padding:8px 14px;
    border:1px solid rgba(100,130,180,.2);
    border-radius:20px;
    background:rgba(5,9,17,.72);
    color:#7889a8;
    font-size:10px;
    letter-spacing:2px;
}

#message{
    position:absolute;
    left:50%;
    top:115px;
    transform:translateX(-50%);
    padding:12px 22px;
    border:1px solid rgba(150,170,220,.2);
    border-radius:10px;
    background:rgba(4,8,15,.88);
    opacity:0;
    transition:.2s;
}

#message.show{
    opacity:1;
}

#interaction{
    position:absolute;
    left:50%;
    bottom:75px;
    transform:translateX(-50%);
    padding:12px 18px;
    border:1px solid rgba(110,150,220,.3);
    border-radius:10px;
    background:rgba(5,9,18,.9);
    color:#b9ccf7;
    opacity:0;
    transition:.15s;
}

#interaction.show{
    opacity:1;
}

/* =========================================================
   INVENTORY
========================================================= */

#inventory{
    position:absolute;
    inset:0;
    z-index:200;
    display:none;
    place-items:center;
    background:rgba(0,0,0,.7);
}

.inventory-box{
    width:min(650px,90vw);
    max-height:80vh;
    overflow:auto;
    padding:25px;
    border:1px solid #293a59;
    border-radius:18px;
    background:#080e1a;
    box-shadow:0 30px 100px #000;
}

.inventory-title{
    margin-bottom:18px;
    font-size:20px;
    font-weight:bold;
}

#inventoryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:10px;
}

.item{
    min-height:110px;
    padding:12px;
    border:1px solid #1e2d45;
    border-radius:10px;
    background:#0c1525;
}

.item-icon{
    font-size:30px;
}

.item-name{
    margin-top:6px;
    color:#9aaac6;
    font-size:11px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- =======================================================
     LOBBY
======================================================== -->

<div id="lobby">

    <div class="lobby-card" id="mainLobby">

        <div class="logo">SPACE SALVAGE</div>

        <div class="subtitle">
            BOARD DEAD SHIPS · STEAL EVERYTHING · GET OUT ALIVE
        </div>

        <input
            id="nameInput"

        <button

    <div

        <div class="subtitle">

        <input

        <button

</div>

<!-- =======================================================
     ROOM LOBBY
======================================================== -->

<div

    class="hidden"
>

    <div class="lobby-card">

        <div class="logo">SALVAGE CREW</div>

        <div class="subtitle">

        <button

    </div>

</div>

<!-- =======================================================
     GAME HUD
======================================================== -->

<div
    id="gameUI"
    class="hidden"
>

    <div id="hud">

        <div class="hud-panel">

            <div class="hud-title">
                SALVAGE VALUE
            </div>

            <div
                class="hud-value"

                $0

        <div class="hud-panel">

            <div

                100%
            </div>

                <div

        <div class="hud-panel">

                HEALTH
            </div>

            <div

                id="health"

                100%
            </div>

            <div class="bar">
                <div
                    class="bar-fill"

                ></div>
            </div>

        </div>

    </div>

    <div id="message"></div>

    <div id="interaction"></div>

    <div id="shipLabel">
        ORPHEUS-7 · DERELICT CLASS FREIGHTER
    </div>

</div>

<!-- =======================================================
     INVENTORY
======================================================== -->

<div id="inventory">

    <div class="inventory-box">

        <div class="inventory-title">
            SALVAGE INVENTORY
        </div>

        <div id="inventoryGrid"></div>

        <button id="closeInventory">
            CLOSE · TAB
        </button>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1,2);

function resize(){

    W = innerWidth;
    H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1,2);

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================================================
   SERVER
========================================================= */

const SERVER =
    "wss://cooliobeans-multiplayer.onrender.com";

let socket = null;
let myId = null;
let room = null;
let isHost = false;
let practiceMode = false;

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;
let gameOver = false;

const players = {};

let me = null;

const camera = {
    x:0,
    y:0,
    shake:0
};

const keys = {};

let dt = 0;
let lastTime = performance.now();

const world = {
    width:7600,
    height:1200
};

/* =========================================================
   INPUT
========================================================= */

addEventListener("keydown",e=>{

    if(
        e.code === "Tab" ||
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "ArrowDown"
    ){
        e.preventDefault();
    }

    keys[e.code] = true;

    if(e.code === "Tab" && gameStarted){
        toggleInventory();
    }

    if(
        e.code === "KeyE" &&
        gameStarted
    ){
        interact();
    }

});

addEventListener("keyup",e=>{
    keys[e.code] = false;
});

/* =========================================================
   PLAYER
========================================================= */

function makePlayer(
    id,
    name,
    x,
    y,
    color
){

    return {

        id,
        name,

        x,
        y,

        vx:0,
        vy:0,

        width:34,
        height:60,

        grounded:false,

        dead:false,

        health:100,
        oxygen:100,

        color,

        holding:null,

        salvage:0,

        facing:1,

        run:false,

        targetX:x,
        targetY:y,

        lastNetwork:0

    };
}

/* =========================================================
   ROOMS / SHIP COLLISION
========================================================= */

/*
    The ship is NOT just floating platforms.

    It is built as a connected interior:
    exterior wall
    floor
    ceiling
    rooms
    bulkheads
    corridors
    cargo bays
    reactor
    extraction airlock
*/

const solids = [];

/* Main hull floor */
solids.push({

/* Main ceiling */
solids.push({
    x:0,

    h:45,

});

/* Exterior walls */
solids.push({
    x:-80,

    w:80,
    h:1080,
    type:"wall"
});

solids.push({
    x:7600,
    y:0,
    w:80,

/* Interior deck platforms */

/* Upper catwalks */

    x:250,

});

solids.push({
    x:1450,

    w:620,
    h:25,
    type:"catwalk"
});

solids.push({
    x:3800,
    y:390,
    w:600,
    h:25,
    type:"catwalk"
});

solids.push({
    x:5200,
    y:430,
    w:620,
    h:25,
    type:"catwalk"
});

/* Cargo raised platforms */

solids.push({
    x:2700,

});

solids.push({
    x:3300,

    h:25,
    type:"cargo"
});

/* Reactor platform */

solids.push({
    x:6150,
    y:510,
    w:650,
    h:25,
    type:"reactor"
});

/* =========================================================
   WALLS / BULKHEADS
========================================================= */

const walls = [

    {x:1120,y:160,w:35,h:740},
    {x:2380,y:160,w:35,h:740},

    {x:4450,y:160,w:35,h:740},
    {x:5850,y:160,w:35,h:740},

    {x:760,y:45,w:28,h:180},
    {x:1750,y:45,w:28,h:180},

    {x:3050,y:45,w:28,h:250},
    {x:5000,y:45,w:28,h:210}

];

/* Door openings */

const doors = [

    {
        x:1120,

    },

    }

/* =========================================================
   PROPS
========================================================= */

const props = [];

function addProp(type,x,y,w,h,extra={}){
    props.push({
        type,
        x,
        y,
        w,
        h,
        ...extra
    });
}

/* Docking bay */

addProp("window",180,150,180,115);
addProp("window",400,150,180,115);

/* Cargo */

for(let i=0;i<8;i++){

    addProp(
        "cargo",
        2550 + (i%4)*160,
        810 - Math.floor(i/4)*95,
        140,
        80
    );

}

for(let i=0;i<5;i++){

    addProp(
        "cargo",
        3350 + i*180,
        810,
        150,
        80
    );

}

/* Engineering */

addProp("machine",3650,760,160,140);
addProp("machine",3880,760,160,140);
addProp("machine",4110,760,160,140);

for(let i=0;i<7;i++){
    addProp(
        "pipe",
        3700+i*130,

        560
    );
}

/* Reactor */

addProp("reactor",6250,290,340,420);
addProp("console",6710,625,120,65);
addProp("console",6880,625,120,65);

addProp("window",6150,120,240,120);
addProp("window",6450,120,240,120);

/* Extraction */

addProp("airlock",7150,650,280,250);

/* =========================================================
   SALVAGE
========================================================= */

const salvageObjects = [];

function addLoot(
    id,
    name,
    icon,
    value,
    x,
    y,
    weight=1
){

    salvageObjects.push({

        id,
        name,

        value,

        x,
        y,

        w:34,
        h:34,

        weight,

        carried:false,

}

/* =========================================================
   ENEMIES
========================================================= */

const enemies = [];

function addEnemy(
    type,
    x,
    y,
    patrolA,
    patrolB
){

    enemies.push({

        type,

        x,
        y,

        w:38,
        h:45,

        vx:0,

        patrolA,
        patrolB,

        dir:1,

addEnemy("crawler",850,845,650,1080);

/* =========================================================

const sections = [

/* =========================================================
   COLLISION
========================================================= */

function rectsOverlap(a,b){

    return (
        a.x < b.x+b.w &&
        a.x+a.width > b.x &&
        a.y < b.y+b.h &&
        a.y+a.height > b.y
    );

}

function getCollisionSolids(){

    const result = solids.slice();

    for(const wall of walls){

        result.push({
            x:wall.x,
            y:wall.y,
            w:wall.w,
            h:wall.h
        });

    }

    for(const door of doors){

        if(!door.open){

            result.push({
                x:door.x,
                y:door.y,
                w:door.w,
                h:door.h
            });

        }

    }

    return result;
}

/* =========================================================
   PLAYER PHYSICS
========================================================= */

const GRAVITY = 1800;
const WALK_SPEED = 260;
const RUN_SPEED = 420;
const ACCEL = 1700;
const AIR_ACCEL = 950;
const FRICTION = 2200;
const JUMP = 650;

function updatePlayer(p){

    if(!p || p.dead)
        return;

    let left =
        keys["KeyA"] ||
        keys["ArrowLeft"];

    let right =
        keys["KeyD"] ||
        keys["ArrowRight"];

    let run =
        keys["ShiftLeft"] ||
        keys["ShiftRight"];

    let dir = 0;

    if(left) dir--;
    if(right) dir++;

    p.run = !!run;

    const maxSpeed =
        run
            ? RUN_SPEED
            : WALK_SPEED;

    if(dir !== 0){

        p.vx +=
            dir *
            (p.grounded
                ? ACCEL
                : AIR_ACCEL) *
            dt;

        p.facing = dir;

    }else{

        const amount =
            FRICTION * dt;

        if(Math.abs(p.vx) <= amount){

            p.vx = 0;

        }else{

            p.vx -=
                Math.sign(p.vx) *
                amount;

        }

    }

    p.vx =
        Math.max(
            -maxSpeed,
            Math.min(maxSpeed,p.vx)
        );

    if(
        (
            keys["Space"] ||
            keys["KeyW"] ||
            keys["ArrowUp"]
        ) &&
        p.grounded
    ){

        p.vy = -JUMP;
        p.grounded = false;

    }

    p.vy += GRAVITY * dt;

    movePlayerHorizontal(p);
    movePlayerVertical(p);

    if(p.y > 1050){

        killPlayer(p);

    }

}

/* =========================================================
   HORIZONTAL COLLISION
========================================================= */

function movePlayerHorizontal(p){

    p.x += p.vx * dt;

    const collisions =
        getCollisionSolids();

    for(const s of collisions){

        const box = {
            x:p.x,
            y:p.y,
            width:p.width,
            height:p.height
        };

        if(!rectsOverlap(box,s))
            continue;

        if(p.vx > 0){

            p.x =
                s.x -
                p.width;

        }else if(p.vx < 0){

            p.x =
                s.x +
                s.w;

        }

        p.vx = 0;

    }

    p.x =
        Math.max(
            0,
            Math.min(
                world.width-p.width,
                p.x
            )
        );

}

/* =========================================================
   VERTICAL COLLISION
========================================================= */

function movePlayerVertical(p){

    p.grounded = false;

    p.y += p.vy * dt;

    const collisions =
        getCollisionSolids();

    for(const s of collisions){

        const box = {
            x:p.x,
            y:p.y,
            width:p.width,
            height:p.height
        };

        if(!rectsOverlap(box,s))
            continue;

        if(p.vy > 0){

            p.y =
                s.y -
                p.height;

            p.vy = 0;
            p.grounded = true;

        }else if(p.vy < 0){

            p.y =
                s.y +
                s.h;

            p.vy = 0;

        }

    }

}

/* =========================================================
   OXYGEN
========================================================= */

function updateOxygen(){

    if(!me || me.dead)
        return;

    /*
       The ship has oxygen in the safe docking/crew areas.
       Deeper sections have damaged atmosphere.
    */

    let dangerous =
        me.x > 2450;

    if(dangerous){

        me.oxygen -=
            dt * 2.1;

    }else{

        me.oxygen +=
            dt * 3.5;

    }

    me.oxygen =
        Math.max(
            0,
            Math.min(
                100,
                me.oxygen
            )
        );

    if(me.oxygen <= 0){

        killPlayer(me);

    }

}

/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(){

    for(const enemy of enemies){

        if(!enemy.alive)
            continue;

        enemy.attackCooldown =
            Math.max(
                0,
                enemy.attackCooldown-dt
            );

        let target = null;

        if(me && !me.dead){

            const dx =
                me.x -
                enemy.x;

            const distance =
                Math.abs(dx);

            if(distance < 430){

                target = me;
                enemy.alert = 1;

            }

        }

        if(target){

            const dx =
                target.x -
                enemy.x;

            enemy.dir =
                Math.sign(dx) || enemy.dir;

            enemy.x +=
                enemy.dir *
                enemy.speed *
                dt;

        }else{

            enemy.x +=
                enemy.dir *
                enemy.speed *
                .45 *
                dt;

            if(
                enemy.x <
                enemy.patrolA
            ){

                enemy.x =
                    enemy.patrolA;

                enemy.dir = 1;

            }

            if(
                enemy.x >
                enemy.patrolB
            ){

                enemy.x =
                    enemy.patrolB;

                enemy.dir = -1;

            }

        }

        if(
            me &&
            !me.dead &&
            rectOverlapEnemy(enemy,me)
        ){

            if(
                enemy.attackCooldown <= 0
            ){

                me.health -=
                    enemy.type === "stalker"
                        ? 30
                        : 18;

                enemy.attackCooldown = 1;

                camera.shake = 8;

                if(me.health <= 0){

                    me.health = 0;
                    killPlayer(me);

                }

            }

        }

    }

}

function rectOverlapEnemy(e,p){

    return (
        e.x < p.x+p.width &&
        e.x+e.w > p.x &&
        e.y < p.y+p.height &&
        e.y+e.h > p.y
    );

}

/* =========================================================
   SALVAGE INTERACTION
========================================================= */

function distanceToLoot(item){

    if(!me)
        return Infinity;

    const ax =
        me.x +
        me.width/2;

    const ay =
        me.y +
        me.height/2;

    const bx =
        item.x +
        item.w/2;

    const by =
        item.y +
        item.h/2;

    return Math.hypot(
        ax-bx,
        ay-by
    );

}

function nearestSalvage(){

    if(!me)
        return null;

    let best = null;
    let bestDistance = 95;

    for(const item of salvageObjects){

        if(item.extracted)
            continue;

        if(item.carried)
            continue;

        const d =
            distanceToLoot(item);

        if(d < bestDistance){

            bestDistance = d;
            best = item;

        }

    }

    return best;

}

function interact(){

    if(!me || me.dead)
        return;

    if(me.holding){

        dropLoot();
        return;

    }

    const item =
        nearestSalvage();

    if(!item)
        return;

    item.carried = true;
    item.holder = me.id;

    me.holding = item;

    showMessage(
        "SALVAGE SECURED · " +
        item.name
    );

}

/* =========================================================
   DROP
========================================================= */

function dropLoot(){

    if(!me || !me.holding)
        return;

    const item =
        me.holding;

    item.carried = false;
    item.holder = null;

    item.x =
        me.x +
        me.width/2 -
        item.w/2 +
        me.facing*45;

    item.y =
        me.y +
        me.height -
        item.h -
        3;

    me.holding = null;

}

/* =========================================================
   EXTRACTION
========================================================= */

const extraction = {
    x:7080,
    y:720,
    w:430,
    h:180
};

function checkExtraction(){

    if(!me || me.dead)
        return;

    if(
        me.x+me.width >
            extraction.x &&
        me.x <
            extraction.x+extraction.w &&
        me.y+me.height >
            extraction.y &&
        me.y <
            extraction.y+extraction.h
    ){

        if(me.holding){

            const item =
                me.holding;

            me.salvage +=
                item.value;

            item.extracted = true;
            item.carried = false;
            item.holder = null;
            item.x = -9999;
            item.y = -9999;

            me.holding = null;

            updateMoney();

            showMessage(
                "SALVAGED · +$" +
                item.value
            );

        }

    }

}

/* =========================================================
   DEATH / RESPAWN
========================================================= */

function killPlayer(p){

    if(!p || p.dead)
        return;

    p.dead = true;

    p.vx = 0;
    p.vy = 0;

    if(p.holding){

        const item =
            p.holding;

        item.carried = false;
        item.holder = null;

        item.x = p.x;
        item.y = p.y;

        p.holding = null;

    }

    camera.shake = 18;

    showMessage(
        "☠ LOST IN THE ORPHEUS-7"
    );

    setTimeout(()=>{

        respawnPlayer(p);

    },1800);

}

function respawnPlayer(p){

    p.dead = false;

    p.health = 100;
    p.oxygen = 100;

    p.x =
        isHost
            ? 250
            : 340;

    p.y = 820;

    p.vx = 0;
    p.vy = 0;

    if(p.id === myId){

        showMessage(
            "BACK ON YOUR FEET"
        );

    }

    send({
        type:"respawn"
    });

}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(!me)
        return;

    const targetX =
        me.x +
        me.width/2 -
        W/2;

    const targetY =
        me.y +
        me.height/2 -
        H/2;

    camera.x +=
        (
            targetX-camera.x
        ) *
        Math.min(
            1,
            dt*7
        );

    camera.y +=
        (
            targetY-camera.y
        ) *
        Math.min(
            1,
            dt*7
        );

    camera.x =
        Math.max(
            0,
            Math.min(
                world.width-W,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                world.height-H,
                camera.y
            )
        );

    if(camera.shake > 0){

        camera.shake *=
            Math.pow(.03,dt);

        if(camera.shake < .2)
            camera.shake = 0;

    }

}

function sx(x){
    return x-camera.x;
}

function sy(y){
    return y-camera.y;
}

/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawSpace(){

    ctx.fillStyle="#02040a";
    ctx.fillRect(0,0,W,H);

    for(let i=0;i<180;i++){

        let x =
            (i*271 -
             camera.x*.12)
            % (W+100);

        if(x<0)
            x += W+100;

        const y =
            (i*137) % H;

        const r =
            1+(i%2);

        ctx.globalAlpha =
            .25+(i%5)*.1;

        ctx.fillStyle="#dce8ff";

        ctx.fillRect(
            x,
            y,
            r,
            r
        );

    }

    ctx.globalAlpha=1;

}

/* =========================================================
   SHIP HULL
========================================================= */

function drawShip(){

    /*
       Outer hull shadow
    */

    ctx.fillStyle="#050a13";

    ctx.fillRect(
        sx(0),
        sy(0),
        world.width,
        1080
    );

    /*
       Main interior wall
    */

    ctx.fillStyle="#0c1420";

    ctx.fillRect(
        sx(0),
        sy(45),
        world.width,
        855
    );

    /*
       wall panels
    */

    for(let x=0;x<world.width;x+=120){

        ctx.fillStyle =
            x%240===0
                ? "#101b2a"
                : "#0e1826";

        ctx.fillRect(
            sx(x),
            sy(45),
            108,
            840
        );

        ctx.strokeStyle="#1d2a3d";
        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            sx(x+108),
            sy(45)
        );

        ctx.lineTo(
            sx(x+108),
            sy(885)
        );

        ctx.stroke();

    }

    /*
       Ceiling
    */

    ctx.fillStyle="#080d16";

    ctx.fillRect(
        sx(0),
        sy(0),
        world.width,
        45
    );

    /*
       Floor foundation
    */

    ctx.fillStyle="#111a27";

    ctx.fillRect(
        sx(0),
        sy(900),
        world.width,
        180
    );

    /*
       floor panels
    */

    for(let x=0;x<world.width;x+=90){

        ctx.strokeStyle =
            "#263244";

        ctx.lineWidth=1;

        ctx.beginPath();

        ctx.moveTo(
            sx(x),
            sy(900)
        );

        ctx.lineTo(
            sx(x),
            sy(1080)
        );

        ctx.stroke();

    }

    /*
       ceiling lights
    */

    for(let x=40;x<world.width;x+=170){

        const broken =
            Math.sin(x*.03)>0.72;

        ctx.fillStyle =
            broken
                ? "#252b32"
                : "#7b9bc7";

        ctx.fillRect(
            sx(x),
            sy(18),
            85,
            8
        );

        if(!broken){

            ctx.globalAlpha=.08;

            ctx.fillStyle="#91baff";

            ctx.fillRect(
                sx(x-15),
                sy(26),
                115,
                90
            );

            ctx.globalAlpha=1;

        }

    }

    /*
       Warning floor stripe
    */

    for(let x=0;x<world.width;x+=80){

        ctx.fillStyle =
            x%160===0
                ? "#b18a32"
                : "#17191c";

        ctx.fillRect(
            sx(x),
            sy(890),
            80,
            8
        );

    }

}

                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle="#80eaff";

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                82,
                performance.now()*.0005,
                performance.now()*.0005+
                Math.PI*1.5
            );

            ctx.stroke();

        }

        else if(p.type==="airlock"){

            ctx.fillStyle="#101a27";

            ctx.fillRect(
                x,
                y,
                p.w,
                p.h
            );

            ctx.strokeStyle="#556b85";

            ctx.lineWidth=4;

            ctx.strokeRect(
                x,
                y,
                p.w,
                p.h
            );

            ctx.fillStyle="#65e4b0";

            ctx.fillRect(
                x+25,
                y+30,
                p.w-50,
                8
            );

            ctx.fillStyle="#65758b";

            ctx.font="bold 15px Arial";

            ctx.fillText(
                "EXTRACTION AIRLOCK",
                x+35,
                y+70
            );

            ctx.fillStyle="#4f6179";

            ctx.font="10px Arial";

            ctx.fillText(
                "RETURN TO YOUR SHIP",
                x+55,
                y+92
            );

        }

    }

}

/* =========================================================
   PLATFORMS
========================================================= */

function drawSolids(){

    for(const s of solids){

        const x=sx(s.x);
        const y=sy(s.y);

        ctx.fillStyle =
            s.type==="floor"
                ? "#202b39"
                : "#29394c";

        ctx.fillRect(
            x,
            y,
            s.w,
            s.h
        );

        ctx.fillStyle="#566a83";

        ctx.fillRect(
            x,
            y,
            s.w,
            5
        );

        if(s.type!=="floor"){

            for(
                let xx=s.x+25;
                xx<s.x+s.w;
                xx+=65
            ){

                ctx.strokeStyle="#182432";
                ctx.lineWidth=2;

                ctx.beginPath();

                ctx.moveTo(
                    sx(xx),
                    sy(s.y+8)
                );

                ctx.lineTo(
                    sx(xx+25),
                    sy(s.y+8)
                );

                ctx.stroke();

            }

        }

    }

}

/* =========================================================
   LOOT DRAWING
========================================================= */

function drawLoot(){

    for(const item of salvageObjects){

        if(item.extracted)
            continue;

        if(item.carried)
            continue;

        const x =
            sx(item.x+item.w/2);

        const y =
            sy(item.y+item.h/2);

        if(
            x<-100 ||
            x>W+100 ||
            y<-100 ||
            y>H+100
        )
            continue;

        const pulse =
            Math.sin(
                performance.now()/300+
                item.x
            )*3;

        ctx.globalAlpha=.08;

        ctx.fillStyle="#75aaff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            35+pulse,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.globalAlpha=1;

        ctx.font="28px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            item.icon,
            x,
            y+10
        );

        ctx.textAlign="left";

        if(
            distanceToLoot(item)<110
        ){

            ctx.fillStyle="#d5e3ff";

            ctx.font="10px Arial";

            ctx.textAlign="center";

            ctx.fillText(
                item.name,
                x,
                y+31
            );

            ctx.textAlign="left";

        }

    }

    if(me && me.holding){

        ctx.font="27px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            me.holding.icon,
            sx(
                me.x+
                me.width/2
            ),
            sy(me.y-8)
        );

        ctx.textAlign="left";

    }

}

/* =========================================================
   ENEMY DRAW
========================================================= */

function drawEnemies(){

    for(const e of enemies){

        if(!e.alive)
            continue;

        const x=sx(e.x);
        const y=sy(e.y);

        /*
           Shadow
        */

        ctx.fillStyle="rgba(0,0,0,.45)";

        ctx.beginPath();

        ctx.ellipse(
            x+e.w/2,
            y+e.h,
            25,
            6,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
           Legs
        */

        ctx.strokeStyle="#161c27";
        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(
            x+8,
            y+e.h-4
        );

        ctx.lineTo(
            x+2,
            y+e.h+7
        );

        ctx.moveTo(
            x+e.w-8,
            y+e.h-4
        );

        ctx.lineTo(
            x+e.w+5,
            y+e.h+7
        );

        ctx.stroke();

        /*
           Body
        */

        ctx.fillStyle =
            e.type==="stalker"
                ? "#303442"
                : "#242a35";

        ctx.beginPath();

        ctx.roundRect(
            x,
            y+10,
            e.w,
            e.h-10,
            10
        );

        ctx.fill();

        /*
           Head
        */

        ctx.fillStyle="#3d4352";

        ctx.beginPath();

        ctx.arc(
            x+e.w/2,
            y+12,
            14,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
           Eyes
        */

        ctx.fillStyle =
            e.alert
                ? "#ff253f"
                : "#9e3145";

        ctx.fillRect(
            x+8,
            y+8,
            6,
            4
        );

        ctx.fillRect(
            x+e.w-14,
            y+8,
            6,
            4
        );

    }

}

/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(p){

    if(!p || p.dead)
        return;

    const x=sx(p.x);
    const y=sy(p.y);

    /*
       Shadow
    */

    ctx.fillStyle="rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        x+p.width/2,
        y+p.height,
        23,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       backpack
    */

    ctx.fillStyle="#263447";

    ctx.fillRect(
        x-4,
        y+22,
        9,
        27
    );

    /*
       body
    */

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.roundRect(
        x+4,
        y+21,
        p.width-8,
        p.height-21,
        8
    );

    ctx.fill();

    /*
       chest panel
    */

    ctx.fillStyle="#101b2b";

    ctx.fillRect(
        x+9,
        y+32,
        p.width-18,
        13
    );

    ctx.fillStyle="#61dcff";

    ctx.fillRect(
        x+13,
        y+36,
        9,
        3
    );

    /*
       helmet
    */

    ctx.fillStyle="#dce7f8";

    ctx.beginPath();

    ctx.arc(
        x+p.width/2,
        y+15,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       visor
    */

    ctx.fillStyle="#0a1422";

    ctx.beginPath();

    ctx.roundRect(
        x+6,
        y+9,
        p.width-12,
        11,
        5
    );

    ctx.fill();

    /*
       visor shine
    */

    ctx.fillStyle="rgba(120,210,255,.4)";

    ctx.fillRect(
        x+9,
        y+11,
        9,
        2
    );

    /*
       name
    */

    ctx.fillStyle="#eaf2ff";

    ctx.font="bold 11px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        p.name,
        x+p.width/2,
        y-11
    );

    ctx.textAlign="left";

}

/* =========================================================
   EXTRACTION
========================================================= */

function drawExtraction(){

    const x=sx(extraction.x);
    const y=sy(extraction.y);

    ctx.fillStyle="rgba(54,190,137,.12)";

    ctx.fillRect(
        x,
        y,
        extraction.w,
        extraction.h
    );

    ctx.strokeStyle="#54dca8";
    ctx.lineWidth=2;

    ctx.strokeRect(
        x,
        y,
        extraction.w,
        extraction.h
    );

    ctx.fillStyle="#64e6ae";

    ctx.font="bold 18px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "EXTRACTION",
        x+extraction.w/2,
        y+35
    );

    ctx.font="10px Arial";

    ctx.fillStyle="#65947f";

    ctx.fillText(
        "BRING SALVAGE HERE",
        x+extraction.w/2,
        y+55
    );

    ctx.textAlign="left";

}

/* =========================================================
   LIGHTING
========================================================= */

function drawLighting(){

    if(!me)
        return;

    /*
       Darkness overlay
    */

    const px =
        sx(
            me.x+
            me.width/2
        );

    const py =
        sy(
            me.y+
            me.height/2
        );

    const radius =
        me.x>2450
            ? 300
            : 430;

    const g =
        ctx.createRadialGradient(
            px,
            py,
            45,
            px,
            py,
            radius
        );

    g.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    g.addColorStop(
        .55,
        "rgba(0,0,0,.25)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,.74)"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
       Flashlight beam
    */

    const direction =
        me.facing || 1;

    const beam =
        ctx.createLinearGradient(
            px,
            py,
            px+direction*350,
            py
        );

    beam.addColorStop(
        0,
        "rgba(120,180,255,.06)"
    );

    beam.addColorStop(
        1,
        "rgba(120,180,255,0)"
    );

    ctx.fillStyle=beam;

    ctx.beginPath();

    ctx.moveTo(
        px,
        py
    );

    ctx.lineTo(
        px+direction*360,
        py-130
    );

    ctx.lineTo(
        px+direction*360,
        py+130
    );

    ctx.closePath();

    ctx.fill();

}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    if(!me)
        return;

    document.getElementById("money")
        .textContent =
        "$"+me.salvage;

    document.getElementById("oxygen")
        .textContent =
        Math.ceil(me.oxygen)+"%";

    document.getElementById("health")
        .textContent =
        Math.ceil(me.health)+"%";

    document.getElementById("oxygenFill")
        .style.width =
        me.oxygen+"%";

    document.getElementById("healthFill")
        .style.width =
        me.health+"%";

}

function updateMoney(){
    updateHUD();
}

/* =========================================================
   INTERACTION UI
========================================================= */

function updateInteraction(){

    const el =
        document.getElementById(
            "interaction"
        );

    if(!me || me.dead){

        el.classList.remove("show");
        return;

    }

    if(me.holding){

        el.textContent =
            "E — DROP " +
            me.holding.name;

        el.classList.add("show");

        return;

    }

    const item =
        nearestSalvage();

    if(item){

        el.textContent =
            "E — PICK UP " +
            item.name +
            "  ·  $" +
            item.value;

        el.classList.add("show");

        return;

    }

    el.classList.remove("show");

}

/* =========================================================
   INVENTORY
========================================================= */

const inventory =
    document.getElementById(
        "inventory"
    );

function toggleInventory(){

    if(
        inventory.style.display ===
        "grid"
    ){

        inventory.style.display =
            "none";

        return;

    }

    inventory.style.display =
        "grid";

    rebuildInventory();

}

function rebuildInventory(){

    const grid =
        document.getElementById(
            "inventoryGrid"
        );

    grid.innerHTML="";

    const collected =
        salvageObjects.filter(
            item =>
                item.extracted ||
                (
                    item.carried &&
                    item.holder===myId
                )
        );

    if(collected.length===0){

        grid.innerHTML =
            "<div class='item'>No salvage collected yet.</div>";

        return;

    }

    for(const item of collected){

        const div =
            document.createElement(
                "div"
            );

        div.className="item";

        div.innerHTML = `
            <div class="item-icon">
                ${item.icon}
            </div>
            <div class="item-name">
                ${item.name}
            </div>
            <div class="item-name">
                VALUE: $${item.value}
            </div>
        `;

        grid.appendChild(div);

    }

}

document
    .getElementById("closeInventory")
    .onclick=()=>{

        inventory.style.display="none";

    };

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(text){

    const el =
        document.getElementById(
            "message"
        );

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(
            ()=>{
                el.classList.remove("show");
            },
            2200
        );

}

/* =========================================================
   NETWORK CONNECT
========================================================= */

function connect(){

    try{

        socket =
            new WebSocket(
                SERVER
            );

        socket.onopen=()=>{

            document
                .getElementById(
                    "connectionStatus"
                )
                .textContent =
                "● Salvage network online";

        };

        socket.onclose=()=>{

            document
                .getElementById(
                    "connectionStatus"
                )
                .textContent =
                "○ Salvage server offline";

        };

        socket.onerror=()=>{

            document
                .getElementById(
                    "connectionStatus"
                )
                .textContent =
                "Network error";

        };

        socket.onmessage =
            handleServerMessage;

    }catch(err){

        console.error(err);

    }

}

function send(data){

    if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}

/* =========================================================
   SERVER MESSAGE
========================================================= */

function handleServerMessage(event){

    let data;

    try{

        data =
            JSON.parse(
                event.data
            );

    }catch{

        return;

    }

    switch(data.type){

        case "connected":

            myId =
                data.id;

            break;

        case "roomCreated":

            room =
                data.room;

            isHost = true;

            showRoom();

            break;

        case "roomJoined":

            room =
                data.room;

            isHost = false;

            showRoom();

            break;

        case "joined":

            room =
                data.room;

            isHost = false;

            showRoom();

            break;

        case "roomState":

            updateRoom(
                data
            );

            break;

        case "playerJoined":

            receivePlayer(
                data
            );

            updateRoom(
                data
            );

            break;

        case "playerUpdate":

            receivePlayer(
                data
            );

            break;

        case "playerMoved":

            receivePlayer(
                data
            );

            break;

        case "gameStart":

            beginGame();

            break;

        case "playerLeft":

            delete players[
                data.id
            ];

            break;

        case "respawn":

            if(
                players[data.id]
            ){

                respawnRemote(
                    players[data.id]
                );

            }

            break;

        case "error":

            showMessage(
                data.message ||
                "NETWORK ERROR"
            );

            break;

    }

}

/* =========================================================
   REMOTE PLAYER
========================================================= */

function receivePlayer(data){

    if(!data || !data.id)
        return;

    if(data.id===myId){

        if(me){

            /*
               Do not overwrite our local movement.
            */

            if(
                typeof data.salvage ===
                "number"
            ){

                me.salvage =
                    data.salvage;

            }

        }

        return;

    }

    let p =
        players[data.id];

    if(!p){

        p =
            makePlayer(
                data.id,
                data.name ||
                    "CREW",
                data.x ||
                    300,
                data.y ||
                    820,
                data.color ||
                    "#ff5c72"
            );

        players[data.id]=p;

    }

    p.targetX =
        typeof data.x==="number"
            ? data.x
            : p.x;

    p.targetY =
        typeof data.y==="number"
            ? data.y
            : p.y;

    p.vx =
        data.vx || 0;

    p.vy =
        data.vy || 0;

    p.dead =
        !!data.dead;

    if(data.name)
        p.name=data.name;

}

function updateRemotePlayers(){

    for(const id in players){

        if(id===myId)
            continue;

        const p =
            players[id];

        if(!p)
            continue;

        p.x +=
            (
                p.targetX-p.x
            ) *
            Math.min(
                1,
                dt*12
            );

        p.y +=
            (
                p.targetY-p.y
            ) *
            Math.min(
                1,
                dt*12
            );

    }

}

function respawnRemote(p){

    p.dead=false;

    p.x =
        p.targetX;

    p.y =
        p.targetY;

}

/* =========================================================
   NETWORK UPDATE
========================================================= */

let networkTimer=0;

function updateNetwork(){

    if(
        !me ||
        practiceMode
    )
        return;

    networkTimer += dt;

    if(networkTimer<.05)
        return;

    networkTimer=0;

    send({

        type:"playerUpdate",

        id:me.id,

        name:me.name,

        x:me.x,

        y:me.y,

        vx:me.vx,

        vy:me.vy,

        grounded:me.grounded,

        dead:me.dead,

        salvage:me.salvage

    });

}

/* =========================================================
   LOBBY
========================================================= */

const lobby =
    document.getElementById(
        "lobby"
    );

const mainLobby =
    document.getElementById(
        "mainLobby"
    );

const joinLobby =
    document.getElementById(
        "joinLobby"
    );

const roomLobby =
    document.getElementById(
        "roomLobby"
    );

const gameUI =
    document.getElementById(
        "gameUI"
    );

function showRoom(){

    lobby.classList.add("hidden");

    roomLobby.classList.remove(
        "hidden"
    );

    document
        .getElementById(
            "roomCode"
        )
        .textContent =
        room || "----";

    document
        .getElementById(
            "roomStatus"
        )
        .textContent =
        isHost
            ? "You are the crew leader."
            : "Waiting for the host to launch.";

}

function updateRoom(data){

    if(data.room)
        room=data.room;

    const list =
        document.getElementById(
            "playerList"
        );

    list.innerHTML="";

    const roomPlayers =
        data.players || [];

    for(const p of roomPlayers){

        const div =
            document.createElement(
                "div"
            );

        div.className="player";

        div.textContent =
            (
                p.host
                    ? "⭐ "
                    : "👤 "
            ) +
            (
                p.name ||
                "Crew"
            );

        list.appendChild(div);

    }

}

/* =========================================================
   BEGIN GAME
========================================================= */

function beginGame(){

    gameStarted=true;
    gameOver=false;

    roomLobby.classList.add(
        "hidden"
    );

    lobby.classList.add(
        "hidden"
    );

    gameUI.classList.remove(
        "hidden"
    );

    if(!me){

        me =
            makePlayer(
                myId || "local",
                "You",
                isHost
                    ? 250
                    : 340,
                820,
                isHost
                    ? "#ff536b"
                    : "#648bff"
            );

        players[
            me.id
        ]=me;

    }

    me.dead=false;

    me.health=100;
    me.oxygen=100;

    showMessage(
        "BOARDING ORPHEUS-7"
    );

}

/* =========================================================
   LOBBY BUTTONS
========================================================= */

document
    .getElementById("hostBtn")
    .onclick=()=>{

        const name =
            document
                .getElementById(
                    "nameInput"
                )
                .value
                .trim();

        if(!name){

            showMessage(
                "ENTER A CREW NAME"
            );

            return;

        }

        send({

            type:"createRoom",

            name

        });

    };

document
    .getElementById("joinBtn")
    .onclick=()=>{

        mainLobby
            .classList
            .add("hidden");

        joinLobby
            .classList
            .remove("hidden");

    };

document
    .getElementById("joinBack")
    .onclick=()=>{

        joinLobby
            .classList
            .add("hidden");

        mainLobby
            .classList
            .remove("hidden");

    };

document
    .getElementById("joinConfirm")
    .onclick=()=>{

        const name =
            document
                .getElementById(
                    "joinName"
                )
                .value
                .trim();

        const code =
            document
                .getElementById(
                    "roomInput"
                )
                .value
                .trim()
                .toUpperCase();

        if(
            !name ||
            code.length!==4
        ){

            showMessage(
                "ENTER A NAME AND 4-LETTER CODE"
            );

            return;

        }

        send({

            type:"joinRoom",

            room:code,

            name

        });

    };

document
    .getElementById("practiceBtn")
    .onclick=()=>{

        practiceMode=true;

        myId="practice";

        isHost=true;

        beginGame();

    };

document
    .getElementById("startBtn")
    .onclick=()=>{

        if(!isHost)
            return;

        send({

            type:"startGame"

        });

    };

/* =========================================================
   RENDER
========================================================= */

function render(){

    drawSpace();

    updateCamera();

    /*
       Tiny camera shake
    */

    const shakeX =
        camera.shake
            ? (
                Math.random()-.5
            )*camera.shake
            : 0;

    const shakeY =
        camera.shake
            ? (
                Math.random()-.5
            )*camera.shake
            : 0;

    ctx.save();

    ctx.translate(
        shakeX,
        shakeY
    );

    drawShip();
    drawSectionSigns();
    drawProps();
    drawBulkheads();
    drawSolids();
    drawLoot();
    drawExtraction();
    drawEnemies();

    for(const id in players){

        drawPlayer(
            players[id]
        );

    }

    drawLighting();

    ctx.restore();

}

/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

    dt =
        Math.min(
            .033,
            (now-lastTime)/1000
        );

    lastTime=now;

    if(
        gameStarted &&
        me
    ){

        updatePlayer(me);

        updateRemotePlayers();

        updateEnemies();

        updateOxygen();

        checkExtraction();

        updateNetwork();

        updateInteraction();

        updateHUD();

    }

    render();

    requestAnimationFrame(
        loop
    );

}

/* =========================================================
   START
========================================================= */

connect();

requestAnimationFrame(
    loop
);

</script>
