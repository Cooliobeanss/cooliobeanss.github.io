<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

<title>Coolio Climb</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05050a;
    color: white;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    user-select: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================================================
   LOBBY
========================================================= */

#lobby {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(128, 64, 255, .18),
            transparent 38%
        ),
        linear-gradient(
            135deg,
            #050509,
            #0c0718 50%,
            #04040a
        );
}

.lobby-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.lobby-orb {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .18;
}

.orb1 {
    background: #773cff;
    left: -180px;
    top: -150px;
}

.orb2 {
    background: #00d9ff;
    right: -200px;
    bottom: -180px;
}

.lobby-card {
    position: relative;
    width: min(92vw, 560px);
    padding: 46px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    box-shadow:
        0 40px 120px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08);

    backdrop-filter: blur(25px);

    text-align: center;
}

.logo {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #a98cff;
    margin-bottom: 14px;
}

h1 {
    font-size: clamp(48px, 9vw, 84px);
    line-height: .9;
    font-weight: 1000;
    letter-spacing: -5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #bda5ff,
            #74e7ff,
            #fff
        );

    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: titleGradient 5s linear infinite;
}

@keyframes titleGradient {
    to {
        background-position: 250% center;
    }
}

.subtitle {
    color: #a7a3b8;
    margin: 20px 0 30px;
    line-height: 1.6;
}

.input {
    width: 100%;
    height: 54px;

    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.1);

    background: rgba(0,0,0,.3);
    color: white;

    padding: 0 18px;
    font-size: 16px;
    outline: none;

    margin-bottom: 12px;
}

.input:focus {
    border-color: #936cff;
    box-shadow: 0 0 25px rgba(126,78,255,.2);
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 10px;
}

button {
    height: 54px;
    border: 0;
    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #7d4dff,
            #a76bff
        );

    color: white;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: .5px;

    cursor: pointer;

    transition:
        transform .15s,
        filter .15s,
        box-shadow .15s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
    box-shadow: 0 12px 30px rgba(123,74,255,.3);
}

button:active {
    transform: translateY(1px);
}

.secondary {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
}

#joinPanel,
#roomPanel {
    display: none;
}

.room-code {
    font-size: 54px;
    font-weight: 1000;
    letter-spacing: 12px;
    margin: 18px 0;
    color: #c9b7ff;
}

.player-list {
    margin: 20px 0;
    display: grid;
    gap: 8px;
}

.player {
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    color: #ddd;
}

.status {
    color: #8f89a2;
    font-size: 13px;
    margin-top: 15px;
}

/* =========================================================
   GAME UI
========================================================= */

#gameUI {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.topbar {
    position: absolute;
    left: 20px;
    right: 20px;
    top: 18px;

    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.panel {
    padding: 12px 16px;

    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.1);

    background: rgba(5,5,12,.55);
    backdrop-filter: blur(14px);

    color: #ddd;
    font-size: 12px;
    line-height: 1.65;

    box-shadow: 0 12px 40px rgba(0,0,0,.25);
}

.panel b {
    color: white;
}

#location {
    font-weight: 900;
    color: #d3c7ff;
}

#checkpoint {
    position: absolute;
    left: 50%;
    top: 25%;

    transform:
        translate(-50%, -50%)
        scale(.8);

    opacity: 0;
    visibility: hidden;

    padding: 14px 22px;
    border-radius: 999px;

    background: rgba(20,10,45,.8);
    border: 1px solid rgba(174,131,255,.5);

    color: #d9caff;
    font-weight: 900;
    letter-spacing: 2px;

    transition:
        opacity .3s,
        transform .3s;
}

#checkpoint.show {
    opacity: 1;
    visibility: visible;
    transform:
        translate(-50%, -50%)
        scale(1);
}

#message {
    position: absolute;
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.75);

    opacity: 0;
    visibility: hidden;

    padding: 28px 40px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(10,7,20,.92),
            rgba(25,12,45,.92)
        );

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        0 0 70px rgba(116,72,255,.15);

    font-size: 28px;
    font-weight: 1000;

    transition:
        opacity .2s,
        transform .2s;
}

#message.show {
    opacity: 1;
    visibility: visible;

    transform:
        translate(-50%, -50%)
        scale(1);
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #05050a;

    transition: opacity .5s;
}

#loading.hide {
    opacity: 0;
    pointer-events: none;
}

.spinner {
    width: 32px;
    height: 32px;

    border: 3px solid rgba(255,255,255,.1);
    border-top-color: #9b72ff;
    border-radius: 50%;

    animation: spin .8s linear infinite;

    margin-right: 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {
    .lobby-card {
        padding: 30px 22px;

    .buttons {

    }

    .topbar {
        left: 8px;
        right: 8px;
        top: 8px;
    }

    .controls {
        display: none;
    }
}
</style>

/* =========================================================
   CORE
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize() {

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =========================================================
   SERVER
========================================================= */

const SERVER =
    "wss://cooliobeans-multiplayer.onrender.com";

let socket = null;

let myId = null;

let roomCode = "";

let isHost = false;

let practiceMode = false;

let gameStarted = false;

/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        const key =
            e.key.toLowerCase();

        keys[key] = true;

        if (
            key === " " ||
            key === "arrowup" ||
            key === "w"
        ) {
            keys.jump = true;
        }

        if (
            key === "arrowleft" ||
            key === "a"
        ) {
            keys.left = true;
        }

        if (
            key === "arrowright" ||
            key === "d"
        ) {
            keys.right = true;
        }

        if (
            key === "shift"
        ) {
            keys.run = true;
        }

        if (
            key === " " ||
            key === "arrowup" ||
            key === "arrowleft" ||
            key === "arrowright"
        ) {
            e.preventDefault();
        }
    },
    { passive:false }
);

window.addEventListener(
    "keyup",
    e => {

        const key =
            e.key.toLowerCase();

        keys[key] = false;

        if (
            key === " " ||
            key === "arrowup" ||
            key === "w"
        ) {
            keys.jump = false;
        }

        if (
            key === "arrowleft" ||
            key === "a"
        ) {
            keys.left = false;
        }

        if (
            key === "arrowright" ||
            key === "d"
        ) {
            keys.right = false;
        }

        if (
            key === "shift"
        ) {
            keys.run = false;
        }
    }
);

/* =========================================================
   UTILITY
========================================================= */

function clamp(
    value,
    min,
    max
) {
    return Math.max(
        min,
        Math.min(max, value)
    );
}

function lerp(
    a,
    b,
    t
) {
    return a + (b - a) * t;
}

function dist(
    a,
    b
) {
    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

function rnd(
    min,
    max
) {
    return (
        Math.random() *
        (max - min) +
        min
    );
}

) {

function roundedRect(
    x,
    y,
    w,
    h,
    r
) {

}

function drawText(
    text,
    x,
    y,

) {

        `900 ${size}px system-ui`;

}

/* =========================================================
   HOUSE BACKGROUND
========================================================= */

function drawHouseBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#83cfff"
    );

    gradient.addColorStop(
        .55,
        "#c8ebff"
    );

    gradient.addColorStop(
        1,
        "#6eb64e"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
        distant hills
    */

    ctx.fillStyle =
        "rgba(54,110,73,.3)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        H*.68
    );

    for (
        let x=0;
        x<=W;
        x+=80
    ) {

        ctx.lineTo(
            x,
            H*.62 +
            Math.sin(x*.008)*35
        );

    }

    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        0,
        H
    );

    ctx.fill();

    /*
        clouds
    */

    for (
        let i=0;
        i<7;
        i++
    ) {

        const x =
            ((i*440 -
            camera.x*.12)
            % (W+600))
            - 300;

        const y =
            80 + i%3*90;

        drawCloud(
            x,
            y,
            1.3
        );

    }

}

/* =========================================================
   OFFICE BACKGROUND
========================================================= */

function drawOfficeBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#090b18"
    );

    gradient.addColorStop(
        1,
        "#24203b"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
        city skyline
    */

    const baseY =
        H*.78;

    for (
        let i=0;
        i<25;
        i++
    ) {

        const bw =
            60 +
            (i*37)%110;

        const bh =
            100 +
            (i*71)%240;

        const bx =
            i*150 -
            (camera.x*.15)%150;

        ctx.fillStyle =
            i%2
                ? "#111426"
                : "#171a30";

        ctx.fillRect(
            bx,
            baseY-bh,
            bw,
            bh
        );

        /*
            windows
        */

        ctx.fillStyle =
            "rgba(255,210,100,.18)";

        for (
            let wy=baseY-bh+20;
            wy<baseY-15;
            wy+=25
        ) {

            for (
                let wx=bx+12;
                wx<bx+bw-8;
                wx+=22
            ) {

                if (
                    (i+Math.floor(wy/25))%3
                    !== 0
                ) {

                    ctx.fillRect(
                        wx,
                        wy,
                        8,
                        10
                    );

                }

            }

        }

    }

}

/* =========================================================
   SPACE BACKGROUND
========================================================= */

function drawSpaceBackground() {

    ctx.fillStyle =
        "#02030b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
        nebula
    */

    const nebula =
        ctx.createRadialGradient(
            W*.65,
            H*.35,
            0,
            W*.65,
            H*.35,
            W*.8
        );

    nebula.addColorStop(
        0,
        "rgba(90,50,180,.25)"
    );

    nebula.addColorStop(
        .45,
        "rgba(20,70,150,.12)"
    );

    nebula.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle =
        nebula;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
        stars
    */

    for (
        const p of particles
    ) {

        const sx =
            p.x -
            camera.x*.3;

        const sy =
            p.y -
            camera.y*.3;

        if (
            sx < -10 ||
            sx > W+10 ||
            sy < -10 ||
            sy > H+10
        ) {
            continue;
        }

        ctx.globalAlpha =
            p.alpha;

        ctx.fillStyle =
            "#fff";

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

}

/* =========================================================
   CLOUD DRAWING
========================================================= */

function drawCloud(
    x,
    y,
    scale
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.fillStyle =
        "rgba(255,255,255,.85)";

    const blobs = [

        [-60,10,42],
        [-20,-15,52],
        [25,-8,60],
        [70,12,38],
        [0,20,75]

    ];

    for (
        const b of blobs
    ) {

        ctx.beginPath();

        ctx.arc(
            b[0],
            b[1],
            b[2],
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.restore();

}

/* =========================================================

function worldToScreenX(x) {

    return (
        x -
        camera.x
    ) * camera.zoom +
    W/2;

}

function worldToScreenY(y) {

    return (
        y -
        camera.y
    ) * camera.zoom +
    H/2;

}

/* =========================================================
   DOORS
========================================================= */

function drawDoor(
    x,
    y,
    w,
    h,
    color
) {

    const sx =
        worldToScreenX(x);

    const sy =
        worldToScreenY(y-h);

    ctx.fillStyle =
        color;

    ctx.fillRect(
        sx,
        sy,
        w*camera.zoom,
        h*camera.zoom
    );

    ctx.fillStyle =
        "rgba(255,255,255,.12)";

    ctx.fillRect(
        sx+8,
        sy+8,
        5,
        h*camera.zoom-16
    );

    ctx.fillStyle =
        "#d4af65";

    ctx.beginPath();

    ctx.arc(
        sx+w*camera.zoom-18,
        sy+h*.52*camera.zoom,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();

}

/* =========================================================
   WINDOWS
========================================================= */

function drawWindow(
    x,
    y,
    w,
    h
) {

    const sx =
        worldToScreenX(x);

    const sy =
        worldToScreenY(y);

    ctx.fillStyle =
        "#80c8ee";

    ctx.fillRect(
        sx,
        sy,
        w*camera.zoom,
        h*camera.zoom
    );

    ctx.strokeStyle =
        "#8d7662";

    ctx.lineWidth =
        10;

    ctx.strokeRect(
        sx,
        sy,
        w*camera.zoom,
        h*camera.zoom
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.45)";

    ctx.lineWidth =
        3;

    ctx.beginPath();

    ctx.moveTo(
        sx+w*.5*camera.zoom,
        sy
    );

    ctx.lineTo(
        sx+w*.5*camera.zoom,
        sy+h*camera.zoom
    );

    ctx.moveTo(
        sx,
        sy+h*.5*camera.zoom
    );

    ctx.lineTo(
        sx+w*camera.zoom,
        sy+h*.5*camera.zoom
    );

    ctx.stroke();

}

/* =========================================================
   PLATFORMS
========================================================= */

function drawPlatforms() {

    for (
        const p of platforms
    ) {

        const sx =
            worldToScreenX(p.x);

        const sy =
            worldToScreenY(p.y);

        const sw =
            p.w *
            camera.zoom;

        const sh =
            p.h *
            camera.zoom;

        if (
            sx+sw < -100 ||
            sx > W+100 ||
            sy+sh < -100 ||
            sy > H+100
        ) {
            continue;
        }

        let top =
            "#69584b";

        let side =
            "#3f342e";

        if (
            p.type === "wood"
        ) {

            top = "#9b704d";
            side = "#64452f";

        }

        if (
            p.type === "floor"
        ) {

            top = "#76583f";
            side = "#4b392b";

        }

        if (
            p.type === "roof"
        ) {

            top = "#4e3437";
            side = "#302329";

        }

        if (
            p.type === "officeFloor"
        ) {

            top = "#596174";
            side = "#303541";

        }

        if (
            p.type === "metal"
        ) {

            top = "#8b95a8";
            side = "#454d5b";

        }

        if (
            p.type === "cloud" ||
            p.type === "cloudSmall"
        ) {

            top = "#ffffff";
            side = "#b9dff7";

        }

        if (
            p.type === "station"
        ) {

            top = "#71849a";
            side = "#303b49";

        }

        if (
            p.type === "moon"
        ) {

            top = "#99999d";
            side = "#5f6064";

        }

        if (
            p.type === "finish"
        ) {

            top = "#eeeef5";
            side = "#a7a7b1";

        }

        /*
            side
        */

        ctx.fillStyle =
            side;

        ctx.fillRect(
            sx,
            sy,
            sw,
            sh
        );

        /*
            top
        */

        ctx.fillStyle =
            top;

        ctx.fillRect(
            sx,
            sy,
            sw,
            Math.max(
                8,
                sh*.35
            )
        );

        /*
            top edge
        */

        ctx.fillStyle =
            "rgba(255,255,255,.12)";

        ctx.fillRect(
            sx,
            sy,
            sw,
            3
        );

        /*
            wood details
        */

        if (
            p.type === "wood"
        ) {

            ctx.strokeStyle =
                "rgba(50,30,20,.25)";

            ctx.lineWidth = 2;

            for (
                let x=sx+20;
                x<sx+sw;
                x+=50
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    sy+3
                );

                ctx.lineTo(
                    x-10,
                    sy+sh
                );

                ctx.stroke();

            }

        }

    }

}

/* =========================================================
   ASTEROID
========================================================= */

function drawAsteroid(
    x,
    y,
    r
) {

    const sx =
        worldToScreenX(x);

    const sy =
        worldToScreenY(y);

    ctx.fillStyle =
        "#4e505a";

    ctx.beginPath();

    for (
        let i=0;
        i<9;
        i++
    ) {

        const angle =
            i/9*Math.PI*2;

        const radius =
            r *
            (
                .75 +
                Math.sin(i*5.3)*.2
            );

        const px =
            sx +
            Math.cos(angle)*radius;

        const py =
            sy +
            Math.sin(angle)*radius;

        if (
            i === 0
        ) {

            ctx.moveTo(
                px,
                py
            );

        } else {

            ctx.lineTo(
                px,
                py
            );

        }

    }

    ctx.closePath();

    ctx.fill();

}

            );

        if (
            o.type === "lamp"
        ) {

            ctx.fillStyle =
                "#303038";

            ctx.fillRect(
                sx+18,

                10,
                90
            );

            ctx.fillStyle =
                "#e7ca78";

            ctx.beginPath();

            ctx.arc(
                sx+23,
                sy-100,
                18,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

        if (
            o.type === "cabinet"
        ) {

            ctx.fillStyle =
                "#555b68";

            ctx.fillRect(
                sx,
                sy-o.h*camera.zoom,
                o.w*camera.zoom,
                o.h*camera.zoom
            );

        }

        if (
            o.type === "plant"
        ) {

            drawOfficePlant(
                o.x,
                o.y
            );

        }

        if (
            o.type === "crate"
        ) {

            ctx.fillStyle =
                "#80603f";

            ctx.fillRect(
                sx,
                sy-45,
                80,
                45
            );

            ctx.strokeStyle =
                "#b28b5e";

            ctx.strokeRect(
                sx,

            o.type === "asteroid"

/* =========================================================
   CHAIN
========================================================= */

function drawChain() {

    if (
        !remotePlayer.id
    ) {
        return;
    }

    const a = {

        x:worldToScreenX(
            localPlayer.x +
            localPlayer.width/2
        ),

        y:worldToScreenY(
            localPlayer.y -
            localPlayer.height/2
        )

    };

    const b = {

        x:worldToScreenX(
            remotePlayer.x +
            remotePlayer.width/2
        ),

        y:worldToScreenY(
            remotePlayer.y -
            remotePlayer.height/2
        )

    };

    const d =
        Math.hypot(
            b.x-a.x,
            b.y-a.y
        );

    const links =
        Math.max(
            8,
            Math.floor(
                d/16
            )
        );

    ctx.save();

    ctx.strokeStyle =
        "rgba(20,20,25,.45)";

    ctx.lineWidth =
        8;

    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.stroke();

    /*
        actual links
    */

    for (
        let i=0;
        i<links;
        i++
    ) {

        const t =
            i/(links-1);

        const x =
            lerp(
                a.x,
                b.x,
                t
            );

        const y =
            lerp(
                a.y,
                b.y,
                t
            );

        ctx.save();

        ctx.translate(
            x,
            y
        );

        ctx.rotate(
            Math.atan2(
                b.y-a.y,
                b.x-a.x
            ) +
            (i%2
                ? Math.PI/2
                : 0)
        );

        ctx.strokeStyle =
            "#c6c9d2";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            8,
            5,
            0,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();

    }

    ctx.restore();

    chainDistance =
        Math.round(
            dist(
                localPlayer,
                remotePlayer
            )
        );

    document.getElementById(
        "chainDistance"
    ).textContent =
        chainDistance;

}

/* =========================================================
   PLAYER DRAWING
========================================================= */

function drawPlayer(
    p
) {

    const x =
        worldToScreenX(
            p.x +
            p.width/2
        );

    const y =
        worldToScreenY(
            p.y -
            p.height/2
        );

    ctx.save();

    /*
        shadow
    */

    if (
        p.grounded
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,.25)";

        ctx.beginPath();

        ctx.ellipse(
            x,
            worldToScreenY(p.y+5),
            24,
            7,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    /*
        legs
    */

    ctx.strokeStyle =
        "#17171d";

    ctx.lineWidth = 7;

    ctx.lineCap =
        "round";

    const run =
        p.running
            ? Math.sin(
                performance.now()/90
            )*7
            : 0;

    ctx.beginPath();

    ctx.moveTo(
        x-7,
        y+18
    );

    ctx.lineTo(
        x-10-run,
        y+42
    );

    ctx.moveTo(
        x+7,
        y+18
    );

    ctx.lineTo(
        x+10+run,
        y+42
    );

    ctx.stroke();

    /*
        body
    */

    ctx.fillStyle =
        p.color;

    roundedRect(
        x-17,
        y-15,
        34,
        36,
        9
    );

    /*
        head
    */

    ctx.fillStyle =
        "#f1c7a4";

    ctx.beginPath();

    ctx.arc(
        x,
        y-32,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        hair
    */

    ctx.fillStyle =
        "#17131a";

    ctx.beginPath();

    ctx.arc(
        x,
        y-37,
        16,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /*
        eye
    */

    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        x+5*p.facing,
        y-33,
        2.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        name
    */

    drawText(
        p.name,
        x,
        y-65,
        12,
        "rgba(255,255,255,.9)"
    );

    ctx.restore();

}

/* =========================================================
   COLLISION
========================================================= */

function resolvePlayerCollision(
    p,
    dt
) {

    p.grounded = false;

    let landed = false;

    for (
        const plat of platforms
    ) {

        const px =
            plat.x;

        const py =
            plat.y;

        const pw =
            plat.w;

        const ph =
            plat.h;

        const left =
            p.x;

        const right =
            p.x+p.width;

        const bottom =
            p.y;

        const previousBottom =
            p.y -
            p.vy*dt;

        /*
            top collision
        */

        if (
            right > px &&
            left < px+pw &&
            bottom >= py &&
            previousBottom <= py
        ) {

            p.y =
                py;

            p.vy = 0;

            p.grounded =
                true;

            landed = true;

            break;

        }

    }

    return landed;

}

/* =========================================================
   OBSTACLE COLLISION
========================================================= */

function resolveObstacleCollision(
    p
) {

    for (
        const o of obstacles
    ) {

        let ox =
            o.x;

        let oy =
            o.y-o.h;

        let ow =
            o.w;

        let oh =
            o.h;

        if (
            p.x+p.width > ox &&
            p.x < ox+ow &&
            p.y > oy &&
            p.y-p.height < o.y
        ) {

            /*
                knock player backward
            */

            if (
                p.x < ox
            ) {

                p.x =
                    ox-p.width;

            } else {

                p.x =
                    ox+ow;

            }

            p.vx *= -.35;

        }

    }

}

/* =========================================================
   LOCAL PHYSICS
========================================================= */

function updateLocalPlayer(
    p,
    dt
) {

    if (
        p.dead
    ) {
        return;
    }

    /*
        jump buffer
    */

    if (
        keys.jump
    ) {

        p.jumpBuffer =
            PHYSICS.jumpBufferTime;

    } else {

        p.jumpBuffer =
            Math.max(
                0,
                p.jumpBuffer-dt
            );

    }

    /*
        coyote
    */

    if (
        p.grounded
    ) {

        p.coyote =
            PHYSICS.coyoteTime;

    } else {

        p.coyote =
            Math.max(
                0,
                p.coyote-dt
            );

    }

    /*
        movement
    */

    let direction = 0;

    if (
        keys.left
    ) {
        direction -= 1;
    }

    if (
        keys.right
    ) {
        direction += 1;
    }

    const targetSpeed =
        (
            keys.run
                ? PHYSICS.runSpeed
                : PHYSICS.walkSpeed
        ) *
        direction;

    p.running =
        keys.run &&
        direction !== 0;

    const acceleration =
        p.grounded
            ? PHYSICS.groundAcceleration
            : PHYSICS.airAcceleration;

    if (
        direction !== 0
    ) {

        if (
            p.vx < targetSpeed
        ) {

            p.vx =
                Math.min(
                    targetSpeed,
                    p.vx+acceleration*dt
                );

        }

        if (
            p.vx > targetSpeed
        ) {

            p.vx =
                Math.max(
                    targetSpeed,
                    p.vx-acceleration*dt
                );

        }

        p.facing =
            direction;

    } else {

        const amount =
            PHYSICS.friction*dt;

        if (
            p.vx > 0
        ) {

            p.vx =
                Math.max(
                    0,
                    p.vx-amount
                );

        } else {

            p.vx =
                Math.min(
                    0,
                    p.vx+amount
                );

        }

    }

    /*
        jump
    */

    if (
        p.jumpBuffer > 0 &&
        p.coyote > 0
    ) {

        p.vy =
            PHYSICS.jumpVelocity;

        p.grounded =
            false;

        p.coyote =
            0;

        p.jumpBuffer =
            0;

    }

    /*
        variable jump
    */

    if (
        !keys.jump &&
        p.vy < -250
    ) {

        p.vy *= .72;

    }

    /*
        gravity
    */

    p.vy +=
        PHYSICS.gravity*dt;

    p.vy =
        Math.min(
            p.vy,
            PHYSICS.terminalVelocity
        );

    /*
        movement
    */

    p.x +=
        p.vx*dt;

    p.y +=
        p.vy*dt;

    resolvePlayerCollision(
        p,
        dt
    );

    resolveObstacleCollision(
        p
    );

    /*
        fell
    */

    if (
        p.y > 1100
    ) {

        killPlayer(
            p
        );

    }

}

/* =========================================================
   MOVING PLATFORMS
========================================================= */

function updateMovingPlatforms(
    time
) {

    for (
        const p of movingPlatforms
    ) {

        p.x =
            p.baseX +
            Math.sin(
                time*p.speed +
                p.phase
            ) *
            p.range;

    }

}

/* =========================================================
   CHAIN PHYSICS
========================================================= */

function updateChain(
    dt
) {

    if (
        !remotePlayer.id ||
        remotePlayer.dead
    ) {
        return;
    }

    const ax =
        localPlayer.x +
        localPlayer.width/2;

    const ay =
        localPlayer.y -
        localPlayer.height/2;

    const bx =
        remotePlayer.x +
        remotePlayer.width/2;

    const by =
        remotePlayer.y -
        remotePlayer.height/2;

    let dx =
        bx-ax;

    let dy =
        by-ay;

    const d =
        Math.hypot(
            dx,
            dy
        );

    chainDistance =
        Math.round(d);

    if (
        d <= chain.softLength
    ) {
        return;
    }

    const nx =
        dx/d;

    const ny =
        dy/d;

    const stretch =
        d-chain.softLength;

    const relativeVelocity =
        (
            remotePlayer.vx -
            localPlayer.vx
        ) *
        nx +
        (
            remotePlayer.vy -
            localPlayer.vy
        ) *
        ny;

    const force =
        stretch *
        chain.stiffness +
        relativeVelocity *
        chain.damping;

    /*
        local player gets pulled
    */

    localPlayer.vx +=
        nx *
        force *
        dt;

    localPlayer.vy +=
        ny *
        force *
        dt;

    /*
        remote player gets pulled opposite
    */

    if (
        practiceMode
    ) {

        remotePlayer.vx -=
            nx *
            force *
            dt;

        remotePlayer.vy -=
            ny *
            force *
            dt;

    }

    /*
        hard maximum
    */

    if (
        d > chain.maxLength
    ) {

        const correction =
            d-chain.maxLength;

        if (
            practiceMode
        ) {

            localPlayer.x +=
                nx *
                correction *
                .5;

            localPlayer.y +=
                ny *
                correction *
                .5;

            remotePlayer.x -=
                nx *
                correction *
                .5;

            remotePlayer.y -=
                ny *
                correction *
                .5;

        } else {

            localPlayer.x +=
                nx *
                correction *
                .25;

            localPlayer.y +=
                ny *
                correction *
                .25;

        }

    }

}

/* =========================================================
   REMOTE INTERPOLATION
========================================================= */

function updateRemote(
    dt
) {

    if (
        !remotePlayer.id ||
        practiceMode
    ) {
        return;
    }

    remotePlayer.x =
        lerp(
            remotePlayer.x,
            remotePlayer.remoteTargetX,
            1-Math.pow(.001,dt)
        );

    remotePlayer.y =
        lerp(
            remotePlayer.y,
            remotePlayer.remoteTargetY,
            1-Math.pow(.001,dt)
        );

    remotePlayer.vx =
        remotePlayer.remoteTargetVX;

    remotePlayer.vy =
        remotePlayer.remoteTargetVY;

    remotePlayer.grounded =
        remotePlayer.remoteTargetGrounded;

}

/* =========================================================
   CHECKPOINT
========================================================= */

let checkpointMessageTimer =
    null;

function updateCheckpoint(
    p
) {

    for (
        const cp of checkpoints
    ) {

        if (
            p.x >
            cp.x &&
            p.checkpointX <
            cp.x
        ) {

            p.checkpointX =
                cp.x;

            p.checkpointY =
                cp.y;

            showCheckpoint(
                cp.label
            );

        }

    }

}

    label
) {

    const el =
        document.getElementById(
            "checkpoint"
        );

    el.textContent =
        "✓ " +
        label +
        " CHECKPOINT";

    el.classList.add(
        "show"
    );

    clearTimeout(
        checkpointMessageTimer
    );

    checkpointMessageTimer =
        setTimeout(
            () => {

                el.classList.remove(
                    "show"
                );

            },
            1800
        );

}

/* =========================================================
   DEATH
========================================================= */

let messageTimer = null;

function killPlayer(
    p
) {

    if (
        p.dead
    ) {
        return;
    }

    p.dead =
        true;

    p.vx =
        0;

    p.vy =
        0;

    if (
        p.id !== myId &&
        !practiceMode
    ) {
        return;
    }

    showMessage(
        "💀 YOU FELL"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                respawnPlayer(
                    p
                );

                hideMessage();

            },
            1000
        );

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN &&
        !practiceMode
    ) {

        socket.send(
            JSON.stringify({
                type:"respawn"
            })
        );

    }

}

function respawnPlayer(
    p
) {

    p.x =
        p.checkpointX;

    p.y =
        p.checkpointY;

    p.vx =
        0;

    p.vy =
        0;

    p.dead =
        false;

    p.grounded =
        false;

    p.coyote =
        0;

    p.jumpBuffer =
        0;

}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text
) {

    const msg =
        document.getElementById(
            "message"
        );

    msg.textContent =
        text;

    clearTimeout(
        messageTimer
    );

    msg.style.opacity =
        "1";

    msg.style.visibility =
        "visible";

    msg.style.transform =
        "translate(-50%, -50%) scale(1)";

    msg.classList.add(
        "show"
    );

}

function hideMessage() {

    const msg =
        document.getElementById(
            "message"
        );

    msg.classList.remove(
        "show"
    );

    msg.style.opacity =
        "0";

    msg.style.visibility =
        "hidden";

    msg.style.transform =
        "translate(-50%, -50%) scale(.8)";

}

   FINISH
========================================================= */

let finished =
    false;

function checkFinish() {

    if (
        finished
    ) {
        return;
    }

    if (
        localPlayer.x >
        32550
    ) {

        finished =
            true;

        showMessage(
            "🌕 YOU MADE IT TO THE MOON!"
        );

        setTimeout(
            () => {

                showMessage(
                    "🏆 CLIMB COMPLETE"
                );

            },
            2300
        );

    }

}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(
    dt
) {

    const targetX =
        localPlayer.x;

    const targetY =
        localPlayer.y -
        50;

    camera.x =
        lerp(
            camera.x,
            targetX,
            1-Math.pow(
                .0005,
                dt
            )
        );

    camera.y =
        lerp(
            camera.y,
            targetY,
            1-Math.pow(
                .0005,
                dt
            )
        );

    /*
        slight zoom-out in major areas
    */

    const env =
        getEnvironment(
            localPlayer.x
        );

    let targetZoom =
        1;

    if (
        env === "space"
    ) {

        targetZoom =
            .88;

    }

    if (
        env === "moon"
    ) {

        targetZoom =
            .9;

    }

    camera.zoom =
        lerp(
            camera.zoom,
            targetZoom,
            dt*2
        );

}

/* =========================================================
   NETWORK
========================================================= */

function connect() {

    if (
        socket
    ) {

        try {
            socket.close();
        } catch {}

    }

    socket =
        new WebSocket(
            SERVER
        );

    socket.addEventListener(
        "open",
        () => {

            document
                .getElementById(
                    "loading"
                )
                .classList.add(
                    "hide"
                );

        }
    );

    socket.addEventListener(
        "message",
        e => {

            let data;

            try {

                data =
                    JSON.parse(
                        e.data
                    );

            } catch {

                return;

            }

            handleServerMessage(
                data
            );

        }
    );

    socket.addEventListener(
        "close",
        () => {

            if (
                gameStarted
            ) {

                showMessage(
                    "⚠ CONNECTION LOST"
                );

            }

        }
    );

}

function handleServerMessage(
    data
) {

    if (
        data.type ===
        "connected"
    ) {

        myId =
            data.id;

        localPlayer.id =
            myId;

    }

    if (
        data.type ===
        "roomCreated"
    ) {

        roomCode =
            data.code;

        isHost =
            true;

        openRoom(
            data.players
        );

    }

    if (
        data.type ===
        "roomJoined"
    ) {

        roomCode =
            data.code;

        isHost =
            false;

        openRoom(
            data.players
        );

    }

    if (
        data.type ===
        "players"
    ) {

        updateRoomPlayers(
            data.players
        );

    }

    if (
        data.type ===
        "gameStart"
    ) {

        beginGame(
            data.players
        );

    }

    if (
        data.type ===
        "state"
    ) {

        if (
            data.players
        ) {

            for (
                const player
                of data.players
            ) {

                if (
                    player.id ===
                    myId
                ) {
                    continue;
                }

                remotePlayer.id =
                    player.id;

                remotePlayer.name =
                    player.name;

                remotePlayer.x =
                    remotePlayer.x ||
                    player.x;

                remotePlayer.y =
                    remotePlayer.y ||
                    player.y;

                remotePlayer.remoteTargetX =
                    player.x;

                remotePlayer.remoteTargetY =
                    player.y;

                remotePlayer.remoteTargetVX =
                    player.vx || 0;

                remotePlayer.remoteTargetVY =
                    player.vy || 0;

                remotePlayer.remoteTargetGrounded =
                    !!player.grounded;

                remotePlayer.dead =
                    !!player.dead;

            }

        }

    }

    if (
        data.type ===
        "playerRespawned"
    ) {

        if (
            data.id ===
            myId
        ) {

            respawnPlayer(
                localPlayer
            );

        }

    }

    if (
        data.type ===
        "error"
    ) {

        const status =
            document.getElementById(
                "joinStatus"
            );

        if (
            status
        ) {

            status.textContent =
                data.message ||
                "Something went wrong.";

        }

    }

}

/* =========================================================
   ROOM UI
========================================================= */

function openRoom(
    players = []
) {

    mainPanel.style.display =
        "none";

    joinPanel.style.display =
        "none";

    roomPanel.style.display =
        "block";

    document.getElementById(
        "roomCode"
    ).textContent =
        roomCode;

    updateRoomPlayers(
        players
    );

}

function updateRoomPlayers(
    players
) {

    const list =
        document.getElementById(
            "playerList"
        );

    list.innerHTML = "";

    for (
        const p of players
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "player";

        div.textContent =
            (
                p.id === myId
                    ? "🔴 "
                    : "🔵 "
            ) +
            p.name;

        list.appendChild(
            div
        );

    }

    const status =
        document.getElementById(
            "roomStatus"
        );

    if (
        players.length >= 2
    ) {

        status.textContent =
            isHost
                ? "Both climbers ready. Start the climb!"
                : "Waiting for host to start...";

    } else {

        status.textContent =
            "Waiting for another climber...";

    }

}

/* =========================================================
   PRACTICE
========================================================= */

function startPractice() {

    practiceMode =
        true;

    isHost =
        true;

    myId =
        "practice";

    localPlayer.id =
        myId;

    localPlayer.name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim() ||
        "Coolio";

    remotePlayer =
        createPlayer(
            "practiceFriend",
            "Training Buddy",
            "#4e8cff",
            360,
            500
        );

    beginGame();

}

/* =========================================================
   BEGIN GAME
========================================================= */

function beginGame(
    players
) {

    if (
        players
    ) {

        for (
            const p of players
        ) {

            if (
                p.id === myId
            ) {

                localPlayer.name =
                    p.name;

                localPlayer.x =
                    p.x ||
                    300;

                localPlayer.y =
                    p.y ||
                    500;

            } else {

                remotePlayer.id =
                    p.id;

                remotePlayer.name =
                    p.name;

                remotePlayer.x =
                    p.x ||
                    360;

                remotePlayer.y =
                    p.y ||
                    500;

            }

        }

    }

    gameStarted =
        true;

    lobby.style.display =
        "none";

    localPlayer.checkpointX =
        localPlayer.x;

    localPlayer.checkpointY =
        localPlayer.y;

    finished =
        false;

    hideMessage();

}

/* =========================================================
   SEND MOVEMENT
========================================================= */

let networkTimer =
    0;

function sendMovement(
    dt
) {

    networkTimer +=
        dt;

    if (
        networkTimer < .04
    ) {
        return;
    }

    networkTimer =
        0;

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN ||
        practiceMode ||
        !gameStarted
    ) {
        return;
    }

    socket.send(
        JSON.stringify({

            type:"move",

            x:localPlayer.x,

            y:localPlayer.y,

            vx:localPlayer.vx,

            vy:localPlayer.vy,

            grounded:
                localPlayer.grounded,

            running:
                localPlayer.running,

            dead:
                localPlayer.dead

        })
    );

}

/* =========================================================
   LOCATION UI
========================================================= */

let lastEnvironment =
    "";

function updateLocationUI() {

    const env =
        getEnvironment(
            localPlayer.x
        );

    if (
        env !== lastEnvironment
    ) {

        lastEnvironment =
            env;

        document.getElementById(
            "location"
        ).textContent =
            environmentName(
                env
            );

    }

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();

function gameLoop(
    now
) {

    const dt =
        Math.min(
            .033,
            (
                now -
                lastTime
            ) /
            1000
        );

    lastTime =
        now;

    updateMovingPlatforms(
        now/1000
    );

    if (
        gameStarted
    ) {

        updateLocalPlayer(
            localPlayer,
            dt
        );

        updateRemote(
            dt
        );

        updateChain(
            dt
        );

        updateCheckpoint(
            localPlayer
        );

        updateCamera(
            dt
        );

        sendMovement(
            dt
        );

        updateLocationUI();

        checkFinish();

    }

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    if (
        gameStarted
    ) {

        drawWorld();

    } else {

        /*
            nice background while lobby
        */

        drawSpaceBackground();

    }

    requestAnimationFrame(
        gameLoop
    );

}

requestAnimationFrame(
    gameLoop
);

/* =========================================================
   START CONNECTION
========================================================= */

connect();

/* =========================================================
   EXTRA ENVIRONMENT DETAIL ANIMATION
========================================================= */

let ambientTime =
    0;

function ambientLoop() {

    ambientTime +=
        .016;

    /*
        subtle background animation
        handled by redraw loop
    */

    requestAnimationFrame(
        ambientLoop
    );

}

ambientLoop();

</script>
