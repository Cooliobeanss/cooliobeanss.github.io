/* =========================================================
   LADDER SYSTEM
   ========================================================= */

function addLadder(x, bottomY, topY) {

    ladders.push({
        x,
        bottomY,
        topY,
        w: 58,
        climbSpeed: 190
    });

}

function nearestLadder() {

    if (!me || me.dead)
        return null;

    let best = null;
    let bestDistance = 90;

    for (const ladder of ladders) {

        const center = ladder.x + ladder.w / 2;

        const playerCenter =
            me.x + me.width / 2;

        const horizontal =
            Math.abs(playerCenter - center);

        const playerBottom =
            me.y + me.height;

        const vertical =
            Math.min(
                Math.abs(playerBottom - ladder.bottomY),
                Math.abs(me.y - ladder.topY),
                Math.abs(me.y - (ladder.bottomY + ladder.topY) / 2)
            );

        if (
            horizontal < 45 &&
            vertical < 90
        ) {

            const distance =
                horizontal + vertical * 0.35;

            if (distance < bestDistance) {
                bestDistance = distance;
                best = ladder;
            }

        }

    }

    return best;
}

/* =========================================================
   COLLISION
   ========================================================= */

function overlap(a, b) {

    return (
        a.x < b.x + b.w &&
        a.x + a.width > b.x &&
        a.y < b.y + b.h &&
        a.y + a.height > b.y
    );

}

/* =========================================================
   LOOT
   ========================================================= */

function addLoot(
    id,
    name,
    icon,
    value,
    x,
    y
) {

    salvageObjects.push({
        id,
        name,
        icon,
        value,
        x,
        y,
        w: 35,
        h: 35,
        carried: false,
        extracted: false,
        holder: null
    });

}

function nearestLoot() {

    if (!me || me.dead)
        return null;

    let best = null;
    let distance = 95;

    for (const item of salvageObjects) {

        if (
            item.extracted ||
            item.carried
        )
            continue;

        const dx =
            item.x -
            me.x;

        const dy =
            item.y -
            me.y;

        const d =
            Math.hypot(dx, dy);

        if (d < distance) {

            distance = d;
            best = item;

        }

    }

    return best;
}

/* =========================================================
   ENEMIES
   ========================================================= */

function addEnemy(
    type,
    x,
    y,
    a,
    b
) {

    enemies.push({
        type,
        x,
        y,
        w: 40,
        h: 45,
        patrolA: Math.min(a, b),
        patrolB: Math.max(a, b),
        dir: Math.random() > 0.5 ? 1 : -1,
        speed:
            type === "stalker"
                ? 105
                : 60,
        alive: true,
        alert: 0,
        attackCooldown: 0,
        health: 100
    });

}

/* =========================================================
   PLAYER
   ========================================================= */

function makePlayer(
    id,
    name,
    x,
    y,
    color
) {

        oxygen: 100,

        dead: false,

        color,

        facing: 1,

        holding: null,

        salvage: 0,

        targetX: x,
        targetY: y,

        climbing: false,
        climbingLadder: null
    };

}

/* =========================================================
   PLAYER UPDATE
   ========================================================= */

function updatePlayer() {

    if (!me || me.dead)
        return;

    /* =====================================================
       LADDER CLIMBING
       ===================================================== */

    if (me.climbing) {

        const ladder =
            me.climbingLadder;

        if (!ladder) {

            me.climbing = false;

        } else {

            const center =
                ladder.x +
                ladder.w / 2;

            me.x =
                center -
                me.width / 2;

            me.vx = 0;

            let climbDirection = 0;

            if (
                keys.KeyW ||
                keys.ArrowUp
            ) {

                climbDirection = -1;

            }

            if (
                keys.KeyS ||
                keys.ArrowDown
            ) {

                climbDirection = 1;

            }

            me.y +=
                climbDirection *
                ladder.climbSpeed *
                dt;

            const top =
                ladder.topY -
                me.height;

            const bottom =
                ladder.bottomY -
                me.height;

            if (me.y <= top) {

                me.y = top;

                me.climbing = false;
                me.climbingLadder = null;

                me.grounded = true;

            }

            if (me.y >= bottom) {

                me.y = bottom;

                me.climbing = false;
                me.climbingLadder = null;

                me.grounded = true;

            }

            return;

        }

    }

    /* =====================================================
       FIND LADDER
       ===================================================== */

    const ladder =
        nearestLadder();

    if (
        ladder &&
        (
            keys.KeyW ||
            keys.ArrowUp
        )
    ) {

        const center =
            ladder.x +
            ladder.w / 2;

        const playerCenter =
            me.x +
            me.width / 2;

        const nearCenter =
            Math.abs(
                playerCenter -
                center
            ) < 48;

        const playerBottom =
            me.y +
            me.height;

        const nearBottom =
            Math.abs(
                playerBottom -
                ladder.bottomY
            ) < 85;

        const inside =
            me.y + me.height >
                ladder.topY &&
            me.y <
                ladder.bottomY;

        if (
            nearCenter &&
            (
                nearBottom ||
                inside
            )
        ) {

            me.climbing = true;
            me.climbingLadder = ladder;

            me.x =
                center -
                me.width / 2;

            me.vx = 0;
            me.vy = 0;

            return;

        }

    }

    /* =====================================================
       DOWNWARD LADDER ENTRY
       ===================================================== */

    if (
        ladder &&
        (
            keys.KeyS ||
            keys.ArrowDown
        )
    ) {

        const center =
            ladder.x +
            ladder.w / 2;

        const playerCenter =
            me.x +
            me.width / 2;

        const nearTop =
            Math.abs(
                me.y -
                (ladder.topY - me.height)
            ) < 55;

        if (
            Math.abs(
                playerCenter - center
            ) < 48 &&
            nearTop
        ) {

            me.climbing = true;
            me.climbingLadder = ladder;

            me.x =
                center -
                me.width / 2;

            me.vx = 0;
            me.vy = 0;

            return;

        }

    }

    /* =====================================================
       NORMAL MOVEMENT
       ===================================================== */

    const left =
        keys.KeyA ||
        keys.ArrowLeft;

    const right =
        keys.KeyD ||
        keys.ArrowRight;

    const sprint =
        keys.ShiftLeft ||
        keys.ShiftRight;

    const speed =
        sprint
            ? 420
            : 260;

    if (left) {

        me.vx -=
            1800 * dt;

        me.facing = -1;

    }

    if (right) {

        me.vx +=
            1800 * dt;

        me.facing = 1;

    }

    if (!left && !right) {

        me.vx *=
            Math.pow(
                0.001,
                dt
            );

    }

    me.vx =
        Math.max(
            -speed,
            Math.min(
                speed,
                me.vx
            )
        );

    /* =====================================================
       JUMP
       ===================================================== */

    if (
        (
            keys.Space ||
            keys.KeyW ||
            keys.ArrowUp
        ) &&
        me.grounded
    ) {

        me.vy = -650;
        me.grounded = false;

    }

    /* =====================================================
       GRAVITY
       ===================================================== */

    me.vy +=
        1800 * dt;

    /* =====================================================
       HORIZONTAL COLLISION
       ===================================================== */

    me.x +=
        me.vx * dt;

    for (const s of solids) {

        if (overlap(me, s)) {

            if (me.vx > 0) {

                me.x =
                    s.x -
                    me.width;

            }

            if (me.vx < 0) {

                me.x =
                    s.x +
                    s.w;

            }

            me.vx = 0;

        }

    }

    /* =====================================================
       VERTICAL COLLISION
       ===================================================== */

    me.grounded = false;

    me.y +=
        me.vy * dt;

    for (const s of solids) {

        if (overlap(me, s)) {

            if (me.vy > 0) {

                me.y =
                    s.y -
                    me.height;

                me.grounded = true;

            }

            if (me.vy < 0) {

                me.y =
                    s.y +
                    s.h;

            }

            me.vy = 0;

        }

    }

    /* =====================================================
       WORLD BOUNDS
       ===================================================== */

    me.x =
        Math.max(
            0,
            Math.min(
                world.width -
                    me.width,
                me.x
            )
        );

    if (me.y > world.height + 200) {

        killPlayer();

    }

}

/* =========================================================
   OXYGEN
   ========================================================= */

function updateOxygen() {

    if (!me || me.dead)
        return;

    const difficulty =
        selectedShip
            ? selectedShip.difficulty
            : 1;

    if (me.x > 1800) {

        me.oxygen -=
            (
                1.2 +
                difficulty * 0.38
            ) * dt;

    } else {

        me.oxygen +=
            4 * dt;

    }

    me.oxygen =
        Math.max(
            0,
            Math.min(
                100,
                me.oxygen
            )
        );

    if (
        me.oxygen <= 0 &&
        !me.dead
    ) {

        me.health -=
            25 * dt;

        if (me.health <= 0) {

            killPlayer();

        }

    }

}

/* =========================================================
   ENEMIES
   ========================================================= */

function updateEnemies() {

    if (!me || me.dead)
        return;

    for (const enemy of enemies) {

        if (!enemy.alive)
            continue;

        enemy.attackCooldown -= dt;

        const distance =
            Math.hypot(
                enemy.x - me.x,
                enemy.y - me.y
            );

        /* STALKER */

        if (
            enemy.type === "stalker" &&
            distance < 330
        ) {

            enemy.alert =
                Math.min(
                    1,
                    enemy.alert +
                    dt * 3
                );

            if (
                me.x >
                enemy.x
            ) {

                enemy.x +=
                    enemy.speed * dt;

            } else {

                enemy.x -=
                    enemy.speed * dt;

            }

        } else {

            enemy.alert =
                Math.max(
                    0,
                    enemy.alert -
                    dt
                );

            enemy.x +=
                enemy.dir *
                enemy.speed *
                dt;

            if (
                enemy.x <
                enemy.patrolA
            ) {

                enemy.x =
                    enemy.patrolA;

                enemy.dir = 1;

            }

            if (
                enemy.x >
                enemy.patrolB
            ) {

                enemy.x =
                    enemy.patrolB;

                enemy.dir = -1;

            }

        }

        /* ATTACK */

        const enemyBox = {
            x: enemy.x,
            y: enemy.y,
            width: enemy.w,
            height: enemy.h
        };

        if (
            overlap(
                me,
                enemyBox
            ) &&
            enemy.attackCooldown <= 0
        ) {

            me.health -=
                enemy.type === "stalker"
                    ? 22
                    : 12;

            enemy.attackCooldown =
                1.1;

            camera.shake = 12;

            if (me.health <= 0) {

                killPlayer();

            }

        }

    }

}

/* =========================================================
   EXTRACTION
   ========================================================= */

function playerInsideExtraction() {

    if (!me)
        return false;

    return (
        me.x + me.width >
            extraction.x &&
        me.x <
            extraction.x +
            extraction.w &&
        me.y + me.height >
            extraction.y &&
        me.y <
            extraction.y +
            extraction.h
    );

}

function beginExtraction() {

    if (
        extraction.active ||
        extraction.completed
    )
        return;

    if (!me || me.dead)
        return;

    if (!playerInsideExtraction()) {

        showMessage(
            "GET INSIDE THE EXTRACTION AIRLOCK"
        );

        return;

    }

    if (!me.holding) {

        showMessage(
            "BRING SALVAGE INTO THE AIRLOCK"
        );

        return;

    }

    extraction.active = true;
    extraction.countdown =
        extraction.duration;

    showMessage(
        "EXTRACTION STARTED · HOLD POSITION"
    );

}

function updateExtraction() {

    if (
        !extraction.active ||
        extraction.completed
    )
        return;

    if (!playerInsideExtraction()) {

        extraction.active = false;
        extraction.countdown = 0;

        showMessage(
            "EXTRACTION CANCELLED"
        );

        return;

    }

    extraction.countdown -= dt;

    if (
        extraction.countdown <= 0
    ) {

        completeExtraction();

    }

}

function completeExtraction() {

    if (extraction.completed)
        return;

    extraction.active = false;
    extraction.completed = true;

    if (me.holding) {

        const item =
            me.holding;

        me.salvage +=
            item.value;

        item.extracted = true;
        item.carried = false;
        item.holder = null;

        item.x = -9999;
        item.y = -9999;

        me.holding = null;

    }

    updateHUD();

    showMessage(
        "✓ SALVAGE EXTRACTED · RETURNING TO ORPHEUS"
    );

    setTimeout(
        returnToOrpheus,
        1800
    );

}

/* =========================================================
   INTERACTION
   ========================================================= */

function interact() {

    if (!me || me.dead)
        return;

    /* Extraction gets priority */

    if (
        playerInsideExtraction()
    ) {

        if (me.holding) {

            beginExtraction();

            return;

        }

    }

    /* Drop held item */

    if (me.holding) {

        dropLoot();

        return;

    }

    /* Pick up */

    const item =
        nearestLoot();

    if (!item)
        return;

    item.carried = true;
    item.holder = me.id;

    me.holding = item;

    showMessage(
        "SALVAGE SECURED · " +
        item.name
    );

}

function dropLoot() {

    if (!me.holding)
        return;

    const item =
        me.holding;

    item.carried = false;
    item.holder = null;

    item.x =
        me.x +
        me.width / 2 +
        me.facing * 45;

    item.y =
        me.y +
        me.height -
        item.h;

    me.holding = null;

}

/* =========================================================
   DEATH
   ========================================================= */

function killPlayer() {

    if (!me || me.dead)
        return;

    me.dead = true;

    me.climbing = false;
    me.climbingLadder = null;

    if (me.holding) {

        const item =
            me.holding;

        item.carried = false;
        item.holder = null;

        item.x = me.x;
        item.y =
            me.y +
            me.height -
            item.h;

        me.holding = null;

    }

    camera.shake = 20;

    showMessage(
        "☠ CREW MEMBER LOST"
    );

    setTimeout(
        respawn,
        1800
    );

}

function respawn() {

    if (!me)
        return;

    me.dead = false;

    me.health = 100;
    me.oxygen = 100;

    me.climbing = false;
    me.climbingLadder = null;

    me.x =
        isHost
            ? 250
            : 350;

    me.y = 820;

    me.vx = 0;
    me.vy = 0;

    showMessage(
        "BACK ON YOUR FEET"
    );

}

/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera() {

    if (!me)
        return;

    const target =
        me.x +
        me.width / 2 -
        W / 2;

    camera.x +=
        (
            target -
            camera.x
        ) *
        Math.min(
            1,
            dt * 7
        );

    camera.x =
        Math.max(
            0,
            Math.min(
                world.width - W,
                camera.x
            )
        );

    if (
        camera.shake > 0
    ) {

        camera.shake *=
            Math.pow(
                0.03,
                dt
            );

    }

}

function sx(x) {
    return x - camera.x;
}

function sy(y) {
    return y;
}

/* =========================================================
   SPACE BACKGROUND
   ========================================================= */

function drawSpace() {

    ctx.fillStyle =
        "#02040a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    for (
        let i = 0;
        i < 180;
        i++
    ) {

        let x =
            (
                i * 271 -
                camera.x * 0.1
            ) %
            (W + 100);

        if (x < 0)
            x += W + 100;

        const y =
            (i * 137) % H;

        ctx.globalAlpha =
            0.25 +
            (i % 5) * 0.1;

        ctx.fillStyle =
            "#dce8ff";

        ctx.fillRect(
            x,
            y,
            1 + (i % 2),
            1 + (i % 2)
        );

    }

    ctx.globalAlpha = 1;

}

/* =========================================================
   SHIP DRAWING
   ========================================================= */

function drawShip() {

    const difficulty =
        selectedShip
            ? selectedShip.difficulty
            : 1;

    /* Hull */

    ctx.fillStyle =
        "#080e17";

    ctx.fillRect(
        sx(0),
        sy(0),
        world.width,
        1080
    );

    /* Interior */

    ctx.fillStyle =
        "#0d1622";

    ctx.fillRect(
        sx(0),
        sy(45),
        world.width,
        855
    );

    /* Wall panels */

    for (
        let x = 0;
        x < world.width;
        x += 120
    ) {

        ctx.fillStyle =
            x % 240 === 0
                ? "#101b29"
                : "#0d1724";

        ctx.fillRect(
            sx(x),
            45,
            108,
            840
        );

        ctx.strokeStyle =
            "#1c2a3d";

        ctx.beginPath();

        ctx.moveTo(
            sx(x + 108),
            45
        );

        ctx.lineTo(
            sx(x + 108),
            885
        );

        ctx.stroke();

    }

    /* Floor */

    ctx.fillStyle =
        "#1a2634";

    ctx.fillRect(
        sx(0),
        900,
        world.width,
        180
    );

    /* Floor panels */

    for (
        let x = 0;
        x < world.width;
        x += 80
    ) {

        ctx.strokeStyle =
            "#293749";

        ctx.beginPath();

        ctx.moveTo(
            sx(x),
            900
        );

        ctx.lineTo(
            sx(x),
            1080
        );

        ctx.stroke();

    }

    /* Ceiling */

    ctx.fillStyle =
        "#080d15";

    ctx.fillRect(
        sx(0),
        0,
        world.width,
        45
    );

    /* Ceiling lights */

    for (
        let x = 30;
        x < world.width;
        x += 160
    ) {

        const broken =
            (
                Math.floor(
                    x / 160
                ) +
                difficulty
            ) %
            Math.max(
                3,
                8 - difficulty
            ) === 0;

        ctx.fillStyle =
            broken
                ? "#22272d"
                : "#718eaf";

        ctx.fillRect(
            sx(x),
            17,
            85,
            7
        );

    }

    /* Deck accent lines */

    for (const ladder of ladders) {

        ctx.strokeStyle =
            "rgba(74,105,135,.22)";

        ctx.beginPath();

        ctx.moveTo(
            sx(ladder.x - 100),
            ladder.topY
        );

        ctx.lineTo(
            sx(ladder.x + ladder.w + 100),
            ladder.topY
        );

        ctx.stroke();

    }

}

/* =========================================================
   LADDERS DRAW
   ========================================================= */

function drawLadders() {

    for (const ladder of ladders) {

        const x =
            sx(ladder.x);

        const top =
            ladder.topY;

        const bottom =
            ladder.bottomY;

        /* Outer rails */

        ctx.strokeStyle =
            "#657b91";

        ctx.lineWidth = 6;

        ctx.beginPath();

        ctx.moveTo(
            x + 7,
            top
        );

        ctx.lineTo(
            x + 7,
            bottom
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            x + ladder.w - 7,
            top
        );

        ctx.lineTo(
            x + ladder.w - 7,
            bottom
        );

        ctx.stroke();

        /* Rungs */

        ctx.strokeStyle =
            "#91a6bb";

        ctx.lineWidth = 4;

        for (
            let y = top + 12;
            y < bottom;
            y += 24
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x + 7,
                y
            );

            ctx.lineTo(
                x + ladder.w - 7,
                y
            );

            ctx.stroke();

        }

        /* Warning lights */

        ctx.fillStyle =
            "#f0b94d";

        ctx.fillRect(
            x - 8,
            top - 8,
            8,
            8
        );

        ctx.fillRect(
            x + ladder.w,
            top - 8,
            8,
            8
        );

    }

}

/* =========================================================
   PROPS
   ========================================================= */

function drawProps() {

    for (const p of props) {

        const x =
            sx(p.x);

        const y =
            sy(p.y);

        if (
            p.type === "window"
        ) {

            ctx.fillStyle =
                "#030914";

            ctx.fillRect(
                x,
                y,
                p.w,
                p.h
            );

            const g =
                ctx.createLinearGradient(
                    x,
                    y,
                    x + p.w,
                    y + p.h
                );

            g.addColorStop(
                0,
                "#183b64"
            );

            g.addColorStop(
                0.5,
                "#07172b"
            );

            g.addColorStop(
                1,
                "#02050b"
            );

            ctx.fillStyle = g;

            ctx.fillRect(
                x + 8,
                y + 8,
                p.w - 16,
                p.h - 16
            );

            for (
                let i = 0;
                i < 8;
                i++
            ) {

                ctx.fillStyle =
                    "#b8d8ff";

                ctx.globalAlpha =
                    0.4;

                ctx.fillRect(
                    x + 20 + i * 31,
                    y + 20 + (i % 4) * 19,
                    2,
                    2
                );

            }

            ctx.globalAlpha = 1;

            ctx.strokeStyle =
                "#40536e";

            ctx.lineWidth = 4;

            ctx.strokeRect(
                x,
                y,
                p.w,
                p.h
            );

        }

        else if (
            p.type === "crate"
        ) {

            ctx.fillStyle =
                "#354456";

            ctx.fillRect(
                x,
                y,
                p.w,
                p.h
            );

            ctx.strokeStyle =
                "#657890";

            ctx.strokeRect(
                x,
                y,
                p.w,
                p.h
            );

            ctx.strokeStyle =
                "#202d3c";

            for (
                let xx = x + 20;
                xx < x + p.w;
                xx += 35
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    xx,
                    y
                );

                ctx.lineTo(
                    xx,
                    y + p.h
                );

                ctx.stroke();

            }

            ctx.fillStyle =
                "#c7a64b";

            ctx.fillRect(
                x + 10,
                y + 10,
                22,
                4
            );

        }

        else if (
            p.type === "console"
        ) {

            ctx.fillStyle =
                "#172536";

            ctx.fillRect(
                x,
                y,
                p.w,
                p.h
            );

            ctx.fillStyle =
                "#050a12";

            ctx.fillRect(
                x + 10,
                y + 10,
                p.w - 20,
                30
            );

            ctx.fillStyle =
                "#59d8ff";

            ctx.fillRect(
                x + 20,
                y + 23,
                p.w - 40,
                3
            );

            ctx.fillStyle =
                "#f0b94d";

            ctx.beginPath();

            ctx.arc(
                x + 25,
                y + 53,
                4,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

        else if (
            p.type === "pipe"
        ) {

            ctx.fillStyle =
                "#394a5c";

            ctx.fillRect(
                x,
                y,
                p.w,
                p.h
            );

            ctx.fillStyle =
                "#596b80";

            ctx.fillRect(
                x - 5,
                y + 25,
                p.w + 10,
                8
            );

        }

        else if (
            p.type === "reactor"
        ) {

            ctx.fillStyle =
                "#101b29";

            ctx.fillRect(
                x,
                y,
                p.w,
                p.h
            );

            ctx.strokeStyle =
                "#4d627d";

            ctx.lineWidth = 4;

            ctx.strokeRect(
                x,
                y,
                p.w,
                p.h
            );

            const cx =
                x + p.w / 2;

            const cy =
                y + 160;

            const glow =
                ctx.createRadialGradient(
                    cx,
                    cy,
                    5,
                    cx,
                    cy,
                    120
                );

            glow.addColorStop(
                0,
                "#dffcff"
            );

            glow.addColorStop(
                0.2,
                "#5bdcff"
            );

            glow.addColorStop(
                0.65,
                "#17466b"
            );

            glow.addColorStop(
                1,
                "#07101a"
            );

            ctx.fillStyle =
                glow;

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                110,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.strokeStyle =
                "#79eaff";

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                85,
                performance.now() * 0.0005,
                performance.now() * 0.0005 +
                Math.PI * 1.5
            );

            ctx.stroke();

        }

        else if (
            p.type === "airlock"
        ) {

            const active =
                playerInsideExtraction();

            ctx.fillStyle =
                active
                    ? "#15352d"
                    : "#0f1b28";

            ctx.fillRect(
                x,
                y,
                p.w,
                p.h
            );

            ctx.strokeStyle =
                active
                    ? "#9dffcf"
                    : "#5be0aa";

            ctx.lineWidth = 4;

            ctx.strokeRect(
                x,
                y,
                p.w,
                p.h
            );

            /* Door */

            ctx.strokeStyle =
                "#405a63";

            ctx.lineWidth = 8;

            ctx.strokeRect(
                x + 35,
                y + 85,
                p.w - 70,
                p.h - 105
            );

            /* Text */

            ctx.fillStyle =
                "#5be0aa";

            ctx.font =
                "bold 17px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                extraction.active
                    ? "EXTRACTING..."
                    : "EXTRACTION",
                x + p.w / 2,
                y + 42
            );

            ctx.font =
                "10px Arial";

            ctx.fillStyle =
                "#6e9a88";

            if (
                extraction.active
            ) {

                ctx.fillText(
                    Math.ceil(
                        extraction.countdown
                    ) +
                    " SECONDS",
                    x + p.w / 2,
                    y + 65
                );

            } else {

                ctx.fillText(
                    "RETURN TO ORPHEUS",
                    x + p.w / 2,
                    y + 65
                );

            }

            ctx.textAlign =
                "left";

        }

    }

}

/* =========================================================
   SOLIDS
   ========================================================= */

function drawSolids() {

    for (const s of solids) {

        const x =
            sx(s.x);

        const y =
            sy(s.y);

        ctx.fillStyle =
            "#293a4e";

        ctx.fillRect(
            x,
            y,
            s.w,
            s.h
        );

        ctx.fillStyle =
            "#526980";

        ctx.fillRect(
            x,
            y,
            s.w,
            5
        );

        /* Warning stripe on platforms */

        if (
            s.h <= 40
        ) {

            ctx.fillStyle =
                "rgba(240,185,77,.22)";

            for (
                let xx = x;
                xx < x + s.w;
                xx += 36
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    xx,
                    y
                );

                ctx.lineTo(
                    xx + 14,
                    y
                );

                ctx.lineTo(
                    xx + 4,
                    y + s.h
                );

                ctx.lineTo(
                    xx - 10,
                    y + s.h
                );

                ctx.closePath();

                ctx.fill();

            }

        }

    }

}

/* =========================================================
   LOOT DRAWING
   ========================================================= */

function drawLoot() {

    for (const item of salvageObjects) {

        if (
            item.extracted ||
            item.carried
        )
            continue;

        const x =
            sx(
                item.x +
                item.w / 2
            );

        const y =
            item.y +
            item.h / 2;

        ctx.globalAlpha =
            0.08;

        ctx.fillStyle =
            "#72aaff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            35,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.globalAlpha = 1;

        ctx.font =
            "27px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            item.icon,
            x,
            y + 9
        );

        if (
            nearestLoot() === item
        ) {

            ctx.font =
                "10px Arial";

            ctx.fillStyle =
                "#d7e4ff";

            ctx.fillText(
                item.name,
                x,
                y + 30
            );

            ctx.fillStyle =
                "#71e6a8";

            ctx.fillText(
                "$" + item.value,
                x,
                y + 43
            );

        }

    }

    if (
        me &&
        me.holding
    ) {

        ctx.font =
            "28px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            me.holding.icon,
            sx(
                me.x +
                me.width / 2
            ),
            me.y - 10
        );

        ctx.textAlign =
            "left";

    }

}

/* =========================================================
   ENEMY DRAWING
   ========================================================= */

function drawEnemies() {

    for (const e of enemies) {

        if (!e.alive)
            continue;

        const x =
            sx(e.x);

        const y =
            e.y;

        ctx.fillStyle =
            "#222a36";

        ctx.beginPath();

        ctx.roundRect(
            x,
            y + 10,
            e.w,
            e.h - 10,
            10
        );

        ctx.fill();

        ctx.fillStyle =
            "#444c5a";

        ctx.beginPath();

        ctx.arc(
            x + e.w / 2,
            y + 12,
            14,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            e.alert
                ? "#ff2540"
                : "#9d3044";

        ctx.fillRect(
            x + 8,
            y + 9,
            6,
            4
        );

        ctx.fillRect(
            x + e.w - 14,
            y + 9,
            6,
            4
        );

    }

}

/* =========================================================
   PLAYER DRAWING
   ========================================================= */

function drawPlayer(p) {

    if (!p || p.dead)
        return;

    const x =
        sx(p.x);

    const y =
        p.y;

    /* Shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        x + p.width / 2,
        y + p.height,
        23,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Backpack */

    ctx.fillStyle =
        "#27374b";

    ctx.fillRect(
        x - 4,
        y + 22,
        9,
        28
    );

    /* Suit */

    ctx.fillStyle =
        p.color;

    ctx.beginPath();

    ctx.roundRect(
        x + 4,
        y + 21,
        p.width - 8,
        p.height - 21,
        8
    );

    ctx.fill();

    /* Chest */

    ctx.fillStyle =
        "#0c1725";

    ctx.fillRect(
        x + 9,
        y + 33,
        p.width - 18,
        13
    );

    ctx.fillStyle =
        "#63dfff";

    ctx.fillRect(
        x + 13,
        y + 37,
        9,
        3
    );

    /* Helmet */

    ctx.fillStyle =
        "#dbe7f7";

    ctx.beginPath();

    ctx.arc(
        x + p.width / 2,
        y + 15,
        16,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Visor */

    ctx.fillStyle =
        "#091321";

    ctx.beginPath();

    ctx.roundRect(
        x + 6,
        y + 9,
        p.width - 12,
        11,
        5
    );

    ctx.fill();

    ctx.fillStyle =
        "#e8f7ff";

    ctx.globalAlpha =
        0.3;

    ctx.fillRect(
        x + 9,
        y + 11,
        9,
        2
    );

    ctx.globalAlpha = 1;

    /* Climbing pose */

    if (p.climbing) {

        ctx.strokeStyle =
            "#eaf2ff";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            x + 4,
            y + 28
        );

        ctx.lineTo(
            x - 8,
            y + 36
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            x + p.width - 4,
            y + 28
        );

        ctx.lineTo(
            x + p.width + 8,
            y + 36
        );

        ctx.stroke();

    }

    /* Name */

    ctx.fillStyle =
        "#eaf2ff";

    ctx.font =
        "bold 11px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        p.name,
        x + p.width / 2,
        y - 10
    );

    ctx.textAlign =
        "left";

}

/* =========================================================
   LIGHTING
   ========================================================= */

function drawLighting() {

    if (!me)
        return;

    const difficulty =
        selectedShip
            ? selectedShip.difficulty
            : 1;

    const px =
        sx(
            me.x +
            me.width / 2
        );

    const py =
        me.y +
        me.height / 2;

    const radius =
        440 -
        difficulty * 45;

    const g =
        ctx.createRadialGradient(
            px,
            py,
            45,
            px,
            py,
            radius
        );

    g.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    g.addColorStop(
        0.5,
        "rgba(0,0,0,.25)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,.82)"
    );

    ctx.fillStyle = g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}

/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

    if (!me)
        return;

    const money =
        document.getElementById(
            "money"
        );

    const hubMoney =
        document.getElementById(
            "hubMoney"
        );

    const oxygen =
        document.getElementById(
            "oxygen"
        );

    const health =
        document.getElementById(
            "health"
        );

    const oxygenFill =
        document.getElementById(
            "oxygenFill"
        );

    const healthFill =
        document.getElementById(
            "healthFill"
        );

    if (money)
        money.textContent =
            "$" + me.salvage;

    if (hubMoney)
        hubMoney.textContent =
            me.salvage;

    if (oxygen)
        oxygen.textContent =
            Math.ceil(
                me.oxygen
            ) + "%";

    if (health)
        health.textContent =
            Math.ceil(
                me.health
            ) + "%";

    if (oxygenFill)
        oxygenFill.style.width =
            me.oxygen + "%";

    if (healthFill)
        healthFill.style.width =
            me.health + "%";

}

/* =========================================================
   INVENTORY
   ========================================================= */

function toggleInventory() {

    const inv =
        document.getElementById(
            "inventory"
        );

    if (!inv)
        return;

    if (
        inv.style.display ===
        "grid"
    ) {

        inv.style.display =
            "none";

    } else {

        inv.style.display =
            "grid";

        const grid =
            document.getElementById(
                "inventoryGrid"
            );

        if (!grid)
            return;

        grid.innerHTML = "";

        const items =
            salvageObjects.filter(
                x =>
                    x.extracted ||
                    (
                        x.carried &&
                        x.holder === myId
                    )
            );

        if (!items.length) {

            grid.innerHTML =
                "<div class='item'>Nothing collected.</div>";

        }

        for (const item of items) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "item";

            div.innerHTML = `
                <div class="item-icon">
                    ${item.icon}
                </div>
                <div class="item-name">
                    ${item.name}
                </div>
                <div class="item-name">
                    VALUE $${item.value}
                </div>
            `;

            grid.appendChild(div);

        }

    }

}

const closeInventory =
    document.getElementById(
        "closeInventory"
    );

if (closeInventory) {

    closeInventory.onclick =
        () => {

            document.getElementById(
                "inventory"
            ).style.display =
                "none";

        };

}

/* =========================================================
   MESSAGES
   ========================================================= */

let messageTimer;

function showMessage(text) {

    const el =
        document.getElementById(
            "message"
        );

    if (!el)
        return;

    el.textContent =
        text;

    el.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                el.classList.remove(
                    "show"
                );

            },
            2200
        );

}

/* =========================================================
   ORPHEUS
   ========================================================= */

const hubCanvas =
    document.getElementById(
        "hubCanvas"
    );

const hubCtx =
    hubCanvas
        ? hubCanvas.getContext("2d")
        : null;

function resizeHub() {

    if (!hubCanvas)
        return;

    hubCanvas.width =
        innerWidth;

    hubCanvas.height =
        innerHeight;

}

addEventListener(
    "resize",
    resizeHub
);

resizeHub();

function drawOrpheus() {

    if (!hubCanvas || !hubCtx)
        return;

    const w =
        hubCanvas.width;

    const h =
        hubCanvas.height;

    hubCtx.fillStyle =
        "#02050b";

    hubCtx.fillRect(
        0,
        0,
        w,
        h
    );

    /* Stars */

    for (
        let i = 0;
        i < 130;
        i++
    ) {

        hubCtx.fillStyle =
            "rgba(180,210,255,.5)";

        hubCtx.fillRect(
            (i * 317) % w,
            (i * 179) % h,
            1,
            1
        );

    }

    const cx =
        w / 2;

    const cy =
        h / 2;

    /* Orpheus */

    hubCtx.fillStyle =
        "#111b2a";

    hubCtx.beginPath();

    hubCtx.moveTo(
        cx - 430,
        cy - 100
    );

    hubCtx.lineTo(
        cx - 250,
        cy - 190
    );

    hubCtx.lineTo(
        cx + 280,
        cy - 160
    );

    hubCtx.lineTo(
        cx + 450,
        cy
    );

    hubCtx.lineTo(
        cx + 260,
        cy + 150
    );

    hubCtx.lineTo(
        cx - 280,
        cy + 170
    );

    hubCtx.lineTo(
        cx - 450,
        cy + 80
    );

    hubCtx.closePath();

    hubCtx.fill();

    hubCtx.strokeStyle =
        "#435977";

    hubCtx.lineWidth = 4;

    hubCtx.stroke();

    /* Cockpit */

    hubCtx.fillStyle =
        "#1b4d70";

    hubCtx.beginPath();

    hubCtx.moveTo(
        cx + 300,
        cy - 65
    );

    hubCtx.lineTo(
        cx + 405,
        cy
    );

    hubCtx.lineTo(
        cx + 300,
        cy + 65
    );

    hubCtx.closePath();

    hubCtx.fill();

    /* Engines */

    for (
        let i = -1;
        i <= 1;
        i++
    ) {

        hubCtx.fillStyle =
            "#61d9ff";

        hubCtx.beginPath();

        hubCtx.arc(
            cx - 400,
            cy + i * 60,
            14,
            0,
            Math.PI * 2
        );

        hubCtx.fill();

    }

    /* Hangar */

    hubCtx.fillStyle =
        "#08101c";

    hubCtx.fillRect(
        0,
        h * 0.73,
        w,
        h * 0.27
    );

}

function hubLoop() {

    const hub =
        document.getElementById(
            "hub"
        );

    if (
        hub &&
        !hub.classList.contains(
            "hidden"
        )
    ) {

        drawOrpheus();

    }

    requestAnimationFrame(
        hubLoop
    );

}

hubLoop();

        .getElementById(

        selectedShip.type;

    if (!me) {

            makePlayer(
                myId || "local",
                practiceMode
                    ? "You"
                    : "Crew",
                isHost
                    ? 250
                    : 350,
                820,
                isHost
                    ? "#ff526c"
                    : "#648cff"
            );

        players[
            me.id
        ] = me;

    }

    me.dead = false;
    me.health = 100;
    me.oxygen = 100;

    me.salvage = 0;

    me.climbing = false;
    me.climbingLadder = null;

    me.x =
        isHost
            ? 250
            : 350;

    me.y = 820;

    me.vx = 0;
    me.vy = 0;

        "BOARDING " +

    );

/* =========================================================
   NETWORK
   ========================================================= */

function connect() {

    try {

        socket =
            new WebSocket(
                SERVER
            );

        socket.onopen =
            () => {

                const status =
                    document.getElementById(
                        "connectionStatus"
                    );

                if (status) {

                    status.textContent =
                        "● SERVER ONLINE";

                }

            };

        socket.onclose =
            () => {

                const status =
                    document.getElementById(
                        "connectionStatus"
                    );

                if (status) {

                    status.textContent =
                        "○ SERVER OFFLINE · PRACTICE STILL WORKS";

                }

            };

        socket.onerror =
            () => {

                const status =
                    document.getElementById(
                        "connectionStatus"
                    );

                if (status) {

                    status.textContent =
                        "NETWORK ERROR";

                }

            };

        socket.onmessage =
            handleServerMessage;

    } catch (err) {

        console.error(err);

    }

}

function send(data) {

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(
                data
            )
        );

    }

}

/* =========================================================
   SERVER MESSAGES
   ========================================================= */

function handleServerMessage(
    event
) {

    let data;

    try {

        data =
            JSON.parse(
                event.data
            );

    } catch {

        return;

    }

    if (
        data.type ===
        "connected"
    ) {

        myId =
            data.id;

    }

    if (
        data.type ===
            "roomCreated" ||
        data.type ===
            "roomJoined" ||
        data.type ===
            "joined"
    ) {

        room =
            data.room;

        isHost =
            data.type ===
            "roomCreated";

        showRoom();

    }

    if (
        data.type ===
            "playerJoined" ||
        data.type ===
            "playerMoved" ||
        data.type ===
            "playerUpdate"
    ) {

        receiveRemote(
            data
        );

    }

    if (
        data.type ===
        "gameStart"
    ) {

        showOrpheus();

    }

    if (
        data.type ===
        "playerLeft"
    ) {

        delete players[
            data.id
        ];

    }

    if (
        data.type ===
        "error"
    ) {

        showMessage(
            data.message ||
            "SERVER ERROR"
        );

    }

}

/* =========================================================
   REMOTE PLAYERS
   ========================================================= */

function receiveRemote(
    data
) {

    if (
        !data.id ||
        data.id === myId
    )
        return;

    let p =
        players[
            data.id
        ];

    if (!p) {

        p =
            makePlayer(
                data.id,
                data.name ||
                    "CREW",
                data.x ||
                    350,
                data.y ||
                    820,
                data.color ||
                    "#648cff"
            );

        players[
            data.id
        ] = p;

    }

    p.targetX =
        data.x ??
        p.x;

    p.targetY =
        data.y ??
        p.y;

    p.dead =
        !!data.dead;

}

/* =========================================================
   REMOTE INTERPOLATION
   ========================================================= */

function updateRemote() {

    for (
        const id in players
    ) {

        if (
            id === myId
        )
            continue;

        const p =
            players[id];

        p.x +=
            (
                p.targetX -
                p.x
            ) *
            Math.min(
                1,
                dt * 12
            );

        p.y +=
            (
                p.targetY -
                p.y
            ) *
            Math.min(
                1,
                dt * 12
            );

    }

}

/* =========================================================
   NETWORK SEND
   ========================================================= */

let networkTimer = 0;

function updateNetwork() {

    if (
        practiceMode ||
        !me
    )
        return;

    networkTimer +=
        dt;

    if (
        networkTimer < 0.05
    )
        return;

    networkTimer = 0;

    send({

        type: "move",

        x: me.x,
        y: me.y,

        vx: me.vx,
        vy: me.vy,

        grounded:
            me.grounded,

        running:
            Math.abs(
                me.vx
            ) > 300,

        dead:
            me.dead

    });

}

/* =========================================================
   KEYBOARD
   ========================================================= */

addEventListener(
    "keydown",
    e => {

        keys[e.code] =
            true;

        if (
            e.code ===
                "Space" ||
            e.code ===
                "ArrowUp" ||
            e.code ===
                "ArrowDown" ||
            e.code ===
                "Tab"
        ) {

            e.preventDefault();

        }

        if (
            e.code ===
            "KeyE"
        ) {

            if (
                gameStarted
            ) {

                interact();

            }

        }

        if (
            e.code ===
            "Tab"
        ) {

            if (
                gameStarted
            ) {

                toggleInventory();

            }

        }

    }
);

addEventListener(
    "keyup",
    e => {

        keys[e.code] =
            false;

    }
);

/* =========================================================
   INTERACTION HUD
   ========================================================= */

function updateInteractionUI() {

    const interaction =
        document.getElementById(
            "interaction"
        );

    if (
        !interaction ||
        !me ||
        me.dead
    )
        return;

    if (
        extraction.active
    ) {

        interaction.textContent =
            "EXTRACTING · " +
            Math.ceil(
                extraction.countdown
            ) +
            "s";

        interaction.classList.add(
            "show"
        );

        return;

    }

    if (
        playerInsideExtraction()
    ) {

        if (me.holding) {

            interaction.textContent =
                "E — EXTRACT " +
                me.holding.name;

        } else {

            interaction.textContent =
                "BRING SALVAGE HERE";

        }

        interaction.classList.add(
            "show"
        );

        return;

    }

    if (me.climbing) {

        interaction.textContent =
            "W / S — CLIMB";

        interaction.classList.add(
            "show"
        );

        return;

    }

    const ladder =
        nearestLadder();

    if (ladder) {

        interaction.textContent =
            "W / S — USE LADDER";

        interaction.classList.add(
            "show"
        );

    }

    if (me.holding) {

        interaction.textContent =
            "E — DROP " +
            me.holding.name;

        interaction.classList.add(
            "show"
        );

        return;

    }

    const item =
        nearestLoot();

    if (item) {

        interaction.textContent =
            "E — PICK UP " +
            item.name +
            " · $" +
            item.value;

        interaction.classList.add(
            "show"
        );

        return;

    }

    if (!ladder) {

        interaction.classList.remove(
            "show"
        );

    }

}

/* =========================================================
   MAIN RENDER
   ========================================================= */

function render() {

    drawSpace();

    if (!gameStarted)
        return;

    updateCamera();

    const shakeX =
        camera.shake
            ? (
                Math.random() -
                0.5
            ) *
            camera.shake
            : 0;

    const shakeY =
        camera.shake
            ? (
                Math.random() -
                0.5
            ) *
            camera.shake
            : 0;

    ctx.save();

    ctx.translate(
        shakeX,
        shakeY
    );

    drawShip();

    drawProps();

    drawSolids();

    drawLadders();

    drawLoot();

    drawEnemies();

    for (
        const id in players
    ) {

        drawPlayer(
            players[id]
        );

    }

    drawLighting();

    ctx.restore();

}

/* =========================================================
   MAIN LOOP
   ========================================================= */

function loop(now) {

    dt =
        Math.min(
            0.033,
            (
                now -
                lastTime
            ) / 1000
        );

    lastTime =
        now;

    if (
        gameStarted &&
        me
    ) {

        updatePlayer();

        updateRemote();

        updateEnemies();

        updateOxygen();

        updateExtraction();

        updateNetwork();

        updateHUD();

        updateInteractionUI();

    }

    render();

    requestAnimationFrame(
        loop
    );

}

/* =========================================================
   START
   ========================================================= */

buildShipCards();

connect();

requestAnimationFrame(
    loop
);
