<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Supermarket Tycoon</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#10131a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}
button{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    font-weight:bold;
    cursor:pointer;
    background:#242a36;
    color:white;
}
button:hover{background:#343c4c}
button.green{background:#22a55b}
button.green:hover{background:#2fc76f}
button.red{background:#c43d45}
button.blue{background:#287bd6}

#menu{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#26354c,#10131a 70%);
}
.menuBox{
    width:480px;
    padding:45px;
    border-radius:20px;
    background:#181d27;
    box-shadow:0 20px 70px #0008;
    text-align:center;
}
.menuBox h1{
    margin:0 0 8px;
    font-size:48px;
}
.menuBox p{color:#9da7b7}
.menuButtons{
    display:grid;
    gap:12px;
    margin-top:30px;
}
.menuButtons button{
    font-size:18px;
    padding:16px;
}

#game{
    display:none;
    width:100vw;
    height:100vh;
}

#topbar{
    height:65px;
    background:#171c25;
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 12px;
    border-bottom:2px solid #303744;
}
.stat{
    background:#222936;
    border-radius:8px;
    padding:9px 13px;
    min-width:115px;
}
.stat small{
    display:block;
    color:#8993a3;
    font-size:11px;
}
.stat strong{
    font-size:16px;
}
#objective{
    flex:1;
}
#objectiveText{
    color:#8fd8ff;
}

#main{
    display:flex;
    height:calc(100vh - 65px);
}

#toolbar{
    width:125px;
    background:#171c25;
    border-right:2px solid #303744;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}
.toolTitle{
    color:#8993a3;
    font-size:12px;
    margin:4px;
}
.tool{
    width:100%;
    font-size:12px;
}
.tool.active{
    outline:2px solid #61b5ff;
    background:#263c55;
}

#canvasWrap{
    position:relative;
    flex:1;
    background:#111;
}
canvas{
    display:block;
    width:100%;
    height:100%;
}

#side{
    width:270px;
    background:#171c25;
    border-left:2px solid #303744;
    padding:12px;
    overflow-y:auto;
}
.panelTitle{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}
.sideButton{
    width:100%;
    margin-bottom:8px;
    text-align:left;
}

#toast{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#151a22;
    padding:13px 20px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    box-shadow:0 5px 25px #0008;
    z-index:20;
}
#toast.show{opacity:1}

.modal{
    position:absolute;
    inset:0;
    background:#0009;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:30;
}
.modalBox{
    width:600px;
    max-height:80vh;
    overflow:auto;
    background:#181d27;
    border:1px solid #3a4352;
    border-radius:15px;
    padding:25px;
    box-shadow:0 20px 80px #000;
}
.modalBox h2{margin-top:0}
.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    background:#222936;
    border-radius:8px;
    margin-bottom:8px;
}
.rowInfo{flex:1}
.rowInfo small{
    display:block;
    color:#909aaa;
}
input{
    width:90px;
    padding:9px;
    border:0;
    border-radius:6px;
    background:#0e1218;
    color:white;
}
.close{
    float:right;
}
.good{color:#57d98a}
.bad{color:#ff6868}
.gold{color:#ffd75e}

#employeePanel{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #333b49;
}
.employee{
    background:#222936;
    padding:9px;
    border-radius:7px;
    margin-bottom:6px;
    font-size:12px;
}
.employee small{color:#8f99aa}

#hint{
    position:absolute;
    left:12px;
    bottom:12px;
    background:#111822dd;
    border:1px solid #344052;
    border-radius:8px;
    padding:8px 12px;
    color:#b6c0cf;
    font-size:12px;
}
</style>
</head>

<body>

<div id="menu">
    <div class="menuBox">
        <h1>🛒 Supermarket Tycoon</h1>
        <p>Build it. Stock it. Open it. Get RICH.</p>

        <div class="menuButtons">
            <button class="green" onclick="newGame()">NEW GAME</button>
            <button onclick="continueGame()">CONTINUE</button>
            <button onclick="showSettings()">SETTINGS</button>
            <button class="red" onclick="resetSave()">RESET SAVE</button>
        </div>
    </div>
</div>

<div id="game">

    <div id="topbar">

        <div class="stat">
            <small>CASH</small>
            <strong id="cash">$10,000</strong>
        </div>

        <div class="stat">
            <small>RATING</small>
            <strong id="rating">3.5 ⭐</strong>
        </div>

        <div class="stat">
            <small>DAY</small>
            <strong id="day">1</strong>
        </div>

        <div class="stat">
            <small>LEVEL</small>
            <strong id="level">1</strong>
        </div>

        <div class="stat">
            <small>TIME</small>
            <strong id="clock">8:00 AM</strong>
        </div>

        <div class="stat">
            <small>CUSTOMERS</small>
            <strong id="customerCount">0</strong>
        </div>

        <div class="stat" id="objective">
            <small>OBJECTIVE</small>
            <strong id="objectiveText">Open your supermarket</strong>
        </div>

    </div>

    <div id="main">

        <div id="toolbar">

            <div class="toolTitle">BUILD</div>

            <button class="tool" data-build="shelf">Shelf<br>$150</button>
            <button class="tool" data-build="fridge">Fridge<br>$450</button>
            <button class="tool" data-build="checkout">Checkout<br>$500</button>
            <button class="tool" data-build="storage">Storage<br>$200</button>
            <button class="tool" data-build="cart">Cart Station<br>$250</button>
            <button class="tool" data-build="light">Light<br>$75</button>
            <button class="tool" data-build="decor">Decor<br>$100</button>
            <button class="tool red" data-build="delete">Delete</button>

            <div class="toolTitle">PLAYER</div>
            <button onclick="centerPlayer()">Center</button>

        </div>

        <div id="canvasWrap">

            <canvas id="canvas"></canvas>

            <div id="hint">
                WASD / Arrow Keys = Move • Click = Build
            </div>

            <div id="toast"></div>

            <div class="modal" id="modal">
                <div class="modalBox" id="modalContent"></div>
            </div>

        </div>

        <div id="side">

            <div class="panelTitle">🏪 Store</div>

            <button class="sideButton green" onclick="openStore()">
                ▶ Open Store
            </button>

            <button class="sideButton" onclick="productsModal()">
                💵 Products & Pricing
            </button>

            <button class="sideButton" onclick="inventoryModal()">
                📦 Inventory
            </button>

            <button class="sideButton" onclick="employeesModal()">
                👷 Employees
            </button>

            <button class="sideButton" onclick="expansionModal()">
                🏗️ Expand Store
            </button>

            <button class="sideButton" onclick="reportModal()">
                📊 Daily Report
            </button>

            <button class="sideButton" onclick="saveGame()">
                💾 Save Game
            </button>

            <button class="sideButton" onclick="mainMenu()">
                🏠 Main Menu
            </button>

            <div id="employeePanel"></div>

        </div>

    </div>

</div>

<script>
/* =========================================================
   SUPERMARKET TYCOON V2
   ========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const TILE=32;

let state={
    cash:10000,
    debt:0,
    xp:0,
    level:1,
    rating:3.5,
    day:1,

    storeW:20,
    storeH:15,

    open:false,
    minutes:480,

    revenueToday:0,
    costsToday:0,
    wagesToday:0,
    customersToday:0,

    customers:[],
    employees:[],
    buildings:[],

    player:{
        x:10,
        y:12,
        speed:4
    },

    selectedBuild:null,
    mouseX:0,
    mouseY:0,

    objective:0,

    products:{
        Bread:{cost:1.20,price:2.49,stock:20,max:40},
        Cereal:{cost:2.40,price:4.49,stock:15,max:30},
        Chips:{cost:1.10,price:2.29,stock:20,max:40},
        Cookies:{cost:1.30,price:2.79,stock:15,max:30},
        Pasta:{cost:.90,price:1.99,stock:20,max:40},
        Water:{cost:.30,price:.99,stock:30,max:60},
        Soda:{cost:.70,price:1.79,stock:25,max:50},
        Juice:{cost:1.10,price:2.49,stock:15,max:30},
        Apples:{cost:.45,price:.99,stock:25,max:50},
        Bananas:{cost:.35,price:.89,stock:25,max:50}
    }
};

const productNames=Object.keys(state.products);

const employeeTypes={
    cashier:{
        name:"Cashier",
        hire:100,
        wage:18,
        color:"#55aaff"
    },
    stocker:{
        name:"Stocker",
        hire:150,
        wage:17,
        color:"#55dd88"
    },
    cleaner:{
        name:"Cleaner",
        hire:125,
        wage:16,
        color:"#dddd66"
    },
    security:{
        name:"Security",
        hire:200,
        wage:20,
        color:"#dd6688"
    },
    manager:{
        name:"Manager",
        hire:500,
        wage:30,
        color:"#cc77ff"
    }
};

const objectives=[
    {text:"Open your supermarket",reward:500},
    {text:"Sell 10 products",reward:250},
    {text:"Make $500 profit",reward:500},
    {text:"Serve 10 customers",reward:300},
    {text:"Stock 100 products",reward:400},
    {text:"Hire your first employee",reward:750},
    {text:"Reach 4.0 stars",reward:1000},
    {text:"Make $1,000 daily profit",reward:1500},
    {text:"Expand your store",reward:2000},
    {text:"Reach Level 3",reward:3000}
];

/* =========================
   BASIC FUNCTIONS
   ========================= */

function money(n){
    return "$"+Math.round(n).toLocaleString();
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function toast(text){
    const t=document.getElementById("toast");
    t.textContent=text;
    t.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

function updateUI(){
    document.getElementById("cash").textContent=money(state.cash);
    document.getElementById("rating").textContent=state.rating.toFixed(1)+" ⭐";
    document.getElementById("day").textContent=state.day;
    document.getElementById("level").textContent=state.level;

    let h=Math.floor(state.minutes/60);
    let m=Math.floor(state.minutes%60);
    let am=h<12;
    let displayH=h%12;
    if(displayH===0)displayH=12;

    document.getElementById("clock").textContent=
        displayH+":"+String(m).padStart(2,"0")+" "+(am?"AM":"PM");

    document.getElementById("customerCount").textContent=
        state.customers.length;

    document.getElementById("objectiveText").textContent=
        objectives[Math.min(state.objective,objectives.length-1)].text;

    renderEmployees();
}

/* =========================
   MENU / SAVE
   ========================= */

function newGame(){
    localStorage.removeItem("supermarket_tycoon_v2");

    state={
        cash:10000,
        debt:0,
        xp:0,
        level:1,
        rating:3.5,
        day:1,
        storeW:20,
        storeH:15,
        open:false,
        minutes:480,
        revenueToday:0,
        costsToday:0,
        wagesToday:0,
        customersToday:0,
        customers:[],
        employees:[],
        buildings:[],
        player:{x:10,y:12,speed:4},
        selectedBuild:null,
        mouseX:0,
        mouseY:0,
        objective:0,
        products:{
            Bread:{cost:1.20,price:2.49,stock:20,max:40},
            Cereal:{cost:2.40,price:4.49,stock:15,max:30},
            Chips:{cost:1.10,price:2.29,stock:20,max:40},
            Cookies:{cost:1.30,price:2.79,stock:15,max:30},
            Pasta:{cost:.90,price:1.99,stock:20,max:40},
            Water:{cost:.30,price:.99,stock:30,max:60},
            Soda:{cost:.70,price:1.79,stock:25,max:50},
            Juice:{cost:1.10,price:2.49,stock:15,max:30},
            Apples:{cost:.45,price:.99,stock:25,max:50},
            Bananas:{cost:.35,price:.89,stock:25,max:50}
        }
    };

    startingBuildings();

    document.getElementById("menu").style.display="none";
    document.getElementById("game").style.display="block";

    updateUI();
    saveGame();
    toast("New supermarket created! 🛒");
}

function continueGame(){
    let saved=localStorage.getItem("supermarket_tycoon_v2");

    if(!saved){
        toast("No save found!");
        return;
    }

    try{
        state=JSON.parse(saved);
        state.customers ||= [];
        state.employees ||= [];
        state.buildings ||= [];
        state.products ||= {};
        state.player ||= {x:10,y:12,speed:4};

        document.getElementById("menu").style.display="none";
        document.getElementById("game").style.display="block";

        updateUI();
        toast("Save loaded!");
    }catch(e){
        toast("Save file is corrupted.");
    }
}

function saveGame(){
    localStorage.setItem(
        "supermarket_tycoon_v2",
        JSON.stringify(state)
    );
    toast("Game saved 💾");
}

function resetSave(){
    if(confirm("Delete your supermarket save?")){
        localStorage.removeItem("supermarket_tycoon_v2");
        toast("Save deleted.");
    }
}

function mainMenu(){
    saveGame();
    state.open=false;
    document.getElementById("game").style.display="none";
    document.getElementById("menu").style.display="flex";
}

function showSettings(){
    alert(
        "SETTINGS\n\n"+
        "V2\n"+
        "Autosave: ON\n"+
        "Controls: WASD / Arrow Keys\n"+
        "More settings coming later!"
    );
}

/* =========================
   STARTING BUILDINGS
   ========================= */

function startingBuildings(){
    state.buildings=[
        {type:"shelf",x:6,y:5},
        {type:"shelf",x:10,y:5},
        {type:"shelf",x:14,y:5},
        {type:"fridge",x:6,y:9},
        {type:"checkout",x:15,y:12},
        {type:"storage",x:3,y:11},
        {type:"storage",x:3,y:13},
        {type:"cart",x:16,y:13},
        {type:"light",x:5,y:3},
        {type:"light",x:10,y:3},
        {type:"light",x:15,y:3},
        {type:"light",x:18,y:7},
        {type:"decor",x:18,y:3}
    ];
}

/* =========================
   BUILDING
   ========================= */

const buildInfo={
    shelf:{price:150,w:1,h:2},
    fridge:{price:450,w:2,h:1},
    checkout:{price:500,w:2,h:1},
    storage:{price:200,w:2,h:1},
    cart:{price:250,w:1,h:1},
    light:{price:75,w:1,h:1},
    decor:{price:100,w:1,h:1}
};

document.querySelectorAll(".tool").forEach(btn=>{
    btn.addEventListener("click",()=>{
        const type=btn.dataset.build;

        document.querySelectorAll(".tool")
            .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        state.selectedBuild=type;

        if(type==="delete"){
            toast("Click a building to delete it.");
        }else{
            toast("Click inside the store to place it.");
        }
    });
});

function canPlace(type,x,y){
    const info=buildInfo[type];

    if(
        x<1 ||
        y<1 ||
        x+info.w>state.storeW-1 ||
        y+info.h>state.storeH-1
    ) return false;

    for(const b of state.buildings){
        const bi=buildInfo[b.type];

        if(
            x < b.x+bi.w &&
            x+info.w > b.x &&
            y < b.y+bi.h &&
            y+info.h > b.y
        ){
            return false;
        }
    }

    return true;
}

function placeBuilding(type,x,y){
    const info=buildInfo[type];

    if(state.cash<info.price){
        toast("Not enough money!");
        return;
    }

    if(!canPlace(type,x,y)){
        toast("That space is occupied!");
        return;
    }

    state.cash-=info.price;

    state.buildings.push({
        type,
        x,
        y
    });

    state.costsToday+=info.price;

    toast("Built "+type+"!");
    updateUI();
    saveGame();
}

function deleteBuilding(x,y){
    for(let i=state.buildings.length-1;i>=0;i--){
        const b=state.buildings[i];
        const bi=buildInfo[b.type];

        if(
            x>=b.x &&
            x<b.x+bi.w &&
            y>=b.y &&
            y<b.y+bi.h
        ){
            if(["shelf","fridge","checkout"].includes(b.type)){
                if(!confirm("Delete this "+b.type+"?")){
                    return;
                }
            }

            state.buildings.splice(i,1);
            toast("Building removed.");
            saveGame();
            return;
        }
    }

    toast("Nothing there.");
}

/* =========================
   CANVAS
   ========================= */

function resizeCanvas(){
    canvas.width=canvas.clientWidth;
    canvas.height=canvas.clientHeight;
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

canvas.addEventListener("mousemove",e=>{
    const rect=canvas.getBoundingClientRect();

    state.mouseX=e.clientX-rect.left;
    state.mouseY=e.clientY-rect.top;
});

canvas.addEventListener("click",e=>{
    if(!state.selectedBuild)return;

    const rect=canvas.getBoundingClientRect();

    const x=Math.floor(
        (e.clientX-rect.left)/TILE
    );

    const y=Math.floor(
        (e.clientY-rect.top)/TILE
    );

    if(state.selectedBuild==="delete"){
        deleteBuilding(x,y);
    }else{
        placeBuilding(state.selectedBuild,x,y);
    }
});

function draw(){
    const scale=Math.min(
        canvas.width/(state.storeW*TILE+400),
        canvas.height/(state.storeH*TILE+150)
    );

    ctx.save();

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const ox=70;
    const oy=70;

    drawOutside(ox,oy);

    drawStore(ox,oy);

    drawBuildings(ox,oy);

    drawCustomers(ox,oy);

    drawEmployees(ox,oy);

    drawPlayer(ox,oy);

    if(state.selectedBuild){
        drawBuildPreview(ox,oy);
    }

    ctx.restore();
}

function drawOutside(ox,oy){
    ctx.fillStyle="#18351f";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // road
    ctx.fillStyle="#30343b";
    ctx.fillRect(
        0,
        oy+state.storeH*TILE+80,
        canvas.width,
        120
    );

    // parking
    ctx.fillStyle="#4a4e55";
    ctx.fillRect(
        0,
        oy+state.storeH*TILE,
        canvas.width,
        80
    );

    ctx.strokeStyle="#ddd";
    ctx.globalAlpha=.4;

    for(let x=0;x<canvas.width;x+=55){
        ctx.beginPath();
        ctx.moveTo(x,oy+state.storeH*TILE+10);
        ctx.lineTo(x+35,oy+state.storeH*TILE+10);
        ctx.stroke();
    }

    ctx.globalAlpha=1;

    // trees
    for(let x=20;x<canvas.width;x+=150){
        ctx.fillStyle="#704b31";
        ctx.fillRect(x,oy+30,10,20);

        ctx.fillStyle="#29763c";
        ctx.beginPath();
        ctx.arc(x+5,oy+25,22,0,Math.PI*2);
        ctx.fill();
    }
}

function drawStore(ox,oy){
    const w=state.storeW*TILE;
    const h=state.storeH*TILE;

    ctx.fillStyle="#d4c7a2";
    ctx.fillRect(ox,oy,w,h);

    // floor grid
    ctx.strokeStyle="#c3b694";
    ctx.lineWidth=1;

    for(let x=0;x<=w;x+=TILE){
        ctx.beginPath();
        ctx.moveTo(ox+x,oy);
        ctx.lineTo(ox+x,oy+h);
        ctx.stroke();
    }

    for(let y=0;y<=h;y+=TILE){
        ctx.beginPath();
        ctx.moveTo(ox,oy+y);
        ctx.lineTo(ox+w,oy+y);
        ctx.stroke();
    }

    // walls
    ctx.fillStyle="#26313e";
    ctx.fillRect(ox,oy,w,8);
    ctx.fillRect(ox,oy,8,h);
    ctx.fillRect(ox+w-8,oy,8,h);
    ctx.fillRect(ox,oy+h-8,w,8);

    // entrance
    ctx.fillStyle="#5ed2ff";
    ctx.fillRect(
        ox+w/2-35,
        oy+h-10,
        70,
        14
    );

    ctx.fillStyle="#fff";
    ctx.font="bold 18px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        "SUPERMARKET",
        ox+w/2,
        oy-20
    );
}

function drawBuildings(ox,oy){

    for(const b of state.buildings){

        const x=ox+b.x*TILE;
        const y=oy+b.y*TILE;
        const info=buildInfo[b.type];

        let color="#777";

        if(b.type==="shelf")color="#8b5a32";
        if(b.type==="fridge")color="#57a8c8";
        if(b.type==="checkout")color="#ad7043";
        if(b.type==="storage")color="#655a4d";
        if(b.type==="cart")color="#b5b9bf";
        if(b.type==="light")color="#fff3a3";
        if(b.type==="decor")color="#b27de2";

        ctx.fillStyle=color;

        ctx.fillRect(
            x+2,
            y+2,
            info.w*TILE-4,
            info.h*TILE-4
        );

        ctx.strokeStyle="#222";
        ctx.lineWidth=2;
        ctx.strokeRect(
            x+2,
            y+2,
            info.w*TILE-4,
            info.h*TILE-4
        );

        ctx.fillStyle="#fff";
        ctx.font="bold 11px Arial";
        ctx.textAlign="center";

        let symbol={
            shelf:"SHELF",
            fridge:"FRIDGE",

function drawPlayer(ox,oy){

    const y=oy+state.player.y*TILE+TILE/2;

    ctx.fillStyle="#ffce55";
    ctx.beginPath();

    ctx.fill();

    ctx.fillStyle="#1c2530";
    ctx.beginPath();
    ctx.arc(x,y-3,4,0,Math.PI*2);

function drawCustomers(ox,oy){

    for(const c of state.customers){

        const x=ox+c.x*TILE+TILE/2;
        const y=oy+c.y*TILE+TILE/2;

        ctx.fillStyle=c.color;
        ctx.beginPath();
        ctx.arc(x,y,8,0,Math.PI*2);

        if(c.state==="queue"){

            ctx.strokeRect(x-10,y-10,20,20);

function drawEmployees(ox,oy){

        const x=ox+e.x*TILE+TILE/2;
        const y=oy+e.y*TILE+TILE/2;

        ctx.fillStyle=employeeTypes[e.type].color;

        ctx.beginPath();
        ctx.arc(x,y,9,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#111";
        ctx.font="bold 9px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            e.type[0].toUpperCase(),
            x,
            y+3
        );
    }
}

function drawBuildPreview(ox,oy){

    if(!buildInfo[state.selectedBuild])return;

    const info=buildInfo[state.selectedBuild];

    const x=Math.floor(
        (state.mouseX-ox)/TILE
    );

    const y=Math.floor(
        (state.mouseY-oy)/TILE
    );

    if(x<0||y<0)return;

    ctx.fillStyle=
        canPlace(state.selectedBuild,x,y)
        ? "#4cff8866"
        : "#ff444466";

    ctx.fillRect(
        ox+x*TILE,
        oy+y*TILE,
        info.w*TILE,
        info.h*TILE
    );
}

let keys={};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function movePlayer(dt){

    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"])dy--;
    if(keys["s"]||keys["arrowdown"])dy++;
    if(keys["a"]||keys["arrowleft"])dx--;
    if(keys["d"]||keys["arrowright"])dx++;

    if(dx||dy){
        const len=Math.hypot(dx,dy);
        dx/=len;
        dy/=len;

        state.player.x+=dx*state.player.speed*dt;
        state.player.y+=dy*state.player.speed*dt;
    }

    state.player.x=clamp(
        state.player.x,
        1,
        state.storeW-2
    );

    state.player.y=clamp(
        state.player.y,
        1,
        state.storeH-2
    );
}

function centerPlayer(){
    state.player.x=state.storeW/2;
    state.player.y=state.storeH-2;
}

function orderProduct(name,amount){

    const p=state.products[name];

    const actual=Math.min(
        amount,
        p.max-p.stock
    );

    if(actual<=0){
        toast("Storage is full for "+name+"!");
        return;
    }

    const cost=actual*p.cost;

    if(state.cash<cost){
        toast("Not enough money!");
        return;
    }

    state.cash-=cost;
    p.stock+=actual;

    state.costsToday+=cost;

    toast(
        "Ordered "+actual+" "+name
    );

    inventoryModal();
    updateUI();
    saveGame();
}

   ========================= */

function updateEmployees(dt){

    if(!state.open)return;

    for(const e of state.employees){

        e.workTimer-=dt;

        if(e.workTimer<=0){

            e.targetX=
                2+
                Math.random()*
                (state.storeW-4);

            e.targetY=
                2+
                Math.random()*
                (state.storeH-4);

            e.workTimer=
                3+
                Math.random()*5;
        }

        const dx=e.targetX-e.x;
        const dy=e.targetY-e.y;
        const distance=Math.hypot(dx,dy);

        if(distance>.1){

            const speed=
                .9+
                e.level*.1;

            e.x+=dx/distance*speed*dt;
            e.y+=dy/distance*speed*dt;
        }

        // Stocker
        if(e.type==="stocker"){
            restockNearby(e);
        }

        // Cleaner
        if(e.type==="cleaner"){
            cleanNearby(e);
        }

        // Cashier
        if(e.type==="cashier"){
            cashierWork(e);
        }
    }
}

function restockNearby(e){

    for(const name of productNames){

        const p=state.products[name];

        if(p.stock<=0){
            p.stock++;
            return;
        }
    }
}

function cleanNearby(e){
    // V2 groundwork for physical dirt/messes.
}

function cashierWork(e){

    for(const c of state.customers){

        if(c.state==="queue"){
            c.queueTime-=.1;

            if(c.queueTime<=0){
                completePurchase(c);
                return;
            }
        }
    }
}

/* =========================
   CUSTOMER AI
   ========================= */

const customerColors=[
    "#ff7373",
    "#72b7ff",
    "#b978ff",
    "#65d58b",
    "#ffb65e",
    "#f17dc1"
];

const personalities=[
    "budget",
    "impatient",
    "rich",
    "family",
    "health",
    "snack"
];

function spawnCustomer(){

    if(!state.open)return;

    const c={
        id:Math.random(),
        x:state.storeW/2,
        y:0.3,

        targetX:state.storeW/2,
        targetY:3,

        state:"shopping",

        personality:
            personalities[
                Math.floor(
                    Math.random()*personalities.length
                )
            ],

        color:
            customerColors[
                Math.floor(
                    Math.random()*customerColors.length
                )
            ],

        shoppingList:[],
        currentItem:0,

        queueTime:Math.random()*8+3,
        patience:20+Math.random()*20,

        spending:5+Math.random()*55,

        satisfaction:3.5
    };

    let count=
        4+
        Math.floor(Math.random()*4);

    if(c.personality==="family")count+=3;
    if(c.personality==="one")count=1;
    if(c.personality==="snack")count+=2;

    for(let i=0;i<count;i++){

        c.shoppingList.push(
            productNames[
                Math.floor(
                    Math.random()*productNames.length
                )
            ]
        );
    }

    state.customers.push(c);
}

function updateCustomers(dt){

    if(!state.open)return;

    for(let i=state.customers.length-1;i>=0;i--){

        const c=state.customers[i];

        if(c.state==="shopping"){

            if(c.currentItem>=c.shoppingList.length){

                c.state="checkout";

                c.targetX=
                    state.storeW-4;

                c.targetY=
                    state.storeH-3;

                continue;
            }

            const item=c.shoppingList[c.currentItem];

            const p=state.products[item];

            if(!p || p.stock<=0){

                c.satisfaction-=.35;

                c.currentItem++;
                continue;
            }

            const shelf=findRandomShelf();

            if(shelf){

                c.targetX=shelf.x;
                c.targetY=shelf.y;

                moveCustomer(c,dt);

                if(distance(c.x,c.y,c.targetX,c.targetY)<.5){

                    if(Math.random()<.85){

                        p.stock--;

                        c.currentItem++;

                        c.satisfaction+=.08;
                    }
                }
            }else{

                c.currentItem++;
            }
        }

        else if(c.state==="checkout"){

            moveCustomer(c,dt);

            if(
                distance(
                    c.x,c.y,
                    c.targetX,c.targetY
                )<.6
            ){

                c.state="queue";
            }
        }

        else if(c.state==="queue"){

            c.patience-=dt;

            if(
                c.patience<=0 &&
                !hasCashier()
            ){

                c.satisfaction-=.5;

                state.customers.splice(i,1);

                continue;
            }

            if(
                c.queueTime<=0 ||
                hasCashier()
            ){

                completePurchase(c);

                state.customers.splice(i,1);
            }
        }
    }
}

function findRandomShelf(){

    const shelves=
        state.buildings.filter(
            b=>b.type==="shelf"||b.type==="fridge"
        );

    if(!shelves.length)return null;

    return shelves[
        Math.floor(
            Math.random()*shelves.length
        )
    ];
}

function moveCustomer(c,dt){

    const dx=c.targetX-c.x;
    const dy=c.targetY-c.y;

    const d=Math.hypot(dx,dy);

    if(d>.05){

        const speed=1.4;

        c.x+=dx/d*speed*dt;
        c.y+=dy/d*speed*dt;
    }
}

function distance(x1,y1,x2,y2){
    return Math.hypot(
        x2-x1,
        y2-y1
    );
}

function hasCashier(){
    return state.employees.some(
        e=>e.type==="cashier"
    );
}

function completePurchase(c){

    let revenue=0;
    let items=0;

    for(const name of c.shoppingList){

        const p=state.products[name];

        if(!p)continue;

        revenue+=p.price;
        items++;
    }

    state.cash+=revenue;

    state.revenueToday+=revenue;

    state.customersToday++;

    state.xp+=items*2;

    if(c.satisfaction>=4){
        state.xp+=5;
    }

    updateLevel();

    // rating
    let target=c.satisfaction;

    if(hasCashier())target+=.15;

    state.rating=
        clamp(
            state.rating+
            (target-state.rating)*.015,
            1,
            5
        );

    moneyParticle(
        c.x*TILE,
        c.y*TILE,
        "+"+money(revenue)
    );
}

            p.x,
            p.y
        );

    }

/* =========================
   STORE OPEN/CLOSE
   ========================= */

function openStore(){

    if(state.open){
        closeStore();
        return;
    }

    const shelves=
        state.buildings.filter(
            b=>b.type==="shelf"||b.type==="fridge"
        ).length;

    const checkouts=
        state.buildings.filter(
            b=>b.type==="checkout"
        ).length;

    const totalStock=
        productNames.reduce(
            (sum,n)=>sum+state.products[n].stock,
            0
        );

    if(shelves<1){
        toast("You need at least one shelf!");
        return;
    }

    if(checkouts<1){
        toast("You need a checkout!");
        return;
    }

    if(totalStock<10){
        toast("You need at least 10 products!");
        return;
    }

    state.open=true;

    toast("STORE OPEN! 🛒🔥");

    if(state.objective===0){
        completeObjective();
    }

    updateUI();
}

function closeStore(){

    state.open=false;

    const profit=
        state.revenueToday-
        state.costsToday-
        state.wagesToday;

    state.xp+=
        Math.max(0,Math.floor(profit/10));

    updateLevel();

    reportModal();

    toast(
        "Store closed. Profit: "+money(profit)
    );
}

/* =========================
   TIME
   ========================= */

let lastTime=performance.now();

function updateTime(dt){

    if(!state.open)return;

    // 8 real minutes = 12 in-game hours
    state.minutes+=
        dt*(720/480);

    if(state.minutes>=1200){

        state.minutes=1200;

        closeStore();
    }

    // wages
    for(const e of state.employees){

        const hourly=
            employeeTypes[e.type].wage;

        state.wagesToday+=
            hourly*(dt/480);
    }

    const hour=state.minutes/60;

    let traffic=1;

    if(hour>=8&&hour<10)traffic=.6;
    else if(hour<14)traffic=.8;
    else if(hour<17)traffic=1;
    else if(hour<19)traffic=1.4;
    else traffic=1.1;

    const spawnChance=
        dt*.16*traffic;

    if(Math.random()<spawnChance){
        spawnCustomer();
    }
}

/* =========================
   LEVEL SYSTEM
   ========================= */

const levelXP=[
    0,
    1000,
    2500,
    5000,
    10000,
    20000,
    40000,
    75000,
    125000,
    200000
];

function updateLevel(){

    let newLevel=1;

    for(let i=levelXP.length-1;i>=0;i--){

        if(state.xp>=levelXP[i]){
            newLevel=i+1;
            break;
        }
    }

    if(newLevel>state.level){

        state.level=newLevel;

        toast(
            "LEVEL UP! Level "+newLevel+" 🎉"
        );

        state.cash+=newLevel*100;
    }

    checkObjectives();
}

function checkObjectives(){

    const obj=state.objective;

    if(obj===1 && state.customersToday>=10){
        completeObjective();
    }

    else if(
        obj===2 &&
        state.revenueToday-state.costsToday>=500
    ){
        completeObjective();
    }

    else if(
        obj===3 &&
        state.customersToday>=10
    ){
        completeObjective();
    }

    else if(obj===4){

        const stock=
            productNames.reduce(
                (s,n)=>s+state.products[n].stock,
                0
            );

        if(stock>=100){
            completeObjective();
        }
    }

    else if(obj===5 && state.employees.length>=1){
        completeObjective();
    }

    else if(obj===6 && state.rating>=4){
        completeObjective();
    }

    else if(
        obj===7 &&
        state.revenueToday-
        state.costsToday-
        state.wagesToday>=1000
    ){
        completeObjective();
    }

    else if(obj===9 && state.level>=3){
        completeObjective();
    }
}

function completeObjective(){

    const o=
        objectives[
            Math.min(
                state.objective,
                objectives.length-1
            )
        ];

    state.cash+=o.reward;

    state.objective++;

    toast(
        "OBJECTIVE COMPLETE! +"+money(o.reward)+" 🎉"
    );

    updateUI();
}

function expansionModal(){

    const prices=[
        5000,
        12500,
        30000,
        75000,
        200000
    ];

    const sizes=[
        [20,15],
        [30,15],
        [40,20],
        [50,25],
        [65,30],
        [80,40]
    ];

    let current=
        sizes.findIndex(
            s=>s[0]===state.storeW&&s[1]===state.storeH
        );

    if(current<0)current=0;

    const next=current+1;

    let html=`
        <button class="close" onclick="closeModal()">✕</button>
        <h2>🏗️ Expand Store</h2>
    `;

    if(next>=sizes.length){

        html+=`
            <p class="gold">
                Your store has reached the current maximum size!
            </p>
        `;
    }else{

        html+=`
            <div class="row">
                <div class="rowInfo">
                    <strong>
                        Expansion ${next}
                    </strong>
                    <small>
                        ${sizes[next][0]} × ${sizes[next][1]} tiles
                        <br>
                        Cost: ${money(prices[next-1])}
                    </small>
                </div>

                <button
                    class="green"
                    onclick="expandStore(${prices[next-1]},${sizes[next][0]},${sizes[next][1]})"
                >
                    BUY
                </button>
            </div>
        `;
    }

    openModal(html);
}

function expandStore(price,w,h){

    if(state.cash<price){
        toast("Not enough money!");
        return;
    }

    state.cash-=price;

    state.costsToday+=price;

    state.storeW=w;
    state.storeH=h;

    state.xp+=250;

    updateLevel();

    closeModal();

    toast(
        "STORE EXPANDED! 🏗️🔥"
    );

    updateUI();
    saveGame();
}

/* =========================
   MODALS
   ========================= */

function openModal(html){

    document.getElementById("modalContent").innerHTML=html;
    document.getElementById("modal").style.display="flex";
}

function closeModal(){

    document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click",e=>{

    if(e.target.id==="modal"){
        closeModal();
    }
});

/* =========================
   GAME LOOP
   ========================= */

function gameLoop(now){

    const dt=
        Math.min(
            .05,
            (now-lastTime)/1000
        );

    lastTime=now;

    if(
        document.getElementById("game").style.display!=="none"
    ){

        movePlayer(dt);

        updateTime(dt);

        updateCustomers(dt);

        updateEmployees(dt);

        updateParticles(dt);

        draw();

        drawParticles();

        updateUI();
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

/* =========================
   AUTOSAVE
   ========================= */

setInterval(()=>{

    if(
        document.getElementById("game").style.display!=="none"
    ){
        localStorage.setItem(
            "supermarket_tycoon_v2",
            JSON.stringify(state)
        );
    }

},30000);

/* initial UI */
updateUI();

</script>
