/* =========================================================
   SELECTION
========================================================= */

function showInitialChoices(){

    paused=true;

    document.getElementById(
        "selectionScreen"
    ).classList.add("show");

    createChoices(true);
}

function createChoices(initial){

    const box=
        document.getElementById("choices");

    box.innerHTML="";

    let available=
        Object.keys(ABILITIES)
        .filter(k=>!activeAbilities.includes(k))
        .sort(()=>Math.random()-.5);

    let amount=initial?6:4;

    available
        .slice(0,amount)
        .forEach(key=>{

            let a=ABILITIES[key];

            let div=
                document.createElement("div");

            div.className="choice";

            div.innerHTML=`
                <div class="choiceIcon">${a.icon}</div>
                <div class="choiceTag new">NEW ABILITY</div>
                <h2>${a.name}</h2>
                <p>${a.description}</p>
            `;

            div.onclick=()=>{

                activeAbilities.push(key);

                a.timer=0;

                document.getElementById(
                    "selectionScreen"
                ).classList.remove("show");

                paused=false;

                renderAbilities();
            };

            box.appendChild(div);
        });
}

/* =========================================================
   LEVEL UP
========================================================= */

function levelUp(){

    player.level++;

    player.xp-=player.xpNeed;

    player.xpNeed=
        Math.floor(
            player.xpNeed*1.24
        );

    paused=true;

    document.getElementById(
        "selectionScreen"
    ).classList.add("show");

    createLevelChoices();
}

        [...activeAbilities]

        .slice(0,2)
        .forEach(key=>{
            options.push({
                key,
                upgrade:true
            });
        });

        Object.keys(ABILITIES)
        .filter(k=>!activeAbilities.includes(k))
        .sort(()=>Math.random()-.5);

    available
        .slice(0,2)
        .forEach(key=>{
            options.push({
                key,
                upgrade:false
            });
        });

    options
        .sort(()=>Math.random()-.5)
        .slice(0,4)
        .forEach(option=>{

            let a=ABILITIES[option.key];

            let div=
                document.createElement("div");

            div.className="choice";

            if(option.upgrade){

                div.innerHTML=`
                    <div class="choiceIcon">${a.icon}</div>
                    <div class="choiceTag upgrade">UPGRADE</div>
                    <h2>${a.name} Lv.${a.level} → Lv.${a.level+1}</h2>
                    <p>
                        Improve this ability with more
                        damage, speed, range, or power.
                    </p>
                `;

            }else{

                div.innerHTML=`
                    <div class="choiceIcon">${a.icon}</div>
                    <div class="choiceTag new">NEW ABILITY</div>
                    <h2>${a.name}</h2>
                    <p>${a.description}</p>
                `;
            }

            div.onclick=()=>{

                if(option.upgrade){

                    a.upgrade();

                }else{

                    activeAbilities.push(
                        option.key
                    );

                    a.timer=0;
                }

                document.getElementById(
                    "selectionScreen"
                ).classList.remove("show");

                paused=false;

                renderAbilities();
            };

            box.appendChild(div);
        });
}

/* =========================================================
   ZOMBIES
========================================================= */

function spawnZombie(type){

    let side=
        Math.floor(
            Math.random()*4
        );

    let x,y;

    if(side===0){
        x=-70;
        y=Math.random()*H;
    }

    if(side===1){
        x=W+70;
        y=Math.random()*H;
    }

    if(side===2){
        x=Math.random()*W;
        y=-70;
    }

    if(side===3){
        x=Math.random()*W;
        y=H+70;
    }

    let data={

        normal:{
            hp:45+wave*10,

            /* FASTER */
            speed:1.1+wave*.028,

            damage:7+wave*.45,
            radius:23,
            xp:9
        },

        fast:{
            hp:28+wave*7,

            /* VERY FAST */
            speed:1.9+wave*.04,

            damage:5+wave*.35,
            radius:17,
            xp:13
        },

        tank:{
            hp:190+wave*30,

            /* FASTER TANK */
            speed:.62+wave*.014,

            damage:17+wave*.7,
            radius:34,
            xp:30
        }
    };

    let chosen=type;

    if(!chosen){

        let r=Math.random();

        if(
            r<
            Math.min(
                .08+wave*.008,
                .22
            )
        ){
            chosen="tank";
        }
        else if(
            r<
            Math.min(
                .25+wave*.015,
                .48
            )
        ){
            chosen="fast";
        }
        else{
            chosen="normal";
        }
    }

    let s=data[chosen];

    zombies.push({
        x,y,
        type:chosen,
        hp:s.hp,
        maxHp:s.hp,
        speed:s.speed,
        damage:s.damage,
        radius:s.radius,
        xp:s.xp,
        hitCooldown:0,
        slow:0
    });
}

/* =========================================================
   BOSS
========================================================= */

function spawnBoss(){

    let a=
        Math.random()*
        Math.PI*2;

    let d=
        Math.max(W,H)*.7;

    let x=
        player.x+
        Math.cos(a)*d;

    let y=
        player.y+
        Math.sin(a)*d;

    let hp=
        1800+
        wave*500;

    zombies.push({
        x,y,
        type:"boss",
        hp,
        maxHp:hp,

        /* faster boss */
        speed:.55+wave*.008,

        damage:25+wave,
        radius:58,
        xp:150,
        hitCooldown:0,
        boss:true
    });

    document.getElementById(
        "bossBar"
    ).style.display="block";
}

/* =========================================================
   GAME LOOP
========================================================= */

let last=performance.now();

function loop(now){

    let dt=
        Math.min(
            (now-last)/16.67,
            2
        );

    last=now;

    if(running&&!paused)
        update(dt);

    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    /* PLAYER */

    let dx=0;
    let dy=0;

    if(keys.w||keys.arrowup)dy--;
    if(keys.s||keys.arrowdown)dy++;
    if(keys.a||keys.arrowleft)dx--;
    if(keys.d||keys.arrowright)dx++;

    if(dx||dy){

        let len=
            Math.hypot(dx,dy);

        player.x+=
            dx/len*
            player.speed*
            dt;

        player.y+=
            dy/len*
            player.speed*
            dt;
    }

    player.x=
        Math.max(
            35,
            Math.min(W-35,player.x)
        );

    player.y=
        Math.max(
            35,
            Math.min(H-35,player.y)
        );

    if(player.invincible>0)
        player.invincible-=dt;

    /* WAVE */

    waveTime-=dt/60;

    if(waveTime<=0){

        wave++;
        waveTime=30;

        for(let i=0;i<6+wave;i++)
            spawnZombie();

        if(wave%5===0)
            spawnBoss();
    }

    /* SPAWNING */

    spawnTimer-=dt;

    if(spawnTimer<=0){

        let amount=
            wave>=7&&Math.random()<.18
            ?2
            :1;

        for(let i=0;i<amount;i++)
            spawnZombie();

        spawnTimer=
            Math.max(
                7,
                34-wave*1.5
            );
    }

    /* ABILITIES */

    for(let key of activeAbilities){

        let a=ABILITIES[key];

        if(a.cooldown>0){

            a.timer-=dt/60;

            if(a.timer<=0){

                a.fire();

                a.timer=a.cooldown;
            }

        }else{

            a.timer-=dt;

            if(a.timer<=0){

                a.fire();

                a.timer=8;
            }
        }
    }

    /* ZOMBIES */

    for(let z of [...zombies]){

        if(z.slow>0)
            z.slow-=dt;

        let speed=
            z.speed*
            (z.slow>0?.5:1);

        let a=Math.atan2(
            player.y-z.y,
            player.x-z.x
        );

        z.x+=
            Math.cos(a)*
            speed*
            dt;

        z.y+=
            Math.sin(a)*
            speed*
            dt;

        if(z.hitCooldown>0)
            z.hitCooldown-=dt;

        let d=
            distance(
                player.x,
                player.y,
                z.x,
                z.y
            );

        if(
            d<
            player.radius+z.radius&&
            z.hitCooldown<=0&&
            player.invincible<=0
        ){

            let damage=z.damage;

            if(
                activeAbilities.includes(
                    "shield"
                )
            ){

                let shield=
                    ABILITIES.shield;

                damage*=
                    Math.max(
                        .3,
                        1-.13*shield.level
                    );
            }

            player.hp-=damage;

            player.invincible=32;

            damageText(
                player.x,
                player.y,
                damage
            );

            z.hitCooldown=30;

            if(player.hp<=0)
                endGame();
        }
    }

    updateProjectiles(dt);
    updateEffects(dt);
    updateSummons(dt);
    updateOrbs(dt);
    updateTexts(dt);

    updateHUD();
}

/* =========================================================
   PROJECTILES
========================================================= */

function updateProjectiles(dt){

    for(let p of [...projectiles]){

        if(p.kind==="fireball"){

            let target=
                nearestZombieFrom(
                    p.x,
                    p.y
                );

            if(target){

                let wanted=
                    Math.atan2(
                        target.y-p.y,
                        target.x-p.x
                    );

                let current=
                    Math.atan2(
                        p.vy,
                        p.vx
                    );

                let difference=
                    normalizeAngle(
                        wanted-current
                    );

                current+=
                    Math.max(
                        -.11,
                        Math.min(
                            .11,
                            difference
                        )
                    );

                p.vx=
                    Math.cos(current)*6;

                p.vy=
                    Math.sin(current)*6;
            }
        }

        if(p.kind==="skull"){

            let target=
                nearestZombieFrom(
                    p.x,
                    p.y
                );

            if(target){

                let a=Math.atan2(
                    target.y-p.y,
                    target.x-p.x
                );

                p.vx+=
                    Math.cos(a)*.25*dt;

                p.vy+=
                    Math.sin(a)*.25*dt;

                let speed=
                    Math.hypot(
                        p.vx,
                        p.vy
                    );

                if(speed>6){

                    p.vx=
                        p.vx/speed*6;

                    p.vy=
                        p.vy/speed*6;
                }
            }
        }

        if(p.kind==="boomerang"){

            if(p.life<65)
                p.returning=true;

            if(p.returning){

                let a=Math.atan2(
                    player.y-p.y,
                    player.x-p.x
                );

                p.vx=Math.cos(a)*10;
                p.vy=Math.sin(a)*10;
            }
        }

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        for(let z of [...zombies]){

            if(
                distance(
                    p.x,
                    p.y,
                    z.x,
                    z.y
                )<
                p.radius+z.radius
            ){

                z.hp-=p.damage;

                damageText(
                    z.x,
                    z.y,
                    p.damage
                );

                if(p.kind==="ice")
                    z.slow=100;

                if(p.kind==="bomb"){

                    explosion(
                        p.x,
                        p.y,
                        75,
                        p.damage
                    );
                }

                if(z.hp<=0)
                    killZombie(z);

                if(
                    p.kind==="card"&&
                    p.pierce>0
                ){

                    p.pierce--;

                }else if(
                    p.kind!=="boomerang"
                ){

                    p.life=0;
                    break;
                }
            }
        }

        if(
            p.kind==="boomerang"&&
            distance(
                p.x,
                p.y,
                player.x,
                player.y
            )<30&&
            p.returning
        ){
            p.life=0;
        }

        if(p.life<=0){

            projectiles.splice(
                projectiles.indexOf(p),
                1
            );
        }
    }
}

/* =========================================================
   EFFECTS
========================================================= */

function updateEffects(dt){

    for(let e of [...effects]){

        e.life-=dt;

        if(e.kind==="meteor"&&e.life<=1){

            explosion(
                e.x,
                e.y,
                e.radius,
                e.damage
            );
        }

        if(e.kind==="shockwave"){

            e.radius+=
                (e.maxRadius-e.radius)*.28;
        }

        if(e.kind==="blackhole"){

            for(let z of [...zombies]){

                let d=
                    distance(
                        e.x,
                        e.y,
                        z.x,
                        z.y
                    );

                if(d<e.radius){

                    let a=Math.atan2(
                        e.y-z.y,
                        e.x-z.x
                    );

                    z.x+=
                        Math.cos(a)*
                        1.6*
                        dt;

                    z.y+=
                        Math.sin(a)*
                        1.6*
                        dt;

                    z.hp-=
                        e.damage*dt;

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }

        if(e.kind==="poison"){

            for(let z of [...zombies]){

                if(
                    distance(
                        e.x,
                        e.y,
                        z.x,
                        z.y
                    )<e.radius
                ){

                    z.hp-=
                        e.damage*dt;

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }

        if(e.kind==="tornado"){

            e.x+=e.vx*dt;
            e.y+=e.vy*dt;

            for(let z of [...zombies]){

                if(
                    distance(
                        e.x,
                        e.y,
                        z.x,
                        z.y
                    )<
                    e.radius+z.radius
                ){

                    z.hp-=
                        e.damage*.04*dt;

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }

        if(e.life<=0){

            effects.splice(
                effects.indexOf(e),
                1
            );
        }
    }
}

/* =========================================================
   SUMMONS
========================================================= */

function updateSummons(dt){

    for(let s of [...summons]){

        s.life-=dt;

        let target=
            nearestZombieFrom(
                s.x,
                s.y
            );

        if(target){

            let a=Math.atan2(
                target.y-s.y,
                target.x-s.x
            );

            let speed=
                s.kind==="bee"
                ?5.5
                :3;

            s.x+=
                Math.cos(a)*
                speed*
                dt;

            s.y+=
                Math.sin(a)*
                speed*
                dt;

            if(
                distance(
                    s.x,
                    s.y,
                    target.x,
                    target.y
                )<
                s.radius+target.radius
            ){

                target.hp-=s.damage;

                if(Math.random()<.08)
                    damageText(
                        target.x,
                        target.y,
                        s.damage
                    );

                if(target.hp<=0)
                    killZombie(target);
            }

        }else{

            let a=Math.atan2(
                player.y-s.y,
                player.x-s.x
            );

            s.x+=
                Math.cos(a)*
                2*
                dt;

            s.y+=
                Math.sin(a)*
                2*
                dt;
        }

        if(s.life<=0){

            summons.splice(
                summons.indexOf(s),
                1
            );
        }
    }
}

/* =========================================================
   ORBS
========================================================= */

function updateOrbs(dt){

    for(let o of [...orbs]){

        let d=
            distance(
                player.x,
                player.y,
                o.x,
                o.y
            );

        if(d<170){

            let a=Math.atan2(
                player.y-o.y,
                player.x-o.x
            );

            o.x+=
                Math.cos(a)*
                5.5*
                dt;

            o.y+=
                Math.sin(a)*
                5.5*
                dt;
        }

        if(d<28){

            player.xp+=o.value;

            orbs.splice(
                orbs.indexOf(o),
                1
            );

            if(player.xp>=player.xpNeed)
                levelUp();
        }
    }
}

/* =========================================================
   EXPLOSION
========================================================= */

function explosion(
    x,
    y,
    radius,
    damage
){

    effects.push({
        kind:"explosion",
        x,y,
        radius:10,
        maxRadius:radius,
        life:25
    });

    for(let z of [...zombies]){

        let d=
            distance(
                x,
                y,
                z.x,
                z.y
            );

        if(d<radius){

            let dealt=
                damage*
                (1-d/radius*.5);

            z.hp-=dealt;

            damageText(
                z.x,
                z.y,
                dealt
            );

            if(z.hp<=0)
                killZombie(z);
        }
    }
}

/* =========================================================
   KILL
========================================================= */

function killZombie(z){

    let index=zombies.indexOf(z);

    if(index===-1)return;

    zombies.splice(index,1);

    kills++;

    orbs.push({
        x:z.x,
        y:z.y,
        value:z.xp
    });

    effects.push({
        kind:"death",
        x:z.x,
        y:z.y,
        radius:8,
        life:25
    });

    if(z.boss){

        document.getElementById(
            "bossBar"
        ).style.display="none";

        for(let i=0;i<10;i++){

            orbs.push({
                x:z.x+
                    (Math.random()-.5)*100,

                y:z.y+
                    (Math.random()-.5)*100,

                value:30
            });
        }
    }
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawMap();
    drawOrbs();
    drawEffects();
    drawSummons();
    drawProjectiles();
    drawZombies();
    drawPlayer();
    drawOrbiting();
    drawDamageText();
}

/* =========================================================
   MAP
========================================================= */

function drawMap(){

    ctx.fillStyle="#10141a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.strokeStyle="#181d25";
    ctx.lineWidth=1;

    const grid=50;

    for(let x=0;x<W;x+=grid){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=grid){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    ctx.strokeStyle="#272e39";
    ctx.lineWidth=5;

    ctx.strokeRect(
        8,
        8,
        W-16,
        H-16
    );
}

/* =========================================================
   ROUNDED IMAGE HELPER
========================================================= */

function drawRoundedImage(
    image,
    x,
    y,
    size,
    radius
){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.clip();

    ctx.drawImage(
        image,
        x-size/2,
        y-size/2,
        size,
        size
    );

    ctx.restore();
}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    ctx.save();

    if(player.invincible>0){

        ctx.globalAlpha=
            Math.sin(
                performance.now()/50
            )>0
            ?0.35
            :1;
    }

    /* aura */

    if(activeAbilities.includes("aura")){

        let a=ABILITIES.aura;

        let radius=
            105+
            a.level*8;

        let gradient=
            ctx.createRadialGradient(
                player.x,
                player.y,
                20,
                player.x,
                player.y,
                radius
            );

        gradient.addColorStop(
            0,
            "rgba(119,103,255,.15)"
        );

        gradient.addColorStop(
            1,
            "rgba(119,103,255,0)"
        );

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle=
            "rgba(119,103,255,.25)";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    /* shield */

    if(activeAbilities.includes("shield")){

        let level=
            ABILITIES.shield.level;

        ctx.strokeStyle=
            "rgba(80,210,255,.6)";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            39+level*2,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    /* PLAYER IMAGE — ROUNDED */

    if(
        playerImg.complete&&
        playerImg.naturalWidth
    ){

        drawRoundedImage(
            playerImg,
            player.x,
            player.y,
            78,
            39
        );

    }else{

        ctx.fillStyle="#7767ff";

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            player.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* =========================================================
   ZOMBIES
========================================================= */

function drawZombies(){

    for(let z of zombies){

        let size=
            z.boss
            ?130
            :z.radius*2.4;

        /* ZOMBIE IMAGE — ROUNDED */

        if(
            zombieImg.complete&&
            zombieImg.naturalWidth
        ){

            drawRoundedImage(
                zombieImg,
                z.x,
                z.y,
                size,
                size/2
            );

        }else{

            ctx.fillStyle=
                z.boss
                ?"rgba(170,60,175,1)"
                :z.type==="tank"
                ?"rgba(120,70,70,1)"
                :z.type==="fast"
                ?"rgba(100,125,70,1)"
                :"rgba(70,115,75,1)";

            ctx.beginPath();

            ctx.arc(
                z.x,
                z.y,
                z.radius,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        /* HP BAR */

        let width=
            z.boss
            ?115
            :z.radius*2;

        ctx.fillStyle="#20242b";

        ctx.fillRect(
            z.x-width/2,
            z.y-z.radius-11,
            width,
            5
        );

        ctx.fillStyle=
            z.boss
            ?"#d44bdf"
            :"#e74c57";

        ctx.fillRect(
            z.x-width/2,
            z.y-z.radius-11,
            width*
            Math.max(
                0,
                z.hp/z.maxHp
            ),
            5
        );
    }
}

/* =========================================================
   ORBITING ABILITIES
========================================================= */

function drawOrbiting(){

    let time=
        performance.now()/400;

    if(activeAbilities.includes("orbitBlades")){

        let a=
            ABILITIES.orbitBlades;

        let count=
            2+
            Math.floor(a.level/2);

        for(let i=0;i<count;i++){

            let angle=
                time+
                i*Math.PI*2/count;

            let radius=
                58+
                a.level*4;

            let x=
                player.x+
                Math.cos(angle)*radius;

            let y=
                player.y+
                Math.sin(angle)*radius;

            ctx.save();

            ctx.translate(x,y);
            ctx.rotate(angle);

            ctx.fillStyle="#e9edf5";

            ctx.fillRect(
                -5,
                -19,
                10,
                38
            );

            ctx.restore();

            for(let z of [...zombies]){

                if(
                    distance(
                        x,
                        y,
                        z.x,
                        z.y
                    )<
                    z.radius+11
                ){

                    z.hp-=
                        player.damage*
                        .06;

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }
    }

    if(activeAbilities.includes("orbitFire")){

        let a=
            ABILITIES.orbitFire;

        let count=
            2+
            Math.floor(a.level/2);

        for(let i=0;i<count;i++){

            let angle=
                -time+
                i*Math.PI*2/count;

            let radius=
                50+
                a.level*4;

            let x=
                player.x+
                Math.cos(angle)*radius;

            let y=
                player.y+
                Math.sin(angle)*radius;

            ctx.shadowBlur=18;
            ctx.shadowColor="#ff7020";

            ctx.fillStyle="#ff8b2c";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                11,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.shadowBlur=0;

            for(let z of [...zombies]){

                if(
                    distance(
                        x,
                        y,
                        z.x,
                        z.y
                    )<
                    z.radius+11
                ){

                    z.hp-=
                        player.damage*
                        .08;

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }
    }
}

/* =========================================================
   PROJECTILE DRAWING
========================================================= */

function drawProjectiles(){

    for(let p of projectiles){

        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        if(p.kind==="card"){

            ctx.rotate(
                Math.atan2(
                    p.vy,
                    p.vx
                )
            );

            ctx.fillStyle="#fff";

            ctx.shadowBlur=8;
            ctx.shadowColor="#fff";

            ctx.fillRect(
                -7,
                -11,
                14,
                22
            );

            ctx.shadowBlur=0;

            ctx.fillStyle="#d63e4a";

            ctx.font="12px Arial";
            ctx.textAlign="center";

            ctx.fillText(
                "♥",
                0,
                4
            );
        }

        if(p.kind==="fireball"){

            ctx.shadowBlur=22;
            ctx.shadowColor="#ff7120";

            ctx.fillStyle="#ff8b2d";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                16,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.shadowBlur=0;
        }

        if(p.kind==="ice"){

            ctx.rotate(
                Math.atan2(
                    p.vy,
                    p.vx
                )
            );

            ctx.fillStyle="#8deaff";

            ctx.beginPath();

            ctx.moveTo(12,0);
            ctx.lineTo(-7,-5);
            ctx.lineTo(-4,0);
            ctx.lineTo(-7,5);
            ctx.closePath();

            ctx.fill();
        }

        if(p.kind==="bomb"){

            ctx.fillStyle="#202126";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                11,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#ffc44d";

            ctx.beginPath();

            ctx.arc(
                5,
                -9,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        if(p.kind==="boomerang"){

            ctx.rotate(
                Math.atan2(
                    p.vy,
                    p.vx
                )
            );

            ctx.strokeStyle="#f2c35b";
            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                10,
                -.9,
                .9
            );

            ctx.stroke();
        }

        if(p.kind==="skull"){

            ctx.font="23px Arial";
            ctx.textAlign="center";
            ctx.textBaseline="middle";

            ctx.fillText(
                "💀",
                0,
                0
            );
        }

        ctx.restore();
    }
}

/* =========================================================
   EFFECT DRAW
========================================================= */

function drawEffects(){

    for(let e of effects){

        if(e.kind==="shockwave"){

            ctx.strokeStyle=
                `rgba(130,115,255,${e.life/25})`;

            ctx.lineWidth=7;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        if(e.kind==="explosion"){

            let progress=
                1-e.life/25;

            let r=
                10+
                progress*
                (e.maxRadius-10);

            ctx.fillStyle=
                `rgba(255,100,35,${1-progress})`;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                r,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle=
                `rgba(255,190,60,${1-progress})`;

            ctx.lineWidth=5;
            ctx.stroke();
        }

        if(e.kind==="meteor"){

            let pulse=
                e.radius+
                Math.sin(
                    performance.now()/70
                )*5;

            ctx.strokeStyle=
                "rgba(255,75,40,.8)";

            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                pulse,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        if(e.kind==="lightning"){

            ctx.strokeStyle=
                `rgba(220,240,255,${e.life/25})`;

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.moveTo(
                e.x,
                e.y-160
            );

            for(let i=1;i<7;i++){

                ctx.lineTo(
                    e.x+
                    (Math.random()-.5)*45,
                    e.y-160+i*27
                );
            }

            ctx.lineTo(
                e.x,
                e.y
            );

            ctx.stroke();
        }

        if(e.kind==="blackhole"){

            ctx.shadowBlur=25;
            ctx.shadowColor="#9849cc";

            ctx.fillStyle="#100817";

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius*.35,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle="#a65ada";
            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.shadowBlur=0;
        }

        if(e.kind==="poison"){

            ctx.fillStyle=
                "rgba(80,220,90,.14)";

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle=
                "rgba(100,230,110,.3)";

            ctx.stroke();
        }

        if(e.kind==="tornado"){

            ctx.strokeStyle=
                "rgba(180,215,255,.75)";

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius*.55,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        if(e.kind==="death"){

            ctx.strokeStyle=
                `rgba(255,90,90,${e.life/25})`;

            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                35-e.life,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    }
}

   TEXT
========================================================= */

function damageText(x,y,value){

    texts.push({
        x,
        y,
        value:Math.round(value),
        life:30
    });
}

function updateTexts(dt){

    for(let t of [...texts]){

        t.y-=.5*dt;
        t.life-=dt;

        if(t.life<=0){

            texts.splice(
                texts.indexOf(t),
                1
            );
        }
    }
}

function drawDamageText(){

    ctx.font="bold 14px Arial";
    ctx.textAlign="center";

    for(let t of texts){

        ctx.fillStyle=
            `rgba(255,255,255,${t.life/30})`;

        ctx.fillText(
            "-"+t.value,
            t.x,
            t.y
        );
    }
}

/* =========================================================
   UTILITIES
========================================================= */

function distance(
    x1,
    y1,
    x2,
    y2
){

    return Math.hypot(
        x2-x1,
        y2-y1
    );
}

function nearestZombie(){

    return nearestZombieFrom(
        player.x,
        player.y
    );
}

function nearestZombieFrom(x,y){

    let best=null;
    let bestD=Infinity;

    for(let z of zombies){

        let d=
            distance(
                x,
                y,
                z.x,
                z.y
            );

        if(d<bestD){

            bestD=d;
            best=z;
        }
    }

    return best;
}

function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}
