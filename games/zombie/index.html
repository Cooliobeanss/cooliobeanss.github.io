<!DOCTYPE html>

<title>Zombie Brawl</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#090b10;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{
    display:block;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    top:16px;
    left:16px;
    width:285px;
    z-index:5;
    pointer-events:none;
}

.hudPanel{
    background:rgba(10,12,18,.82);
    border:1px solid rgba(255,255,255,.09);
    border-radius:12px;
    padding:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    backdrop-filter:blur(5px);
}

.label{
    font-size:11px;
    color:#aeb5c5;
    margin-bottom:4px;
    font-weight:bold;
}

.bar{
    height:18px;
    border-radius:10px;
    overflow:hidden;
    background:#242936;
    margin-bottom:7px;
    border:1px solid #080a0e;
}

.barFill{
    height:100%;
    width:100%;
    transition:width .15s;
}

#healthFill{
    background:#e94a55;
}

#xpFill{
    width:0%;
    background:#7767ff;
}

.stats{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-top:7px;
}

.stats b{
    color:#fff;
}

/* ================= ABILITY BAR ================= */

#abilityBar{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    z-index:5;
    pointer-events:none;
    max-width:95vw;
    overflow:hidden;
}

.slot{
    width:74px;
    height:76px;
    flex-shrink:0;
    background:rgba(15,18,25,.9);
    border:1px solid #343b4a;
    border-radius:11px;
    text-align:center;
    padding-top:5px;
    position:relative;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.slotIcon{
    font-size:29px;
    line-height:34px;
}

.slotName{
    font-size:9px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:0 4px;
}

.slotLevel{
    position:absolute;
    top:4px;
    right:5px;
    background:#7767ff;
    border-radius:5px;
    padding:2px 4px;
    font-size:9px;
    font-weight:bold;
}

.slotCooldown{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
    background:rgba(0,0,0,.5);
    border-radius:10px;
    color:#fff;
}

/* ================= LEVEL UP ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(4,6,10,.78);
    backdrop-filter:blur(7px);
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.overlay.show{
    display:flex;
}

.overlayTitle{
    font-size:42px;
    font-weight:900;
    margin-bottom:8px;
    text-align:center;
}

.overlaySub{
    color:#aeb5c5;
    margin-bottom:24px;
    text-align:center;
}

#choices{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    width:min(1000px,94vw);
}

.choice{
    width:205px;
    min-height:205px;
    padding:18px;
    border-radius:15px;
    background:#171b25;
    border:2px solid #363d4d;
    cursor:pointer;
    transition:.15s;
    text-align:left;
}

.choice:hover{
    transform:translateY(-7px);
    border-color:#7767ff;
    background:#202533;
    box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.choiceIcon{
    font-size:46px;
    margin-bottom:8px;
}

.choiceTag{
    font-size:10px;
    color:#8f84ff;

    font-weight:bold;
}

.choice h2{
    font-size:18px;
    margin:5px 0 8px;
}

.choice p{
    color:#aeb5c5;
    font-size:13px;
    line-height:1.4;
    margin:0;
}

.choice .new{
    color:#65e6a0;
}

.choice .upgrade{
    color:#ffc85c;
}

/* ================= GAME OVER ================= */

#gameOver{

#gameOver h1{
    font-size:58px;

#finalStats{

button{
    border:0;

button:hover{

/* ================= TOP INFO ================= */

#topInfo{

#waveText{

}

#waveTimer{

/* ================= BOSS ================= */

#bossBar{

#bossName{

#bossTrack{
    height:15px;

}

#bossFill{
    height:100%;
    background:#c94bdf;
    width:100%;
}
</style>

/* =========================================================
   ACTIVE ABILITIES
========================================================= */

let activeAbilities=[];

/* =========================================================
   START SELECTION
========================================================= */

function showInitialChoices(){

    paused=true;

    document.getElementById(
        "selectionScreen"
    ).classList.add("show");

    generateChoices(true);
}

function generateChoices(initial=false){

    let container=
        document.getElementById("choices");

    container.innerHTML="";

    let available=
        Object.keys(ABILITIES)
        .filter(k=>!activeAbilities.includes(k));

    available.sort(()=>Math.random()-.5);

    let choices=available.slice(
        0,
        initial ? 6 : 4
    );

    choices.forEach(key=>{

        let ability=ABILITIES[key];

        let div=document.createElement("div");

        div.className="choice";

        div.innerHTML=`
            <div class="choiceIcon">${ability.icon}</div>
            <div class="choiceTag new">NEW ABILITY</div>
            <h2>${ability.name}</h2>
            <p>${ability.description}</p>
        `;

        div.onclick=()=>{

            activeAbilities.push(key);

            ability.timer=0;

            document.getElementById(
                "selectionScreen"
            ).classList.remove("show");

            paused=false;

            renderAbilities();
        };

        container.appendChild(div);
    });
}

/* =========================================================
   LEVEL UP
========================================================= */

function levelUp(){

    player.level++;

    player.xp-=player.xpNeed;

    player.xpNeed=
        Math.floor(player.xpNeed*1.25);

    paused=true;

    document.getElementById(
        "selectionScreen"
    ).classList.add("show");

    showUpgradeChoices();
}

function showUpgradeChoices(){

    let container=
        document.getElementById("choices");

    container.innerHTML="";

    let options=[];

    /* Existing upgrades */

    if(activeAbilities.length){

        let shuffled=
            [...activeAbilities]
            .sort(()=>Math.random()-.5);

        shuffled.slice(
            0,
            Math.min(2,shuffled.length)
        ).forEach(key=>{

            options.push({
                key,
                upgrade:true
            });
        });
    }

    /* New ability */

    let available=
        Object.keys(ABILITIES)
        .filter(k=>!activeAbilities.includes(k))
        .sort(()=>Math.random()-.5);

    if(available.length){

        options.push({
            key:available[0],
            upgrade:false
        });
    }

    /* Fill to 4 */

    while(options.length<4){

        let candidate=
            Object.keys(ABILITIES)
            .filter(k =>
                !options.some(o=>o.key===k)
            )
            .sort(()=>Math.random()-.5)[0];

        if(!candidate)break;

        options.push({
            key:candidate,
            upgrade:false
        });
    }

    options
        .sort(()=>Math.random()-.5)
        .slice(0,4)
        .forEach(option=>{

            let ability=ABILITIES[option.key];

            let div=document.createElement("div");

            div.className="choice";

            if(option.upgrade){

                div.innerHTML=`
                    <div class="choiceIcon">${ability.icon}</div>
                    <div class="choiceTag upgrade">
                        UPGRADE
                    </div>
                    <h2>
                        ${ability.name}
                        Lv.${ability.level}
                        → Lv.${ability.level+1}
                    </h2>
                    <p>
                        Upgrade this ability and make it
                        stronger and faster.
                    </p>
                `;

            }else{

                div.innerHTML=`
                    <div class="choiceIcon">${ability.icon}</div>
                    <div class="choiceTag new">
                        NEW ABILITY
                    </div>
                    <h2>${ability.name}</h2>
                    <p>${ability.description}</p>
                `;
            }

            div.onclick=()=>{

                if(option.upgrade){

                    ability.upgrade();

                }else{

                    activeAbilities.push(option.key);
                    ability.timer=0;
                }

                document.getElementById(
                    "selectionScreen"
                ).classList.remove("show");

                paused=false;

                renderAbilities();
            };

            container.appendChild(div);
        });
}

/* =========================================================
   ZOMBIE SPAWNING
========================================================= */

function spawnZombie(type){

    let side=
        Math.floor(Math.random()*4);

    let x,y;

    if(side===0){
        x=-70;
        y=Math.random()*H;
    }

    if(side===1){
        x=W+70;
        y=Math.random()*H;
    }

    if(side===2){
        x=Math.random()*W;
        y=-70;
    }

    if(side===3){
        x=Math.random()*W;
        y=H+70;
    }

    let data={
        normal:{
            hp:45+wave*10,
            speed:.65+wave*.018,
            damage:7+wave*.45,
            radius:23,
            xp:9
        },

        fast:{
            hp:28+wave*7,
            speed:1.25+wave*.025,
            damage:5+wave*.35,
            radius:17,
            xp:13
        },

        tank:{
            hp:190+wave*30,
            speed:.35+wave*.008,
            damage:17+wave*.7,
            radius:34,
            xp:30
        }
    };

    let chosen=type;

    if(!chosen){

        let r=Math.random();

        if(r<Math.min(.08+wave*.008,.22))
            chosen="tank";

        else if(r<Math.min(.20+wave*.012,.42))
            chosen="fast";

        else
            chosen="normal";
    }

    let s=data[chosen];

    zombies.push({
        x,y,
        type:chosen,
        hp:s.hp,
        maxHp:s.hp,
        speed:s.speed,
        damage:s.damage,
        radius:s.radius,
        xp:s.xp,
        hitCooldown:0,
        slow:0
    });
}

/* =========================================================
   BOSS
========================================================= */

function spawnBoss(){

    let angle=Math.random()*Math.PI*2;

    let distanceSpawn=
        Math.max(W,H)*.7;

    let x=
        player.x+
        Math.cos(angle)*distanceSpawn;

    let y=
        player.y+
        Math.sin(angle)*distanceSpawn;

    let hp=
        1800+
        wave*500;

    zombies.push({
        x,
        y,
        type:"boss",
        hp,
        maxHp:hp,
        speed:.3+wave*.006,
        damage:25+wave,
        radius:58,
        xp:150,
        hitCooldown:0,
        boss:true
    });

    document.getElementById(
        "bossBar"
    ).style.display="block";
}

/* =========================================================
   UPDATE
========================================================= */

let last=performance.now();

function loop(now){

    let dt=
        Math.min(
            (now-last)/16.67,
            2
        );

    last=now;

    if(running && !paused)
        update(dt);

    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

function update(dt){

    gameTime+=dt/60;

    /* PLAYER */

    let dx=0;
    let dy=0;

    if(keys.w||keys.arrowup)dy--;
    if(keys.s||keys.arrowdown)dy++;
    if(keys.a||keys.arrowleft)dx--;
    if(keys.d||keys.arrowright)dx++;

    if(dx||dy){

        let len=Math.hypot(dx,dy);

        player.x+=
            dx/len*
            player.speed*
            dt;

        player.y+=
            dy/len*
            player.speed*
            dt;
    }

    player.x=
        Math.max(
            35,
            Math.min(W-35,player.x)
        );

    player.y=
        Math.max(
            35,
            Math.min(H-35,player.y)
        );

    if(player.invincible>0)
        player.invincible-=dt;

    /* WAVE */

    waveTime-=dt/60;

    if(waveTime<=0){

        wave++;

        waveTime=30;

        for(let i=0;i<5+wave;i++)
            spawnZombie();

        if(wave%5===0)
            spawnBoss();
    }

    /* SPAWN */

    spawnTimer-=dt;

    if(spawnTimer<=0){

        let amount=
            wave>8 &&
            Math.random()<.15
            ?2
            :1;

        for(let i=0;i<amount;i++)
            spawnZombie();

        spawnTimer=
            Math.max(
                10,
                48-wave*1.6
            );
    }

    /* ABILITIES */

    for(let key of activeAbilities){

        let a=ABILITIES[key];

        if(a.cooldown>0){

            a.timer-=dt/60;

            if(a.timer<=0){

                a.fire();

                a.timer=a.cooldown;
            }
        }else{

            /* aura / passive */
            a.timer-=dt;

            if(a.timer<=0){

                a.fire();

                a.timer=10;
            }
        }
    }

    /* ZOMBIES */

    for(let z of [...zombies]){

        if(z.slow>0)
            z.slow-=dt;

        let speed=
            z.speed*
            (z.slow>0?.5:1);

        let angle=
            Math.atan2(
                player.y-z.y,
                player.x-z.x
            );

        z.x+=
            Math.cos(angle)*
            speed*
            dt;

        z.y+=
            Math.sin(angle)*
            speed*
            dt;

        if(z.hitCooldown>0)
            z.hitCooldown-=dt;

        let d=
            distance(
                player.x,
                player.y,
                z.x,
                z.y
            );

        if(
            d<
            player.radius+z.radius &&
            z.hitCooldown<=0 &&
            player.invincible<=0
        ){

            let damage=z.damage;

            let shield=
                ABILITIES.shield;

            if(activeAbilities.includes("shield")){

                damage*=
                    Math.max(
                        .35,
                        1-.12*shield.level
                    );
            }

            player.hp-=damage;

            player.invincible=35;

            damageText(
                player.x,
                player.y,
                damage
            );

            z.hitCooldown=35;

            if(player.hp<=0){
                endGame();
            }
        }
    }

    /* PROJECTILES */

    updateProjectiles(dt);

    /* EFFECTS */

    updateEffects(dt);

    /* SUMMONS */

    updateSummons(dt);

    /* XP */

    for(let orb of [...orbs]){

        let d=
            distance(
                player.x,
                player.y,
                orb.x,
                orb.y
            );

        if(d<150){

            let a=Math.atan2(
                player.y-orb.y,
                player.x-orb.x
            );

            orb.x+=
                Math.cos(a)*
                4.5*
                dt;

            orb.y+=
                Math.sin(a)*
                4.5*
                dt;
        }

        if(d<25){

            gainXP(orb.value);

            orbs.splice(
                orbs.indexOf(orb),
                1
            );
        }
    }

    /* TEXT */

    for(let t of [...texts]){

        t.y-=.45*dt;
        t.life-=dt;

        if(t.life<=0)
            texts.splice(
                texts.indexOf(t),
                1
            );
    }

    updateHUD();
}

/* =========================================================
   PROJECTILES
========================================================= */

function updateProjectiles(dt){

    for(let p of [...projectiles]){

        if(p.kind==="fireball"){

            let target=nearestZombieFrom(
                p.x,
                p.y
            );

            if(target){

                let desired=
                    Math.atan2(
                        target.y-p.y,
                        target.x-p.x
                    );

                let current=
                    Math.atan2(p.vy,p.vx);

                let difference=
                    normalizeAngle(
                        desired-current
                    );

                current+=
                    Math.max(
                        -.08,
                        Math.min(.08,difference)
                    );

                p.vx=Math.cos(current)*5;
                p.vy=Math.sin(current)*5;
            }
        }

        if(p.kind==="skull"){

            let target=
                nearestZombieFrom(
                    p.x,
                    p.y
                );

            if(target){

                let a=Math.atan2(
                    target.y-p.y,
                    target.x-p.x
                );

                p.vx+=Math.cos(a)*.18*dt;
                p.vy+=Math.sin(a)*.18*dt;

                let speed=Math.hypot(
                    p.vx,p.vy
                );

                if(speed>5){

                    p.vx=
                        p.vx/speed*5;

                    p.vy=
                        p.vy/speed*5;
                }
            }
        }

        if(p.kind==="boomerang"){

            p.life-=dt;

            if(p.life<70)
                p.returning=true;

            if(p.returning){

                let a=Math.atan2(
                    player.y-p.y,
                    player.x-p.x
                );

                p.vx=Math.cos(a)*8;
                p.vy=Math.sin(a)*8;
            }
        }

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        let hit=false;

        for(let z of [...zombies]){

            if(
                distance(
                    p.x,p.y,
                    z.x,z.y
                )<
                p.radius+z.radius
            ){

                z.hp-=p.damage;

                damageText(
                    z.x,
                    z.y,
                    p.damage
                );

                if(p.kind==="ice")
                    z.slow=100;

                if(
                    p.kind==="bomb"
                ){

                    explosion(
                        p.x,
                        p.y,
                        65,
                        p.damage
                    );
                }

                if(z.hp<=0)
                    killZombie(z);

                if(p.kind==="card" && p.pierce>0){

                    p.pierce--;
                    hit=false;

                }else{

                    hit=true;
                }

                if(p.kind==="boomerang")
                    hit=false;

                if(hit)break;
            }
        }

        if(
            p.kind==="boomerang" &&
            distance(
                p.x,p.y,
                player.x,player.y
            )<30
        ){
            p.life=0;
        }

        if(
            p.life<=0 ||
            p.x<-150 ||
            p.x>W+150 ||
            p.y<-150 ||
            p.y>H+150
        ){

            projectiles.splice(
                projectiles.indexOf(p),
                1
            );
        }
    }
}

/* =========================================================
   EFFECTS
========================================================= */

function updateEffects(dt){

    for(let e of [...effects]){

        e.life-=dt;

        if(e.kind==="meteorWarning"){

            if(e.life<=1){

                explosion(
                    e.x,
                    e.y,
                    90,
                    e.damage
                );
            }
        }

        if(e.kind==="blackhole"){

            for(let z of zombies){

                let d=
                    distance(
                        e.x,e.y,
                        z.x,z.y
                    );

                if(d<e.radius){

                    let a=Math.atan2(
                        e.y-z.y,
                        e.x-z.x
                    );

                    z.x+=
                        Math.cos(a)*
                        1.2*
                        dt;

                    z.y+=
                        Math.sin(a)*
                        1.2*
                        dt;

                    if(Math.random()<.04*dt){

                        z.hp-=e.damage;

                        if(z.hp<=0)
                            killZombie(z);
                    }
                }
            }
        }

        if(e.kind==="poison"){

            for(let z of [...zombies]){

                if(
                    distance(
                        e.x,e.y,
                        z.x,z.y
                    )<e.radius
                ){

                    z.hp-=e.damage*dt;

                    if(Math.random()<.03)
                        damageText(
                            z.x,
                            z.y,
                            e.damage
                        );

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }

        if(e.kind==="tornado"){

            e.x+=e.vx*dt;
            e.y+=e.vy*dt;

            for(let z of [...zombies]){

                if(
                    distance(
                        e.x,e.y,
                        z.x,z.y
                    )<
                    e.radius+z.radius
                ){

                    z.hp-=e.damage*dt;

                    if(Math.random()<.05)
                        damageText(
                            z.x,
                            z.y,
                            e.damage
                        );

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }

        if(e.life<=0){

            if(e.kind==="meteorWarning"){

                /* already exploded */

            }

            effects.splice(
                effects.indexOf(e),
                1
            );
        }
    }
}

/* =========================================================
   SUMMONS
========================================================= */

function updateSummons(dt){

    for(let s of [...summons]){

        s.life-=dt;

        let target=
            nearestZombieFrom(
                s.x,
                s.y
            );

        if(target){

            let a=Math.atan2(
                target.y-s.y,
                target.x-s.x
            );

            let speed=
                s.kind==="bee"
                ?4.5
                :2.5;

            s.x+=
                Math.cos(a)*
                speed*
                dt;

            s.y+=
                Math.sin(a)*
                speed*
                dt;

            if(
                distance(
                    s.x,s.y,
                    target.x,target.y
                )<
                s.radius+target.radius
            ){

                target.hp-=s.damage;

                if(Math.random()<.08)
                    damageText(
                        target.x,
                        target.y,
                        s.damage
                    );

                if(target.hp<=0)
                    killZombie(target);

                if(s.kind==="bee")
                    s.x-=Math.cos(a)*20;
            }

        }else{

            let a=Math.atan2(
                player.y-s.y,
                player.x-s.x
            );

            s.x+=
                Math.cos(a)*
                1.5*
                dt;

            s.y+=
                Math.sin(a)*
                1.5*
                dt;
        }

        if(s.life<=0){

            summons.splice(
                summons.indexOf(s),
                1
            );
        }
    }
}

/* =========================================================
   EXPLOSIONS
========================================================= */

function explosion(x,y,radius,damage){

    effects.push({
        kind:"explosion",
        x,y,
        radius:10,
        maxRadius:radius,
        life:28
    });

    for(let z of [...zombies]){

        let d=
            distance(
                x,y,
                z.x,z.y
            );

        if(d<radius){

            let multiplier=
                1-d/radius*.5;

            let dealt=
                damage*multiplier;

            z.hp-=dealt;

            damageText(
                z.x,
                z.y,
                dealt
            );

            if(z.hp<=0)
                killZombie(z);
        }
    }
}

/* =========================================================
   KILL / XP
========================================================= */

function killZombie(z){

    let index=zombies.indexOf(z);

    if(index===-1)return;

    zombies.splice(index,1);

    kills++;

    orbs.push({
        x:z.x,
        y:z.y,
        value:z.xp
    });

    effects.push({
        kind:"death",
        x:z.x,
        y:z.y,
        radius:8,
        life:25
    });

    if(z.boss){

        document.getElementById(
            "bossBar"
        ).style.display="none";

        for(let i=0;i<8;i++){

            orbs.push({
                x:z.x+(Math.random()-.5)*80,
                y:z.y+(Math.random()-.5)*80,
                value:30
            });
        }
    }
}

function gainXP(amount){

    player.xp+=amount;

    while(player.xp>=player.xpNeed){

        levelUp();
        break;
    }
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    drawMap();
    drawOrbs();
    drawEffects();
    drawSummons();
    drawProjectiles();
    drawZombies();
    drawPlayer();
    drawDamageText();
}

/* MAP */

function drawMap(){

    ctx.fillStyle="#10141a";
    ctx.fillRect(0,0,W,H);

    /* subtle grid */

    ctx.strokeStyle="#171c24";
    ctx.lineWidth=1;

    const grid=50;

    for(
        let x=0;
        x<W;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    /* arena border */

    ctx.strokeStyle="#252c37";
    ctx.lineWidth=5;

    ctx.strokeRect(
        8,
        8,
        W-16,
        H-16
    );
}

/* PLAYER */

function drawPlayer(){

    ctx.save();

    if(player.invincible>0){

        ctx.globalAlpha=
            Math.sin(
                performance.now()/55
            )>0?.35:1;
    }

    /* aura */

    if(activeAbilities.includes("aura")){

        let a=ABILITIES.aura;

        let radius=
            100+a.level*7;

        let gradient=
            ctx.createRadialGradient(
                player.x,
                player.y,
                radius*.55,
                player.x,
                player.y,
                radius
            );

        gradient.addColorStop(
            0,
            "rgba(119,103,255,.10)"
        );

        gradient.addColorStop(
            1,
            "rgba(119,103,255,0)"
        );

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle=
            "rgba(119,103,255,.25)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    if(activeAbilities.includes("shield")){

        let level=
            ABILITIES.shield.level;

        ctx.strokeStyle=
            "rgba(100,210,255,.55)";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            36+level*2,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    if(
        playerImg.complete &&
        playerImg.naturalWidth
    ){

        ctx.drawImage(
            playerImg,
            player.x-38,
            player.y-38,
            76,
            76
        );

    }else{

        ctx.fillStyle="#7767ff";

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            player.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();

    /* orbiting weapons */

    drawOrbiting();
}

/* ZOMBIES */

function drawZombies(){

    for(let z of zombies){

        let size=
            z.boss
            ? 130
            : z.radius*2.4;

        if(
            zombieImg.complete &&
            zombieImg.naturalWidth
        ){

            ctx.drawImage(
                zombieImg,
                z.x-size/2,
                z.y-size/2,
                size,
                size
            );

        }else{

            ctx.fillStyle=
                z.boss
                ? "#9a3c9f"
                : z.type==="tank"
                ? "#784c4c"
                : z.type==="fast"
                ? "#687c49"
                : "#4d744e";

            ctx.beginPath();

            ctx.arc(
                z.x,
                z.y,
                z.radius,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        /* HP */

        let width=
            z.boss
            ? 115
            : z.radius*2;

        ctx.fillStyle="#20242c";

        ctx.fillRect(
            z.x-width/2,
            z.y-z.radius-11,
            width,
            5
        );

        ctx.fillStyle=
            z.boss
            ? "#d650dd"
            : "#e74b56";

        ctx.fillRect(
            z.x-width/2,
            z.y-z.radius-11,
            width*
            Math.max(
                0,
                z.hp/z.maxHp
            ),
            5
        );

        if(z.boss){

            ctx.font="bold 12px Arial";
            ctx.textAlign="center";
            ctx.fillStyle="#fff";

            ctx.fillText(
                "BOSS",
                z.x,
                z.y-z.radius-17
            );
        }
    }
}

/* PROJECTILES */

function drawProjectiles(){

    for(let p of projectiles){

        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        if(p.kind==="card"){

            let angle=
                Math.atan2(
                    p.vy,
                    p.vx
                );

            ctx.rotate(angle);

            ctx.fillStyle="#fff";

            ctx.shadowBlur=8;
            ctx.shadowColor="#fff";

            ctx.fillRect(
                -7,
                -11,
                14,
                22
            );

            ctx.shadowBlur=0;

            ctx.fillStyle="#d63f4b";

            ctx.font="12px Arial";
            ctx.textAlign="center";

            ctx.fillText(
                "♥",
                0,
                4
            );
        }

        if(p.kind==="fireball"){

            ctx.shadowBlur=22;
            ctx.shadowColor="#ff741c";

            ctx.fillStyle="#ff8b27";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                15,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        if(p.kind==="ice"){

            ctx.rotate(
                Math.atan2(p.vy,p.vx)
            );

            ctx.fillStyle="#8ce9ff";

            ctx.beginPath();

            ctx.moveTo(11,0);
            ctx.lineTo(-7,-5);
            ctx.lineTo(-4,0);
            ctx.lineTo(-7,5);
            ctx.closePath();

            ctx.fill();
        }

        if(p.kind==="bomb"){

            ctx.fillStyle="#222";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                11,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#ffbf3c";

            ctx.beginPath();

            ctx.arc(
                5,
                -9,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        if(p.kind==="boomerang"){

            ctx.strokeStyle="#f0bd50";
            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                9,
                -.9,
                .9
            );

            ctx.stroke();
        }

        if(p.kind==="skull"){

            ctx.font="23px Arial";
            ctx.textAlign="center";
            ctx.textBaseline="middle";

            ctx.fillText(
                "💀",
                0,
                0
            );
        }

        ctx.restore();
    }
}

/* ORBS */

function drawOrbs(){

    for(let o of orbs){

        ctx.shadowBlur=12;
        ctx.shadowColor="#7767ff";

        ctx.fillStyle="#8f84ff";

        ctx.beginPath();

        ctx.arc(
            o.x,
            o.y,
            6,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    }
}

/* EFFECTS */

function drawEffects(){

    for(let e of effects){

        if(e.kind==="shockwave"){

            let alpha=e.life/25;

            ctx.strokeStyle=
                `rgba(130,115,255,${alpha})`;

            ctx.lineWidth=6;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            e.radius+=
                (e.maxRadius-e.radius)*
                .25;
        }

        if(e.kind==="explosion"){

            let progress=
                1-e.life/28;

            let radius=
                10+
                progress*
                (e.maxRadius-10);

            ctx.fillStyle=
                `rgba(255,125,40,${1-progress})`;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                radius,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle=
                `rgba(255,190,70,${1-progress})`;

            ctx.lineWidth=5;

            ctx.stroke();
        }

        if(e.kind==="lightning"){

            ctx.strokeStyle=
                `rgba(210,235,255,${e.life/28})`;

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.moveTo(
                e.x,
                e.y-170
            );

            for(let i=1;i<8;i++){

                ctx.lineTo(
                    e.x+
                    (Math.random()-.5)*45,
                    e.y-170+i*25
                );
            }

            ctx.lineTo(
                e.x,
                e.y
            );

            ctx.stroke();

            ctx.fillStyle=
                `rgba(255,255,255,${e.life/28})`;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                25,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        if(e.kind==="meteorWarning"){

            let pulse=
                65+
                Math.sin(
                    performance.now()/80
                )*6;

            ctx.strokeStyle=
                "rgba(255,90,50,.85)";

            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                pulse,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.fillStyle=
                "rgba(255,80,30,.12)";

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                pulse,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        if(e.kind==="blackhole"){

            ctx.shadowBlur=25;
            ctx.shadowColor="#8c43c9";

            ctx.fillStyle="#10091a";

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius*.35,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle="#9d5bda";
            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.shadowBlur=0;
        }

        if(e.kind==="poison"){

            ctx.fillStyle=
                "rgba(80,220,90,.13)";

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle=
                "rgba(100,230,110,.3)";

            ctx.stroke();
        }

        if(e.kind==="tornado"){

            ctx.strokeStyle=
                "rgba(180,210,255,.7)";

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius*.55,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        if(e.kind==="death"){

            ctx.strokeStyle=
                `rgba(255,90,90,${e.life/25})`;

            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                35-e.life,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    }
}

/* SUMMON DRAW */

function drawSummons(){

    for(let s of summons){

        ctx.font=
            s.kind==="bee"
            ?"21px Arial"
            :"27px Arial";

        ctx.textAlign="center";

/* ORBIT */

function drawOrbiting(){

    let t=
        performance.now()/450;

    if(activeAbilities.includes("orbitBlades")){

        let level=
            ABILITIES.orbitBlades.level;

        let count=
            2+
            Math.floor(level/2);

        for(let i=0;i<count;i++){

            let angle=
                t+
                i*Math.PI*2/count;

            let radius=
                55+
                level*3;

            let x=
                player.x+
                Math.cos(angle)*radius;

            let y=
                player.y+
                Math.sin(angle)*radius;

            ctx.save();

            ctx.translate(x,y);
            ctx.rotate(angle);

            ctx.fillStyle="#e7e9ef";

            ctx.fillRect(
                -5,
                -18,
                10,
                36
            );

            ctx.restore();

            /* collision */

            for(let z of [...zombies]){

                if(
                    distance(x,y,z.x,z.y)
                    <z.radius+12
                ){

                    z.hp-=
                        player.damage*
                        .06*
                        dtSafe();

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }
    }

    if(activeAbilities.includes("orbitFire")){

        let level=
            ABILITIES.orbitFire.level;

        let count=
            2+
            Math.floor(level/2);

        for(let i=0;i<count;i++){

            let angle=
                -t+
                i*Math.PI*2/count;

            let radius=
                48+
                level*4;

            let x=
                player.x+
                Math.cos(angle)*radius;

            let y=
                player.y+
                Math.sin(angle)*radius;

            ctx.shadowBlur=15;
            ctx.shadowColor="#ff7225";

            ctx.fillStyle="#ff8b2d";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                10,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.shadowBlur=0;

            for(let z of [...zombies]){

                if(
                    distance(x,y,z.x,z.y)
                    <
                    z.radius+10
                ){

                    z.hp-=
                        player.damage*
                        .08*
                        dtSafe();

                    if(z.hp<=0)
                        killZombie(z);
                }
            }
        }
    }
}

function dtSafe(){
    return 1;
}

/* =========================================================
   UTILS
========================================================= */

function distance(x1,y1,x2,y2){

    return Math.hypot(
        x2-x1,
        y2-y1
    );
}

function nearestZombie(){

    return nearestZombieFrom(
        player.x,
        player.y
    );
}

function nearestZombieFrom(x,y){

    let best=null;
    let bestD=Infinity;

    for(let z of zombies){

        let d=
            distance(
                x,y,
                z.x,z.y
            );

        if(d<bestD){

            bestD=d;
            best=z;
        }
    }

    return best;
}

function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}
